<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gradiente dourado estilo capoeira/malandro -->
    <linearGradient id="ouro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente vermelho estilo coral/corda -->
    <linearGradient id="vermelho" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B22222;stop-opacity:1" />
    </linearGradient>
    
    <!-- Sombra suave -->
    <filter id="sombra" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    
    <!-- Brilho dourado -->
    <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Círculo de fundo escuro -->
  <circle cx="50" cy="50" r="48" fill="#1a1a1a" filter="url(#sombra)"/>
  
  <!-- Anel externo dourado -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#ouro)" stroke-width="2" filter="url(#brilho)"/>
  
  <!-- Padrão de cordas estilo capoeira -->
  <path d="M 50 10 Q 65 30 50 50 Q 35 70 50 90" 
        fill="none" 
        stroke="url(#vermelho)" 
        stroke-width="1.5" 
        opacity="0.6"/>
  <path d="M 50 10 Q 35 30 50 50 Q 65 70 50 90" 
        fill="none" 
        stroke="url(#vermelho)" 
        stroke-width="1.5" 
        opacity="0.6"/>
  
  <!-- Chapéu de malandro estilizado -->
  <g transform="translate(50, 42)">
    <!-- Aba do chapéu -->
    <ellipse cx="0" cy="8" rx="18" ry="6" fill="#2c2c2c"/>
    <ellipse cx="0" cy="7" rx="18" ry="6" fill="url(#ouro)"/>
    <!-- Copa do chapéu -->
    <path d="M -12 7 L -10 -8 Q 0 -12 10 -8 L 12 7 Z" fill="#2c2c2c"/>
    <!-- Faixa dourada -->
    <rect x="-11" y="-2" width="22" height="4" fill="url(#ouro)" rx="1"/>
  </g>
  
  <!-- Óculos de malandro -->
  <g transform="translate(50, 62)">
    <!-- Lentes redondas estilo retrô -->
    <circle cx="-7" cy="0" r="5" fill="#000" opacity="0.8"/>
    <circle cx="7" cy="0" r="5" fill="#000" opacity="0.8"/>
    <!-- Aro dourado -->
    <circle cx="-7" cy="0" r="5" fill="none" stroke="url(#ouro)" stroke-width="1"/>
    <circle cx="7" cy="0" r="5" fill="none" stroke="url(#ouro)" stroke-width="1"/>
    <!-- Ponte -->
    <path d="M -2 0 Q 0 -1 2 0" fill="none" stroke="url(#ouro)" stroke-width="1"/>
  </g>
  
  <!-- Bigode fino de malandro -->
  <g transform="translate(50, 68)">
    <path d="M -8 0 Q -4 3 0 1 Q 4 3 8 0" 
          fill="none" 
          stroke="#2c2c2c" 
          stroke-width="1.5" 
          stroke-linecap="round"/>
  </g>
  
  <!-- Detalhes brilhantes -->
  <circle cx="35" cy="35" r="1.5" fill="url(#ouro)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="65" cy="45" r="1" fill="url(#ouro)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
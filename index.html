function CfgSync({st,setSt,fbUser,setFbUser,syncStatus,onManualSync}){
  const[cfgText,setCfgText]=useState('');
  const[connecting,setConnecting]=useState(false);
  const[err,setErr]=useState('');
  const[logging,setLogging]=useState(false);
  const[pulling,setPulling]=useState(false);

  const savedCfg=fbLoadCfg();
  const isConfigured=!!savedCfg;

  async function connect(){
    setErr('');setConnecting(true);
    try{
      let cfg;
      // Strip "const firebaseConfig = { ... };" wrapper if present
      let raw=cfgText.trim()
        .replace(/^const\s+\w+\s*=\s*/,'')  // remove "const firebaseConfig ="
        .replace(/;\s*$/,'')                  // remove trailing ";"
        .trim();
      // Strategy 1: direct JSON.parse (works if keys are already quoted)
      try{ cfg=JSON.parse(raw); }catch(_){
        // Strategy 2: eval as JS object literal via Function (safe — no local scope access)
        // Handles unquoted keys like { apiKey: "...", projectId: "..." }
        try{ cfg=new Function('return ('+raw+')')(); }catch(e2){
          throw new Error('Não foi possível ler a config. Tente selecionar "Config" (não NPM/CDN) no Firebase console e copie apenas o objeto JSON.');
        }
      }
      if(!cfg||!cfg.apiKey||!cfg.projectId)throw new Error('Config incompleta — verifique se copiou o firebaseConfig correto.');
      const ok=fbInit(cfg);
      if(!ok)throw new Error('Falha ao inicializar Firebase. Verifique a config.');
      fbSaveCfg(cfg);
      setCfgText('');
    }catch(e){
      setErr(e.message||'Config inválida.');
    }
    setConnecting(false);
  }

  async function login(){
    setErr('');setLogging(true);
    try{await fbSignIn();}
    catch(e){setErr(e.message||'Erro no login.');}
    setLogging(false);
  }

  async function logout(){
    await fbSignOut();
    setFbUser(null);
  }

  async function pullCloud(){
    if(!fbUser)return;
    setPulling(true);setErr('');
    try{
      const cloud=await fbPull(fbUser.uid);
      if(!cloud){setErr('Nenhum dado encontrado na nuvem.');setPulling(false);return;}
      if(window.confirm('Substituir dados locais pelos dados da nuvem? (Cancelar = mesclar)')){
        setSt(cloud);
      }else{
        setSt(p=>mergeDeep(p,cloud));
      }
    }catch(e){setErr(e.message||'Erro ao buscar dados da nuvem.');}
    setPulling(false);
  }

  function disconnect(){
    if(!window.confirm('Desconectar Firebase? A config será removida deste dispositivo.'))return;
    fbSignOut().catch(()=>{});
    fbClearCfg();
    _fbApp=null;_fbAuth=null;_fbDb=null;
    setFbUser(null);
    setErr('');
  }

  const statusColor=syncStatus==='ok'?'#22c55e':syncStatus==='syncing'?'#eab308':syncStatus==='err'?'#ef4444':'#555';
  const statusLabel=syncStatus==='ok'?'Sincronizado':syncStatus==='syncing'?'Sincronizando…':syncStatus==='err'?'Erro na sync':'Não sincronizado';

  return<div>
    {/* Status */}
    {isConfigured&&<div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 14px',background:'var(--card2)',border:'1px solid var(--bd)',borderRadius:'var(--r)',marginBottom:16}}>
      <div style={{width:8,height:8,borderRadius:'50%',background:statusColor,flexShrink:0,boxShadow:`0 0 6px ${statusColor}`}}/>
      <span style={{fontSize:'.82rem',color:'var(--tx2)',flex:1}}>{statusLabel}</span>
      {fbUser&&<span style={{fontSize:'.75rem',color:'var(--tx3)',fontFamily:'var(--fm)'}}>{fbUser.email}</span>}
    </div>}

    {/* Not configured yet */}
    {!isConfigured&&<div className="cfg-s">
      <div className="cfg-t">Configurar Firebase</div>
      <div style={{fontSize:'.8rem',color:'var(--tx2)',lineHeight:1.6,marginBottom:12}}>
        Para sincronizar entre dispositivos, crie um projeto Firebase gratuito e cole a config abaixo.<br/>
        <strong style={{color:'var(--tx)'}}>Passo a passo:</strong>
        <ol style={{marginTop:6,paddingLeft:18,display:'flex',flexDirection:'column',gap:3}}>
          <li>Acesse <strong style={{color:'var(--ac)'}}>console.firebase.google.com</strong></li>
          <li>Crie um projeto → Adicionar app Web</li>
          <li>Copie o objeto <strong style={{color:'var(--ac)'}}>firebaseConfig</strong></li>
          <li>Ative <strong>Firestore Database</strong> no menu lateral</li>
          <li>Ative <strong>Authentication → Google</strong></li>
          <li>Em Firestore → Regras, cole a regra segura abaixo</li>
        </ol>
      </div>
      {/* Firestore rule */}
      <div style={{background:'#0d1117',border:'1px solid var(--bd)',borderRadius:6,padding:'10px 12px',marginBottom:12,fontFamily:'var(--fm)',fontSize:'.72rem',color:'#79c0ff',lineHeight:1.7}}>
        <div style={{color:'#8b949e',marginBottom:4}}>{'// Firestore → Regras:'}</div>
        {`rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /cerebro/{uid} {\n      allow read, write: if request.auth.uid == uid;\n    }\n  }\n}`}
      </div>
      <div className="fld"><label>Cole o firebaseConfig aqui (JSON ou objeto JS)</label>
        <textarea rows={6}value={cfgText}onChange={e=>setCfgText(e.target.value)}placeholder={'{\n  "apiKey": "...",\n  "authDomain": "...",\n  "projectId": "...",\n  ...\n}'}style={{fontFamily:'var(--fm)',fontSize:'.78rem'}}/>
      </div>
      {err&&<div style={{color:'#ef4444',fontSize:'.78rem',marginBottom:8}}>{err}</div>}
      <button className="btn btn-ac w100"onClick={connect}disabled={!cfgText.trim()||connecting}>
        {connecting?'Conectando…':'🔗 Conectar Firebase'}
      </button>
    </div>}

    {/* Configured — show login or user panel */}
    {isConfigured&&!fbUser&&<div className="cfg-s">
      <div className="cfg-t">Entrar com Google</div>
      <div style={{fontSize:'.8rem',color:'var(--tx2)',marginBottom:12}}>Faça login para ativar a sincronização automática.</div>
      {err&&<div style={{color:'#ef4444',fontSize:'.78rem',marginBottom:8}}>{err}</div>}
      <button className="btn btn-ac w100"onClick={login}disabled={logging}style={{marginBottom:8}}>
        {logging?'Entrando…':'🔑 Entrar com Google'}
      </button>
      <button className="btn btn-gh w100"onClick={disconnect}style={{fontSize:'.75rem'}}>Desconectar Firebase</button>
    </div>}

    {isConfigured&&fbUser&&<div className="cfg-s">
      <div className="cfg-t">Sincronização ativa</div>
      <div style={{fontSize:'.8rem',color:'var(--tx2)',marginBottom:12,lineHeight:1.6}}>
        Seus dados são enviados para a nuvem automaticamente após cada alteração (3 segundos de debounce). Você pode acessar em qualquer dispositivo fazendo login com a mesma conta Google.
      </div>
      {err&&<div style={{color:'#ef4444',fontSize:'.78rem',marginBottom:8}}>{err}</div>}
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        <button className="btn btn-ac"onClick={onManualSync}>☁️ Enviar dados agora</button>
        <button className="btn btn-gh"onClick={pullCloud}disabled={pulling}>{pulling?'Buscando…':'⬇️ Buscar dados da nuvem'}</button>
        <button className="btn btn-gh"onClick={logout}style={{fontSize:'.75rem',color:'var(--tx3)'}}>Sair da conta</button>
        <button className="btn-er"style={{fontSize:'.72rem',padding:'5px 10px',borderRadius:'var(--r)',width:'auto',alignSelf:'flex-start'}}onClick={disconnect}>Desconectar Firebase</button>
      </div>
    </div>}
  </div>;
}

function EixoMeter(){
  const trackRef=useRef(null);
  const[pos,setPos]=useState(0.5);
  const[stateLbl,setStateLbl]=useState('arraste o ponto');
  const dragging=useRef(false);
  const idle=useRef(true);
  const sway0=useRef(performance.now());

  const l=Math.round((1-pos)*100), r=100-l;
  const centered=Math.abs(pos-0.5)<0.06;

  const fromClientX=cx=>{
    const rect=trackRef.current.getBoundingClientRect();
    setPos(Math.max(0,Math.min(1,(cx-rect.left)/rect.width)));
  };

  useEffect(()=>{
    const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    const onMove=e=>{ if(dragging.current) fromClientX(e.clientX); };
    const onUp=()=>{ if(dragging.current){ dragging.current=false; setStateLbl('arraste o ponto'); } };
    const onTMove=e=>{ if(dragging.current) fromClientX(e.touches[0].clientX); };
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
    window.addEventListener('touchmove',onTMove,{passive:true});
    window.addEventListener('touchend',onUp);
    let raf;
    const loop=t=>{
      if(idle.current && !dragging.current && !reduce){
        setPos(0.5+Math.sin((t-sway0.current)/1400)*0.16);
      }
      raf=requestAnimationFrame(loop);
    };
    if(!reduce) raf=requestAnimationFrame(loop);
    return()=>{
      window.removeEventListener('mousemove',onMove);
      window.removeEventListener('mouseup',onUp);
      window.removeEventListener('touchmove',onTMove);
      window.removeEventListener('touchend',onUp);
      if(raf)cancelAnimationFrame(raf);
    };
  },[]);

  const startDrag=cx=>{ idle.current=false; dragging.current=true; setStateLbl('solte pra fixar'); fromClientX(cx); };
  const center=()=>{
    idle.current=false;
    const start=pos, dur=420, t0=performance.now();
    const anim=t=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); setPos(start+(0.5-start)*e); if(k<1)requestAnimationFrame(anim); };
    requestAnimationFrame(anim);
  };

  return<div className="meter">
    <div className="meter-head"><span>Centro de gravidade</span><span className="lbl">{stateLbl}</span></div>
    <div className="track"ref={trackRef}onMouseDown={e=>startDrag(e.clientX)}onTouchStart={e=>startDrag(e.touches[0].clientX)}>
      <div className="base-line"></div>
      <div className="tick"style={{left:'12.5%'}}></div>
      <div className="tick"style={{left:'25%'}}></div>
      <div className="tick"style={{left:'37.5%'}}></div>
      <div className="tick center"style={{left:'50%'}}></div>
      <div className="tick"style={{left:'62.5%'}}></div>
      <div className="tick"style={{left:'75%'}}></div>
      <div className="tick"style={{left:'87.5%'}}></div>
      <div className="foot-lbl l">PÉ ESQ.</div>
      <div className="foot-lbl r">PÉ DIR.</div>
      <div className={"dot"+(centered?" centered":"")}style={{left:(pos*100)+'%'}}></div>
    </div>
    <div className="meter-read">
      <div className="read-vals">ESQ <b>{l}%</b> &nbsp;·&nbsp; DIR <b>{r}%</b>{centered&&<span className="c"> — centrado</span>}</div>
      <button className="btn-center"onClick={center}>centrar</button>
    </div>
    <p className="meter-hint">Esse é o gesto que você vai treinar: sentir onde o peso está e movê-lo de propósito. Arraste e repare como o corpo "decide" o apoio. No centro, os dois pés dividem a carga.</p>
  </div>;
}

function EixoSection({st,setSt}){
  const eixo=st.eixo||{sessions:[],fase:1};
  const sessions=eixo.sessions||[];
  const fase=eixo.fase||1;
  const todayStr=TODAY();
  const dStr=off=>{ const d=new Date(); d.setDate(d.getDate()-off); return localDateStr(d); };

  const streak=useMemo(()=>{
    let c=0, off=sessions.includes(todayStr)?0:1;
    while(sessions.includes(dStr(off))){ c++; off++; }
    return c;
  },[sessions,todayStr]);

  const setEixo=patch=>setSt(p=>({...p,eixo:{...(p.eixo||{sessions:[],fase:1}),...patch}}));
  const toggleDay=ds=>{
    const s=eixo.sessions||[];
    setEixo({sessions:s.includes(ds)?s.filter(x=>x!==ds):[...s,ds]});
  };

  const done=sessions.includes(todayStr);
  const f=EIXO_PHASES[fase];

  return<div className="sec">
   <div className="eixo">
    <div className="wrap">
      <header>
        <div className="eyebrow">Protocolo de coordenação · <b>transferência de peso</b></div>
        <h1 className="brand">EI<span>X</span>O</h1>
        <p className="tagline">A habilidade de levar seu peso de um apoio ao outro com controle. Você não nasceu desengonçado — <em>faltou repetição com atenção</em>. Começa hoje, no dia certo. Parabéns.</p>
        <EixoMeter/>
      </header>

      <div className="stats">
        <div className="stat"><div className="num">{streak}</div><div className="cap">dias seguidos</div></div>
        <div className="stat"><div className="num euca">{sessions.length}</div><div className="cap">sessões totais</div></div>
        <div className="stat"><div className="num">{fase}</div><div className="cap">fase atual</div></div>
      </div>

      <div className="panel">
        <div className="panel-title">Últimos 14 dias</div>
        <div className="grid-days">
          {Array.from({length:14},(_,idx)=>{
            const i=13-idx, ds=dStr(i), isDone=sessions.includes(ds);
            return<div key={ds}className={"cell"+(isDone?" done":"")+(i===0?" today":"")}title={ds}onClick={()=>toggleDay(ds)}/>;
          })}
        </div>
        <div className="log-row">
          <button className={"btn-log"+(done?" done":"")}onClick={()=>toggleDay(todayStr)}>{done?'✓ Sessão de hoje registrada':'Registrar sessão de hoje'}</button>
          <div className="log-note">Pouco e frequente vence muito e esporádico. 5–15 min por dia já constrói a via motora.</div>
        </div>
      </div>

      <div className="section-head">
        <div className="kick">O treino · 3 fases</div>
        <h2>Sentir, estabilizar,<br/>colocar em ritmo</h2>
        <p>A ordem importa. Você não começa pela técnica do esporte — começa pela fundação que faltou. Só avança de fase quando a anterior estiver clara no corpo, não num prazo fixo.</p>
      </div>

      <div className="phase-tabs">
        {[[1,'Consciência'],[2,'Estabilidade'],[3,'Ritmo']].map(([p,nome])=>
          <button key={p}className={"ptab"+(fase===p?" active":"")}onClick={()=>setEixo({fase:p})}><b>Fase {p}</b> · {nome}</button>
        )}
      </div>

      <div className="phase">

// ── REELS — feed de evolução de habilidades ──────────────────────────────────
function rid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

// Junta todas as skills com o contexto da árvore (paleta, emoji, nível)
function reelsSkillPool(st,treeId){
  const pool=[];
  ((st.skilltree&&st.skilltree.trees)||[]).forEach(t=>{
    if(treeId&&treeId!=='all'&&t.id!==treeId)return;
    const pal=treePalette(t);
    (t.skills||[]).forEach(s=>{
      pool.push({
        skillId:s.id, treeId:t.id, skillNome:s.nome||'Habilidade', treeNome:t.nome||'',
        emoji:s.emoji||t.emoji||'🎯', treeEmoji:t.emoji||'🌳', pal,
        nivel:s.nivel||0, maxNivel:s.maxNivel||5, levels:s.levels||[],
      });
    });
  });
  return pool;
}

const REEL_TPL=[
  {type:'acao',title:'5 min deliberados',body:s=>`Separa 5 minutos só pra ${s.skillNome.toLowerCase()}. Sem celular, atenção total no movimento. Qualidade vence quantidade — sempre.`},
  {type:'acao',title:'10 reps conscientes',body:s=>`Faz 10 repetições de ${s.skillNome.toLowerCase()} bem devagar, sentindo cada detalhe. Repetição com atenção é o que constrói a via.`},
  {type:'acao',title:'Isola o ponto fraco',body:s=>`Pega a parte mais difícil de ${s.skillNome.toLowerCase()} e repete só ela por 3 minutos. O ganho mora no que incomoda.`},
  {type:'acao',title:'Grava e revisa',body:s=>`Grava 30s praticando ${s.skillNome.toLowerCase()} e assiste. De fora você enxerga o erro que não sente fazendo.`},
  {type:'acao',title:'Ensina pra fixar',body:s=>`Explica em voz alta como se faz ${s.skillNome.toLowerCase()}, como se ensinasse alguém. Ensinar expõe o que ainda não domina.`},
  {type:'aprendizado',title:'O próximo degrau',body:s=>`Teu próximo nível em ${s.skillNome.toLowerCase()}: ${s.next}. Visualiza fazendo isso na cabeça antes de tentar de verdade.`},
  {type:'aprendizado',title:'Onde você está',body:s=>`Hoje teu ${s.skillNome.toLowerCase()} tá assim: ${s.cur}. Reconhecer o ponto exato já é meio caminho andado.`},
];

function reelMakeCard(s,tpl){
  const lv=s.levels||[];
  const maxed=s.nivel>=s.maxNivel;
  const cur=lv[s.nivel]||'no começo dessa habilidade';
  const next=maxed?'já domina — agora é manter afiado e ensinar':(lv[s.nivel+1]||'subir mais um nível de controle');
  const ctx={...s,cur,next};
  let title=tpl.title;
  if(tpl.type==='aprendizado'&&tpl.title==='O próximo degrau'&&maxed)title='Mantém afiado';
  return{
    id:rid(),type:tpl.type,title,body:tpl.body(ctx),next,
    skillId:s.skillId,treeId:s.treeId,skillNome:s.skillNome,treeNome:s.treeNome,
    treeEmoji:s.treeEmoji,emoji:s.emoji,pal:s.pal,nivel:s.nivel,maxNivel:s.maxNivel,source:'curado',
  };
}

// pondera skills com mais espaço pra crescer (nível baixo aparece mais)
function reelWeighted(pool){
  const w=[];
  pool.forEach(s=>{const room=Math.max(1,(s.maxNivel-s.nivel)+1);for(let i=0;i<room;i++)w.push(s);});
  return w;
}
function reelGenCurated(st,n,treeId){
  const pool=reelsSkillPool(st,treeId);
  if(!pool.length)return[];
  const w=reelWeighted(pool);
  const cards=[];let lastKey='';
  for(let i=0;i<n;i++){
    const s=w[Math.floor(Math.random()*w.length)];
    let tpl,g=0;
    do{tpl=REEL_TPL[Math.floor(Math.random()*REEL_TPL.length)];g++;}while(g<6&&(s.skillId+tpl.title)===lastKey);
    lastKey=s.skillId+tpl.title;
    cards.push(reelMakeCard(s,tpl));
  }
  return cards;
}

function reelPickSkills(pool,n){
  const w=reelWeighted(pool);
  const picks=[];const used=new Set();let g=0;
  while(picks.length<Math.min(n,pool.length)&&g<300){
    g++;const s=w[Math.floor(Math.random()*w.length)];
    if(!used.has(s.skillId)){used.add(s.skillId);picks.push(s);}
  }
  return picks;
}
function reelParseJSON(raw){
  try{const t=aiStrip(raw);const a=t.indexOf('['),b=t.lastIndexOf(']');if(a<0||b<0)return null;return JSON.parse(t.slice(a,b+1));}catch(e){return null;}
}
async function reelGenAI(st,n,treeId){
  const pool=reelsSkillPool(st,treeId);
  if(!pool.length)return[];
  const byName={};pool.forEach(s=>{byName[s.skillNome.toLowerCase()]=s;});
  const picks=reelPickSkills(pool,n);
  const list=picks.map(s=>`- ${s.skillNome} (${s.treeNome}, nível ${s.nivel}/${s.maxNivel}; próximo: ${(s.levels&&s.levels[s.nivel+1])||'dominar e ensinar'})`).join('\n');
  const prompt=`Estas são habilidades minhas que quero evoluir:\n${list}\n\nPara cada uma, crie 1 card curtíssimo estilo "reels": ou uma MICRO-AÇÃO prática que dá pra fazer em 1 a 5 minutos hoje, ou uma MICRO-APRENDIZAGEM (insight rápido e específico). Varie entre os dois tipos. Responda APENAS um array JSON válido, nada fora dele:\n[{"skill":"nome exato da habilidade","type":"acao ou aprendizado","title":"até 4 palavras","body":"1 a 2 frases, máximo 200 caracteres, direto e prático"}]`;
  let raw;
  try{raw=await aiCall(AI_SYS_MALANDRO,prompt,1000);}catch(e){return[];}
  const arr=reelParseJSON(raw);
  if(!Array.isArray(arr))return[];
  const out=[];
  arr.forEach(o=>{
    if(!o||!o.skill||!o.body)return;
    const key=String(o.skill).toLowerCase();
    const s=byName[key]||picks.find(p=>p.skillNome.toLowerCase().includes(key)||key.includes(p.skillNome.toLowerCase()));
    if(!s)return;
    out.push({
      id:rid(),type:o.type==='aprendizado'?'aprendizado':'acao',
      title:String(o.title||'Micro-passo').slice(0,42),body:String(o.body).slice(0,260),
      next:(s.levels&&s.levels[s.nivel+1])||'dominar e ensinar',
      skillId:s.skillId,treeId:s.treeId,skillNome:s.skillNome,treeNome:s.treeNome,
      treeEmoji:s.treeEmoji,emoji:s.emoji,pal:s.pal,nivel:s.nivel,maxNivel:s.maxNivel,source:'ia',
    });
  });
  return out;
}

// Árvores (categorias) com nível agregado, pra stories e filtros
function reelsTrees(st){
  return((st.skilltree&&st.skilltree.trees)||[]).filter(t=>(t.skills||[]).length).map(t=>{
    const skills=t.skills||[];
    const lvl=skills.reduce((a,s)=>a+Math.min(s.nivel||0,s.maxNivel||1),0);
    const mx=skills.reduce((a,s)=>a+(s.maxNivel||1),0);
    return{id:t.id,nome:t.nome||'Árvore',emoji:t.emoji||'🌳',pal:treePalette(t),skills,lvl,mx};
  });
}
// Segmentos de um story: skills da árvore priorizando as de nível mais baixo
function reelStorySegments(tree){
  const skills=(tree.skills||[]).slice().sort((a,b)=>(((a.nivel||0)-(a.maxNivel||5))-((b.nivel||0)-(b.maxNivel||5))));
  return skills.slice(0,6).map(s=>{
    const lv=s.levels||[],nivel=s.nivel||0,maxNivel=s.maxNivel||5,maxed=nivel>=maxNivel;
    return{
      skill:s,skillNome:s.nome||'Habilidade',emoji:s.emoji||tree.emoji,nivel,maxNivel,maxed,
      cur:lv[nivel]||'no começo',next:maxed?'manter afiado e ensinar':(lv[nivel+1]||'subir mais um nível'),
    };
  });
}

// Visualizador de stories fullscreen — barras de progresso, auto-avanço, toque
function ReelStoryViewer({tree,segments,onClose,onTrain,onSeen}){
  const DUR=6000;
  const segs=segments.length?segments:[{skillNome:tree.nome,emoji:tree.emoji,nivel:0,maxNivel:0,next:'',cur:'',maxed:false}];
  const[idx,setIdx]=useState(0);
  const[prog,setProg]=useState(0);
  const[paused,setPaused]=useState(false);
  const seg=segs[Math.min(idx,segs.length-1)];
  const finish=useCallback(()=>{onSeen&&onSeen(tree.id);onClose&&onClose();},[onSeen,onClose,tree.id]);
  const next=useCallback(()=>{setIdx(i=>{if(i+1>=segs.length){Promise.resolve().then(finish);return i;}return i+1;});},[segs.length,finish]);
  const prev=()=>setIdx(i=>Math.max(0,i-1));
  useEffect(()=>{setProg(0);},[idx]);
  useEffect(()=>{
    if(paused)return;
    const STEP=50,inc=STEP/DUR;
    const iv=setInterval(()=>{setProg(p=>{const np=p+inc;if(np>=1){clearInterval(iv);Promise.resolve().then(next);return 1;}return np;});},STEP);
    return()=>clearInterval(iv);
  },[idx,paused,next]);
  const onBody=e=>{const x=e.clientX,w=window.innerWidth||360;if(x<w*0.32)prev();else next();};
  return<div className="sview"style={{'--sc':tree.pal.d}}>
    <div className="sview-bars">
      {segs.map((s,i)=><div key={i}className="sview-bar"><i style={{width:(i<idx?100:i===idx?prog*100:0)+'%'}}/></div>)}
    </div>
    <div className="sview-head">
      <span className="sview-emoji">{tree.emoji}</span>
      <span className="sview-tname">{tree.nome}<span>árvore {tree.lvl||0}/{tree.mx||0}</span></span>
      <button className="sview-x"onClick={onClose}>✕</button>
    </div>
    <div className="sview-body"onClick={onBody}>
      <div className="sview-kind">{seg.maxed?'🏅 Dominado':'🎯 Próximo passo'}</div>
      <div className="sview-skill">{seg.emoji} {seg.skillNome}</div>
      <div className="sview-nivel">nível {seg.nivel}/{seg.maxNivel}</div>
      <div className="sview-text">{seg.maxed
        ?<>Você já domina <b>{seg.skillNome.toLowerCase()}</b>. Agora é manter afiado e ensinar — ensinar consolida.</>
        :<>Pra subir de nível em <b>{seg.skillNome.toLowerCase()}</b>: {seg.next}</>}</div>
    </div>
    <div className="sview-cta">
      <button className="sview-train"onClick={e=>{e.stopPropagation();onTrain(seg);}}>▶ Treinar essa</button>
      <button className="sview-next"onClick={e=>{e.stopPropagation();next();}}>Próximo ›</button>
    </div>
  </div>;
}

// Treino guiado no celular — visualização + execução cronometrada
function ReelTrainer({target,onClose,onComplete}){
  const PHASES=useMemo(()=>{
    const nome=(target.skillNome||'a habilidade').toLowerCase();
    const next=target.next||'dominar com naturalidade';
    return[
      {label:'Prepara',dur:5,inst:`Fica numa posição confortável e solta os ombros. Bora treinar ${nome}.`},
      {label:'Visualiza',dur:25,inst:`Fecha os olhos e se vê executando ${nome} com perfeição: ${next}. Repete na mente, em câmera lenta.`},
      {label:'Executa',dur:45,inst:`Agora faz de verdade — devagar e com atenção total. Cada repetição com foco vale por dez no automático.`},
      {label:'Consolida',dur:10,inst:`Repara no que mudou, mesmo um detalhe. É o cérebro gravando a via nova.`},
    ];
  },[target]);
  const[pi,setPi]=useState(0);
  const[left,setLeft]=useState(PHASES[0].dur);
  const[paused,setPaused]=useState(false);
  const[finished,setFinished]=useState(false);
  const fired=useRef(false);
  useEffect(()=>{setLeft(PHASES[pi].dur);},[pi,PHASES]);
  useEffect(()=>{
    if(paused||finished)return;
    const iv=setInterval(()=>{setLeft(s=>{if(s<=1){clearInterval(iv);if(pi+1>=PHASES.length)setFinished(true);else setPi(p=>p+1);return 0;}return s-1;});},1000);
    return()=>clearInterval(iv);
  },[pi,paused,finished,PHASES]);
  useEffect(()=>{if(finished&&!fired.current){fired.current=true;onComplete&&onComplete(target);}},[finished,onComplete,target]);
  const cur=PHASES[pi],frac=cur?left/cur.dur:0,R=90,C=2*Math.PI*R;
  return<div className="trn"style={{'--tc':target.pal?target.pal.d:'var(--ac)'}}>
    <button className="trn-x"onClick={onClose}>✕</button>
    {finished?<>
      <div className="trn-skill">{target.emoji} {target.skillNome}</div>
      <div className="trn-done">✓ Treino concluído</div>
      <div className="trn-inst">Prática registrada. Pouco e frequente — você acabou de reforçar a via motora dessa habilidade.</div>
      <button className="trn-btn main"onClick={onClose}>Voltar ao feed</button>
    </>:<>
      <div className="trn-skill">{target.emoji} {target.skillNome}</div>
      <div className="trn-ring">
        <svg width="200"height="200">
          <circle cx="100"cy="100"r={R}fill="none"stroke="var(--bd)"strokeWidth="8"/>
          <circle cx="100"cy="100"r={R}fill="none"stroke="var(--tc)"strokeWidth="8"strokeLinecap="round"strokeDasharray={C}strokeDashoffset={C*(1-frac)}style={{transition:'stroke-dashoffset 1s linear'}}/>
        </svg>
        <div className="trn-num"><b>{left}</b><span>seg</span></div>
      </div>
      <div className="trn-phase">{cur.label}</div>
      <div className="trn-inst">{cur.inst}</div>
      <div className="trn-ctrl">
        <button className="trn-btn"onClick={()=>setPaused(p=>!p)}>{paused?'▶ Retomar':'⏸ Pausar'}</button>
        <button className="trn-btn"onClick={()=>{if(pi+1>=PHASES.length)setFinished(true);else setPi(pi+1);}}>Pular fase ›</button>
      </div>
    </>}
  </div>;
}

function ReelsSection({st,setSt}){
  const reels=st.reels||{done:[]};
  const done=reels.done||[];
  const today=TODAY();
  const todayCount=done.filter(d=>d.date===today).length;
  const totalReps=done.length;
  const repsBySkill=useMemo(()=>{const m={};done.forEach(d=>{m[d.skillId]=(m[d.skillId]||0)+1;});return m;},[done]);
  const streak=useMemo(()=>{
    const days=new Set(done.map(d=>d.date));
    let c=0,off=days.has(today)?0:1;
    const dStr=o=>{const d=new Date();d.setDate(d.getDate()-o);return localDateStr(d);};
    while(days.has(dStr(off))){c++;off++;}
    return c;
  },[done,today]);

  const trees=useMemo(()=>reelsTrees(st),[st.skilltree]);
  const hasSkills=trees.length>0;
  const seenToday=(reels.stories&&reels.stories[today])||[];

  const[aiBusy,setAiBusy]=useState(false);
  const[completed,setCompleted]=useState(()=>new Set());
  const[story,setStory]=useState(null);
  const[trainer,setTrainer]=useState(null);
  const feedRef=useRef(null);
  const sentinelRef=useRef(null);
  const[feedH,setFeedH]=useState('70vh');

  // altura do feed = espaço restante abaixo de stories/barra/filtros
  useEffect(()=>{
    const calc=()=>{if(feedRef.current){const top=feedRef.current.getBoundingClientRect().top;setFeedH(Math.max(320,window.innerHeight-top-8)+'px');}};
    calc();window.addEventListener('resize',calc);
    return()=>window.removeEventListener('resize',calc);
  },[story,trainer]);

  // (re)gera o feed pro filtro atual — curado na hora + IA na frente, se houver
  useEffect(()=>{
    if(!hasSkills)return;
    setCards(reelGenCurated(st,8,filter));
    if(feedRef.current)feedRef.current.scrollTop=0;
    if(!aiReady())return;
    let cancel=false;setAiBusy(true);
    reelGenAI(st,6,filter).then(ai=>{if(!cancel&&ai.length)setCards(c=>[...ai,...c]);}).catch(()=>{}).finally(()=>{if(!cancel)setAiBusy(false);});
    return()=>{cancel=true;};
  },[filter]);

  const loadMore=useCallback(async()=>{
    if(!hasSkills)return;
    if(aiReady()){
      setAiBusy(true);
      try{const ai=await reelGenAI(st,5,filter);setCards(c=>[...c,...(ai.length?ai:reelGenCurated(st,6,filter))]);}
      catch(e){setCards(c=>[...c,...reelGenCurated(st,6,filter)]);}
      finally{setAiBusy(false);}
    }else{
      setCards(c=>[...c,...reelGenCurated(st,6,filter)]);
    }
  },[st,hasSkills,filter]);

  // scroll infinito

    const el=sentinelRef.current,root=feedRef.current;
    if(!el||!root)return;
    const io=new IntersectionObserver(es=>{if(es[0].isIntersecting)loadMore();},{root,rootMargin:'500px'});
    io.observe(el);
    return()=>io.disconnect();
  },[loadMore]);

  const logPractice=o=>{

      const entry={id:rid(),skillId:o.skillId,treeId:o.treeId,type:o.type||'acao',title:o.title||'Treino guiado',date:TODAY(),ts:Date.now()};
      return{...p,reels:{...r,done:[...(r.done||[]),entry]}};
    });
  };

    setSt(p=>{
      const r=p.reels||{done:[]};const stories={...(r.stories||{})};const day=TODAY();
      const set=new Set(stories[day]||[]);set.add(treeId);stories[day]=[...set];
      return{...p,reels:{...r,stories}};
    });

  const openTrainerCard=card=>setTrainer({skillNome:card.skillNome,next:card.next,pal:card.pal,emoji:card.emoji,skillId:card.skillId,treeId:card.treeId,type:card.type,title:card.title,cardId:card.id});
  const openTrainerSeg=(seg,tree)=>setTrainer({skillNome:seg.skillNome,next:seg.next,pal:tree.pal,emoji:seg.emoji,skillId:seg.skill.id,treeId:tree.id,type:'acao',title:'Treino guiado'});
  const onTrainerDone=t=>{logPractice(t);if(t.cardId)setCompleted(s=>{const n=new Set(s);n.add(t.cardId);return n;});};

  if(!hasSkills){
    return<div className="sec"><div className="reels-empty">
      <span className="re-emoji">🌳</span>

      <div>
        <div className="rb-title">REELS DE EVOLUÇÃO</div>
        <div className="rb-sub">Toque um story ou role o feed. Cada card treina uma skill sua.</div>
      </div>
      <div className="rb-stats">
        <div className="rb-stat"><b>{todayCount}</b><span>hoje</span></div>
        <div className="rb-stat"><b>{streak}</b><span>dias</span></div>
        <div className="rb-stat"><b>{totalReps}</b><span>total</span></div>
      </div>
    </div>
    <div className="reel-filters">
      <button className={"rfil"+(filter==='all'?' on':'')}onClick={()=>setFilter('all')}>🌀 Todas</button>
      {trees.map(t=><button key={t.id}className={"rfil"+(filter===t.id?' on':'')}style={{'--rc':t.pal.d}}onClick={()=>setFilter(t.id)}>{t.emoji} {t.nome}</button>)}
    </div>
    <div className="reels-feed"ref={feedRef}style={{height:feedH}}>
      {cards.map(card=><ReelCard key={card.id}card={card}reps={repsBySkill[card.skillId]||0}done={completed.has(card.id)}onDone={completeCard}onTrain={openTrainerCard}/>)}
      <div className="reels-sentinel"ref={sentinelRef}>{aiBusy?'✨ gerando mais…':'carregando mais…'}</div>
    </div>
    {story&&<ReelStoryViewer tree={story}segments={reelStorySegments(story)}onClose={()=>setStory(null)}onSeen={markStorySeen}onTrain={seg=>{const t=story;setStory(null);openTrainerSeg(seg,t);}}/>}
    {trainer&&<ReelTrainer target={trainer}onClose={()=>setTrainer(null)}onComplete={onTrainerDone}/>}
  </div>;
}

function App(){
  const[st,setSt]=useState(loadSt);
  const[tab,setTab]=useState('hoje');
  const[fbUser,setFbUser]=useState(null);
  const[syncStatus,setSyncStatus]=useState('idle'); // 'idle'|'syncing'|'ok'|'err'
  const syncTimer=useRef(null);
  const isFirstSync=useRef(true);

  // Persist locally
  useEffect(()=>{
    try{localStorage.setItem('sc-v3',JSON.stringify(st));}catch(e){}
  },[st]);

  // Apply theme
  useEffect(()=>{applyTheme(st.config);},[st.config.themeId,st.config.accentOverride,st.config.fontSize,st.config.textColor]);
  useEffect(()=>{applyTheme(st.config);},[]);

  // Init Firebase on mount if config exists
  useEffect(()=>{
    const cfg=fbLoadCfg();
    if(!cfg)return;
    const ok=fbInit(cfg);
    if(!ok)return;
    const unsub=fbOnAuth(async user=>{
      setFbUser(user);
      if(user&&isFirstSync.current){
        isFirstSync.current=false;
        // On first login, pull cloud and merge (cloud wins for older local data)
        try{
          const cloud=await fbPull(user.uid);
          if(cloud)setSt(p=>sanitizeSkilltree(sanitizeTabs(mergeDeep(p,cloud))));
        }catch(e){console.warn('Pull on login failed:',e);}
      }
    });
    return unsub;
  },[]);

  // Auto-sync to cloud 3s after any state change
  useEffect(()=>{
    if(!fbUser)return;
    clearTimeout(syncTimer.current);
    setSyncStatus('syncing');
    syncTimer.current=setTimeout(async()=>{
      try{
        await fbPush(fbUser.uid,st);
        setSyncStatus('ok');
      }catch(e){
        console.warn('Sync error:',e);
        setSyncStatus('err');
      }
    },3000);
    return()=>clearTimeout(syncTimer.current);
  },[st,fbUser]);

  // Manual sync
  const manualSync=useCallback(async()=>{
    if(!fbUser)return;
    setSyncStatus('syncing');
    try{
      await fbPush(fbUser.uid,st);
      setSyncStatus('ok');
    }catch(e){
      setSyncStatus('err');
    }
  },[fbUser,st]);

  // História de evolução: detecta quando o usuário sobe de classe
  const curClass=getLevelInfo(calcTotalXP(st)).cls;
  useEffect(()=>{
    const seen=st.aiClassSeen||1;
    if(curClass.id<=seen)return;
    if(aiReady()){
      let cancel=false;
      (async()=>{
        try{
          const t=aiStrip(await aiCall(AI_SYS_MALANDRO,`Na minha jornada de evolução pessoal (estilo RPG), acabei de subir para a classe "${curClass.nome}" — ${curClass.desc}. Escreva uma narrativa épica e pessoal de 2 a 3 frases celebrando essa evolução, no clima da malandragem, me chamando pra continuar firme.`,300));
          if(!cancel)setSt(p=>({...p,aiClassSeen:curClass.id,aiClassStory:t?{classId:curClass.id,text:t,date:TODAY()}:null}));
        }catch(e){if(!cancel)setSt(p=>({...p,aiClassSeen:curClass.id}));}
      })();
      return()=>{cancel=true;};
    }else{
      setSt(p=>({...p,aiClassSeen:curClass.id}));
    }
  },[curClass.id]);

  const sections={
    hoje:<HojeSection st={st}setSt={setSt}/>,
    reels:<ReelsSection st={st}setSt={setSt}/>,
    tarefas:<TarefasSection st={st}setSt={setSt}/>,
    habitos:<HabitosSection st={st}setSt={setSt}/>,
    dashboard:<DashboardSection st={st}setSt={setSt}/>,
    metas:<MetasSection st={st}setSt={setSt}/>,
    anotacoes:<AnotacoesSection st={st}setSt={setSt}/>,
    financas:<FinancasSection st={st}setSt={setSt}/>,
    missao:<MissaoSection st={st}setSt={setSt}/>,
    crencas:<CrencasSection st={st}setSt={setSt}/>,
    skilltree:<SkillTreeSection st={st}setSt={setSt}/>,
    conquistas:<ConquistasSection st={st}setSt={setSt}/>,
    eixo:<EixoSection st={st}setSt={setSt}/>,
    config:<ConfigSection st={st}setSt={setSt}fbUser={fbUser}setFbUser={setFbUser}syncStatus={syncStatus}onManualSync={manualSync}/>,
  };

  const visibleTab=(st.config.tabs||DEF_TABS).some(t=>t.id===tab&&t.visible!==false)?tab:'hoje';

  const story=st.aiClassStory;
  const storyCls=story?CLASSES.find(c=>c.id===story.classId):null;

  return<div>
    <Navbar cur={visibleTab}onChange={setTab}st={st}fbUser={fbUser}syncStatus={syncStatus}/>
    {sections[visibleTab]||null}
    {story&&storyCls&&<div className="overlay"onClick={e=>{if(e.target===e.currentTarget)setSt(p=>({...p,aiClassStory:null}));}}>
      <div className="modal"style={{textAlign:'center',maxWidth:380,border:`1px solid ${storyCls.cor}66`,boxShadow:`0 0 30px ${storyCls.cor}44`}}>
        <div style={{fontFamily:'var(--serif)',fontSize:'.66rem',letterSpacing:'.16em',textTransform:'uppercase',color:storyCls.cor,marginBottom:12}}>Nova Classe Desbloqueada</div>
        <div style={{display:'flex',justifyContent:'center',marginBottom:10}}><ClassAvatar cls={storyCls}size={110}baseImg={st.classBaseImg}/></div>
        <div style={{fontFamily:'var(--serif)',fontWeight:900,fontSize:'1.5rem',letterSpacing:'.05em',color:storyCls.cor,textShadow:`0 0 14px ${storyCls.cor}66`,marginBottom:12}}>{storyCls.nome.toUpperCase()}</div>
        <div style={{fontSize:'.9rem',color:'var(--tx2)',lineHeight:1.6,fontStyle:'italic',marginBottom:18}}>{story.text}</div>
        <button className="btn btn-ac"onClick={()=>setSt(p=>({...p,aiClassStory:null}))}>Seguir a jornada →</button>
      </div>
    </div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

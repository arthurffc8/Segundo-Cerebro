    <div style={{textAlign:'center',marginBottom:18}}>
      <div style={{fontFamily:'var(--serif)',fontWeight:900,fontSize:'1.15rem',letterSpacing:'.08em',color:acc,textShadow:`0 0 ${Math.round(6+auraP*16)}px ${acc+ah(.3+auraP*.5)}`}}>{cls.nome} {roman(info.sub)}</div>

        <div style={{fontSize:'.72rem',color:'var(--tx3)',marginTop:5}}>Aura em <b style={{color:acc,fontFamily:'var(--fm)'}}>{auraPct}%</b> — falta{lvlsToNext===1?'':'m'} <b style={{color:'var(--tx2)',fontFamily:'var(--fm)'}}>{lvlsToNext}</b> {lvlsToNext===1?'nível':'níveis'} pra virar <b style={{color:nextClass.cor}}>{nextClass.nome}</b>.</div>

          <div style={{fontFamily:'var(--serif)',fontWeight:900,fontSize:'1.2rem',letterSpacing:'.06em',color:imgModal.cor}}>{imgModal._locked?'? ? ?':imgModal.nome}{imgModal._locked&&<span style={{fontSize:'.7rem',marginLeft:8,opacity:.8}}>🔒</span>}</div>
          <div style={{fontSize:'.75rem',color:'var(--tx2)',fontStyle:'italic'}}>{imgModal._locked?`Desbloqueia no nível ${imgModal.minLevel}.`:imgModal.desc}</div>
        </div>

    </div>}
  </div>;
}

// ── TAREFAS FIXAS (recorrentes por dia da semana) ─────────────────────────────
const WD_SHORT=['D','S','T','Q','Q','S','S'];

function spawnFixedTasks(st,setSt){
  const fixed=st.fixedTasks||[];
  if(!fixed.length)return;
  const now=new Date();
  const dow=now.getDay();
  const td=TODAY();
  const toSpawn=fixed.filter(ft=>(ft.days||[]).includes(dow));
  if(!toSpawn.length)return;
  const existing=new Set((st.tasks||[]).filter(t=>t.fixedId&&t.date===td).map(t=>t.fixedId));
  const fresh=toSpawn.filter(ft=>!existing.has(ft.id)).map(ft=>({
    id:uid(),title:ft.title,weight:ft.weight||5,date:td,time:ft.time||'',
    cat:ft.cat||'',prio:ft.prio||'media',done:false,createdAt:td,
    subtasks:(ft.subtasks||[]).map(s=>({...s})),fixedId:ft.id,
  }));
  if(!fresh.length)return;
  setSt(p=>({...p,tasks:[...(p.tasks||[]),...fresh]}));
}

// ── MODAIS DE FORMULÁRIO ─────────────────────────────────────────────────────

function TaskModal({open,onClose,onSave,onSaveFixed,init,cats}){
  const blank={title:'',weight:5,date:TODAY(),time:'',cat:cats[0]?.id||'',prio:'media',done:false,subtasks:[],fixedDays:[]};
  const[f,setF]=useState({...blank});
  useEffect(()=>{setF({...blank,...(init||{}),fixedDays:(init&&init.fixedDays)||[]});},[open]);
  const isEdit=!!(init&&init.id);
  const hasFixed=(f.fixedDays||[]).length>0;
  function togDay(d){setF(p=>({...p,fixedDays:p.fixedDays.includes(d)?p.fixedDays.filter(x=>x!==d):[...p.fixedDays,d].sort()}));}
  function save(){
    if(!f.title.trim())return;
    if(hasFixed&&onSaveFixed){
      onSaveFixed({title:f.title.trim(),weight:f.weight||5,time:f.time||'',cat:f.cat||'',prio:f.prio||'media',days:f.fixedDays,subtasks:(f.subtasks||[]).filter(s=>s.text.trim())});
    }else{
      onSave({...f,date:f.date||TODAY(),subtasks:(f.subtasks||[]).filter(s=>s.text.trim())});
    }
    onClose();
  }
  function addSub(){setF(p=>({...p,subtasks:[...(p.subtasks||[]),{id:uid(),text:'',done:false}]}));}
  function updSub(i,v){setF(p=>({...p,subtasks:p.subtasks.map((s,idx)=>idx===i?{...s,text:v}:s)}));}
  function togSub(i){setF(p=>({...p,subtasks:p.subtasks.map((s,idx)=>idx===i?{...s,done:!s.done}:s)}));}
  function delSub(i){setF(p=>({...p,subtasks:p.subtasks.filter((_,idx)=>idx!==i)}));}
  return<Modal open={open}onClose={onClose}title={isEdit?'Editar Tarefa':'Nova Tarefa'}>
    <Fld label="Título"><input value={f.title}onChange={e=>setF(p=>({...p,title:e.target.value}))}placeholder="Ex: Estudar n8n por 1 hora"/></Fld>
    <div className="g2c">
      <Fld label="Data"><input type="date"value={f.date}onChange={e=>setF(p=>({...p,date:e.target.value}))}disabled={hasFixed}/></Fld>
      <Fld label="Horário (opcional)"><input type="time"value={f.time||''}onChange={e=>setF(p=>({...p,time:e.target.value}))}/></Fld>
    </div>
    <div className="g2c">
      <Fld label="Peso (1–10)"><input type="number"min={1}max={10}value={f.weight}onChange={e=>setF(p=>({...p,weight:+e.target.value}))}/></Fld>
      <Fld label="Prioridade">
        <select value={f.prio}onChange={e=>setF(p=>({...p,prio:e.target.value}))}>
          <option value="alta">Alta</option><option value="media">Média</option><option value="baixa">Baixa</option>
        </select>
      </Fld>
    </div>
    <Fld label="Categoria">
      <select value={f.cat}onChange={e=>setF(p=>({...p,cat:e.target.value}))}>
        {cats.map(c=><option key={c.id}value={c.id}>{c.name}</option>)}
      </select>
    </Fld>
    <Fld label={`Repetir semanalmente${hasFixed?' ✦ fixa':''}`}>
      <div className="tsk-wd">
        {WD_SHORT.map((lb,i)=><button key={i}type="button"className={`tsk-wd-btn${f.fixedDays.includes(i)?' on':''}`}onClick={()=>togDay(i)}>{lb}</button>)}
      </div>
      {hasFixed&&<div style={{fontSize:'.68rem',color:'var(--ac)',marginTop:6,fontStyle:'italic'}}>🔁 Esta tarefa aparecerá automaticamente nos dias selecionados.</div>}
    </Fld>
    <Fld label="Subitens (lista)">
      <div className="flex col g6">
        {(f.subtasks||[]).map((s,i)=><div key={s.id}className="fc g6">
          <Chk on={s.done}onChange={()=>togSub(i)}/>
          <input value={s.text}onChange={e=>updSub(i,e.target.value)}placeholder="Subitem..."/>
          <button className="btn-ic"style={{color:'var(--er)',flexShrink:0}}onClick={()=>delSub(i)}>×</button>
        </div>)}
      </div>
      <button onClick={addSub}style={{marginTop:6,fontSize:'.75rem',color:'var(--ac)',background:'none',border:'none',cursor:'pointer',padding:'2px 0'}}>+ adicionar subitem</button>
    </Fld>
    <Btns>
      <button className="btn btn-gh"onClick={onClose}>Cancelar</button>
      <button className="btn btn-ac"onClick={save}>{hasFixed?'Criar Tarefa Fixa':'Salvar'}</button>
    </Btns>
  </Modal>;
}

function HabitModal({open,onClose,onSave,init}){
  const blank={name:'',emoji:'⭐',freq:'diario',days:[],weight:10,color:'#60a5fa',cat:'saude',monthlyGoal:20,active:true};

// ── MODO FOCO (Pomodoro fullscreen) ──────────────────────────────────────────

function FocusMode({st,onClose}){
  const SESSIONS=[
    {label:'Foco',min:25,color:'var(--ac)'},
    {label:'Pausa curta',min:5,color:'#22c55e'},
    {label:'Pausa longa',min:15,color:'#3b82f6'},
  ];
  const[sessionIdx,setSessionIdx]=useState(0);
  const[running,setRunning]=useState(false);
  const[elapsed,setElapsed]=useState(0);
  const[reflection,setReflection]=useState('');
  const intervalRef=useRef(null);
  const sess=SESSIONS[sessionIdx];
  const total=sess.min*60;
  const left=Math.max(0,total-elapsed);
  const mm=String(Math.floor(left/60)).padStart(2,'0');
  const ss=String(left%60).padStart(2,'0');
  const pct=elapsed/total;
  // circular SVG progress
  const R=80,CX=100,CY=100,CIRC=2*Math.PI*R;
  const dash=CIRC*(1-pct);

  useEffect(()=>{
    if(running){
      intervalRef.current=setInterval(()=>{
        setElapsed(e=>{if(e>=total){clearInterval(intervalRef.current);setRunning(false);return total;}return e+1;});
      },1000);
    }else{
      clearInterval(intervalRef.current);
    }
    return()=>clearInterval(intervalRef.current);
  },[running,total]);

  function changeSession(i){setSessionIdx(i);setElapsed(0);setRunning(false);setReflection('');}
  function reset(){setElapsed(0);setRunning(false);setReflection('');}

  // top priority task today
  const td=TODAY();
  const topTask=st.tasks.filter(t=>t.date===td&&!t.done).sort((a,b)=>{const po={alta:0,media:1,baixa:2};return po[a.prio]-po[b.prio];})[0];

  // Reflexão pós-foco gerada pela IA quando a sessão de Foco termina
  useEffect(()=>{
    if(left===0&&elapsed>0&&sess.label==='Foco'&&aiReady()&&!reflection){
      setReflection('...');
      (async()=>{
        try{
          const t=aiStrip(await aiCall(AI_SYS_MALANDRO,`Acabei de concluir uma sessão de foco de ${sess.min} minutos. Tarefa que eu estava focando: "${(topTask&&topTask.title)||'(sem tarefa específica)'}". Faça 2 perguntas curtas e diretas de reflexão pra eu avaliar o que rendeu e o próximo passo. Liste cada pergunta numa linha começando com "• ".`,160));
          setReflection(t||'');
        }catch(e){setReflection('');}
      })();
    }
  },[left,elapsed]);
  // habit progress
  const dayLog=st.habitLog[td]||{};
  const active=st.habits.filter(h=>h.active);
  const doneH=active.filter(h=>dayLog[h.id]).length;

  return<div style={{position:'fixed',inset:0,zIndex:900,background:'rgba(0,0,0,.96)',backdropFilter:'blur(8px)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:24,animation:'fi .22s ease'}}>
    {/* Close */}
    <button onClick={onClose}style={{position:'absolute',top:16,right:16,background:'none',border:'1px solid var(--bd2)',color:'var(--tx2)',padding:'6px 12px',borderRadius:8,fontSize:'.8rem',cursor:'pointer'}}>✕ Fechar</button>

    {/* Session selector */}
    <div style={{display:'flex',gap:8}}>
      {SESSIONS.map((s,i)=><button key={i}onClick={()=>changeSession(i)}style={{padding:'6px 16px',borderRadius:20,fontSize:'.78rem',fontWeight:700,cursor:'pointer',background:sessionIdx===i?s.color+'22':'transparent',border:`1px solid ${sessionIdx===i?s.color:'#333'}`,color:sessionIdx===i?s.color:'#555',transition:'all .15s'}}>{s.label}</button>)}
    </div>

    {/* Circle timer */}
    <div style={{position:'relative',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <svg width="200"height="200"viewBox="0 0 200 200">
        <circle cx={CX}cy={CY}r={R}fill="none"stroke="#1a1a1a"strokeWidth="8"/>
        <circle cx={CX}cy={CY}r={R}fill="none"stroke={sess.color}strokeWidth="8"strokeLinecap="round"
          strokeDasharray={CIRC}strokeDashoffset={dash}
          transform="rotate(-90 100 100)"style={{transition:'stroke-dashoffset .9s linear'}}/>
      </svg>
      <div style={{position:'absolute',textAlign:'center'}}>
        <div style={{fontFamily:'var(--fm)',fontSize:'2.8rem',fontWeight:700,color:sess.color,lineHeight:1}}>{mm}:{ss}</div>
        <div style={{fontSize:'.72rem',color:'#555',marginTop:4,textTransform:'uppercase',letterSpacing:'.1em'}}>{sess.label}</div>
      </div>
    </div>

    {/* Controls */}
    <div style={{display:'flex',gap:12}}>
      <button onClick={reset}style={{padding:'8px 18px',borderRadius:8,background:'#1a1a1a',border:'1px solid #2a2a2a',color:'#666',cursor:'pointer',fontSize:'.85rem'}}>↺ Reset</button>
      <button onClick={()=>setRunning(r=>!r)}style={{padding:'10px 32px',borderRadius:8,background:sess.color,border:'none',color:'#000',fontWeight:800,fontSize:'1rem',cursor:'pointer',transition:'opacity .15s'}}>{running?'⏸ Pausar':'▶ Iniciar'}</button>
    </div>

    {/* Reflexão pós-foco (IA) */}
    {reflection&&<div style={{width:'100%',maxWidth:340,padding:'12px 14px',background:'var(--ac1)',border:'1px solid var(--ac2)',borderRadius:10}}>
      <div style={{fontSize:'.66rem',color:'var(--ac)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:6,fontWeight:700}}>🧠 Reflexão da sessão</div>
      {reflection==='...'
        ?<div style={{fontSize:'.82rem',color:'var(--tx3)'}}>Gerando…</div>
        :<div style={{fontSize:'.84rem',color:'var(--tx)',lineHeight:1.5,whiteSpace:'pre-line'}}>{reflection}</div>}
    </div>}

    {/* Top task + habit mini progress */}
    <div style={{width:'100%',maxWidth:340,display:'flex',flexDirection:'column',gap:8,marginTop:4}}>
      {topTask&&<div style={{padding:'10px 14px',background:'#111',border:'1px solid #222',borderRadius:10}}>
        <div style={{fontSize:'.68rem',color:'#444',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:4}}>Tarefa prioritária</div>
        <div style={{fontSize:'.9rem',fontWeight:600,color:'#ccc'}}>{topTask.title}</div>
      </div>}
      <div style={{padding:'10px 14px',background:'#111',border:'1px solid #222',borderRadius:10}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
          <span style={{fontSize:'.68rem',color:'#444',textTransform:'uppercase',letterSpacing:'.08em'}}>Hábitos hoje</span>
          <span style={{fontFamily:'var(--fm)',fontSize:'.8rem',color:'#666'}}>{doneH}/{active.length}</span>
        </div>
        <div style={{height:4,background:'#1a1a1a',borderRadius:2,overflow:'hidden'}}>
          <div style={{height:'100%',width:`${(doneH/Math.max(active.length,1))*100}%`,background:'var(--ac)',borderRadius:2,transition:'width .4s'}}/>
        </div>
      </div>
    </div>
  </div>;
}

// ── MENU DE DOPAMINA ─────────────────────────────────────────────────────────

const DOPAMINA_SECOES=[
  {key:'entradas',  label:'Entradas',       sub:'5 min',  emoji:'🥗', cor:'#22c55e'},
  {key:'pratos',    label:'Pratos Principais',sub:'20 min',emoji:'🍖', cor:'var(--ac)'},
  {key:'sobremesas',label:'Sobremesas',      sub:'10 min', emoji:'🍮', cor:'#a855f7'},
];

function DopaminaMenu({st,setSt}){
  const td=TODAY();
  const menu=st.dopaminaMenu||{entradas:[],pratos:[],sobremesas:[]};
  const log=st.dopaminaLog?.[td]||{};
  const[sugestao,setSugestao]=useState(null);
  const[addModal,setAddModal]=useState(null);
  const[novoItem,setNovoItem]=useState({titulo:'',emoji:''});
  const[open,setOpen]=useState(true);

  const totalItens=DOPAMINA_SECOES.reduce((s,sec)=>s+(menu[sec.key]||[]).length,0);
  const totalFeitos=Object.values(log).filter(Boolean).length;

  function toggle(id){
    setSt(p=>({...p,dopaminaLog:{...(p.dopaminaLog||{}),[td]:{...((p.dopaminaLog||{})[td]||{}),[id]:!((p.dopaminaLog||{})[td]||{})[id]}}}));
  }
  function addItem(key){
    if(!novoItem.titulo.trim())return;
    setSt(p=>({...p,dopaminaMenu:{...(p.dopaminaMenu||{}), [key]:[...((p.dopaminaMenu||{})[key]||[]),{...novoItem,id:uid(),emoji:novoItem.emoji||'⭐'}]}}));
    setNovoItem({titulo:'',emoji:''});setAddModal(null);
  }
  function delItem(key,id){
    setSt(p=>({...p,dopaminaMenu:{...(p.dopaminaMenu||{}),[key]:((p.dopaminaMenu||{})[key]||[]).filter(i=>i.id!==id)}}));
  }
  function sortear(){
    const picks={};
    for(const s of DOPAMINA_SECOES){
      const disp=(menu[s.key]||[]).filter(i=>!log[i.id]);
      if(disp.length)picks[s.key]=disp[Math.floor(Math.random()*disp.length)].id;
    }
    setSugestao(picks);
    setTimeout(()=>setSugestao(null),10000);
  }

  return<div className="card mb14"style={{padding:0,overflow:'hidden'}}>
    {/* Header do cardápio */}
    <div onClick={()=>setOpen(o=>!o)}style={{cursor:'pointer',padding:'12px 14px',background:'var(--card2)',borderBottom:open?'1px solid var(--bd)':'none',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div className="fc g8">
        <span style={{fontSize:'1.1rem'}}>🧠</span>
        <div>
          <div style={{fontFamily:'var(--ft)',fontSize:'1rem',letterSpacing:'.06em',lineHeight:1}}>MENU DE DOPAMINA</div>
          <div style={{fontSize:'.65rem',color:'var(--tx3)',marginTop:2}}>{totalFeitos}/{totalItens} pedidos hoje</div>
        </div>
      </div>
      <div className="fc g8">
        {open&&<button onClick={e=>{e.stopPropagation();sortear();}}style={{padding:'4px 10px',borderRadius:8,background:'var(--ac)',border:'none',color:'#000',fontWeight:700,fontSize:'.7rem',cursor:'pointer'}}>🎲 Sortear</button>}
        <span style={{color:'var(--tx3)',fontSize:'.9rem'}}>{open?'▲':'▼'}</span>
      </div>
    </div>

    {open&&<div style={{padding:'12px 14px'}}>
      {DOPAMINA_SECOES.map((sec,si)=><div key={sec.key}style={{marginBottom:si<2?16:0}}>
        {/* Cabeçalho da seção */}
        <div className="fcb mb8">
          <div className="fc g6">
            <span style={{fontSize:'1rem'}}>{sec.emoji}</span>
            <span style={{fontWeight:700,fontSize:'.85rem'}}>{sec.label}</span>
            <span style={{fontSize:'.7rem',fontFamily:'var(--fm)',color:sec.cor,background:sec.cor.startsWith('#')?sec.cor+'18':'var(--ac1)',padding:'1px 7px',borderRadius:8}}>{sec.sub}</span>
          </div>
          <button onClick={()=>{setAddModal(sec.key);setNovoItem({titulo:'',emoji:''});}}style={{fontSize:'.7rem',color:'var(--tx3)',background:'none',border:'none',cursor:'pointer',padding:'2px 4px'}}>+ adicionar</button>
        </div>

        {/* Itens */}
        <div style={{display:'flex',flexDirection:'column',gap:5}}>
          {(menu[sec.key]||[]).map(item=>{
            const done=!!log[item.id];
            const chef=sugestao?.[sec.key]===item.id;
            const corHex=sec.cor.startsWith('#')?sec.cor:'var(--ac)';
            return<div key={item.id}onClick={()=>toggle(item.id)}style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',borderRadius:'var(--r)',cursor:'pointer',background:done?corHex+'18':chef?corHex+'12':'transparent',border:`1px solid ${done?corHex+'55':chef?corHex+'99':'var(--bd2)'}`,boxShadow:chef&&!done?`0 0 14px ${corHex}44`:'none',transition:'all .2s',opacity:done?0.65:1}}>
              <span style={{fontSize:'1.1rem',flexShrink:0}}>{item.emoji}</span>
              <span style={{flex:1,fontSize:'.85rem',fontWeight:500,textDecoration:done?'line-through':'none',color:done?'var(--tx3)':'var(--tx)'}}>{item.titulo}</span>
              {chef&&!done&&<span style={{fontSize:'.6rem',fontWeight:800,color:corHex,background:corHex+'22',padding:'2px 7px',borderRadius:8,letterSpacing:'.05em',flexShrink:0}}>CHEF ⭐</span>}
              {done&&<span style={{color:'#22c55e',flexShrink:0,fontSize:'1rem'}}>✓</span>}
              <button onClick={e=>{e.stopPropagation();delItem(sec.key,item.id);}}style={{background:'none',border:'none',color:'var(--tx4)',fontSize:'.85rem',cursor:'pointer',padding:'0 2px',flexShrink:0,lineHeight:1}}>×</button>
            </div>;
          })}
          {(menu[sec.key]||[]).length===0&&<div style={{color:'var(--tx4)',fontSize:'.78rem',textAlign:'center',padding:'8px 0'}}>Nenhum prato aqui. Clique em + adicionar.</div>}
        </div>
      </div>)}
    </div>}

    {/* Modal para adicionar item */}
    <Modal open={!!addModal}onClose={()=>setAddModal(null)}title="Novo prato">
      <div className="g2c">
        <Fld label="Emoji"><input value={novoItem.emoji}onChange={e=>setNovoItem(p=>({...p,emoji:e.target.value}))}maxLength={4}placeholder="⭐"/></Fld>
        <Fld label="Atividade"><input value={novoItem.titulo}onChange={e=>setNovoItem(p=>({...p,titulo:e.target.value}))}placeholder="Ex: 5 min de alongamento"/></Fld>
      </div>
      <Btns>
        <button className="btn btn-gh"onClick={()=>setAddModal(null)}>Cancelar</button>
        <button className="btn btn-ac"onClick={()=>addItem(addModal)}>Adicionar</button>
      </Btns>
    </Modal>
  </div>;
}

// ── HOJE ─────────────────────────────────────────────────────────────────────

function HojeSection({st,setSt}){
  const td=TODAY();
  const[taskModal,setTaskModal]=useState(false);
  const[editTask,setEditTask]=useState(null);
  const[focusOpen,setFocusOpen]=useState(false);
  // Spawn tarefas fixas do dia
  useEffect(()=>{spawnFixedTasks(st,setSt);},[td]);
  const todayTasks=st.tasks.filter(t=>t.date===td);
  const dayLog=st.habitLog[td]||{};
  const activeHabits=st.habits.filter(h=>h.active);
  const score=getDayScore(st,td);
  const doneT=todayTasks.filter(t=>t.done).length;
  const doneH=activeHabits.filter(h=>dayLog[h.id]).length;
  const maxScore=todayTasks.reduce((s,t)=>s+t.weight,0)+activeHabits.reduce((s,h)=>s+h.weight,0);

  function toggleTask(id){
    setSt(p=>({...p,tasks:p.tasks.map(t=>t.id===id?{...t,done:!t.done}:t)}));
  }
  function toggleHabit(hid){
    setSt(p=>({...p,habitLog:{...p.habitLog,[td]:{...( p.habitLog[td]||{}), [hid]:!(p.habitLog[td]||{})[hid]}}}));
  }
  function saveTask(f){
    const td2=TODAY();
    if(editTask){
      setSt(p=>({...p,tasks:p.tasks.map(t=>t.id===editTask.id?{...t,...f}:t)}));
    }else{
      setSt(p=>({...p,tasks:[...p.tasks,{...f,id:uid(),done:false,createdAt:td2}]}));
    }
    setEditTask(null);
  }
  function saveFixed(f){
    setSt(p=>({...p,fixedTasks:[...(p.fixedTasks||[]),{...f,id:uid()}]}));
  }

  const streak=useMemo(()=>{
    let n=0;const now=new Date();
    for(let i=0;i<365;i++){
      const d=new Date(now);d.setDate(now.getDate()-i);
      const ds=localDateStr(d);
      if(getDayScore(st,ds)>0)n++;else break;
    }
    return n;
  },[st]);
  const streakRecord=useMemo(()=>{
    let best=0,cur=0;
    const now=new Date();
    for(let i=0;i<365;i++){
      const d=new Date(now);d.setDate(now.getDate()-i);
      if(getDayScore(st,localDateStr(d))>0)cur++;else{if(cur>best)best=cur;cur=0;}
    }
    return Math.max(best,cur);
  },[st]);
  const streakMilestones=[3,7,14,21,30,60,90];
  const nextMilestone=streakMilestones.find(m=>m>streak)||streakMilestones[streakMilestones.length-1];
  const fireLevel=streak>=30?5:streak>=21?4:streak>=14?3:streak>=7?2:streak>=3?1:0;
  const fireEmojis=['🔥','🔥','🔥🔥','🔥🔥🔥','🔥🔥🔥🔥','💥🔥🔥🔥🔥'];
  const fireMsgs=[
    'Aquecendo... bora ativar!',
    'Chama começou! Mantenha.',
    'Fogo brando! Não apaga.',
    'Fogueira acesa! Tá pegando.',
    'Inferno na área! Só passa por cima.',
    'LENDA VIVA — tá imparável! 🔥💥'
  ];

  const staticFrase=useMemo(()=>st.frases[Math.floor(Math.random()*st.frases.length)]||'',[]);
  const aiFraseHoje=(st.aiFrase&&st.aiFrase.date===td)?st.aiFrase.text:'';
  const frase=aiFraseHoje||staticFrase;
  // Frase do dia personalizada pela IA (1x por dia)
  useEffect(()=>{
    if(!aiReady())return;
    if(st.aiFrase&&st.aiFrase.date===td)return;
    let cancel=false;
    (async()=>{
      try{
        const lvl=getLevelInfo(calcTotalXP(st));
        const ah=st.habits.filter(h=>h.active);
        const doneHj=ah.filter(h=>(st.habitLog[td]||{})[h.id]).length;
        const ctx=`Contexto de hoje: classe ${lvl.cls.nome} (nível ${lvl.lvl}), score do dia ${score}, hábitos ${doneHj}/${ah.length}, ${todayTasks.length} tarefas. Escreva UMA frase curta (máx 18 palavras), motivadora e pessoal pra hoje. Só a frase, sem aspas.`;
        const text=aiStrip(await aiCall(AI_SYS_MALANDRO,ctx,80));
        if(!cancel&&text)setSt(p=>({...p,aiFrase:{date:td,text}}));
      }catch(e){}
    })();
    return()=>{cancel=true;};
  },[td]);

  return<div className="sec">
    {focusOpen&&<FocusMode st={st}onClose={()=>setFocusOpen(false)}/>}

    {/* Tarefas do dia */}
    <div className="sch">
      <div className="sch-t">Tarefas de Hoje</div>
      <button className="btn btn-ac"onClick={()=>{setEditTask(null);setTaskModal(true);}}>+ Tarefa</button>
    </div>
    {todayTasks.length===0&&<div style={{color:'var(--tx3)',fontSize:'.85rem',padding:'12px 0'}}>Sem tarefas para hoje. Adicione uma!</div>}
    {todayTasks.map(t=><div key={t.id}className={`tsk-row${t.done?' done':''}`}>
      <Chk on={t.done}onChange={()=>toggleTask(t.id)}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:'.88rem',fontWeight:600,textDecoration:t.done?'line-through':'none',color:t.done?'var(--tx2)':'var(--tx)'}}>{t.title}</div>
        <div className="fc g6 mt4"style={{flexWrap:'wrap'}}>
          <CatTag catId={t.cat}cats={st.categories}/>
          <PrioTag p={t.prio}/>
          <span style={{fontSize:'.68rem',fontFamily:'var(--fm)',color:'var(--tx3)'}}>+{t.weight}pts</span>
          {t.fixedId&&<span className="tsk-fixed">fixa</span>}
        </div>
      </div>
      <button className="btn-ic"onClick={()=>{setEditTask(t);setTaskModal(true);}}>✏️</button>
    </div>)}

    {/* Hábitos */}
    <div className="sch mt12">
      <div className="sch-t">Hábitos de Hoje</div>
    </div>
    {activeHabits.map(h=>{
      const done=!!(dayLog[h.id]);
      return<div key={h.id}className="hab-row"style={{borderColor:done?h.color+'33':'var(--bd)',opacity:h.active?1:.5}}>
        <span style={{fontSize:'1.2rem'}}>{h.emoji}</span>
        <div style={{flex:1}}>
          <div style={{fontWeight:600,fontSize:'.88rem',textDecoration:done?'line-through':'none',color:done?'var(--tx2)':'var(--tx)'}}>{h.name}</div>
          <div style={{fontSize:'.7rem',fontFamily:'var(--fm)',color:h.color}}>+{h.weight}pts</div>
        </div>
        <Chk on={done}onChange={()=>toggleHabit(h.id)}/>
      </div>;
    })}

    {/* Score strip */}
    <div className="card mb14"style={{background:'var(--card)',borderColor:'var(--ac2)'}}>
      <div className="fcb"style={{marginBottom:10}}>
        <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.08em'}}>{todayFull()}</div>
        <button onClick={()=>setFocusOpen(true)}style={{display:'flex',alignItems:'center',gap:5,padding:'5px 12px',borderRadius:8,background:'var(--ac)',border:'none',color:'#000',fontWeight:700,fontSize:'.75rem',cursor:'pointer',flexShrink:0}}>⏱ Modo Foco</button>
      </div>
      <div className="fc g16"style={{flexWrap:'wrap'}}>
        <div>
          <div className="score-n">{score}</div>
          <div style={{fontSize:'.68rem',color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.08em'}}>Score do dia</div>
        </div>
        <div className="flex col g4"style={{flex:1,minWidth:120}}>
          <div className="fcb"style={{fontSize:'.8rem'}}>
            <span style={{color:'var(--tx2)'}}>Tarefas</span>
            <span style={{fontFamily:'var(--fm)',color:'var(--ac)'}}>{doneT}/{todayTasks.length}</span>
          </div>
          <PBar val={doneT}max={Math.max(todayTasks.length,1)}color="var(--ac)"/>
          <div className="fcb mt4"style={{fontSize:'.8rem'}}>
            <span style={{color:'var(--tx2)'}}>Hábitos</span>
            <span style={{fontFamily:'var(--fm)',color:'var(--ac)'}}>{doneH}/{activeHabits.length}</span>
          </div>
          <PBar val={doneH}max={Math.max(activeHabits.length,1)}color="var(--ac)"/>
        </div>
      </div>
    </div>

    {/* Sequência de Fogo */}
    <div className="card mb14"style={{borderColor:fireLevel>=4?'var(--ok)':fireLevel>=2?'var(--warn)':'var(--bd)',overflow:'hidden',padding:0}}>
      <div className="fcb"style={{padding:'10px 14px',background:`linear-gradient(135deg,${fireLevel>=4?'#22c55e22':fireLevel>=2?'#eab30822':'transparent'},transparent)`}}>
        <div className="fc g10">
          <span style={{fontSize:fireLevel===0?'1.3rem':'1.6rem',filter:fireLevel>=3?'drop-shadow(0 0 6px #f97316)':'none',transition:'all .3s'}}>
            {fireEmojis[fireLevel]}
          </span>
          <div>
            <div style={{fontWeight:700,fontSize:'.95rem'}}>
              {streak>0?`${streak} ${streak===1?'dia seguido':'dias seguidos'}`:'Nenhum registro hoje'}
            </div>
            <div style={{fontSize:'.7rem',color:'var(--tx2)'}}>
              {fireMsgs[fireLevel]}{streakRecord>1?` · Recorde: ${streakRecord} dias`:' · Bora começar!'}
            </div>
          </div>
        </div>
        {streak>0&&streak<streakMilestones[streakMilestones.length-1]&&<div style={{textAlign:'right',flexShrink:0}}>
          <div style={{fontSize:'.6rem',color:'var(--tx3)',textTransform:'uppercase',letterSpacing:'.06em'}}>Próx. marco</div>
          <div style={{fontFamily:'var(--fm)',fontSize:'.8rem',fontWeight:700,color:'var(--ac)'}}>{nextMilestone}d</div>
        </div>}
      </div>
      {streak>0&&<div style={{padding:'0 14px 10px'}}><PBar val={streak}max={nextMilestone}color={fireLevel>=4?'#22c55e':fireLevel>=2?'#eab308':'var(--ac)'}/></div>}
    </div>

    {/* Frase */}
    <div style={{padding:'10px 14px',background:'var(--ac1)',border:'1px solid var(--ac2)',borderRadius:'var(--r)',marginBottom:'14px',fontStyle:'italic',fontSize:'.85rem',color:'var(--ac)',lineHeight:1.5}}>
      "{frase}"
    </div>

    <TaskModal open={taskModal}onClose={()=>{setTaskModal(false);setEditTask(null);}}onSave={saveTask}onSaveFixed={saveFixed}init={editTask}cats={st.categories}/>
  </div>;
}

// ── TAREFAS ──────────────────────────────────────────────────────────────────

function TarefasSection({st,setSt}){
  const td=TODAY();
  const po={alta:0,media:1,baixa:2};
  const[view,setView]=useState('lista');
  const[modal,setModal]=useState(false);
  const[edit,setEdit]=useState(null);
  const[preset,setPreset]=useState(null);
  const[weekOff,setWeekOff]=useState(0);
  const[listInput,setListInput]=useState({});
  const[editFixed,setEditFixed]=useState(null);
  // Spawn tarefas fixas do dia
  useEffect(()=>{spawnFixedTasks(st,setSt);},[td]);

  function weekDates(ref){
    const d=new Date(ref);const off=(d.getDay()===0?-6:1-d.getDay());
    const mon=new Date(d);mon.setDate(d.getDate()+off);
    return Array.from({length:7},(_,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return localDateStr(x);});
  }
  const thisWeek=weekDates(new Date());

  // ── ações ──
  function save(f){
    if(edit)setSt(p=>({...p,tasks:p.tasks.map(t=>t.id===edit.id?{...t,...f}:t)}));
    else setSt(p=>({...p,tasks:[...p.tasks,{...f,id:uid(),done:false,createdAt:td}]}));
    setEdit(null);setPreset(null);
  }
  function saveFixedTask(f){
    if(editFixed){
      setSt(p=>({...p,fixedTasks:(p.fixedTasks||[]).map(ft=>ft.id===editFixed.id?{...ft,...f}:ft)}));
    }else{
      setSt(p=>({...p,fixedTasks:[...(p.fixedTasks||[]),{...f,id:uid()}]}));
    }
    setEditFixed(null);
  }
  function delFixed(id){setSt(p=>({...p,fixedTasks:(p.fixedTasks||[]).filter(ft=>ft.id!==id)}));}
  function del(id){setSt(p=>({...p,tasks:p.tasks.filter(t=>t.id!==id)}));}
  function tog(id){setSt(p=>({...p,tasks:p.tasks.map(t=>t.id===id?{...t,done:!t.done}:t)}));}
  function openNew(initPartial){setEdit(null);setPreset(initPartial||{});setModal(true);}
  function openEdit(t){setEdit(t);setPreset(null);setModal(true);}

  // ── LISTAS PRÓPRIAS (criadas livremente, lado a lado) ──
  const lists=st.taskLists||[];
  function addList(){setSt(p=>({...p,taskLists:[...(p.taskLists||[]),{id:uid(),nome:'Nova lista',items:[]}]}));}
  function renameList(id,nome){setSt(p=>({...p,taskLists:p.taskLists.map(l=>l.id===id?{...l,nome}:l)}));}
  function delList(id){setSt(p=>({...p,taskLists:p.taskLists.filter(l=>l.id!==id)}));}
  function addItem(lid){const txt=(listInput[lid]||'').trim();if(!txt)return;setSt(p=>({...p,taskLists:p.taskLists.map(l=>l.id===lid?{...l,items:[...l.items,{id:uid(),text:txt,done:false}]}:l)}));setListInput(s=>({...s,[lid]:''}));}
  function togItem(lid,iid){setSt(p=>({...p,taskLists:p.taskLists.map(l=>l.id===lid?{...l,items:l.items.map(it=>it.id===iid?{...it,done:!it.done}:it)}:l)}));}
  function delItem(lid,iid){setSt(p=>({...p,taskLists:p.taskLists.map(l=>l.id===lid?{...l,items:l.items.filter(it=>it.id!==iid)}:l)}));}
  function moveItem(lid,iid,dir){setSt(p=>({...p,taskLists:p.taskLists.map(l=>{if(l.id!==lid)return l;const items=[...l.items];const i=items.findIndex(it=>it.id===iid);const j=i+dir;if(j<0||j>=items.length)return l;[items[i],items[j]]=[items[j],items[i]];return{...l,items};})}));}

  // ── QUADRO SEMANAL ──
  const DLBL=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const refBase=(()=>{const d=new Date();d.setDate(d.getDate()+weekOff*7);return d;})();
  const week=weekDates(refBase);
  const ptShort=ds=>{const d=new Date(ds+'T12:00:00');return d.getDate()+'/'+(d.getMonth()+1);};
  const weekAll=st.tasks.filter(t=>t.date&&t.date>=week[0]&&t.date<=week[6]);
  const weekDone=weekAll.filter(t=>t.done).length;
  // refeições fixas (âncoras do dia) — tarefas se organizam antes/depois por horário
  const MEALS=[{id:'m-cafe',meal:true,emoji:'☕',title:'Café da manhã',time:'08:00'},{id:'m-almoco',meal:true,emoji:'🍽️',title:'Almoço',time:'12:00'}];
  function dayItems(ds){
    const dayDow=new Date(ds+'T12:00:00').getDay();
    const realTasks=st.tasks.filter(t=>t.date===ds).map(t=>({...t,time:t.time||'',_ds:ds}));
    const spawnedIds=new Set(realTasks.filter(t=>t.fixedId).map(t=>t.fixedId));
    const fixed=(st.fixedTasks||[]).filter(ft=>(ft.days||[]).includes(dayDow)&&!spawnedIds.has(ft.id));
    const virtualTasks=fixed.map(ft=>({...ft,id:'vfx-'+ft.id,time:ft.time||'',_ds:ds,virtualFixed:true,fixedId:ft.id}));
    const items=[...realTasks,...virtualTasks,...MEALS.map(m=>({...m}))];
    items.sort((a,b)=>{const ta=a.time||'',tb=b.time||'';if(ta!==tb)return ta<tb?-1:1;if(a.meal!==b.meal)return a.meal?1:-1;if(a.virtualFixed!==b.virtualFixed)return a.virtualFixed?1:-1;return(po[a.prio]||1)-(po[b.prio]||1);});
    return items;
  }
  function spawnVirtual(ftId,ds){
    const ft=(st.fixedTasks||[]).find(f=>f.id===ftId);
    if(!ft)return null;
    const t={id:uid(),title:ft.title,weight:ft.weight||5,date:ds,time:ft.time||'',cat:ft.cat||'',prio:ft.prio||'media',done:false,createdAt:td,subtasks:(ft.subtasks||[]).map(s=>({...s})),fixedId:ft.id};
    setSt(p=>({...p,tasks:[...p.tasks,t]}));
    return t;
  }
  function colCard(t){
    const subs=t.subtasks||[];const dn=subs.filter(s=>s.done).length;
    const pc={alta:'#ef4444',media:'#eab308',baixa:'#22c55e'}[t.prio]||'#888';
    const isVirtual=!!t.virtualFixed;
    const handleClick=()=>{
      if(isVirtual){const spawned=spawnVirtual(t.fixedId,t._ds||td);if(spawned)openEdit(spawned);}
      else openEdit(t);
    };
    const handleToggle=e=>{
      e.stopPropagation();
      if(isVirtual){const spawned=spawnVirtual(t.fixedId,t._ds||td);if(spawned)tog(spawned.id);}
      else tog(t.id);
    };
    return<div onClick={handleClick}style={{flex:1,background:isVirtual?'var(--card)':'var(--card2)',border:isVirtual?`1px dashed ${pc}66`:'1px solid var(--bd)',borderLeft:`3px solid ${pc}`,borderRadius:6,padding:'7px 9px',cursor:'pointer',opacity:t.done?.5:1}}>
      <div className="fc g6"style={{alignItems:'flex-start'}}>
        <span onClick={handleToggle}style={{fontSize:'.8rem',flexShrink:0,cursor:'pointer',lineHeight:1.2}}>{t.done?'✅':'⬜'}</span>
        <span style={{flex:1,fontSize:'.76rem',fontWeight:600,lineHeight:1.25,textDecoration:t.done?'line-through':'none',color:t.done?'var(--tx3)':'var(--tx)',wordBreak:'break-word'}}>{t.title}</span>
      </div>
      <div className="fc g4 mt4"style={{flexWrap:'wrap'}}>
        {subs.length>0&&<span style={{fontSize:'.62rem',fontFamily:'var(--fm)',color:dn===subs.length?'#22c55e':'var(--tx3)'}}>☑ {dn}/{subs.length}</span>}
        {t.fixedId&&<span className="tsk-fixed">fixa</span>}
      </div>
    </div>;
  }
  function dayRow(item){
    const gutter=<div style={{width:30,flexShrink:0,fontSize:'.56rem',fontFamily:'var(--fm)',color:item.meal?'var(--ac)':'var(--tx4)',textAlign:'right',paddingTop:5,lineHeight:1.15}}>{item.time||''}</div>;
    if(item.meal)return<div key={item.id}className="fc"style={{gap:5,alignItems:'center',margin:'5px 0'}}>
      {gutter}
      <div style={{flex:1,display:'flex',alignItems:'center',gap:5,padding:'3px 7px',borderRadius:6,background:'var(--ac1)',border:'1px dashed var(--ac2)'}}>
        <span style={{fontSize:'.78rem'}}>{item.emoji}</span>
        <span style={{fontSize:'.62rem',fontWeight:700,color:'var(--ac)',textTransform:'uppercase',letterSpacing:'.03em'}}>{item.title}</span>
      </div>
    </div>;
    return<div key={item.id}className="fc"style={{gap:5,alignItems:'stretch',marginBottom:6}}>
      {gutter}{colCard(item)}
    </div>;
  }
  const colWrap={minWidth:160,flex:'0 0 160px',background:'var(--card)',borderRadius:8,padding:8,maxHeight:'62vh',overflowY:'auto'};
  const colHead={fontSize:'.72rem',fontWeight:700,marginBottom:8,position:'sticky',top:0};
  const addBtn=ds=>(<button onClick={()=>openNew({date:ds})}style={{width:'100%',padding:'6px',borderRadius:6,background:'none',border:'1px dashed var(--bd2)',color:'var(--tx3)',fontSize:'.72rem',cursor:'pointer',marginTop:2}}>+ tarefa</button>);

  return<div className="sec">
    <div className="sch">
      <div className="sch-t">Tarefas</div>
      {view==='lista'
        ?<button className="btn btn-ac"onClick={addList}>+ Nova Lista</button>
        :view==='quadro'
        ?<button className="btn btn-ac"onClick={()=>openNew({date:td})}>+ Nova Tarefa</button>
        :<button className="btn btn-ac"onClick={()=>{setEditFixed(null);setModal(true);}}>+ Tarefa Fixa</button>}
    </div>
    <div className="stabs mb14">
      <button className={`stab${view==='lista'?' on':''}`}onClick={()=>setView('lista')}>📋 Listas</button>
      <button className={`stab${view==='quadro'?' on':''}`}onClick={()=>setView('quadro')}>🗓 Quadro Semanal</button>
      <button className={`stab${view==='fixos'?' on':''}`}onClick={()=>setView('fixos')}>🔁 Fixas</button>
    </div>

    {view==='lista'&&<div>
      {lists.length===0&&<div style={{color:'var(--tx3)',fontSize:'.85rem',padding:'30px 0',textAlign:'center'}}>
        Nenhuma lista ainda.<br/><span style={{fontSize:'.78rem'}}>Crie listas próprias (ideias, pendências, compras...) com "+ Nova Lista".</span>
      </div>}
      <div style={{display:'flex',gap:10,overflowX:'auto',paddingBottom:8,alignItems:'flex-start'}}>
        {lists.map(l=>{
          const doneN=l.items.filter(i=>i.done).length;
          return<div key={l.id}style={{...colWrap,border:'1px solid var(--bd)'}}>
            <div className="fcb"style={{marginBottom:8}}>
              <input value={l.nome}onChange={e=>renameList(l.id,e.target.value)}style={{fontWeight:700,fontSize:'.82rem',background:'none',border:'none',padding:0,color:'var(--tx)',width:'100%'}}/>
              <button className="btn-ic"style={{color:'var(--er)',flexShrink:0}}onClick={()=>delList(l.id)}>×</button>
            </div>
            {l.items.length>0&&<div style={{fontSize:'.62rem',fontFamily:'var(--fm)',color:doneN===l.items.length?'#22c55e':'var(--tx3)',marginBottom:6}}>☑ {doneN}/{l.items.length}</div>}
            {l.items.map((it,i)=><div key={it.id}className="fc g4"style={{padding:'3px 0'}}>
              <button className="btn-ic"style={{color:'var(--tx4)',fontSize:'.7rem',padding:1,opacity:i===0?0.15:1,cursor:i===0?'default':'pointer'}}disabled={i===0}onClick={()=>moveItem(l.id,it.id,-1)}>▲</button>
              <button className="btn-ic"style={{color:'var(--tx4)',fontSize:'.7rem',padding:1,opacity:i===l.items.length-1?0.15:1,cursor:i===l.items.length-1?'default':'pointer'}}disabled={i===l.items.length-1}onClick={()=>moveItem(l.id,it.id,1)}>▼</button>
              <Chk on={it.done}onChange={()=>togItem(l.id,it.id)}/>
              <span style={{flex:1,fontSize:'.8rem',color:it.done?'var(--tx3)':'var(--tx2)',textDecoration:it.done?'line-through':'none',wordBreak:'break-word'}}>{it.text}</span>
              <button className="btn-ic"style={{color:'var(--tx4)',flexShrink:0}}onClick={()=>delItem(l.id,it.id)}>×</button>
            </div>)}
            <div className="fc g4" style={{marginTop:6}}>
              <input value={listInput[l.id]||''}onChange={e=>setListInput(s=>({...s,[l.id]:e.target.value}))}onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addItem(l.id);}}}placeholder="Novo item..."style={{fontSize:'.78rem',padding:'5px 8px',flex:1,marginTop:0}}/>
              <button className="btn btn-ac"onClick={()=>addItem(l.id)}style={{padding:'5px 10px',fontSize:'.75rem',flexShrink:0,whiteSpace:'nowrap'}}>Adicionar</button>
            </div>
          </div>;
        })}
        <button onClick={addList}style={{minWidth:120,flex:'0 0 120px',alignSelf:'flex-start',background:'none',border:'1px dashed var(--bd2)',borderRadius:8,color:'var(--tx3)',fontSize:'.8rem',cursor:'pointer',padding:'14px 8px'}}>+ Nova lista</button>
      </div>

function HabitosSection({st,setSt}){
  const[sub,setSub]=useState('lista');
  return<div className="sec">
    <div className="stabs mb14">
      <button className={`stab${sub==='lista'?' on':''}`}onClick={()=>setSub('lista')}>📋 Lista</button>
      <button className={`stab${sub==='tracker'?' on':''}`}onClick={()=>setSub('tracker')}>📅 Tracker Mensal</button>
    </div>
    {sub==='lista'?<HabitsList st={st}setSt={setSt}/>:<HabitsTracker st={st}setSt={setSt}/>}
  </div>;
}

function HabitsList({st,setSt}){
  const[modal,setModal]=useState(false);
  const[edit,setEdit]=useState(null);
  const td=TODAY();
  const mk=td.slice(0,7);

  function save(f){
    if(edit)setSt(p=>({...p,habits:p.habits.map(h=>h.id===edit.id?{...h,...f}:h)}));
    else setSt(p=>({...p,habits:[...p.habits,{...f,id:uid(),order:p.habits.length}]}));
    setEdit(null);
  }
  function del(id){setSt(p=>({...p,habits:p.habits.filter(h=>h.id!==id)}));}
  function togActive(id){setSt(p=>({...p,habits:p.habits.map(h=>h.id===id?{...h,active:!h.active}:h)}));}
  function move(id,dir){
    setSt(p=>{
      const arr=[...p.habits].sort((a,b)=>a.order-b.order);
      const i=arr.findIndex(h=>h.id===id);
      const j=dir==='up'?i-1:i+1;
      if(j<0||j>=arr.length)return p;
      [arr[i].order,arr[j].order]=[arr[j].order,arr[i].order];
      return{...p,habits:arr};
    });
  }

  const habits=[...st.habits].sort((a,b)=>a.order-b.order);

  // calc month completions
  function monthCount(hid){
    let n=0;
    const yr=new Date().getFullYear();
    const mo=new Date().getMonth()+1;
    const days=daysInMonth(yr,mo);
    for(let d=1;d<=days;d++){
      const ds=`${mk}-${String(d).padStart(2,'0')}`;
      if(st.habitLog[ds]?.[hid])n++;
    }
    return n;
  }

  return<div>
    <div className="sch">
      <div className="sch-t">Hábitos</div>
      <button className="btn btn-ac"onClick={()=>{setEdit(null);setModal(true);}}>+ Hábito</button>
    </div>
    {habits.map(h=>{
      const mc=monthCount(h.id);
      return<div key={h.id}className="hab-row"style={{borderColor:h.active?h.color+'33':'var(--bd)',opacity:h.active?1:.55}}>
        <span style={{fontSize:'1.2rem'}}>{h.emoji}</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:600,fontSize:'.88rem'}}>{h.name}</div>
          <div className="fc g6 mt4"style={{flexWrap:'wrap'}}>
            <span style={{fontSize:'.68rem',fontFamily:'var(--fm)',color:h.color}}>{mc}/{h.monthlyGoal} este mês</span>
            <span style={{fontSize:'.68rem',color:'var(--tx3)'}}>+{h.weight}pts</span>
            <span style={{fontSize:'.68rem',color:'var(--tx3)'}}>{h.freq==='diario'?'Diário':'Semanal'}</span>
          </div>
          <div className="mt4"><PBar val={mc}max={h.monthlyGoal}color={h.color}/></div>
        </div>
        <div className="fc g6">
          <Tog on={h.active}onChange={()=>togActive(h.id)}/>
          <button className="btn-ic"onClick={()=>move(h.id,'up')}>↑</button>
          <button className="btn-ic"onClick={()=>move(h.id,'down')}>↓</button>
          <button className="btn-ic"onClick={()=>{setEdit(h);setModal(true);}}>✏️</button>
          <button className="btn-ic"style={{color:'var(--er)'}}onClick={()=>del(h.id)}>🗑</button>
        </div>
      </div>;
    })}
    <HabitModal open={modal}onClose={()=>{setModal(false);setEdit(null);}}onSave={save}init={edit}/>
  </div>;
}

function HabitsTracker({st,setSt}){
  const now=new Date();
  const[yr,setYr]=useState(now.getFullYear());
  const[mo,setMo]=useState(now.getMonth()+1);
  const days=daysInMonth(yr,mo);
  const mk=monthKey(yr,mo);
  const habits=[...st.habits].filter(h=>h.active).sort((a,b)=>a.order-b.order);
  const td=TODAY();

  function toggle(hid,day){
    const ds=`${mk}-${String(day).padStart(2,'0')}`;
    setSt(p=>({...p,habitLog:{...p.habitLog,[ds]:{...(p.habitLog[ds]||{}),[hid]:!(p.habitLog[ds]||{})[hid]}}}));
  }
  function prevMonth(){if(mo===1){setYr(y=>y-1);setMo(12);}else setMo(m=>m-1);}
  function nextMonth(){if(mo===12){setYr(y=>y+1);setMo(1);}else setMo(m=>m+1);}
  const mNames=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  return<div>
    {/* Month nav */}
    <div className="fcb mb14">
      <button className="btn btn-gh"style={{padding:'5px 10px'}}onClick={prevMonth}>‹</button>
      <div style={{fontFamily:'var(--fm)',fontWeight:700,fontSize:'.9rem'}}>{mNames[mo-1]} {yr}</div>
      <button className="btn btn-gh"style={{padding:'5px 10px'}}onClick={nextMonth}>›</button>
    </div>
    <div className="trk-wrap">
      <table style={{borderCollapse:'separate',borderSpacing:'2px',minWidth:'max-content'}}>
        <thead>
          <tr>
            <th style={{fontSize:'.68rem',color:'var(--tx2)',fontWeight:600,padding:'2px 8px 6px 0',textAlign:'left',whiteSpace:'nowrap',minWidth:'100px'}}>Hábito</th>
            {Array.from({length:days},(_,i)=>{
              const d=i+1;
              const ds=`${mk}-${String(d).padStart(2,'0')}`;
              const isT=ds===td;
              return<th key={d}style={{fontSize:'.65rem',color:isT?'var(--ac)':'var(--tx3)',fontWeight:isT?700:400,padding:'2px 1px',textAlign:'center',width:'24px'}}>{d}</th>;
            })}
          </tr>
        </thead>
        <tbody>
          {habits.map(h=>{
            const mc=Array.from({length:days},(_,i)=>{
              const ds=`${mk}-${String(i+1).padStart(2,'0')}`;
              return st.habitLog[ds]?.[h.id]?1:0;
            }).reduce((s,v)=>s+v,0);
            return<tr key={h.id}>
              <td style={{padding:'2px 8px 2px 0',whiteSpace:'nowrap'}}>
                <div className="fc g6">
                  <span style={{fontSize:'.9rem'}}>{h.emoji}</span>
                  <span style={{fontSize:'.75rem',fontWeight:500}}>{h.name}</span>
                  <span style={{fontSize:'.65rem',fontFamily:'var(--fm)',color:h.color}}>{mc}/{h.monthlyGoal}</span>
                </div>
              </td>
              {Array.from({length:days},(_,i)=>{
                const d=i+1;
                const ds=`${mk}-${String(d).padStart(2,'0')}`;
                const done=!!(st.habitLog[ds]?.[h.id]);
                const isT=ds===td;
                return<td key={d}style={{padding:'1px'}}>
                  <div className={`trk-cell${done?' done':''}${isT?' today':''}`}
                    style={{background:done?h.color:'transparent'}}
                    onClick={()=>toggle(h.id,d)}>
                    {done&&<span style={{color:'#fff'}}>✓</span>}
                  </div>
                </td>;
              })}
            </tr>;
          })}
        </tbody>
      </table>
    </div>
  </div>;
}

// ── DASHBOARD ────────────────────────────────────────────────────────────────

function DashboardSection({st,setSt}){
  const now=new Date();
  const[yr,setYr]=useState(now.getFullYear());
  const[mo,setMo]=useState(now.getMonth()+1);
  const[chartMode,setChartMode]=useState('linha');
  const[analiseMode,setAnaliseMode]=useState('geral');
  const td=TODAY();
  const mNames=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const dNames=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const scores=getMonthScores(st,yr,mo);
  const totalTasks=st.tasks.filter(t=>t.date.startsWith(monthKey(yr,mo))).length;
  const doneTasks=st.tasks.filter(t=>t.date.startsWith(monthKey(yr,mo))&&t.done).length;
  const todayScore=getDayScore(st,td);
  const avgScore=useMemo(()=>{const s=scores.filter(d=>d.score>0);return s.length?Math.round(s.reduce((a,d)=>a+d.score,0)/s.length):0;},[scores]);
  const bestDay=useMemo(()=>scores.reduce((b,d)=>d.score>b?d.score:b,0),[scores]);
  const daysWithData=scores.filter(d=>d.score>0).length;
  const totalDays=daysInMonth(yr,mo);
  const pctMonth=Math.round((daysWithData/totalDays)*100);

  // habits month progress — sorted best → worst
  const habitsProgress=st.habits.filter(h=>h.active).map(h=>{
    let done=0;
    for(let d=1;d<=totalDays;d++){
      const ds=`${monthKey(yr,mo)}-${String(d).padStart(2,'0')}`;
      if(st.habitLog[ds]?.[h.id])done++;
    }
    return{...h,done,pct:Math.round((done/Math.max(h.monthlyGoal,1))*100)};
  }).sort((a,b)=>b.pct-a.pct);

  // Day of week failure pattern
  const dayFails=Array(7).fill(0);
  const dayScores=Array(7).fill(0);
  const dayCounts=Array(7).fill(0);
  scores.forEach(d=>{
    const dow=new Date(d.date+'T12:00:00').getDay();
    if(d.score===0)dayFails[dow]++;
    else{dayScores[dow]+=d.score;dayCounts[dow]++;}
  });
  const avgDayScores=dayScores.map((s,i)=>(dayCounts[i]>0?Math.round(s/dayCounts[i]):0));
  const worstDay=dayFails.indexOf(Math.max(...dayFails));
  const bestDayOfWeek=avgDayScores.indexOf(Math.max(...avgDayScores));
  
  // Tasks by category
  const tasksByCat=useMemo(()=>{
    const cats={};
    st.tasks.filter(t=>t.date.startsWith(monthKey(yr,mo))).forEach(t=>{
      const c=t.cat||'sem-categoria';
      if(!cats[c])cats[c]={name:c,total:0,done:0};
      cats[c].total++;
      if(t.done)cats[c].done++;
    });
    // Map to category names
    const namedCats={};
    Object.keys(cats).forEach(k=>{
      const catInfo=st.categories.find(c=>c.id===k);
      namedCats[k]={...cats[k],displayName:catInfo?catInfo.name:k,color:catInfo?catInfo.color:'#888'};
    });
    return Object.values(namedCats);
  },[st.tasks,st.categories,yr,mo]);

  function exp(){
    const data={period:`${mNames[mo-1]} ${yr}`,avgScore,bestDay,daysActive:daysWithData,tasksCompleted:doneTasks,habits:habitsProgress.map(h=>({name:h.name,done:h.done,goal:h.monthlyGoal,pct:h.pct+'%'}))};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`cerebro-${monthKey(yr,mo)}.json`;a.click();
  }

  function prevMonth(){if(mo===1){setYr(y=>y-1);setMo(12);}else setMo(m=>m-1);}
  function nextMonth(){if(mo===12){setYr(y=>y+1);setMo(1);}else setMo(m=>m+1);}

  return<div className="sec">
    <div className="fcb mb14">
      <div className="fcb g8">
        <button className="btn btn-gh"style={{padding:'5px 10px'}}onClick={prevMonth}>‹</button>
        <div style={{fontFamily:'var(--fm)',fontWeight:700,fontSize:'.88rem'}}>{mNames[mo-1]} {yr}</div>
        <button className="btn btn-gh"style={{padding:'5px 10px'}}onClick={nextMonth}>›</button>
      </div>
      <button className="btn btn-gh"style={{fontSize:'.75rem'}}onClick={exp}>⬇ Exportar</button>
    </div>

    {/* Abas de análise */}
    <div className="stabs mb14">
      <button className={`stab${analiseMode==='geral'?' on':''}`}onClick={()=>setAnaliseMode('geral')}>📊 Visão Geral</button>
      <button className={`stab${analiseMode==='categorias'?' on':''}`}onClick={()=>setAnaliseMode('categorias')}>🏷️ Categorias</button>
      <button className={`stab${analiseMode==='padroes'?' on':''}`}onClick={()=>setAnaliseMode('padroes')}>🔍 Padrões</button>
    </div>

    {analiseMode==='geral'&&<>
      {/* Metric cards */}
      <div className="g2c mb14">
        <div className="mcrd"><div className="mval">{todayScore}</div><div className="mlbl">Score hoje</div></div>
        <div className="mcrd"><div className="mval">{avgScore}</div><div className="mlbl">Média do mês</div></div>
        <div className="mcrd"><div className="mval">{bestDay}</div><div className="mlbl">Melhor dia</div></div>
        <div className="mcrd"><div className="mval">{doneTasks}/{totalTasks}</div><div className="mlbl">Tarefas</div></div>
      </div>

      {/* Chart */}
      {(()=>{
        const accent=st.config.accentOverride||(THEMES.find(t=>t.id===st.config.themeId)||THEMES[0]).ac;
        const MODES=[{k:'linha',l:'📈 Linha'},{k:'barras',l:'📊 Barras'},{k:'heatmap',l:'🗓 Calendário'}];
        return<div className="card mb14">
          <div className="fcb mb10">
            <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.07em'}}>Score por dia — {mNames[mo-1]}</div>
            <div className="fc g4">
              {MODES.map(m=><button key={m.k}onClick={()=>setChartMode(m.k)}style={{padding:'3px 9px',borderRadius:12,fontSize:'.68rem',fontWeight:700,cursor:'pointer',border:`1px solid ${chartMode===m.k?accent:'var(--bd2)'}`,background:chartMode===m.k?accent+'22':'none',color:chartMode===m.k?accent:'var(--tx3)',transition:'all .15s'}}>{m.l}</button>)}
            </div>
          </div>
          {chartMode==='linha'&&<>
            <LineChart data={scores}accent={accent}/>
            <div style={{display:'flex',justifyContent:'space-between',marginTop:'4px',fontSize:'.65rem',color:'var(--tx3)',fontFamily:'var(--fm)'}}>
              <span>1</span><span>{Math.floor(totalDays/2)}</span><span>{totalDays}</span>
            </div>
          </>}
          {chartMode==='barras'&&<BarChart data={scores}accent={accent}/>}
          {chartMode==='heatmap'&&<HeatmapChart data={scores}accent={accent}yr={yr}mo={mo}/>}
        </div>;
      })()}

      {/* % conclusão + padrão */}
      <div className="g2c mb14">
        <div className="card">
          <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:'8px'}}>Atividade do mês</div>
          <div style={{fontFamily:'var(--fm)',fontSize:'1.4rem',fontWeight:700,color:'var(--ac)'}}>{pctMonth}%</div>
          <div style={{fontSize:'.72rem',color:'var(--tx2)'}}>{daysWithData} de {totalDays} dias</div>
        </div>
        <div className="card">
          <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:'8px'}}>Padrão de falha</div>
          <div style={{fontFamily:'var(--fm)',fontSize:'1.1rem',fontWeight:700,color:'#ef4444'}}>{DAYS_LABEL[worstDay]}</div>
          <div style={{fontSize:'.72rem',color:'var(--tx2)'}}>é o dia mais difícil</div>
        </div>
      </div>

      {/* Habits progress */}
      <div className="card">
        <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--tx2)',marginBottom:'12px',textTransform:'uppercase',letterSpacing:'.07em'}}>Progresso dos hábitos</div>
        {habitsProgress.map(h=><div key={h.id}style={{marginBottom:'10px'}}>
          <div className="fcb mb4">
            <span style={{fontSize:'.82rem',fontWeight:500}}>{h.emoji} {h.name}</span>
            <span style={{fontSize:'.72rem',fontFamily:'var(--fm)',color:h.color}}>{h.done}/{h.monthlyGoal} ({h.pct}%)</span>
          </div>
          <PBar val={h.done}max={h.monthlyGoal}color={h.color}/>
        </div>)}
      </div>
    </>}

    {analiseMode==='categorias'&&<>
      {/* Distribuição de tarefas por categoria */}
      <div className="card mb14">
        <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--tx2)',marginBottom:'12px',textTransform:'uppercase',letterSpacing:'.07em'}}>Tarefas por Categoria</div>
        {tasksByCat.length===0?<div style={{color:'var(--tx3)',padding:'20px',textAlign:'center'}}>Nenhuma tarefa este mês</div>:
          tasksByCat.map((cat,i)=>{
            const pct=cat.total>0?Math.round((cat.done/cat.total)*100):0;
            return<div key={i}style={{marginBottom:'12px'}}>
              <div className="fcb mb4">
                <span style={{fontSize:'.82rem',fontWeight:500}}><span style={{display:'inline-block',width:'10px',height:'10px',borderRadius:'50%',background:cat.color,marginRight:'6px'}}></span>{cat.displayName}</span>
                <span style={{fontSize:'.72rem',fontFamily:'var(--fm)',color:cat.color}}>{cat.done}/{cat.total} ({pct}%)</span>
              </div>
              <PBar val={cat.done}max={cat.total}color={cat.color}/>
            </div>;
          })
        }
      </div>
    </>}

    {analiseMode==='padroes'&&<>
      <div className="g2c mb14">
        <div className="card">
          <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:'8px'}}>Dia mais produtivo</div>
          <div style={{fontFamily:'var(--fm)',fontSize:'1.1rem',fontWeight:700,color:'#22c55e'}}>{dNames[bestDayOfWeek]}</div>
          <div style={{fontSize:'.72rem',color:'var(--tx2)'}}>Média: {avgDayScores[bestDayOfWeek]} pts</div>
        </div>
        <div className="card">
          <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:'8px'}}>Dia mais difícil</div>
          <div style={{fontFamily:'var(--fm)',fontSize:'1.1rem',fontWeight:700,color:'#ef4444'}}>{DAYS_LABEL[worstDay]}</div>
          <div style={{fontSize:'.72rem',color:'var(--tx2)'}}>{dayFails[worstDay]} falhas este mês</div>
        </div>
      </div>
      
      {/* Média de score por dia da semana */}
      <div className="card mb14">
        <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--tx2)',marginBottom:'12px',textTransform:'uppercase',letterSpacing:'.07em'}}>Média por dia da semana</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'8px'}}>
          {dNames.map((nome,i)=>(
            <div key={i}style={{textAlign:'center',padding:'8px 4px',borderRadius:'8px',background:avgDayScores[i]>0?'var(--card2)':'var(--card)',border:'1px solid var(--bd)'}}>
              <div style={{fontSize:'.65rem',color:'var(--tx3)',marginBottom:'4px'}}>{nome.slice(0,3)}</div>
              <div style={{fontFamily:'var(--fm)',fontSize:'1rem',fontWeight:'700',color:avgDayScores[i]>0?'var(--ac)':'var(--tx3)'}}>{avgDayScores[i]}</div>
            </div>
          ))}

}

function MetasSection({st,setSt}){
  const[sub,setSub]=useState('clareza');
  const subs=[
    {k:'clareza',l:'🎯 Clareza'},{k:'gatilhos',l:'⚡ Gatilhos'},
    {k:'facilitacao',l:'🔧 Facilitação'},{k:'drop',l:'🧠 DROP'},{k:'identidade',l:'🧬 Identidade'},
  ];
  return<div className="sec">
    <div className="stabs mb14">
      {subs.map(s=><button key={s.k}className={`stab${sub===s.k?' on':''}`}onClick={()=>setSub(s.k)}>{s.l}</button>)}
    </div>
    {sub==='clareza'&&<ClarezaTab st={st}setSt={setSt}/>}
    {sub==='gatilhos'&&<GatilhosTab st={st}setSt={setSt}/>}

function ClarezaTab({st,setSt}){
  const[modal,setModal]=useState(false);
  const[edit,setEdit]=useState(null);
  const stMap={'mais-longe':{ic:'🔴',c:'#ef4444'},'igual':{ic:'⚪',c:'#888'},'mais-perto':{ic:'🟢',c:'#22c55e'}};
  function save(f){
    if(edit)setSt(p=>({...p,goals:p.goals.map(g=>g.id===edit.id?{...g,...f,updatedAt:TODAY()}:g)}));
    else setSt(p=>({...p,goals:[...p.goals,{...f,id:uid(),updatedAt:TODAY()}]}));
    setEdit(null);
  }
  function del(id){setSt(p=>({...p,goals:p.goals.filter(g=>g.id!==id)}));}
  function setStatus(id,s){setSt(p=>({...p,goals:p.goals.map(g=>g.id===id?{...g,status:s,updatedAt:TODAY()}:g)}));}
  function setMeta(id,f,v){setSt(p=>({...p,goals:p.goals.map(g=>g.id===id?{...g,[f]:v,updatedAt:TODAY()}:g)}));}
  return<div>
    <div className="sch">
      <div className="sch-t">🎯 Clareza de Direção</div>
      <button className="btn btn-ac"onClick={()=>{setEdit(null);setModal(true);}}>+ Objetivo</button>
    </div>
    {st.goals.map(g=>{
      const s=stMap[g.status||'igual'];
      return<div key={g.id}className="obj-card">
        <div className="fcb mb10">
          <div className="fc g8"><span style={{fontSize:'1.3rem'}}>{g.emoji}</span><div><div style={{fontWeight:700}}>{g.name}</div><div style={{fontSize:'.75rem',color:'var(--tx2)'}}>{g.desc}</div></div></div>
          <div className="fc g6">
            <button className="btn-ic"onClick={()=>{setEdit(g);setModal(true);}}>✏️</button>
            <button className="btn-ic"style={{color:'var(--er)'}}onClick={()=>del(g.id)}>🗑</button>
          </div>
        </div>
        <div className="fld"><label>Meta específica (com número e prazo)</label>
          <input value={g.meta||''}onChange={e=>setMeta(g.id,'meta',e.target.value)}placeholder="Ex: Fazer 10 dribles seguidos em 8 semanas"/>
        </div>
        <div className="fld"><label>Anti-meta (o que evitar a todo custo)</label>
          <input value={g.antiMeta||''}onChange={e=>setMeta(g.id,'antiMeta',e.target.value)}placeholder="Ex: Não passar 1 semana sem treinar"/>
        </div>
        <div className="fld"><label>Progresso vs. semana passada</label>
          <StBtn status={g.status||'igual'}onChange={v=>setStatus(g.id,v)}/>
        </div>
        {g.updatedAt&&<div style={{fontSize:'.68rem',color:'var(--tx3)',fontFamily:'var(--fm)',marginTop:'6px'}}>Atualizado: {ptDate(g.updatedAt)}</div>}
      </div>;
    })}
    <GoalModal open={modal}onClose={()=>{setModal(false);setEdit(null);}}onSave={save}init={edit}/>
  </div>;
}

function GatilhosTab({st,setSt}){
  function add(gid){setSt(p=>({...p,gatilhos:{...p.gatilhos,[gid]:[...(p.gatilhos[gid]||[]),{id:uid(),quando:'',entao:'',ativo:true}]}}))}
  function upd(gid,tid,f,v){setSt(p=>({...p,gatilhos:{...p.gatilhos,[gid]:p.gatilhos[gid].map(g=>g.id===tid?{...g,[f]:v}:g)}}))}
  function del(gid,tid){setSt(p=>({...p,gatilhos:{...p.gatilhos,[gid]:(p.gatilhos[gid]||[]).filter(g=>g.id!==tid)}}))}

    <div className="sch-t mb14">⚡ Gatilhos IF/THEN</div>
    {st.goals.map(g=>{
      const gs=st.gatilhos[g.id]||[];
      return<div key={g.id}className="obj-card">
        <div className="fcb mb10">
          <div className="fc g6"><span>{g.emoji}</span><span style={{fontWeight:700,fontSize:'.9rem'}}>{g.name}</span></div>
          <button className="btn btn-ac"style={{fontSize:'.72rem',padding:'4px 10px'}}onClick={()=>add(g.id)}>+ Gatilho</button>
        </div>
        {gs.map(t=><div key={t.id}style={{background:'var(--card2)',border:`1px solid ${t.ativo?'var(--ac2)':'var(--bd2)'}`,borderRadius:'var(--r)',padding:'10px',marginBottom:'8px',opacity:t.ativo?1:.5}}>
          <div className="fcb mb8">
            <span style={{fontSize:'.68rem',fontWeight:700,color:'var(--ac)',textTransform:'uppercase',letterSpacing:'.08em'}}>IF / THEN</span>
            <div className="fc g8"><Tog on={t.ativo}onChange={()=>upd(g.id,t.id,'ativo',!t.ativo)}/><button className="btn-ic"style={{color:'var(--er)'}}onClick={()=>del(g.id,t.id)}>×</button></div>
          </div>
          <div className="fc g6 mb6"><span style={{fontSize:'.7rem',fontWeight:700,color:'var(--tx2)',minWidth:38}}>SE</span><input value={t.quando}onChange={e=>upd(g.id,t.id,'quando',e.target.value)}placeholder="Quando isso acontecer..."/></div>
          <div className="fc g6"><span style={{fontSize:'.7rem',fontWeight:700,color:'var(--ac)',minWidth:38}}>ENTÃO</span><input value={t.entao}onChange={e=>upd(g.id,t.id,'entao',e.target.value)}placeholder="Eu faço isso..."/></div>
        </div>)}
        {gs.length===0&&<div style={{color:'var(--tx3)',fontSize:'.8rem',textAlign:'center',padding:'10px'}}>Nenhum gatilho. Crie o primeiro!</div>}

function FacilitacaoTab({st,setSt}){
  const[inputs,setInputs]=useState({});
  function addItem(gid,tipo){
    const k=`${gid}-${tipo}`;const txt=(inputs[k]||'').trim();if(!txt)return;
    setSt(p=>({...p,facilitacao:{...p.facilitacao,[gid]:{...(p.facilitacao[gid]||{facilitar:[],dificultar:[]}),[tipo]:[...((p.facilitacao[gid]||{})[tipo]||[]),{id:uid(),texto:txt,ok:false}]}}}));
    setInputs(p=>({...p,[k]:''}));
  }
  function togItem(gid,tipo,iid){
    setSt(p=>({...p,facilitacao:{...p.facilitacao,[gid]:{...p.facilitacao[gid],[tipo]:p.facilitacao[gid][tipo].map(i=>i.id===iid?{...i,ok:!i.ok}:i)}}}));
  }
  function delItem(gid,tipo,iid){
    setSt(p=>({...p,facilitacao:{...p.facilitacao,[gid]:{...p.facilitacao[gid],[tipo]:p.facilitacao[gid][tipo].filter(i=>i.id!==iid)}}}));
  }
  return<div>
    <div className="sch-t mb14">🔧 Facilitação</div>
    {st.goals.map(g=>{
      const fac=st.facilitacao[g.id]||{facilitar:[],dificultar:[]};
      return<div key={g.id}className="obj-card">
        <div className="fc g6 mb12"><span>{g.emoji}</span><span style={{fontWeight:700,fontSize:'.9rem'}}>{g.name}</span></div>
        {[['facilitar','✅ Facilitar o que DEVE','#22c55e'],['dificultar','🚫 Dificultar o que NÃO deve','#ef4444']].map(([tipo,lbl,cor])=>{
          const k=`${g.id}-${tipo}`;
          const items=fac[tipo]||[];
          return<div key={tipo}style={{marginBottom:'14px'}}>
            <div style={{fontSize:'.72rem',fontWeight:700,color:cor,textTransform:'uppercase',letterSpacing:'.07em',marginBottom:'8px'}}>{lbl}</div>
            {items.map(item=><div key={item.id}className="fc g8"style={{padding:'6px 8px',background:'var(--bg)',borderRadius:'6px',marginBottom:'4px',border:`1px solid ${item.ok?cor+'33':'var(--bd)'}` }}>
              <Chk on={item.ok}onChange={()=>togItem(g.id,tipo,item.id)}/>
              <span style={{flex:1,fontSize:'.82rem',color:item.ok?'var(--tx3)':'var(--tx)',textDecoration:item.ok?'line-through':'none'}}>{item.texto}</span>
              <button className="btn-ic"style={{color:'var(--er)'}}onClick={()=>delItem(g.id,tipo,item.id)}>×</button>
            </div>)}
            <div className="fc g6 mt4">
              <input value={inputs[k]||''}onChange={e=>setInputs(p=>({...p,[k]:e.target.value}))}onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addItem(g.id,tipo);}}}placeholder="Adicionar item..."style={{fontSize:'.8rem',padding:'6px 10px'}}/>
              <button className="btn btn-ac"style={{padding:'6px 10px',flexShrink:0}}onClick={()=>addItem(g.id,tipo)}>+</button>
            </div>
          </div>;
        })}
      </div>;
    })}
  </div>;
}

function DropTab({st,setSt}){
  function updF(gid,f,v){setSt(p=>({...p,drop:{...p.drop,[gid]:{...(p.drop[gid]||{}), [f]:v}}}))}
  function addObs(gid){setSt(p=>({...p,drop:{...p.drop,[gid]:{...(p.drop[gid]||{}),obs:[...((p.drop[gid]||{}).obs||[]),{id:uid(),obs:'',prot:''}]}}}))}
  function updO(gid,oid,f,v){setSt(p=>({...p,drop:{...p.drop,[gid]:{...p.drop[gid],obs:p.drop[gid].obs.map(o=>o.id===oid?{...o,[f]:v}:o)}}}))}
  function delO(gid,oid){setSt(p=>({...p,drop:{...p.drop,[gid]:{...p.drop[gid],obs:p.drop[gid].obs.filter(o=>o.id!==oid)}}}))}
  const drops=[['🔥','Desejo','desejo','O que quero alcançar?'],['✨','Resultado','resultado','Como vou me sentir quando alcançar?']];
  return<div>
    <div className="sch-t mb6">🧠 Protocolo DROP</div>
    <div className="fc g6 mb14"style={{flexWrap:'wrap'}}>
      {[['D','#FF6B00'],['R','#22c55e'],['O','#f472b6'],['P','#60a5fa']].map(([l,c])=><span key={l}style={{fontSize:'.72rem',background:c+'18',color:c,border:`1px solid ${c}30`,padding:'2px 8px',borderRadius:'4px',fontWeight:700}}>{l}</span>)}
    </div>
    {st.goals.map(g=>{
      const d=st.drop[g.id]||{desejo:'',resultado:'',obs:[]};
      return<div key={g.id}className="obj-card">
        <div className="fc g6 mb12"><span>{g.emoji}</span><span style={{fontWeight:700,fontSize:'.9rem'}}>{g.name}</span></div>
        {drops.map(([ic,lbl,field,ph])=><div key={field}className="fld">
          <label style={{color:field==='desejo'?'#FF6B00':'#22c55e'}}>{ic} {lbl}</label>
          <textarea rows={2}value={d[field]||''}onChange={e=>updF(g.id,field,e.target.value)}placeholder={ph}/>
        </div>)}
        <div className="fcb mb8">
          <label style={{fontSize:'.7rem',fontWeight:700,color:'#f472b6',textTransform:'uppercase',letterSpacing:'.07em'}}>🧱 O + P — Obstáculos</label>
          <button className="btn btn-ac"style={{fontSize:'.72rem',padding:'4px 10px'}}onClick={()=>addObs(g.id)}>+ Obs.</button>
        </div>
        {(d.obs||[]).map(o=><div key={o.id}style={{background:'var(--card2)',border:'1px solid var(--bd2)',borderRadius:'var(--r)',padding:'10px',marginBottom:'8px'}}>
          <div className="fcb mb6"><span style={{fontSize:'.68rem',fontWeight:700,color:'#f472b6',textTransform:'uppercase'}}>Obstáculo</span><button className="btn-ic"style={{color:'var(--er)'}}onClick={()=>delO(g.id,o.id)}>×</button></div>
          <input value={o.obs}onChange={e=>updO(g.id,o.id,'obs',e.target.value)}placeholder="Qual barreira pode me impedir?"style={{marginBottom:'6px'}}/>
          <label style={{fontSize:'.68rem',fontWeight:700,color:'#60a5fa',textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:'4px'}}>Protocolo (mínimo passo)</label>
          <textarea rows={2}value={o.prot}onChange={e=>updO(g.id,o.id,'prot',e.target.value)}placeholder="Se acontecer, eu faço exatamente isso..."/>
        </div>)}
        {(d.obs||[]).length===0&&<div style={{color:'var(--tx3)',fontSize:'.8rem',textAlign:'center',padding:'10px'}}>Sem obstáculos mapeados.</div>}
      </div>;
    })}
  </div>;
}

function IdentidadeTab({st,setSt}){
  const[texto,setTexto]=useState('');
  const td=TODAY();
  const hoje=new Date().toDateString();
  const frase=useMemo(()=>st.frases[Math.floor(Math.random()*st.frases.length)]||'',[]);

  function updAfirm(gid,v){setSt(p=>({...p,afirmacoes:{...p.afirmacoes,[gid]:v}}));}
  function marcar(gid){
    setSt(p=>{
      const sk=p.streaks[gid]||{atual:0,recorde:0,ultima:null};
      if(sk.ultima===hoje)return p;
      const ontem=new Date();ontem.setDate(ontem.getDate()-1);
      const seq=sk.ultima===ontem.toDateString()?sk.atual+1:1;
      return{...p,streaks:{...p.streaks,[gid]:{atual:seq,recorde:Math.max(seq,sk.recorde),ultima:hoje}}};
    });
  }
  function saveDiary(){
    if(!texto.trim())return;
    setSt(p=>({...p,diario:[{id:uid(),data:new Date().toLocaleDateString('pt-BR'),iso:new Date().toISOString(),texto:texto.trim()},...p.diario]}));
    setTexto('');
  }
  function addFrase(){
    const f=prompt('Nova frase:');
    if(f?.trim())setSt(p=>({...p,frases:[...p.frases,f.trim()]}));
  }

  return<div>
    {/* Frase */}
    <div style={{padding:'12px 14px',background:'var(--ac1)',border:'1px solid var(--ac2)',borderRadius:'var(--r)',marginBottom:'16px',fontStyle:'italic',color:'var(--ac)',lineHeight:1.5}}>"{frase}"<button className="btn-ic"style={{marginLeft:'8px',fontSize:'.7rem'}}onClick={addFrase}>+ frase</button></div>

    {/* Afirmações */}
    <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.09em',marginBottom:'10px'}}>Afirmações de Identidade</div>
    {st.goals.map(g=><div key={g.id}style={{background:'var(--card)',border:`1px solid var(--bd)`,borderLeft:`3px solid var(--ac)`,borderRadius:'var(--r)',padding:'10px 12px',marginBottom:'8px'}}>
      <div style={{fontSize:'.75rem',color:'var(--ac)',fontWeight:700,marginBottom:'5px'}}>{g.emoji} {g.name}</div>
      <textarea rows={2}value={st.afirmacoes[g.id]||''}onChange={e=>updAfirm(g.id,e.target.value)}placeholder="Eu sou..."style={{fontStyle:'italic'}}/>
    </div>)}

    {/* Streaks */}
    <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.09em',margin:'16px 0 10px'}}>Consistência — Fiz Hoje</div>
    <div className="g2c mb16">
      {st.goals.map(g=>{
        const sk=st.streaks[g.id]||{atual:0,recorde:0,ultima:null};
        const feito=sk.ultima===hoje;
        return<div key={g.id}style={{background:'var(--card)',border:`1px solid ${feito?'var(--ac2)':'var(--bd)'}`,borderRadius:'var(--r)',padding:'12px',textAlign:'center'}}>
          <div style={{fontSize:'.78rem',color:'var(--tx2)',marginBottom:'4px'}}>{g.emoji}</div>
          <div style={{fontFamily:'var(--fm)',fontSize:'2rem',fontWeight:700,color:feito?'var(--ac)':'var(--bd2)',lineHeight:1}}>{sk.atual}</div>
          <div style={{fontSize:'.65rem',color:'var(--tx3)',fontFamily:'var(--fm)',marginBottom:'8px'}}>dias · rec:{sk.recorde}</div>
          <button onClick={()=>marcar(g.id)}disabled={feito}style={{background:feito?'var(--ac1)':'var(--ac)',border:`1px solid var(--ac)`,color:feito?'var(--ac)':'#000',padding:'5px',borderRadius:'5px',fontSize:'.72rem',fontWeight:700,cursor:feito?'default':'pointer',width:'100%'}}>{feito?'✓ Feito':'Fiz hoje!'}</button>
        </div>;
      })}
    </div>

    {/* Diário */}
    <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.09em',marginBottom:'10px'}}>Diário do Sistema</div>
    <div style={{fontSize:'.68rem',color:'var(--tx3)',fontFamily:'var(--fm)',marginBottom:'4px'}}>{new Date().toLocaleDateString('pt-BR')}</div>
    <textarea rows={4}value={texto}onChange={e=>setTexto(e.target.value)}placeholder="Como foi hoje? O que funcionou? O que aprendi?"style={{marginBottom:'8px'}}/>
    <button className="btn btn-ac w100"onClick={saveDiary}>Salvar reflexão</button>
    {st.diario.slice(0,14).map(e=><div key={e.id}className="diary-e mt8">
      <div style={{fontSize:'.68rem',color:'var(--tx3)',fontFamily:'var(--fm)',marginBottom:'3px'}}>{e.data}</div>
      <div style={{fontSize:'.82rem',color:'var(--tx)',lineHeight:1.5,whiteSpace:'pre-wrap'}}>{e.texto}</div>
    </div>)}
  </div>;
}

// ── ANOTAÇÕES ────────────────────────────────────────────────────────────────

function getNoteStyle(colorKey){
  const c=NOTE_COLORS.find(x=>x.k===colorKey)||NOTE_COLORS[0];
  return{background:c.bg,borderColor:c.bd};
}

function NoteModal({open,onClose,onSave,init,cats}){
  const blank={title:'',type:'texto',content:'',items:[],imageData:null,color:'default',catId:'',pinned:false};
  const[f,setF]=useState(init||blank);
  const[newItem,setNewItem]=useState('');
  const fileRef=useRef();
  useEffect(()=>{setF(init||blank);setNewItem('');},[open]);

  function addItem(){
    if(!newItem.trim())return;
    setF(p=>({...p,items:[...p.items,{id:uid(),text:newItem.trim(),done:false}]}));
    setNewItem('');
  }
  function togItem(id){setF(p=>({...p,items:p.items.map(i=>i.id===id?{...i,done:!i.done}:i)}));}
  function delItem(id){setF(p=>({...p,items:p.items.filter(i=>i.id!==id)}));}
  function handleImage(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>setF(p=>({...p,imageData:ev.target.result,type:'imagem'}));
    r.readAsDataURL(file);
  }
  function save(){onSave({...f,updatedAt:TODAY()});onClose();}

  const types=[{k:'texto',l:'📝 Texto'},{k:'lista',l:'✅ Lista'},{k:'imagem',l:'🖼 Imagem'}];
  return<Modal open={open}onClose={onClose}title={init?'Editar nota':'Nova nota'}>
    {/* Type selector */}
    <div className="stabs mb10">
      {types.map(t=><button key={t.k}className={`stab${f.type===t.k?' on':''}`}onClick={()=>setF(p=>({...p,type:t.k}))}>{t.l}</button>)}
    </div>
    <Fld label="Título (opcional)"><input value={f.title}onChange={e=>setF(p=>({...p,title:e.target.value}))}placeholder="Título da nota..."/></Fld>

    {/* Content by type */}
    {f.type==='texto'&&<Fld label="Conteúdo">
      <textarea rows={5}value={f.content}onChange={e=>setF(p=>({...p,content:e.target.value}))}placeholder="Escreva aqui..."/>
    </Fld>}

    {f.type==='lista'&&<Fld label="Itens">
      {f.items.map(item=><div key={item.id}className="fc g8 mb6">
        <Chk on={item.done}onChange={()=>togItem(item.id)}/>
        <span style={{flex:1,fontSize:'.85rem',textDecoration:item.done?'line-through':'none',color:item.done?'var(--tx3)':'var(--tx)'}}>{item.text}</span>
        <button className="btn-ic"style={{color:'var(--er)'}}onClick={()=>delItem(item.id)}>×</button>
      </div>)}
      <div className="fc g6 mt4">
        <input value={newItem}onChange={e=>setNewItem(e.target.value)}onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addItem();}}}placeholder="Novo item... (Enter)"/>
        <button className="btn btn-ac"style={{padding:'6px 10px',flexShrink:0}}onClick={addItem}>+</button>
      </div>
    </Fld>}

    {f.type==='imagem'&&<div>
      {f.imageData&&<img src={f.imageData}style={{width:'100%',borderRadius:'8px',marginBottom:'8px',maxHeight:'200px',objectFit:'cover'}}/>}
      <button className="btn btn-gh w100"onClick={()=>fileRef.current.click()}>📎 {f.imageData?'Trocar imagem':'Adicionar imagem'}</button>
      <input ref={fileRef}type="file"accept="image/*"style={{display:'none'}}onChange={handleImage}/>
      {f.imageData&&<Fld label="Legenda" style={{marginTop:'8px'}}>
        <input value={f.content}onChange={e=>setF(p=>({...p,content:e.target.value}))}placeholder="Legenda opcional..."/>
      </Fld>}
    </div>}

    {/* Bottom row: category + color + pin */}
    <div className="g2c mt12">
      <Fld label="Categoria">

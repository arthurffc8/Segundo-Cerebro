<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Segundo Cérebro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF6B00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="2°Cérebro">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;900&family=Press+Start+2P&family=Space+Grotesk:wght@300;700&family=Unbounded:wght@400;900&family=VT323&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.0/babel.min.js"></script>
<!-- Firebase compat SDK (loads before Babel processes JSX) -->
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<style>
:root{
  --ac:#FF6B00;--ac1:#FF6B0022;--ac2:#FF6B0044;
  --bg:#0a0a0a;--card:#141414;--card2:#1c1c1c;--card3:#222;
  --bd:#282828;--bd2:rgba(255,255,255,.10);--bd3:rgba(255,255,255,.18);
  --tx:#f0f0f0;--tx2:#f0f0f0aa;--tx3:#f0f0f066;--tx4:#f0f0f033;
  --ok:#22c55e;--er:#ef4444;--warn:#eab308;
  --ff:'Inter',system-ui,sans-serif;
  --fm:'JetBrains Mono','Courier New',monospace;
  --ft:'Bebas Neue','Impact',sans-serif;
  --serif:'Cinzel','Georgia',serif;
  --fs:14px;--r:8px;--tr:.18s ease;
  --sh:none;--bdw:1px;
}
/* Glass Mode */
.glass-mode .card, .glass-mode .navbar, .glass-mode .modal, .glass-mode .mcrd, .glass-mode .btn-gh {
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.glass-mode .sec {
  background: radial-gradient(circle at 50% -20%, var(--ac1) 0%, transparent 70%);
}
* { margin:0; padding:0; box-sizing:border-box; border-width: var(--bdw); }
html { font-size:var(--fs); }
body {
  background:var(--bg); color:var(--tx); font-family:var(--ff); min-height:100vh; overflow-x:hidden; -webkit-tap-highlight-color:transparent;
  transition: background var(--tr), color var(--tr);
}
#root { min-height:100vh; display:flex; flex-direction:column; }
::-webkit-scrollbar { width:3px; height:3px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--bd2); border-radius:2px; }
input,textarea,select { background:var(--card2); border:var(--bdw) solid var(--bd2); color:var(--tx); padding:8px 12px; border-radius:var(--r); font-size:.875rem; width:100%; outline:none; font-family:var(--ff); transition:border-color var(--tr); resize:vertical; box-shadow: var(--sh); }
input:focus,textarea:focus,select:focus { border-color:var(--ac); }
input::placeholder,textarea::placeholder { color:var(--tx4); }
select option { background:var(--card); }
button { cursor:pointer; border:none; outline:none; font-family:var(--ff); transition:all var(--tr); }
/* layout */
.flex { display:flex; } .col { flex-direction:column; } .fc { display:flex; align-items:center; } .fcb { display:flex; align-items:center; justify-content:space-between; }
.g4 { gap:4px; } .g6 { gap:6px; } .g8 { gap:8px; } .g10 { gap:10px; } .g12 { gap:12px; } .g16 { gap:16px; }
.g2c { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.g3c { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
.w100 { width:100%; } .mt4 { margin-top:4px; } .mt8 { margin-top:8px; } .mt12 { margin-top:12px; } .mt16 { margin-top:16px; } .mb6 { margin-bottom:6px; } .mb10 { margin-bottom:10px; } .mb14 { margin-bottom:14px; } .mb20 { margin-bottom:20px; }
/* card */
.card { background:var(--card); border:var(--bdw) solid var(--bd); border-radius:var(--r); padding:14px; box-shadow: var(--sh); }
/* navbar */
.navbar { background:var(--card); border-bottom:var(--bdw) solid var(--bd); position:sticky; top:0; z-index:200; box-shadow: var(--sh); }
.nav-header{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--bd);}
.nav-tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 10px;}
.nav-tabs::-webkit-scrollbar{display:none;}
.tab-btn{display:flex;align-items:center;gap:4px;padding:8px 11px;background:none;border:none;color:var(--tx2);font-size:.78rem;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer;flex-shrink:0;transition:all var(--tr);}
.tab-btn.on{color:var(--ac);border-bottom-color:var(--ac);}
.tab-btn:hover{color:var(--tx);}
/* section */
.sec{padding:14px;flex:1;animation:fu .22s ease;}
@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
/* sidebar layout */
.layout-sidebar{display:flex;flex-direction:row;min-height:100vh;}
.layout-sidebar .sidebar{width:180px;background:var(--card);border-right:var(--bdw) solid var(--bd);display:flex;flex-direction:column;padding:14px;position:fixed;inset:0 auto 0 0;z-index:200;overflow-y:auto;}
.layout-sidebar .sidebar-top{display:flex;align-items:center;gap:10px;padding-bottom:14px;margin-bottom:10px;border-bottom:1px solid var(--bd);}
.layout-sidebar .sidebar-top .sb-avatar{font-size:1.5rem;}
.layout-sidebar .sidebar-top .sb-title{font-family:var(--ft);font-size:.9rem;letter-spacing:.06em;color:var(--ac);line-height:1;}
.layout-sidebar .sidebar-top .sb-sub{font-size:.62rem;color:var(--tx2);line-height:1;}
.layout-sidebar .sb-nav{display:flex;flex-direction:column;gap:4px;width:100%;}
.layout-sidebar .sb-btn{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r);background:none;border:none;color:var(--tx2);font-size:.82rem;font-weight:600;cursor:pointer;transition:all var(--tr);white-space:nowrap;}
.layout-sidebar .sb-btn:hover{background:var(--card2);color:var(--tx);}
.layout-sidebar .sb-btn.on{background:var(--ac1);color:var(--ac);}
.layout-sidebar .sb-btn .sb-emoji{font-size:1.15rem;}
.layout-sidebar .sb-footer{margin-top:auto;padding-top:12px;border-top:1px solid var(--bd);width:100%;display:flex;flex-direction:column;gap:6px;}
.layout-sidebar .main-wrap{flex:1;margin-left:180px;min-width:0;}
.layout-sidebar .nav-header-mini{display:none;}
@media(max-width:760px){
  .layout-sidebar .sidebar{width:56px;padding:10px 6px;align-items:center;}
  .layout-sidebar .sidebar-top{display:none;}
  .layout-sidebar .sb-btn{padding:10px 6px;justify-content:center;}
  .layout-sidebar .sb-btn .sb-label{display:none;}
  .layout-sidebar .sb-footer{align-items:center;}
  .layout-sidebar .main-wrap{margin-left:56px;}
  .layout-sidebar .nav-header-mini{display:flex;}
}
/* buttons */
.btn { padding:7px 14px; border-radius:var(--r); font-size:.8rem; font-weight:700; cursor:pointer; box-shadow: var(--sh); border: var(--bdw) solid transparent; }
.btn-ac { background:var(--ac); color:#000; border:none; } .btn-ac:hover { opacity:.85; transform: translateY(-1px); }
.btn-gh { background:var(--card2); border:var(--bdw) solid var(--bd2); color:var(--tx2); } .btn-gh:hover { color:var(--tx); border-color:var(--bd3); }
.btn-ic { background:none; border:none; color:var(--tx3); padding:4px; font-size:.95rem; border-radius:4px; } .btn-ic:hover { color:var(--tx); }
.btn-er { background:rgba(239,68,68,.1); border:var(--bdw) solid rgba(239,68,68,.25); color:#ef4444; font-size:.75rem; padding:5px 10px; border-radius:var(--r); }
/* toggle */
.tog { width:34px; height:18px; border-radius:9px; background:var(--bd2); position:relative; cursor:pointer; transition:background var(--tr); flex-shrink:0; border: var(--bdw) solid var(--bd2); }
.tog.on { background:var(--ac); border-color: var(--ac); }
.tog-th { width:12px; height:12px; border-radius:50%; background:#fff; position:absolute; top:calc(50% - 6px); left:3px; transition:left var(--tr); }
.tog.on .tog-th { left:17px; }
/* checkbox */
.chk { width:18px; height:18px; border:var(--bdw) solid var(--bd2); border-radius:4px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:all .15s; }
.chk.on { background:var(--ac); border-color:var(--ac); }
/* modal */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.78); z-index:500; display:flex; align-items:center; justify-content:center; padding:16px; animation:fi .18s ease; backdrop-filter: blur(4px); }
@keyframes fi { from{opacity:0} to{opacity:1} }
.modal { background:var(--card); border:var(--bdw) solid var(--bd2); border-radius:var(--r); padding:20px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; box-shadow: var(--sh); }
.modal-h { font-family: var(--ft); font-size:1.4rem; font-weight:700; margin-bottom:16px; text-transform: uppercase; letter-spacing: 0.05em; }
/* field */
.fld { margin-bottom:10px; }
.fld label { display:block; font-size:.7rem; font-weight:700; color:var(--tx2); text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; }
/* priority */
.prio { font-size:.68rem; font-weight:700; padding:2px 7px; border-radius:4px; text-transform:uppercase; letter-spacing:.05em; }
.p-alta { background:rgba(239,68,68,.14); color:#ef4444; border: var(--bdw) solid rgba(239,68,68,0.2); }
.p-media { background:rgba(234,179,8,.14); color:#eab308; border: var(--bdw) solid rgba(234,179,8,0.2); }
.p-baixa { background:rgba(34,197,94,.14); color:#22c55e; border: var(--bdw) solid rgba(34,197,94,0.2); }
/* subtabs */
.stabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:12px; scrollbar-width:none; }
.stabs::-webkit-scrollbar { display:none; }
.stab { padding:6px 14px; border-radius:20px; font-size:.75rem; font-weight:600; cursor:pointer; white-space:nowrap; border:var(--bdw) solid var(--bd2); background:none; color:var(--tx2); transition:all .15s; }
.stab.on { background:var(--ac); border-color:var(--ac); color:#000; box-shadow: var(--sh); }
/* tracker */
.trk-wrap { overflow-x:auto; padding-bottom:6px; }
.trk-cell { width:22px; height:22px; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:.55rem; cursor:pointer; transition:all .12s; border:var(--bdw) solid var(--bd2); flex-shrink:0; }
.trk-cell.done { border-color:transparent; }
.trk-cell.today { box-shadow:0 0 0 2px var(--ac); }
/* metric card */
.mcrd { background:var(--card); border:var(--bdw) solid var(--bd); border-radius:var(--r); padding:12px 14px; box-shadow: var(--sh); }
.mval { font-family:var(--fm); font-size:1.7rem; font-weight:700; color:var(--ac); line-height:1; }
.mlbl { font-size:.68rem; color:var(--tx2); text-transform:uppercase; letter-spacing:.08em; margin-top:3px; }
/* prog bar */
.pbar { height:8px; background:var(--bd2); border-radius:4px; overflow:hidden; border: var(--bdw) solid var(--bd2); }
.pfil { height:100%; border-radius:4px; transition:width .4s cubic-bezier(0.4, 0, 0.2, 1); }
/* badge */
.badge { border-radius:var(--r); padding:14px 10px; text-align:center; border:var(--bdw) solid var(--bd); background: var(--card2); box-shadow: var(--sh); }
.badge.locked { opacity:.3; filter:grayscale(1); }
.badge.done { border-color:var(--ac); background:var(--ac1); }
/* config */
.cfg-s { margin-bottom:22px; }
.cfg-t { font-family: var(--ft); font-size:1rem; font-weight:700; color:var(--tx2); text-transform:uppercase; letter-spacing:.09em; margin-bottom:10px; padding-bottom:6px; border-bottom:var(--bdw) solid var(--bd); }
.swatch { width:26px; height:26px; border-radius:50%; cursor:pointer; transition:transform .12s; border:var(--bdw) solid var(--bd2); }
.swatch.on { transform:scale(1.25); border-color:#fff; box-shadow: 0 0 10px var(--ac); }
/* score */
.score-n { font-family:var(--fm); font-size:2.6rem; font-weight:700; color:var(--ac); line-height:1; }
/* habit item */
.hab-row { display:flex; align-items:center; gap:10px; padding:12px; background:var(--card); border:var(--bdw) solid var(--bd); border-radius:var(--r); margin-bottom:8px; box-shadow: var(--sh); }
/* task item */
.tsk-row { display:flex; align-items:flex-start; gap:10px; padding:12px; background:var(--card); border:var(--bdw) solid var(--bd); border-radius:var(--r); margin-bottom:8px; transition: all .2s; box-shadow: var(--sh); }
.tsk-row.done { opacity:.4; transform: scale(0.98); }
/* fixed/recurring task badge */
.tsk-fixed{display:inline-flex;align-items:center;gap:3px;font-size:.6rem;font-family:var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--ac);background:var(--ac1);border:1px solid var(--ac2);border-radius:4px;padding:1px 6px;white-space:nowrap;}
.tsk-fixed::before{content:"🔁";font-size:.6rem;}
/* weekday picker */
.tsk-wd{display:flex;gap:4px;flex-wrap:wrap;}
.tsk-wd-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd2);background:var(--card2);color:var(--tx3);font-family:var(--fm);font-size:.62rem;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;padding:0;}
.tsk-wd-btn.on{background:var(--ac);color:#000;border-color:var(--ac);box-shadow:0 0 8px color-mix(in srgb,var(--ac) 40%,transparent);}
.tsk-wd-btn:hover{border-color:var(--ac);}
/* fixed tasks panel */
.tsk-fixos{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px;}
.tsk-fixo-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd);}
.tsk-fixo-row:last-child{border-bottom:none;}
.tsk-fixo-days{display:flex;gap:2px;}
.tsk-fixo-dot{width:18px;height:18px;border-radius:50%;font-size:.5rem;font-family:var(--fm);display:flex;align-items:center;justify-content:center;font-weight:700;}
/* status btn */
.st-btn { padding:5px 9px; border-radius:5px; font-size:.75rem; font-weight:600; cursor:pointer; transition:all .15s; border: var(--bdw) solid var(--bd2); }

/* ── SKILL TREE — radar, ritual, histórico ── */

/* Radar chart */
.st-radar-wrap{position:relative;padding:18px 16px;margin-bottom:16px;border-radius:10px;background:linear-gradient(135deg,#1D314A,#13263D);border:1px solid #2B394C;}
.st-radar-title{font-family:var(--serif);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:#F5D98C;margin-bottom:10px;text-align:center;}
.st-radar{display:flex;justify-content:center;align-items:center;}
.st-radar-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px;}
.st-radar-legend-item{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:#9FB3C8;}
.st-radar-legend-dot{width:8px;height:8px;border-radius:50%;}

/* Level-up ritual overlay */
.st-ritual{position:fixed;inset:0;z-index:620;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;background:radial-gradient(ellipse at 50% 40%, #1D314A 0%, #0B1522 60%, #000 100%);animation:fi .3s ease;padding:32px 28px;text-align:center;overflow-x:hidden;overflow-y:auto;}
.st-ritual::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%, rgba(245,217,140,.25), transparent 60%);animation:st-ritual-pulse 2.4s ease-in-out infinite;pointer-events:none;}
@keyframes st-ritual-pulse{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:1;transform:scale(1.08);}}
.st-ritual>*{position:relative;z-index:1;}
.st-ritual-eyebrow{font-family:var(--serif);font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:#F5D98C;margin-bottom:16px;animation:st-ritual-slide .6s ease;} 
.st-ritual-node{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:4rem;background:radial-gradient(circle at 50% 32%, #FFF1B3, #F5D98C 40%, #D18B1F);box-shadow:0 0 60px rgba(245,217,140,.85), 0 0 120px rgba(245,217,140,.4), inset 0 4px 8px rgba(255,255,255,.4);animation:st-ritual-pop .7s cubic-bezier(.34,1.56,.64,1) .15s both, st-ritual-breathe 3.6s ease-in-out 1s infinite;}
@keyframes st-ritual-pop{0%{transform:scale(0);opacity:0;}60%{transform:scale(1.15);opacity:1;}100%{transform:scale(1);opacity:1;}}
@keyframes st-ritual-slide{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:none;}}
@keyframes st-ritual-rise{from{opacity:0;transform:translateY(10px) scale(.86);}to{opacity:1;transform:none;}}
@keyframes st-ritual-spin{to{transform:rotate(360deg);}}
@keyframes st-ritual-breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.045);}}
@keyframes st-ritual-wave{0%{transform:scale(.7);opacity:0;}14%{opacity:.8;}100%{transform:scale(1.62);opacity:0;}}
@keyframes st-ritual-orbit{0%{transform:rotate(0deg) translateX(88px) scale(1);}50%{transform:rotate(180deg) translateX(88px) scale(.5);}100%{transform:rotate(360deg) translateX(88px) scale(1);}}
/* palco do orbe: raios girando + ondas de choque + fagulhas em orbita */
.st-ritual-stage{position:relative;width:224px;height:224px;display:flex;align-items:center;justify-content:center;}
.st-ritual-rays{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(rgba(245,217,140,.30) 0deg,transparent 9deg,transparent 36deg,rgba(245,217,140,.16) 45deg,transparent 53deg,transparent 81deg,rgba(245,217,140,.26) 90deg,transparent 99deg,transparent 126deg,rgba(245,217,140,.16) 135deg,transparent 143deg,transparent 171deg,rgba(245,217,140,.30) 180deg,transparent 189deg,transparent 216deg,rgba(245,217,140,.16) 225deg,transparent 233deg,transparent 261deg,rgba(245,217,140,.26) 270deg,transparent 279deg,transparent 306deg,rgba(245,217,140,.16) 315deg,transparent 323deg,transparent 351deg,rgba(245,217,140,.30) 360deg);-webkit-mask:radial-gradient(circle closest-side,transparent 32%,#000 48%,#000 76%,transparent 100%);mask:radial-gradient(circle closest-side,transparent 32%,#000 48%,#000 76%,transparent 100%);animation:st-ritual-spin 16s linear infinite,fi 1.1s ease .25s both;}
.st-ritual-wave{position:absolute;width:142px;height:142px;border-radius:50%;border:2px solid rgba(245,217,140,.5);pointer-events:none;animation:st-ritual-wave 2.8s cubic-bezier(.18,.7,.28,1) .35s infinite;}
.st-ritual-wave.w2{animation-delay:1.28s;}
.st-ritual-wave.w3{animation-delay:2.2s;}
.st-ritual-spark{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#FFF1B3;box-shadow:0 0 10px rgba(245,217,140,.95);pointer-events:none;animation:st-ritual-orbit 7s linear infinite;}
/* entradas escalonadas */
.st-ritual-skill{animation:st-ritual-slide .5s ease .5s both;}
.st-ritual-level{animation:st-ritual-rise .55s cubic-bezier(.34,1.56,.64,1) .62s both;}
.st-ritual-level-sub{animation:st-ritual-slide .5s ease .76s both;}
.st-ritual-narrative{animation:st-ritual-slide .5s ease .88s both;}
.st-ritual-criteria{animation:st-ritual-slide .5s ease 1s both;}
.st-ritual-cta{animation:st-ritual-slide .5s ease 1.12s both;}
/* Missao — retrato da classe com aura crescente */
@keyframes ms-aura-breathe{0%,100%{transform:scale(1);opacity:var(--auo,.6);}50%{transform:scale(1.08);opacity:calc(var(--auo,.6) * 1.4);}}
@keyframes ms-aura-wave{0%{transform:scale(.9);opacity:0;}18%{opacity:.75;}100%{transform:scale(1.3);opacity:0;}}
@keyframes ms-aura-orbit{0%{transform:rotate(0deg) translateX(var(--orb,120px)) scale(1);}50%{transform:rotate(180deg) translateX(var(--orb,120px)) scale(.5);}100%{transform:rotate(360deg) translateX(var(--orb,120px)) scale(1);}}
.ms-aura-wrap{display:flex;justify-content:center;padding:18px 0 6px;}
.ms-aura-stage{position:relative;width:min(300px,74vw);height:min(300px,74vw);display:flex;align-items:center;justify-content:center;}
.ms-aura-glow{position:absolute;inset:-16%;border-radius:50%;pointer-events:none;background:radial-gradient(circle closest-side,var(--au) 0%,transparent 74%);filter:blur(4px);animation:ms-aura-breathe 4.4s ease-in-out infinite;}

.ms-aura-ring{position:absolute;inset:-4%;border-radius:50%;border:1px solid var(--ar,rgba(255,255,255,.4));pointer-events:none;animation:ms-aura-wave 3.6s ease-out infinite;}

@keyframes st-ritual-orbit-sm{0%{transform:rotate(0deg) translateX(70px) scale(1);}50%{transform:rotate(180deg) translateX(70px) scale(.5);}100%{transform:rotate(360deg) translateX(70px) scale(1);}}
@media(prefers-reduced-motion:reduce){.st-ritual-rays,.st-ritual-wave,.st-ritual-spark,.st-ritual-node,.ms-aura-glow,.ms-aura-rays,.ms-aura-ring,.ms-aura-spark{animation:none!important;}}

/* section header */

.note-card { border-radius:var(--r); padding:16px; border:var(--bdw) solid var(--bd); cursor:pointer; transition:all .25s; position:relative; background: var(--card); box-shadow: var(--sh); }

.tc-vibes{display:flex;flex-wrap:wrap;gap:4px;}

/* skill tree — templo RPG premium (navy + ouro) */

.st-panel{position:relative;overflow:hidden;border-radius:6px;padding:16px 18px;margin-bottom:20px;background:linear-gradient(135deg,rgba(29,49,74,0.7),rgba(19,38,61,0.6));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.st-title{font-family:var(--serif);font-weight:900;letter-spacing:.13em;text-transform:uppercase;line-height:1.05;}
.st-sub{font-family:var(--serif);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:#5C6B7C;margin-top:6px;}
.st-label{font-family:var(--serif);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:#5C6B7C;}
.skill-tree-body{position:relative;padding:16px 0 6px;}
.skill-spine{position:absolute;top:8px;bottom:8px;left:50%;width:2px;transform:translateX(-50%);z-index:0;}
.skill-tier{position:relative;display:flex;justify-content:center;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:0 0 34px;z-index:1;}
.skill-tier:last-child{margin-bottom:8px;}
.skill-node{position:relative;width:76px;display:flex;flex-direction:column;align-items:center;cursor:pointer;flex-shrink:0;transition:transform .15s;z-index:1;}
.skill-node:hover{transform:translateY(-2px) scale(1.05);}
.skill-halo{position:absolute;width:90px;height:90px;border-radius:50%;left:50%;top:35px;transform:translate(-50%,-50%);z-index:0;filter:blur(10px);pointer-events:none;}
.skill-laurel{position:absolute;width:88px;height:88px;left:50%;top:35px;transform:translate(-50%,-50%);z-index:0;pointer-events:none;}

.skill-studs{position:absolute;inset:0;border-radius:50%;z-index:2;pointer-events:none;}
.skill-ring{position:relative;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:3;}
.skill-core{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.38rem;}
/* ── Estágios de ignição: cada nível acende uma camada nova dentro do nó ── */
.sk-light{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--sk-d);height:var(--sk-d);border-radius:50%;z-index:2;pointer-events:none;background:radial-gradient(circle closest-side,var(--sk-hot) 0%,var(--sk-c) 58%,var(--sk-rim) 92%,var(--sk-rim) 100%);box-shadow:0 0 var(--sk-bloom) var(--sk-glow);transition:width .4s ease,height .4s ease;}
.sk-aura{position:absolute;inset:2.5px;border-radius:50%;z-index:1;pointer-events:none;border:1px solid var(--sk-c);opacity:var(--sk-aura-op);box-shadow:0 0 7px var(--sk-glow),inset 0 0 9px var(--sk-glow);}
.sk-orbit{position:absolute;inset:0;z-index:2;pointer-events:none;animation:sk-spin 9s linear infinite;}
.sk-orbit i{position:absolute;left:50%;top:50%;width:3.5px;height:3.5px;margin:-1.75px 0 0 -1.75px;border-radius:50%;background:var(--sk-spark);box-shadow:0 0 5px var(--sk-glow);}
.sk-rays{position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:50%;opacity:.6;background:repeating-conic-gradient(from 0deg,var(--sk-spark) 0deg 3deg,transparent 3deg 30deg);animation:sk-spin 30s linear infinite;}
/* Forma final: coroa pulsante e corona de raios, ambas POR FORA do disco (que já está cheio) */
.sk-crown{position:absolute;left:50%;top:35px;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;z-index:0;pointer-events:none;border:1.5px solid var(--sk-hot);animation:sk-crown 2.8s ease-in-out infinite;}

@keyframes sk-spin{to{transform:rotate(360deg)}}
@keyframes sk-crown{0%,100%{opacity:.28;transform:scale(.96)}50%{opacity:.7;transform:scale(1.06)}}

/* ===================== EIXO — Protocolo de Transferência de Peso ===================== */
.eixo{
  --bg:#14110D;--bg-2:#1A1611;--surface:#211C16;--surface-2:#2A241B;
  --line:#342D22;--line-soft:#28221A;--bone:#EDE4D3;--bone-dim:#B6AB98;--muted:#83786A;
  --fire:#FF5436;--fire-dim:#C9472F;--euca:#5FB8A6;--euca-dim:#3E7E72;
  --eradius:14px;--emaxw:880px;
  background:var(--bg);color:var(--bone);
  font-family:'Hanken Grotesk',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;
  border-radius:16px;padding:6px 18px 36px;
}
.eixo *{box-sizing:border-box;margin:0;padding:0}
.eixo .wrap{max-width:var(--emaxw);margin:0 auto}
/* HERO */
.eixo header{padding:34px 0 24px}
.eixo .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.eixo .eyebrow b{color:var(--fire);font-weight:700}
.eixo h1.brand{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(52px,15vw,104px);line-height:.84;letter-spacing:.01em;text-transform:uppercase}
.eixo h1.brand span{color:var(--fire)}
.eixo .tagline{margin-top:18px;max-width:480px;color:var(--bone-dim);font-size:15.5px}
.eixo .tagline em{color:var(--bone);font-style:normal;font-weight:600}
/* BALANCE METER */
.eixo .meter{margin:30px 0 6px;background:linear-gradient(180deg,var(--surface) 0%,var(--bg-2) 100%);border:1px solid var(--line);border-radius:var(--eradius);padding:24px 22px 20px;user-select:none}
.eixo .meter-head{display:flex;justify-content:space-between;align-items:baseline;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}
.eixo .meter-head .lbl{color:var(--bone-dim)}
.eixo .track{position:relative;height:70px;cursor:grab;touch-action:none}
.eixo .track:active{cursor:grabbing}
.eixo .base-line{position:absolute;left:0;right:0;top:50%;height:2px;background:linear-gradient(90deg,var(--fire) 0%,var(--line) 50%,var(--euca) 100%);opacity:.5;transform:translateY(-50%)}
.eixo .tick{position:absolute;top:50%;width:1px;height:14px;background:var(--line);transform:translateY(-50%)}
.eixo .tick.center{height:24px;background:var(--bone-dim);opacity:.6}
.eixo .foot-lbl{position:absolute;top:0;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--bone-dim)}
.eixo .foot-lbl.l{left:0}
.eixo .foot-lbl.r{right:0;text-align:right}
.eixo .dot{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,var(--fire) 55%,var(--fire-dim) 100%);box-shadow:0 0 0 6px rgba(255,84,54,.14),0 8px 22px rgba(255,84,54,.28);transition:box-shadow .25s ease}
.eixo .dot.centered{background:radial-gradient(circle at 35% 30%,#fff 0%,var(--euca) 55%,var(--euca-dim) 100%);box-shadow:0 0 0 6px rgba(95,184,166,.16),0 8px 22px rgba(95,184,166,.3)}
.eixo .meter-read{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.eixo .read-vals{font-family:'Space Mono',monospace;font-size:13px;color:var(--bone-dim)}
.eixo .read-vals b{color:var(--bone);font-weight:700}
.eixo .read-vals .c{color:var(--euca)}
.eixo .btn-center{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;background:transparent;color:var(--bone-dim);border:1px solid var(--line);border-radius:30px;padding:8px 16px;cursor:pointer;transition:border-color .2s,color .2s}
.eixo .btn-center:hover{border-color:var(--euca-dim);color:var(--euca)}
.eixo .meter-hint{margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.5}
/* STATS */
.eixo .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:32px 0 8px}
.eixo .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--eradius);padding:18px 16px}
.eixo .stat .num{font-family:'Space Mono',monospace;font-size:34px;font-weight:700;line-height:1;color:var(--fire)}
.eixo .stat .num.euca{color:var(--euca)}
.eixo .stat .cap{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:10px}
/* HEATMAP */
.eixo .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--eradius);padding:22px 20px;margin:14px 0}
.eixo .panel-title{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-dim);margin-bottom:18px}
.eixo .grid-days{display:grid;grid-template-columns:repeat(14,1fr);gap:6px}
.eixo .cell{aspect-ratio:1;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-soft);transition:transform .15s;cursor:pointer}
.eixo .cell.done{background:var(--fire);border-color:var(--fire);box-shadow:0 0 10px rgba(255,84,54,.3)}
.eixo .cell.today{outline:2px solid var(--bone-dim);outline-offset:1px}
.eixo .cell.today.done{outline-color:var(--bone)}
.eixo .cell:hover{transform:scale(1.18)}
/* LOG BUTTON */
.eixo .log-row{display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}
.eixo .btn-log{flex:1;min-width:220px;font-family:'Anton',sans-serif;font-size:18px;letter-spacing:.04em;text-transform:uppercase;background:var(--fire);color:#1a0d09;border:none;border-radius:12px;padding:16px 22px;cursor:pointer;transition:transform .12s,background .2s,box-shadow .2s;box-shadow:0 6px 20px rgba(255,84,54,.22)}
.eixo .btn-log:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(255,84,54,.34)}
.eixo .btn-log:active{transform:translateY(0)}
.eixo .btn-log.done{background:transparent;color:var(--euca);border:1px solid var(--euca-dim);box-shadow:none}
.eixo .btn-log.done:hover{box-shadow:0 0 0 1px var(--euca-dim)}
.eixo .log-note{font-size:12.5px;color:var(--muted);max-width:260px}
/* PHASES */
.eixo .section-head{margin:48px 0 22px}
.eixo .section-head .kick{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--fire);margin-bottom:12px}
.eixo .section-head h2{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(30px,7vw,46px);line-height:.92;text-transform:uppercase;letter-spacing:.01em}
.eixo .section-head p{margin-top:14px;color:var(--bone-dim);font-size:15px;max-width:560px}
.eixo .phase-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.eixo .ptab{font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:30px;padding:10px 16px;cursor:pointer;transition:.2s}
.eixo .ptab b{color:var(--bone-dim)}
.eixo .ptab.active{background:var(--fire);color:#1a0d09;border-color:var(--fire)}
.eixo .ptab.active b{color:#1a0d09}
.eixo .phase{border:1px solid var(--line);border-radius:var(--eradius);overflow:hidden;background:var(--surface)}
.eixo .phase-top{padding:24px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--surface-2) 0%,var(--surface) 100%)}
.eixo .phase-no{font-family:'Anton',sans-serif;font-size:13px;letter-spacing:.2em;color:var(--fire);text-transform:uppercase}
.eixo .phase-name{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(26px,6vw,38px);text-transform:uppercase;line-height:.95;margin:6px 0 14px}
.eixo .phase-meta{display:flex;gap:8px;flex-wrap:wrap}
.eixo .chip{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--bone-dim);background:var(--bg-2);border:1px solid var(--line);border-radius:20px;padding:6px 12px}
.eixo .chip .k{color:var(--muted)}
.eixo .phase-foco{padding:18px 22px 4px;color:var(--bone-dim);font-size:14.5px;border-bottom:1px solid var(--line-soft)}
.eixo .phase-foco b{color:var(--bone);font-weight:600}
.eixo ol.exs{list-style:none}
.eixo ol.exs li{padding:20px 22px;border-bottom:1px solid var(--line-soft);display:grid;grid-template-columns:38px 1fr;gap:14px;align-items:start}
.eixo ol.exs li:last-child{border-bottom:none}
.eixo ol.exs li .n{font-family:'Space Mono',monospace;font-weight:700;font-size:15px;color:var(--fire);padding-top:1px}
.eixo ol.exs li .ex-name{font-weight:700;font-size:16px;color:var(--bone)}
.eixo ol.exs li .ex-det{margin-top:5px;color:var(--bone-dim);font-size:14px;line-height:1.55}
.eixo ol.exs li .ex-dose{margin-top:9px;display:inline-block;font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.04em;color:var(--euca);background:rgba(95,184,166,.08);border:1px solid var(--euca-dim);border-radius:6px;padding:4px 10px}
.eixo .rule{margin:20px 0 0;padding:18px 20px;border-left:3px solid var(--fire);background:var(--bg-2);border-radius:0 10px 10px 0;font-size:14.5px;color:var(--bone-dim)}
.eixo .rule b{color:var(--bone);font-weight:600}
.eixo .efoot{margin-top:34px;padding-top:24px;border-top:1px solid var(--line);font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.04em;color:var(--muted);line-height:1.7}
.eixo .efoot b{color:var(--bone-dim)}
@media (max-width:560px){
  .eixo .stats{grid-template-columns:1fr 1fr}
  .eixo .stats .stat:last-child{grid-column:1/-1}
  .eixo .grid-days{grid-template-columns:repeat(7,1fr)}
}

/* ===================== REELS — feed de evolução ===================== */
.reels{display:flex;flex-direction:column;position:relative;}
.reels::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 35% at 50% 0%,color-mix(in srgb,var(--ac) 10%,transparent),transparent 65%),radial-gradient(60% 40% at 100% 100%,color-mix(in srgb,var(--ac) 8%,transparent),transparent 70%);z-index:0;}
.reels>*{position:relative;z-index:1;}
.reels-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:18px 18px 12px;border-bottom:1px solid var(--bd);}
.reels-bar .rb-title{font-family:var(--ft);font-size:1.4rem;letter-spacing:.08em;color:var(--ac);line-height:1;text-shadow:0 0 22px color-mix(in srgb,var(--ac) 45%,transparent);}
.reels-bar .rb-sub{font-size:.74rem;color:var(--tx2);margin-top:6px;max-width:260px;line-height:1.4;font-style:italic;}
.rb-stats{display:flex;gap:16px;flex-shrink:0;}
.rb-stat{text-align:center;}
.rb-stat b{display:block;font-family:var(--fm);font-size:1.2rem;color:var(--tx);line-height:1;text-shadow:0 0 14px color-mix(in srgb,var(--ac) 40%,transparent);}
.rb-stat span{font-size:.58rem;text-transform:uppercase;letter-spacing:.14em;color:var(--tx3);}
.rb-stat.fire b{color:#f97316;text-shadow:0 0 18px rgba(249,115,22,.55);}

/* HERO — desafio mental do dia */
.reel-hero{position:relative;margin:14px 16px 6px;padding:22px 22px 20px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg, color-mix(in srgb,var(--ac) 22%,var(--card)) 0%, var(--card) 60%);border:1px solid color-mix(in srgb,var(--ac) 35%,var(--bd));box-shadow:0 10px 40px -10px color-mix(in srgb,var(--ac) 38%,transparent),inset 0 1px 0 color-mix(in srgb,#fff 12%,transparent);animation:fu .4s ease;}
.reel-hero::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 45deg,color-mix(in srgb,var(--ac) 14%,transparent),transparent 30%,color-mix(in srgb,var(--ac) 10%,transparent) 55%,transparent 70%,color-mix(in srgb,var(--ac) 14%,transparent));animation:hero-spin 18s linear infinite;opacity:.6;pointer-events:none;}
.reel-hero::after{content:"";position:absolute;inset:1px;border-radius:17px;background:linear-gradient(160deg,color-mix(in srgb,var(--card) 88%,transparent),color-mix(in srgb,var(--card) 98%,transparent));pointer-events:none;}
.reel-hero>*{position:relative;z-index:1;}
.rh-eyebrow{font-family:var(--fm);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ac);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.rh-eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac);animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.45;transform:scale(.78);}}
@keyframes hero-spin{to{transform:rotate(360deg);}}
.rh-title{font-family:var(--ft);font-size:clamp(1.8rem,7vw,2.5rem);line-height:.95;letter-spacing:.03em;text-transform:uppercase;color:var(--tx);margin-bottom:12px;}
.rh-body{font-size:1.02rem;line-height:1.55;color:var(--tx);max-width:560px;font-style:italic;margin-bottom:14px;}
.rh-cta{display:flex;align-items:center;gap:10px;font-family:var(--fm);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:700;}
.rh-cta .rh-arrow{display:inline-block;animation:rh-slide 1.4s ease-in-out infinite;}
@keyframes rh-slide{0%,100%{transform:translateX(0);opacity:.7;}50%{transform:translateX(6px);opacity:1;}}

.reels-feed{overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-top:1px solid var(--bd);}
.reels-feed::-webkit-scrollbar{display:none;}
.reel-card{scroll-snap-align:start;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;padding:28px 22px 26px;position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 6%,var(--card)),var(--card) 30%);border-bottom:1px solid var(--bd);animation:fu .35s ease;overflow:hidden;}
.reel-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(140% 80% at 50% -5%,color-mix(in srgb,var(--rc) 22%,transparent) 0%,transparent 55%),radial-gradient(80% 50% at 100% 100%,color-mix(in srgb,var(--rc) 10%,transparent),transparent 70%);}
.reel-card::after{content:"";position:absolute;left:-30%;top:-30%;width:160%;height:160%;pointer-events:none;background:conic-gradient(from 0deg,transparent,color-mix(in srgb,var(--rc) 8%,transparent),transparent 40%);opacity:.35;animation:hero-spin 24s linear infinite;}
.reel-card>*{position:relative;z-index:1;}
.rc-top{display:flex;justify-content:space-between;align-items:center;font-size:.68rem;}
.rc-tree{font-family:var(--fm);letter-spacing:.1em;color:var(--rc);text-transform:uppercase;font-weight:700;text-shadow:0 0 14px color-mix(in srgb,var(--rc) 45%,transparent);}
.rc-meta{display:flex;gap:8px;align-items:center;font-family:var(--fm);color:var(--tx3);}
.rc-reps{color:var(--tx2);}
.rc-nivel{border:1px solid var(--bd2);border-radius:20px;padding:3px 10px;}
.rc-mid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;gap:4px;}
.rc-hook{font-family:var(--ft);font-size:.82rem;letter-spacing:.06em;color:var(--rc);opacity:.9;text-transform:uppercase;margin-bottom:2px;}
.rc-kind{font-family:var(--fm);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--tx2);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.rc-kind::before{content:"";width:18px;height:1px;background:var(--rc);}
.rc-ai{color:var(--ac);}
.rc-skill{font-family:var(--ft);font-size:1.05rem;font-weight:400;letter-spacing:.04em;text-transform:uppercase;color:var(--rc);margin-bottom:4px;opacity:.85;}
.rc-title{font-family:var(--ft);font-weight:400;font-size:clamp(2.3rem,10vw,3.6rem);line-height:.94;letter-spacing:.02em;text-transform:uppercase;color:var(--tx);text-shadow:0 2px 30px color-mix(in srgb,var(--rc) 30%,transparent);}
.rc-body{margin-top:16px;font-size:1.1rem;line-height:1.58;color:var(--tx);max-width:560px;}
.rc-body b{color:var(--rc);font-weight:700;}
.rc-cta{margin-top:18px;display:inline-flex;align-items:center;gap:8px;font-family:var(--fm);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--tx3);}
.rc-cta .rc-arrow{animation:rh-slide 1.4s ease-in-out infinite;color:var(--rc);}
.rc-identity{font-family:var(--serif,var(--ft));font-style:italic;font-size:clamp(1.6rem,6.5vw,2.3rem);line-height:1.1;color:var(--tx);margin-top:12px;text-align:left;border-left:3px solid var(--rc);padding-left:16px;}
.rc-identity b{color:var(--rc);font-weight:700;font-style:normal;}
.rc-paradox{font-family:var(--serif,var(--ft));font-size:clamp(1.35rem,5.5vw,1.9rem);line-height:1.2;color:var(--tx);margin:14px 0;font-style:italic;}
.rc-paradox .rc-vs{display:inline-block;color:var(--rc);font-style:normal;font-weight:800;margin:0 8px;letter-spacing:.1em;}
.rc-trigger-when{font-family:var(--ft);font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;color:var(--tx2);margin-top:8px;}
.rc-trigger-then{font-family:var(--ft);font-size:clamp(1.7rem,6.5vw,2.4rem);letter-spacing:.03em;text-transform:uppercase;color:var(--rc);line-height:1;margin-top:6px;text-shadow:0 2px 18px color-mix(in srgb,var(--rc) 40%,transparent);}
.rc-question{font-family:var(--serif,var(--ft));font-size:clamp(1.7rem,7vw,2.6rem);line-height:1.08;color:var(--tx);font-weight:400;margin:8px 0 14px;}
.rc-question b{color:var(--rc);}
.rc-answer{font-size:1rem;line-height:1.6;color:var(--tx2);max-width:540px;font-style:italic;}
.rc-actions{display:flex;gap:10px;}
.rc-btn{font-family:var(--ff);font-weight:700;font-size:.92rem;border-radius:14px;padding:16px 12px;cursor:pointer;border:1px solid transparent;transition:transform .14s,background .2s,box-shadow .2s,color .2s,filter .2s;}
.rc-train{width:100%;background:linear-gradient(135deg,var(--rc),color-mix(in srgb,#000 14%,var(--rc)));color:#0a0a0a;font-size:1.02rem;letter-spacing:.04em;box-shadow:0 10px 28px -6px color-mix(in srgb,var(--rc) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.25);}
.rc-train:hover{transform:translateY(-2px);filter:brightness(1.08);}
.rc-train:active{transform:translateY(0);}
.rc-sub{gap:10px;}
.rc-do2{flex:2;background:color-mix(in srgb,var(--rc) 8%,var(--card3));color:var(--tx);border:1px solid color-mix(in srgb,var(--rc) 28%,var(--bd2));}
.rc-do2:hover{color:#fff;border-color:var(--rc);background:color-mix(in srgb,var(--rc) 14%,var(--card3));}
.rc-done{flex:2;background:transparent;color:var(--ok);border-color:var(--ok);cursor:default;}
.rc-skip{flex:1;background:var(--card3);color:var(--tx2);}
.rc-skip:hover{color:var(--tx);}
.reels-sentinel{scroll-snap-align:start;display:flex;align-items:center;justify-content:center;min-height:110px;color:var(--tx3);font-family:var(--fm);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;}
.reels-empty{padding:48px 24px;text-align:center;color:var(--tx2);line-height:1.6;}
.reels-empty .re-emoji{font-size:2.4rem;display:block;margin-bottom:12px;}
/* stories */
.stories-row{display:flex;gap:13px;overflow-x:auto;scrollbar-width:none;padding:12px 14px 4px;}
.stories-row::-webkit-scrollbar{display:none;}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;flex-shrink:0;width:66px;}
.story-ring{width:60px;height:60px;border-radius:50%;padding:2.5px;background:conic-gradient(from 210deg,var(--rc),var(--rc2,var(--rc)),var(--rc));display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.story:hover .story-ring{transform:scale(1.06);}
.story.seen .story-ring{background:var(--bd3);}
.story-emoji{width:100%;height:100%;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;border:2px solid var(--bg);}
.story-name{font-size:.6rem;color:var(--tx2);max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;}
/* filtros de categoria */
.reel-filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 14px 10px;}
.reel-filters::-webkit-scrollbar{display:none;}
.rfil{flex-shrink:0;font-family:var(--ff);font-size:.74rem;font-weight:600;color:var(--tx2);background:var(--card2);border:1px solid var(--bd2);border-radius:30px;padding:7px 13px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.rfil:hover{color:var(--tx);}
.rfil.on{color:#0a0a0a;background:var(--rc,var(--ac));border-color:transparent;}
/* visualizador de stories */
.sview{position:fixed;inset:0;z-index:600;background:var(--bg);display:flex;flex-direction:column;animation:fi .2s ease;}
.sview-bars{display:flex;gap:4px;padding:12px 12px 6px;}
.sview-bar{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;}
.sview-bar i{display:block;height:100%;background:#fff;width:0;}
.sview-head{display:flex;align-items:center;gap:10px;padding:6px 14px 0;}
.sview-emoji{width:34px;height:34px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:1.1rem;border:2px solid var(--sc);}
.sview-tname{font-weight:700;font-size:.9rem;color:var(--tx);line-height:1.2;}
.sview-tname span{display:block;font-size:.62rem;color:var(--tx3);font-weight:400;}
.sview-x{margin-left:auto;background:none;border:none;color:var(--tx2);font-size:1.3rem;cursor:pointer;padding:4px 8px;}
.sview-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 26px;position:relative;cursor:pointer;}
.sview-body::before{content:"";position:absolute;inset:0;background:radial-gradient(100% 60% at 50% 32%,color-mix(in srgb,var(--sc) 22%,transparent),transparent 70%);pointer-events:none;}
.sview-body>*{position:relative;}
.sview-kind{font-family:var(--fm);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--sc);margin-bottom:10px;}
.sview-skill{font-family:var(--ft);font-size:clamp(2.2rem,10vw,3.4rem);line-height:1;text-transform:uppercase;color:var(--tx);margin-bottom:6px;}
.sview-nivel{font-family:var(--fm);font-size:.72rem;color:var(--tx2);margin-bottom:18px;}
.sview-text{font-size:1.1rem;line-height:1.5;color:var(--tx);max-width:560px;}
.sview-text b{color:var(--sc);}
.sview-cta{display:flex;gap:10px;padding:0 26px 26px;}
.sview-train{flex:1;font-family:var(--ff);font-weight:700;font-size:1rem;background:var(--sc);color:#0a0a0a;border:none;border-radius:12px;padding:15px;cursor:pointer;}
.sview-next{font-family:var(--ff);font-weight:600;background:transparent;color:var(--tx2);border:1px solid var(--bd2);border-radius:12px;padding:15px 18px;cursor:pointer;}
.sview-next:hover{color:var(--tx);}
/* treino guiado */
.trn{position:fixed;inset:0;z-index:610;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px 28px;text-align:center;animation:fi .2s ease;}
.trn-x{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--tx2);font-size:1.4rem;cursor:pointer;}
.trn-skill{font-family:var(--fm);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tc);}
.trn-ring{position:relative;width:200px;height:200px;}
.trn-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}

const AI_CFG_KEY='sc-ai-cfg';
function aiLoadCfg(){try{const s=localStorage.getItem(AI_CFG_KEY);return s?JSON.parse(s):null;}catch{return null;}}
function aiSaveCfg(c){localStorage.setItem(AI_CFG_KEY,JSON.stringify(c));}
function aiClearCfg(){localStorage.removeItem(AI_CFG_KEY);}
function aiReady(){const c=aiLoadCfg();return !!(c&&c.key);}
async function aiCall(system,prompt,maxTokens){
  const c=aiLoadCfg();
  if(!c||!c.key)throw new Error('IA não configurada');
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:c.model||'claude-3-5-haiku-latest',max_tokens:maxTokens||300,system:system||'',messages:[{role:'user',content:prompt}]}),
  });
  if(!res.ok){let m='';try{m=(await res.json()).error?.message||'';}catch(e){}throw new Error('IA '+res.status+(m?': '+m:''));}
  const data=await res.json();
  return((data.content&&data.content[0]&&data.content[0].text)||'').trim();
}
// Chamada com blocos de conteúdo (texto + imagem). Aceita override de modelo.
async function aiCallBlocks(system,blocks,maxTokens,modelOverride){
  const c=aiLoadCfg();
  if(!c||!c.key)throw new Error('IA não configurada');
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:modelOverride||c.model||'claude-3-5-haiku-latest',max_tokens:maxTokens||600,system:system||'',messages:[{role:'user',content:blocks}]}),
  });
  if(!res.ok){let m='';try{m=(await res.json()).error?.message||'';}catch(e){}throw new Error('IA '+res.status+(m?': '+m:''));}
  const data=await res.json();
  return((data.content&&data.content[0]&&data.content[0].text)||'').trim();
}
// Claude 3.5 Haiku não aceita imagem — cai para um modelo com visão quando necessário.
const AI_VISION_MODEL='claude-opus-5';
function aiModelForImage(){
  const c=aiLoadCfg();const m=(c&&c.model)||'';
  if(!m)return AI_VISION_MODEL;
  if(/haiku/i.test(m)&&!/haiku-4/i.test(m))return AI_VISION_MODEL; // 3/3.5 haiku = sem visão
  return m;
}

function aiStrip(t){return(t||'').replace(/^["'\s]+|["'\s]+$/g,'');}
function aiParseArray(raw){
  try{const t=aiStrip(raw);const a=t.indexOf('['),b=t.lastIndexOf(']');if(a<0||b<0)return null;const v=JSON.parse(t.slice(a,b+1));return Array.isArray(v)?v:null;}catch(e){return null;}
}

// ── FIREBASE SYNC ────────────────────────────────────────────────────────────

const FB_CFG_KEY='sc-fb-cfg';
let _fbApp=null,_fbAuth=null,_fbDb=null;

function fbLoadCfg(){try{const s=localStorage.getItem(FB_CFG_KEY);return s?JSON.parse(s):null;}catch{return null;}}
function fbSaveCfg(cfg){localStorage.setItem(FB_CFG_KEY,JSON.stringify(cfg));}
function fbClearCfg(){localStorage.removeItem(FB_CFG_KEY);}

function fbInit(cfg){
  try{
    if(_fbApp){
      // Already initialized — check if same config
      return true;
    }
    _fbApp=firebase.initializeApp(cfg,'cerebro');
    _fbAuth=firebase.auth(_fbApp);
    _fbDb=firebase.firestore(_fbApp);
    return true;
  }catch(e){
    console.error('Firebase init error:',e);
    _fbApp=null;_fbAuth=null;_fbDb=null;
    return false;
  }
}

function fbReady(){return !!(_fbAuth&&_fbDb);}

async function fbSignIn(){
  if(!_fbAuth)throw new Error('Firebase não inicializado');
  const p=new firebase.auth.GoogleAuthProvider();
  return _fbAuth.signInWithPopup(p);
}

async function fbSignOut(){
  if(!_fbAuth)return;
  return _fbAuth.signOut();
}

function fbOnAuth(cb){
  if(!_fbAuth)return ()=>{};
  return _fbAuth.onAuthStateChanged(cb);
}

async function fbPush(uid,state){
  if(!_fbDb)return;
  await _fbDb.collection('cerebro').doc(uid).set({
    data:JSON.stringify(state),
    updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
  });
}

async function fbPull(uid){
  if(!_fbDb)return null;
  const doc=await _fbDb.collection('cerebro').doc(uid).get();
  if(!doc.exists)return null;
  const raw=doc.data()?.data;
  return raw?JSON.parse(raw):null;
}

function treePalette(tree){
  if(tree&&tree.destaque)return{d:tree.destaque,s:tree.secundaria||tree.destaque};
  if(tree&&SKILL_PALETTES[tree.id])return SKILL_PALETTES[tree.id];

  return{d:c,s:c};
}

// alpha 0..1 → hex 2 dígitos
function _ah(a){return Math.round(Math.max(0,Math.min(1,a))*255).toString(16).padStart(2,'0');}
// interpolação de cor: #rrggbb → rgb, mistura e rampa multi-parada (0..1)
function _hx(c){const h=String(c).replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function _rgbHex(r,g,b){return'#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');}
function _mix(a,b,t){const A=_hx(a),B=_hx(b),k=Math.max(0,Math.min(1,t));return _rgbHex(A[0]+(B[0]-A[0])*k,A[1]+(B[1]-A[1])*k,A[2]+(B[2]-A[2])*k);}
function _rgba(c,a){const p=_hx(c);return`rgba(${p[0]},${p[1]},${p[2]},${a})`;}
function _ramp(stops,t){const x=Math.max(0,Math.min(1,t))*(stops.length-1),i=Math.min(stops.length-2,Math.floor(x));return _mix(stops[i],stops[i+1],x-i);}
// Rampa de luz de uma habilidade, tirada da paleta da própria árvore: começa
// como brasa na cor secundária e termina incandescente na cor de destaque.
function skillLightRamp(pal){
  const d=pal.d,s=pal.s||pal.d;
  // Passa pelo destaque, desce pra secundária e só então escurece: assim os
  // primeiros níveis não ficam todos no mesmo tom pálido em paletas já claras.
  return[_mix(d,'#FFFFFF',0.55),_mix(d,'#FFFFFF',0.2),_mix(d,s,0.35),_mix(d,s,0.85),_mix(s,'#070C16',0.22)];
}

// Garante que abas novas sempre aparecem após updates (evita sumir ao sincronizar)
function sanitizeTabs(state){
  if(!state?.config?.tabs)return state;
  const existing=new Set(state.config.tabs.map(t=>t.id));
  const missing=DEF_TABS.filter(t=>!existing.has(t.id));
  const tabs=[...state.config.tabs];
  if(missing.length){
    const cfgIdx=tabs.findIndex(t=>t.id==='config');
    if(cfgIdx>=0)tabs.splice(cfgIdx,0,...missing);
    else tabs.push(...missing);
  }
  const skillIdx=tabs.findIndex(t=>t.id==='skilltree');
  if(skillIdx>0){
    const [tab]=tabs.splice(skillIdx,1);
    tabs.unshift(tab);
  }
  return{...state,config:{...state.config,tabs}};
}

// Migra dados antigos da skill tree (renomeia Dança→Molho, aplica paletas novas)
function sanitizeSkilltree(state){
  if(!state||!state.skilltree||!Array.isArray(state.skilltree.trees))return state;
  let changed=false;
  // garante objeto de estilo
  let style=state.skilltree.style;
  const mergedStyle={...DEF_STYLE,...(style||{})};
  if(!style||Object.keys(DEF_STYLE).some(k=>mergedStyle[k]!==style[k])){style=mergedStyle;changed=true;}
  // mapa dos defaults p/ backfill de subcategorias
  const defMap={};
  DEF_SKILLTREES.forEach(t=>{const sk={};(t.skills||[]).forEach(s=>{sk[s.id]=s.subcat;});defMap[t.id]={subcats:t.subcats,skills:sk};});
  const trees=state.skilltree.trees.map(t=>{
    let nt=t;
    if(t.id==='danca'&&t.nome==='Dança'){nt={...nt,nome:'Molho'};changed=true;}
    // Futevôlei: vermelho antigo → rosa
    if(t.id==='futevolei'&&t.destaque==='#D94747'){nt={...nt,destaque:'#FF6EB3',secundaria:'#A02E6E',cor:'#FF6EB3'};changed=true;}
    if(!nt.destaque&&SKILL_PALETTES[nt.id]){nt={...nt,destaque:SKILL_PALETTES[nt.id].d,secundaria:SKILL_PALETTES[nt.id].s,cor:SKILL_PALETTES[nt.id].d};changed=true;}
    // substituir árvore de futebol antiga (IDs fb1-fb12) pela nova estrutura FUNDAMENTOS/MENTAL/FREESTYLE
    if(t.id==='futebol'&&t.skills&&t.skills.some(s=>/^fb\d+$/.test(s.id))){const def=DEF_SKILLTREES.find(d=>d.id==='futebol');if(def){nt={...def,skills:def.skills.map(s=>({...s}))};changed=true;}}
    // backfill de subcategorias (colunas) em dados antigos
    const def=defMap[nt.id];
    if((!nt.subcats||!nt.subcats.length)){
      if(def&&def.subcats){nt={...nt,subcats:def.subcats.map(x=>({...x}))};changed=true;}
      else{nt={...nt,subcats:[{id:'geral',nome:'Geral'}]};changed=true;}
    }
    // backfill do subcat de cada skill
    if(nt.skills&&nt.skills.some(s=>!s.subcat)){
      const firstSub=(nt.subcats&&nt.subcats[0]&&nt.subcats[0].id)||'geral';
      nt={...nt,skills:nt.skills.map(s=>{
        if(s.subcat)return s;
        const fromDef=def&&def.skills&&def.skills[s.id];
        return{...s,subcat:fromDef||firstSub};
      })};
      changed=true;
    }
    return nt;
  });
  if(!changed)return state;
  return{...state,skilltree:{...state.skilltree,trees,style}};
}

function loadSt(){
  try{
    const s=localStorage.getItem('sc-v3');
    if(s){
      const p=JSON.parse(s);
      return sanitizeSkilltree(sanitizeTabs(mergeDeep(makeInit(),p)));
    }
  }catch(e){}
  return makeInit();
}
function mergeDeep(target,source){
  const out={...target};
  for(const k in source){
    if(source[k]&&typeof source[k]==='object'&&!Array.isArray(source[k])){
      out[k]=mergeDeep(target[k]||{},source[k]);
    }else{
      out[k]=source[k];
    }
  }
  return out;
}

// ── SCORE UTILS ──────────────────────────────────────────────────────────────

function getDayScore(st,dateStr){
  const tasks=st.tasks.filter(t=>t.date===dateStr&&t.done);
  const log=st.habitLog[dateStr]||{};
  const tScore=tasks.reduce((s,t)=>s+t.weight,0);
  const hScore=st.habits.reduce((s,h)=>log[h.id]?s+h.weight:s,0);
  if(st.config.scoreFormula==='weighted'){
    const hw=st.config.habitWeight/100;
    return Math.round(hScore*hw+tScore*(1-hw));
  }
  return tScore+hScore;
}
function getMonthScores(st,year,month){
  const days=daysInMonth(year,month);
  const mk=monthKey(year,month);
  return Array.from({length:days},(_,i)=>{
    const d=i+1;
    const ds=`${mk}-${String(d).padStart(2,'0')}`;
    return{day:d,score:getDayScore(st,ds),date:ds,isToday:ds===TODAY()};
  });
}

const LEVEL_XP=(()=>{const a=[0];let x=0;for(let n=1;n<100;n++){x+=60+8*(n-1);a.push(x);}return a;})();
const MAX_LEVEL=LEVEL_XP.length; // 100
function roman(n){const m=[['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]];let r='';for(const[s,v]of m){while(n>=v){r+=s;n-=v;}}return r;}

const BASE_MALANDRO_IMG=null;
const CLASS_IMAGES={1:'./classes/1.jpg',2:'./classes/2.jpg',3:'./classes/3.jpg',4:'./classes/4.jpg',5:'./classes/5.jpg'}; // troque o arquivo na pasta classes/ pra atualizar a imagem da classe

function calcSkillLevels(st){
  let n=0;
  ((st.skilltree&&st.skilltree.trees)||[]).forEach(t=>(t.skills||[]).forEach(s=>{n+=Math.min(s.nivel||0,s.maxNivel||1);}));
  return n;
}
function calcSkillXP(st){return calcSkillLevels(st)*XP_PER_SKILL_LEVEL;}
function calcTotalXP(st){return calcSkillXP(st);}
function classForLevel(lvl){let c=CLASSES[0];for(const x of CLASSES){if(lvl>=x.minLevel)c=x;}return c;}
function getLevelInfo(xp){
  let lvl=1;
  for(let i=0;i<LEVEL_XP.length;i++){if(xp>=LEVEL_XP[i])lvl=i+1;else break;}
  const cls=classForLevel(lvl);
  const sub=Math.max(1,lvl-cls.minLevel+1);
  const curXp=LEVEL_XP[lvl-1];
  const nextXp=lvl<MAX_LEVEL?LEVEL_XP[lvl]:null;
  return{lvl,cls,sub,curXp,nextXp};
}

// ── APPLY THEME ──────────────────────────────────────────────────────────────

function applyTheme(config, st){
  const r=document.documentElement.style;
  const html=document.documentElement;
  const theme=THEMES.find(t=>t.id===config.themeId)||THEMES[0];
  const ac=config.accentOverride||theme.ac;
  
  r.setProperty('--ac',ac);
  r.setProperty('--ac1',ac+'22');
  r.setProperty('--ac2',ac+'44');
  r.setProperty('--bg',theme.bg);
  r.setProperty('--card',theme.card);
  r.setProperty('--card2',theme.card2);
  r.setProperty('--bd',theme.bd);
  r.setProperty('--r',theme.r||'8px');
  r.setProperty('--ff',theme.ff||"'Inter', sans-serif");
  r.setProperty('--ft',theme.ft||"'Bebas Neue'");
  r.setProperty('--sh',theme.sh||'none');
  r.setProperty('--bdw',theme.bdw||'1px');

  // Text colors
  const tx=theme.tx||config.textColor||'#f0f0f0';
  const tx2=theme.tx2||tx+'aa';
  const tx3=theme.tx3||tx+'66';
  const tx4=theme.tx4||tx+'33';
  r.setProperty('--tx',tx);
  r.setProperty('--tx2',tx2);
  r.setProperty('--tx3',tx3);
  r.setProperty('--tx4',tx4);

  // Borders
  const isDark=theme.bg==='#0a0a0a'||theme.bg.startsWith('#0')||theme.bg.startsWith('#1');
  r.setProperty('--bd2',isDark?'rgba(255,255,255,0.10)':'rgba(0,0,0,0.08)');
  r.setProperty('--bd3',isDark?'rgba(255,255,255,0.18)':'rgba(0,0,0,0.14)');

  const fs={small:'13px',medium:'14px',large:'15px'};
  r.setProperty('--fs',fs[config.fontSize]||'14px');
  
  html.classList.toggle('glass-mode',!!theme.glass);
  // Apply theme-id class (theme-terminal, theme-bauhaus, ...) for theme-specific CSS
  [...html.classList].forEach(c=>{if(c.startsWith('theme-'))html.classList.remove(c);});
  html.classList.add('theme-'+theme.id);

  // Background image + destaque (0 = fundo apagado, 1 = imagem no talo)
  const body=document.body;
  const bgImg=config.bgImage?BG_IMAGES.find(b=>b.id===config.bgImage):null;
  const src=bgImg?bgImg.path:(st?.classBaseImg||null);
  const bgOp=src?Math.max(0,Math.min(1,config.bgOpacity!=null?config.bgOpacity:DEF_BG_OPACITY)):0;
  if(src){
    // véu da cor do tema por cima da imagem — quanto mais opaco, mais discreto o fundo
    const veil=_rgba(theme.bg,1-bgOp);
    body.style.backgroundImage=`linear-gradient(${veil},${veil}), url('${src}')`;
    body.style.backgroundSize='cover';
    body.style.backgroundPosition='center';
    body.style.backgroundAttachment='fixed';
    body.style.backgroundRepeat='no-repeat';
    body.style.backgroundBlendMode='normal';
  }else{
    body.style.backgroundImage='none';
  }
  // A Skill Tree tem um véu próprio — mantém um piso pra não perder a legibilidade
  r.setProperty('--st-scrim',String(0.25+0.75*(1-bgOp)));
}

function LineChart({data,accent}){
  const W=560,H=110,PAD={t:22,b:18,l:4,r:4};
  const cW=W-PAD.l-PAD.r,cH=H-PAD.t-PAD.b;
  const max=Math.max(...data.map(d=>d.score),1);
  const pts=data.map((d,i)=>({
    x:PAD.l+(i/(data.length-1||1))*cW,
    y:PAD.t+cH-(d.score/max)*cH,
    ...d
  }));
  // Smooth bezier path
  function curve(pts){
    if(pts.length<2)return pts.length?`M${pts[0].x},${pts[0].y}`:'';
    let d=`M${pts[0].x},${pts[0].y}`;
    for(let i=0;i<pts.length-1;i++){
      const cx=(pts[i].x+pts[i+1].x)/2;
      d+=` C${cx},${pts[i].y} ${cx},${pts[i+1].y} ${pts[i+1].x},${pts[i+1].y}`;
    }
    return d;
  }
  const linePath=curve(pts);
  const areaPath=linePath+` L${pts[pts.length-1].x},${PAD.t+cH} L${pts[0].x},${PAD.t+cH} Z`;
  const gid='lg'+accent.replace('#','');
  // Mostra score em dias-chave: hoje + a cada 3 dias (evita sobreposição)
  const showLabel=(i)=>data[i].isToday||i===0||i===data.length-1||i%3===2;
  return<svg viewBox={`0 0 ${W} ${H}`}style={{width:'100%',height:'auto',display:'block',overflow:'visible'}}>
    <defs>
      <linearGradient id={gid}x1="0"y1="0"x2="0"y2="1">
        <stop offset="0%"stopColor={accent}stopOpacity="0.35"/>
        <stop offset="100%"stopColor={accent}stopOpacity="0"/>
      </linearGradient>
    </defs>
    {/* Area fill */}
    <path d={areaPath}fill={`url(#${gid})`}/>
    {/* Line */}
    <path d={linePath}fill="none"stroke={accent}strokeWidth="2"strokeLinecap="round"strokeLinejoin="round"/>
    {/* Data points + labels */}
    {pts.map((p,i)=>{
      const isT=data[i].isToday;
      return<g key={i}>
        <circle cx={p.x}cy={p.y}r={isT?4:data[i].score>0?2:1.5}fill={isT?accent:data[i].score>0?accent+'aa':'var(--bd2)'}stroke={isT?'#fff':'none'}strokeWidth={isT?1.5:0}/>
        {showLabel(i)&&data[i].score>0&&<text x={p.x}y={p.y-6}textAnchor="middle"fontSize="8"fontFamily="var(--fm)"fontWeight={isT?'700':'400'}fill={isT?accent:accent+'bb'}>{data[i].score}</text>}
      </g>;
    })}
  </svg>;
}

// ── GRÁFICO DE BARRAS ────────────────────────────────────────────────────────

function BarChart({data,accent}){
  const W=560,H=130,PAD={t:24,b:16,l:4,r:4};
  const cW=W-PAD.l-PAD.r,cH=H-PAD.t-PAD.b;
  const max=Math.max(...data.map(d=>d.score),1);
  const slot=cW/data.length;
  const barW=Math.max(slot*0.72,2);
  return<svg viewBox={`0 0 ${W} ${H}`}style={{width:'100%',height:'auto',display:'block'}}>
    {data.map((d,i)=>{
      const x=PAD.l+i*slot+(slot-barW)/2;
      const barH=Math.max((d.score/max)*cH,d.score>0?2:0);
      const y=PAD.t+cH-barH;
      const isT=d.isToday;
      // Mostra número do dia em todos os dias (a cada 2 se muito cheio)
      const showDay=data.length<=20||(i%2===0)||isT;
      return<g key={i}>
        <rect x={x}y={y}width={barW}height={Math.max(barH,1)}rx={2}
          fill={d.score===0?'var(--bd)':isT?accent:accent+'99'}
          style={{transition:'height .3s,y .3s'}}/>
        {/* Dia no rodapé */}
        {showDay&&<text x={x+barW/2}y={H-2}textAnchor="middle"fontSize="6.5"fontFamily="var(--fm)"fill={isT?accent:'var(--tx3)'}>{d.day}</text>}
        {/* Score real no topo de cada barra com dado */}
        {d.score>0&&<text x={x+barW/2}y={y-3}textAnchor="middle"fontSize="7"fontFamily="var(--fm)"fontWeight={isT?'700':'400'}fill={isT?accent:accent+'cc'}>{d.score}</text>}
      </g>;
    })}
    {/* Linha tracejada do dia de hoje */}
    {data.map((d,i)=>{
      if(!d.isToday)return null;
      const x=PAD.l+i*slot+(slot-barW)/2+barW/2;
      return<line key="tl"x1={x}y1={PAD.t}x2={x}y2={PAD.t+cH}stroke={accent}strokeWidth="1"strokeDasharray="3,3"opacity="0.35"/>;
    })}
  </svg>;
}

// ── HEATMAP CALENDÁRIO ────────────────────────────────────────────────────────

function HeatmapChart({data,accent,yr,mo}){
  const firstDow=new Date(yr,mo-1,1).getDay();
  const max=Math.max(...data.map(d=>d.score),1);
  const CELL=30,GAP=4;
  const rows=Math.ceil((firstDow+data.length)/7);
  const W=7*(CELL+GAP)-GAP,H=16+rows*(CELL+GAP);
  const DLBL=['D','S','T','Q','Q','S','S'];
  function cellColor(score){
    if(score===0)return null;
    const p=score/max;
    return p>0.75?accent:p>0.45?accent+'bb':p>0.2?accent+'77':accent+'44';
  }
  return<svg viewBox={`0 0 ${W} ${H}`}style={{width:'100%',height:'auto',display:'block'}}>
    {/* Day-of-week headers */}
    {DLBL.map((l,i)=><text key={i}x={i*(CELL+GAP)+CELL/2}y={10}textAnchor="middle"fontSize="8"fontFamily="var(--fm)"fill="var(--tx3)">{l}</text>)}
    {/* Empty cells before day 1 */}
    {Array.from({length:firstDow},(_,i)=>{
      const col=i%7,row=Math.floor(i/7);
      return<rect key={`e${i}`}x={col*(CELL+GAP)}y={14+row*(CELL+GAP)}width={CELL}height={CELL}rx={5}fill="var(--card2)"opacity="0.3"/>;
    })}
    {/* Day cells */}
    {data.map((d,i)=>{
      const pos=firstDow+i;
      const col=pos%7,row=Math.floor(pos/7);
      const x=col*(CELL+GAP),y=14+row*(CELL+GAP);
      const isT=d.isToday;
      const bg=cellColor(d.score)||'var(--card2)';
      const pct=Math.round((d.score/max)*100);
      return<g key={i}>
        <rect x={x}y={y}width={CELL}height={CELL}rx={5}fill={bg}
          stroke={isT?accent:'none'}strokeWidth={isT?2:0}/>
        <text x={x+CELL/2}y={y+CELL/2-3}textAnchor="middle"fontSize="8"fontFamily="var(--fm)"
          fill={d.score>0?'#fff':'var(--tx3)'}fontWeight={isT?'700':'400'}>{d.day}</text>
        {d.score>0&&<text x={x+CELL/2}y={y+CELL/2+8}textAnchor="middle"fontSize="7.5"fontFamily="var(--fm)"fontWeight="700"
          fill="rgba(255,255,255,0.85)">{d.score}</text>}
      </g>;
    })}
  </svg>;
}

// ── 🧬 ANÁLISE DO SISTEMA (surpresa) ─────────────────────────────────────────

function InsightCard({st,yr,mo}){
  const td=TODAY();
  const mk=monthKey(yr,mo);
  const totalDays=daysInMonth(yr,mo);
  const scores=getMonthScores(st,yr,mo);
  const now=new Date();

  // Hábito mais forte e mais fraco do mês
  const habProg=st.habits.filter(h=>h.active).map(h=>{
    let done=0;
    for(let d=1;d<=totalDays;d++){
      const ds=`${mk}-${String(d).padStart(2,'0')}`;
      if(st.habitLog[ds]?.[h.id])done++;
    }
    return{...h,done,pct:Math.round((done/Math.max(h.monthlyGoal,1))*100)};
  });
  const bestHab=[...habProg].sort((a,b)=>b.pct-a.pct)[0];
  const worstHab=[...habProg].sort((a,b)=>a.pct-b.pct)[0];

  // Melhor dia da semana
  const dowBucket=Array(7).fill(null).map(()=>({t:0,n:0}));
  scores.forEach(d=>{
    if(d.score>0){const dow=new Date(d.date+'T12:00:00').getDay();dowBucket[dow].t+=d.score;dowBucket[dow].n++;}
  });
  const dowAvg=dowBucket.map(b=>b.n>0?b.t/b.n:0);
  const bestDow=dowAvg.indexOf(Math.max(...dowAvg));
  const worstDow=dowAvg.indexOf(Math.min(...dowAvg.map((v,i)=>dowAvg[bestDow]>0&&v===0?99:v)));

  // Sequência atual
  let streak=0;
  for(let i=0;i<60;i++){
    const d=new Date(now);d.setDate(now.getDate()-i);
    const ds=localDateStr(d);
    if(getDayScore(st,ds)>0)streak++;else break;
  }

  // Tendência últimos 7 dias vs 7 anteriores
  const todayNum=now.getDate();
  const last7=scores.slice(Math.max(todayNum-7,0),todayNum);
  const prev7=scores.slice(Math.max(todayNum-14,0),Math.max(todayNum-7,0));
  const avg7=d=>{const a=d.filter(x=>x.score>0);return a.length?a.reduce((s,x)=>s+x.score,0)/a.length:0;};
  const la=avg7(last7),pa=avg7(prev7);
  const trend=pa>0?(la>pa*1.1?'up':la<pa*0.9?'down':'igual'):'novo';
  const trendPct=pa>0?Math.round(Math.abs(la-pa)/pa*100):0;

  // Consistência geral do mês
  const daysActive=scores.filter(d=>d.score>0).length;
  const daysUntilToday=Math.min(todayNum,totalDays);
  const consistency=Math.round((daysActive/Math.max(daysUntilToday,1))*100);

  // Gera insights
  const insights=[];
  if(streak>=7)insights.push({e:'🏆',t:`Sequência lendária de ${streak} dias! Você é imparável.`,c:'#f59e0b'});
  else if(streak>=3)insights.push({e:'🔥',t:`Sequência de ${streak} dias — o sistema está vivo. Não quebre.`,c:'#f97316'});
  else if(streak===1)insights.push({e:'⚡',t:'Você voltou hoje. Um dia de volta vale mais que mil planos.',c:'var(--ac)'});

  if(trend==='up')insights.push({e:'📈',t:`Sua performance subiu ${trendPct}% em relação à semana anterior.`,c:'#22c55e'});
  else if(trend==='down')insights.push({e:'📉',t:`Queda de ${trendPct}% vs semana passada. Hora de reconectar com o sistema.`,c:'#ef4444'});

  if(consistency>=80)insights.push({e:'🎯',t:`${consistency}% de consistência este mês — isso é elite.`,c:'#22c55e'});
  else if(consistency>=50)insights.push({e:'📅',t:`${consistency}% dos dias ativos — você está na média. Pode mais.`,c:'#eab308'});
  else if(daysUntilToday>=5)insights.push({e:'🚨',t:`Só ${consistency}% dos dias com registro — o sistema está apagado.`,c:'#ef4444'});

  if(bestHab&&bestHab.pct>=70)insights.push({e:bestHab.emoji,t:`${bestHab.name} é seu ponto forte este mês (${bestHab.pct}% da meta).`,c:'#22c55e'});
  if(worstHab&&worstHab.pct<40&&worstHab.id!==bestHab?.id)insights.push({e:worstHab.emoji,t:`${worstHab.name} está em ${worstHab.pct}% — precisa de atenção urgente.`,c:'#eab308'});

  if(dowAvg[bestDow]>0)insights.push({e:'📅',t:`${DAYS_LABEL[bestDow]} é o seu dia mais forte da semana.`,c:'var(--tx)'});

  if(insights.length===0)insights.push({e:'🧠',t:'Continue registrando seus dias para ver insights personalizados aqui.',c:'var(--tx2)'});

  return<div className="card mt14">
    <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--tx2)',marginBottom:12,textTransform:'uppercase',letterSpacing:'.07em'}}>🧬 Análise do Sistema</div>
    <div style={{display:'flex',flexDirection:'column',gap:7}}>
      {insights.map((ins,i)=><div key={i}style={{display:'flex',alignItems:'flex-start',gap:10,padding:'9px 12px',background:'var(--card2)',borderRadius:'var(--r)',border:'1px solid var(--bd)'}}>
        <span style={{fontSize:'1.05rem',flexShrink:0,lineHeight:1.4}}>{ins.e}</span>
        <span style={{fontSize:'.82rem',color:ins.c,lineHeight:1.45,fontWeight:500}}>{ins.t}</span>
      </div>)}
    </div>
  </div>;
}

function MissaoSection({st,setSt}){

  const skillLevels=useMemo(()=>calcSkillLevels(st),[st.skilltree]);
  const info=getLevelInfo(totalXP);
  const cls=info.cls;
  const nextClass=CLASSES.find(c=>c.minLevel>info.lvl)||null;
  const base=st.classBaseImg;
  const fileRef=useRef(null);
  const[imgModal,setImgModal]=useState(null);
  function handleAvatarFile(file){
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const im=new Image();
      im.onload=()=>{
        const sz=320,cv=document.createElement('canvas');cv.width=sz;cv.height=sz;
        const ctx=cv.getContext('2d');
        const scale=Math.max(sz/im.width,sz/im.height);
        const w=im.width*scale,h=im.height*scale;
        ctx.drawImage(im,(sz-w)/2,(sz-h)/2,w,h);
        try{setSt(p=>({...p,classBaseImg:cv.toDataURL('image/jpeg',0.82)}));}catch(e){}
      };
      im.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  }
  const acc=cls.cor,acc2=cls.cor2;
  const nextXp=info.nextXp;
  const xpInLvl=totalXP-info.curXp;
  const xpToNext=nextXp==null?0:nextXp-info.curXp;
  const pct=nextXp==null?100:Math.min(100,Math.round(xpInLvl/Math.max(xpToNext,1)*100));

  // Progresso DENTRO da classe atual (0..1) — é o que faz a aura crescer.
  const clsStart=cls.minLevel;
  const clsEnd=nextClass?nextClass.minLevel:MAX_LEVEL;
  const clsSpan=Math.max(1,clsEnd-clsStart);
  const clsIn=(info.lvl-clsStart)+(nextXp==null?1:pct/100);
  const auraP=nextClass?Math.max(0,Math.min(1,clsIn/clsSpan)):1;
  const auraPct=Math.round(auraP*100);
  const lvlsToNext=nextClass?Math.max(0,nextClass.minLevel-info.lvl):0;
  const ah=v=>Math.round(Math.max(0,Math.min(1,v))*255).toString(16).padStart(2,'0');

        <div style={{position:'relative'}}>
          <div style={{filter:`drop-shadow(0 0 10px ${acc}88)`,cursor:'pointer'}}onClick={()=>setImgModal(cls)}><ClassAvatar cls={cls}size={94}baseImg={base}/></div>
          <button onClick={e=>{e.stopPropagation();fileRef.current&&fileRef.current.click();}}title="Definir foto do avatar"style={{position:'absolute',bottom:-2,right:-2,width:28,height:28,borderRadius:'50%',background:acc,border:'2px solid #0B1522',color:'#0B1522',cursor:'pointer',fontSize:'.8rem',display:'flex',alignItems:'center',justifyContent:'center',zIndex:5}}>📷</button>
          <input ref={fileRef}type="file"accept="image/*"onChange={e=>handleAvatarFile(e.target.files&&e.target.files[0])}style={{display:'none'}}/>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontFamily:'var(--serif)',fontSize:'.62rem',fontWeight:700,color:acc,textTransform:'uppercase',letterSpacing:'.16em',marginBottom:4}}>Nível {info.lvl} / {MAX_LEVEL}</div>
          <div style={{fontFamily:'var(--serif)',fontWeight:900,fontSize:'1.7rem',letterSpacing:'.04em',lineHeight:1,color:acc,textShadow:`0 0 14px ${acc}55`}}>{cls.nome} {roman(info.sub)}</div>
          <div style={{fontSize:'.74rem',color:'var(--tx2)',fontStyle:'italic',marginTop:5}}>"{cls.desc}"</div>
        </div>
      </div>
      {/* XP bar */}
      <div style={{position:'relative',marginTop:16}}>
        {nextXp!=null?<>
          <div className="fcb"style={{fontSize:'.7rem',color:'var(--tx3)',marginBottom:5}}>
            <span style={{fontFamily:'var(--serif)',letterSpacing:'.06em'}}>Próximo nível</span>
            <span style={{fontFamily:'var(--fm)'}}>{xpInLvl.toLocaleString()} / {xpToNext.toLocaleString()} XP</span>
          </div>
          <div style={{height:9,background:'rgba(0,0,0,.3)',borderRadius:5,overflow:'hidden',border:`1px solid ${acc}33`}}>
            <div style={{height:'100%',width:pct+'%',background:`linear-gradient(90deg,${acc2},${acc})`,borderRadius:5,transition:'width .6s ease',boxShadow:`0 0 10px ${acc}`}}/>
          </div>
        </>:<div style={{textAlign:'center',color:acc,fontWeight:800,fontFamily:'var(--serif)',letterSpacing:'.08em',padding:'6px 0'}}>🏆 NÍVEL MÁXIMO — LENDA VIVA</div>}
      </div>
      {/* stats */}
      <div className="fc g12"style={{position:'relative',borderTop:'1px solid rgba(255,255,255,.10)',paddingTop:12,marginTop:14}}>
        <div><div style={{fontFamily:'var(--fm)',fontSize:'1.3rem',fontWeight:700,color:acc,lineHeight:1}}>{totalXP.toLocaleString()}</div><div style={{fontSize:'.6rem',color:'var(--tx3)',textTransform:'uppercase',letterSpacing:'.07em'}}>XP Total</div></div>
        <div style={{width:1,height:26,background:'rgba(255,255,255,.1)'}}/>
        <div><div style={{fontFamily:'var(--fm)',fontSize:'1.3rem',fontWeight:700,color:'var(--tx)',lineHeight:1}}>{skillLevels}</div><div style={{fontSize:'.6rem',color:'var(--tx3)',textTransform:'uppercase',letterSpacing:'.07em'}}>Níveis de skill</div></div>
        <div style={{width:1,height:26,background:'rgba(255,255,255,.1)'}}/>
        <div><div style={{fontFamily:'var(--fm)',fontSize:'1.3rem',fontWeight:700,color:'var(--tx)',lineHeight:1}}>{pct}%</div><div style={{fontSize:'.6rem',color:'var(--tx3)',textTransform:'uppercase',letterSpacing:'.07em'}}>p/ próximo</div></div>
      </div>
    </div>

    {/* ── TRILHA DAS CLASSES ── */}
    <div style={{fontFamily:'var(--serif)',fontWeight:700,fontSize:'.82rem',letterSpacing:'.1em',textTransform:'uppercase',color:'var(--tx2)',marginBottom:10}}>🃏 Trilha da Malandragem</div>
    <div style={{display:'flex',gap:10,overflowX:'auto',paddingBottom:8,marginBottom:20}}>
      {CLASSES.map(c=>{
        const unlocked=info.lvl>=c.minLevel;
        const isCurrent=c.id===cls.id;
        const isNext=nextClass&&c.id===nextClass.id;
        const clickable=unlocked||isNext;
        return<div key={c.id}style={{minWidth:108,flex:'0 0 108px',textAlign:'center',background:isCurrent?c.cor+'1f':'var(--card)',border:`1px solid ${isCurrent?c.cor:unlocked?c.cor+'44':isNext?c.cor+'66':'var(--bd)'}`,borderRadius:12,padding:'12px 8px',boxShadow:isCurrent?`0 0 14px ${c.cor}55`:isNext?`0 0 12px ${c.cor}33`:'none',cursor:clickable?'pointer':'default',position:'relative'}}onClick={()=>clickable&&setImgModal({...c,_locked:!unlocked})}>
          {isNext&&<div style={{position:'absolute',top:4,right:4,fontSize:'.62rem',opacity:.85,zIndex:2}}>🔍</div>}
          <div style={{display:'flex',justifyContent:'center',marginBottom:6}}><ClassAvatar cls={c}locked={!unlocked}size={62}baseImg={base}/></div>
          <div style={{fontFamily:'var(--serif)',fontWeight:700,fontSize:'.78rem',color:unlocked?c.cor:isNext?c.cor+'cc':'var(--tx4)',letterSpacing:'.04em'}}>{unlocked?c.nome:'? ? ?'}</div>
          <div style={{fontSize:'.58rem',fontFamily:'var(--fm)',marginTop:3,color:isCurrent?c.cor:isNext?c.cor:'var(--tx4)'}}>
            {isCurrent?'★ ATUAL':unlocked?'✓ conquistada':isNext?'🔒 prévia':`Nível ${c.minLevel}`}
          </div>
        </div>;
      })}
    </div>

    {/* ── AURA DA CLASSE (cresce até a próxima classe) ── */}
    <div style={{fontFamily:'var(--serif)',fontWeight:700,fontSize:'.82rem',letterSpacing:'.1em',textTransform:'uppercase',color:'var(--tx2)',marginBottom:4}}>🔮 Aura da Classe</div>
    <div style={{fontSize:'.7rem',color:'var(--tx3)',marginBottom:2,lineHeight:1.45}}>Sua aura cresce conforme você se aproxima da próxima classe. Suba habilidades na <b style={{color:'var(--tx2)'}}>Skill Tree</b> (+{XP_PER_SKILL_LEVEL} XP por nível) — é a <b style={{color:'var(--tx2)'}}>única fonte de XP</b>.</div>

    <div className="ms-aura-wrap">
      <div className="ms-aura-stage">
        <div className="ms-aura-glow"style={{'--au':acc+ah(.10+auraP*.55),'--auo':(.30+auraP*.70).toFixed(2)}}/>
        {auraP>=.15&&<div className="ms-aura-rays"style={{'--au':acc+ah(.06+auraP*.42),opacity:(.25+auraP*.75).toFixed(2)}}/>}
        {Array.from({length:rings}).map((_,i)=><div key={i}className={'ms-aura-ring'+(i===1?' r2':i===2?' r3':'')}style={{'--ar':acc+ah(.35+auraP*.5)}}/>)}
        {Array.from({length:sparks}).map((_,i)=><span key={'s'+i}className="ms-aura-spark"style={{'--orb':(108+(i%3)*10)+'px',animationDelay:(i*-1.35).toFixed(2)+'s',background:_mix(acc,'#FFFFFF',.5),boxShadow:`0 0 ${6+Math.round(auraP*10)}px ${_rgba(acc,.9)}`}}/>)}
        <div className="ms-aura-portrait"onClick={()=>setImgModal(cls)}style={{border:`2px solid ${_mix(acc,'#FFFFFF',auraP*.45)}`,boxShadow:`0 0 ${Math.round(10+auraP*46)}px ${acc+ah(.28+auraP*.6)}, inset 0 0 ${Math.round(auraP*26)}px ${acc+ah(auraP*.42)}`}}>
          {heroImg
            ?<img src={heroImg}alt={cls.nome}/>
            :<div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',background:`linear-gradient(135deg,${acc}22,${acc2}11)`}}><ClassAvatar cls={cls}size={140}baseImg={base}/></div>}
          <div style={{position:'absolute',inset:0,borderRadius:'50%',background:`radial-gradient(circle at 50% 120%, ${acc+ah(auraP*.35)}, transparent 62%)`,pointerEvents:'none'}}/>
        </div>

function AnotacoesSection({st,setSt}){
  const[modal,setModal]=useState(false);
  const[edit,setEdit]=useState(null);
  const[search,setSearch]=useState('');
  const[catFilter,setCatFilter]=useState('');
  const[catModal,setCatModal]=useState(false);
  const[newCat,setNewCat]=useState({name:'',color:'#a855f7'});

  const CAT_COLORS=['#a855f7','#3b82f6','#22c55e','#eab308','#ef4444','#ec4899','#06b6d4','#f97316'];

  function saveNote(f){
    const td=TODAY();
    if(edit){
      setSt(p=>({...p,notes:p.notes.map(n=>n.id===edit.id?{...n,...f}:n)}));
    }else{
      setSt(p=>({...p,notes:[{...f,id:uid(),createdAt:td,archived:false},...p.notes]}));
    }
    setEdit(null);
  }
  function delNote(id){setSt(p=>({...p,notes:p.notes.filter(n=>n.id!==id)}));}
  function pinNote(id){setSt(p=>({...p,notes:p.notes.map(n=>n.id===id?{...n,pinned:!n.pinned}:n)}));}
  function archiveNote(id){setSt(p=>({...p,notes:p.notes.map(n=>n.id===id?{...n,archived:!n.archived}:n)}));}
  function addCat(){
    if(!newCat.name.trim())return;
    setSt(p=>({...p,noteCategories:[...p.noteCategories,{id:uid(),...newCat}]}));
    setNewCat({name:'',color:'#a855f7'});setCatModal(false);
  }
  function delCat(id){setSt(p=>({...p,noteCategories:p.noteCategories.filter(c=>c.id!==id)}));}

  const notes=useMemo(()=>{
    let n=(st.notes||[]).filter(x=>!x.archived);
    if(search)n=n.filter(x=>(x.title+x.content+x.items.map(i=>i.text).join(' ')).toLowerCase().includes(search.toLowerCase()));
    if(catFilter)n=n.filter(x=>x.catId===catFilter);
    // pinned first
    return [...n.filter(x=>x.pinned),...n.filter(x=>!x.pinned)];
  },[st.notes,search,catFilter]);

  const cats=st.noteCategories||[];

  return<div className="sec">
    {/* Header */}
    <div className="fcb mb10">
      <div className="sch-t">📝 Anotações</div>
      <div className="fc g6">
        <button className="btn btn-gh"style={{fontSize:'.75rem',padding:'5px 10px'}}onClick={()=>setCatModal(true)}>🏷 Cats</button>
        <button className="btn btn-ac"onClick={()=>{setEdit(null);setModal(true);}}>+ Nota</button>
      </div>
    </div>

    {/* Search */}
    <input value={search}onChange={e=>setSearch(e.target.value)}placeholder="🔍 Buscar nas anotações..."style={{marginBottom:'10px'}}/>

    {/* Category filter */}
    <div className="stabs mb14">
      <button className={`stab${catFilter===''?' on':''}`}onClick={()=>setCatFilter('')}>Todas</button>
      {cats.map(c=><button key={c.id}className={`stab${catFilter===c.id?' on':''}`}onClick={()=>setCatFilter(c.id)}style={catFilter===c.id?{background:c.color+'18',borderColor:c.color+'44',color:c.color}:{}}>{c.name}</button>)}
    </div>

    {/* Notes grid */}
    {notes.length===0&&<div style={{color:'var(--tx3)',textAlign:'center',padding:'32px 0',fontSize:'.9rem'}}>
      {search?'Nenhuma nota encontrada.':'Sem anotações. Crie a primeira!'}
    </div>}
    <div className="notes-masonry">
      {notes.map(note=>{
        const cat=cats.find(c=>c.id===note.catId);
        const ns=getNoteStyle(note.color);
        return<div key={note.id}className="note-card"style={ns}onClick={()=>{setEdit(note);setModal(true);}}>
          {note.pinned&&<div className="note-pin">📌</div>}
          {note.type==='imagem'&&note.imageData&&<img src={note.imageData}className="note-img"onClick={e=>e.stopPropagation()}/>}
          {note.title&&<div className="note-title"style={{paddingRight:note.pinned?'20px':'0'}}>{note.title}</div>}
          {note.type==='texto'&&note.content&&<div className="note-text">{note.content}</div>}
          {note.type==='lista'&&<div>{note.items.slice(0,6).map(item=><div key={item.id}className={`note-item${item.done?' done':''}`}>
            <div style={{width:10,height:10,borderRadius:2,flexShrink:0,border:`1.5px solid ${item.done?'var(--ac)':'var(--bd2)'}`,background:item.done?'var(--ac)':'transparent'}}/>
            <span>{item.text}</span>
          </div>)}
          {note.items.length>6&&<div style={{fontSize:'.72rem',color:'var(--tx3)',marginTop:'4px'}}>+{note.items.length-6} itens</div>}
          </div>}
          {note.type==='imagem'&&note.content&&<div className="note-text"style={{marginTop:'4px'}}>{note.content}</div>}
          <div className="note-footer"onClick={e=>e.stopPropagation()}>
            <div>{cat&&<span className="cat-tag"style={{background:cat.color+'18',color:cat.color}}>{cat.name}</span>}</div>
            <div className="note-actions">
              <button className="btn-ic"onClick={e=>{e.stopPropagation();pinNote(note.id);}}title={note.pinned?'Desafixar':'Fixar'}>📌</button>
              <button className="btn-ic"onClick={e=>{e.stopPropagation();archiveNote(note.id);}}title="Arquivar">📦</button>
              <button className="btn-ic"style={{color:'var(--er)'}}onClick={e=>{e.stopPropagation();delNote(note.id);}}>🗑</button>
            </div>
          </div>
        </div>;
      })}
    </div>

    {/* Note modal */}
    <NoteModal open={modal}onClose={()=>{setModal(false);setEdit(null);}}onSave={saveNote}init={edit}cats={cats}/>

    {/* Category modal */}
    <Modal open={catModal}onClose={()=>setCatModal(false)}title="Categorias de notas">
      <div className="flex col g6 mb12">
        {cats.map(c=><div key={c.id}className="fcb"style={{padding:'6px 10px',background:'var(--card2)',borderRadius:'6px'}}>
          <div className="fc g8"><div style={{width:12,height:12,borderRadius:'50%',background:c.color}}/><span style={{fontSize:'.85rem'}}>{c.name}</span></div>
          <button className="btn-ic"style={{color:'var(--er)'}}onClick={()=>delCat(c.id)}>🗑</button>
        </div>)}
      </div>
      <div className="fc g6 mb8">
        <input value={newCat.name}onChange={e=>setNewCat(p=>({...p,name:e.target.value}))}onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addCat();}}}placeholder="Nova categoria..."/>
        <div className="fc g4"style={{flexWrap:'wrap',flexShrink:0}}>
          {CAT_COLORS.map(col=><div key={col}className={`swatch${newCat.color===col?' on':''}`}style={{background:col,width:20,height:20}}onClick={()=>setNewCat(p=>({...p,color:col}))}/>)}
        </div>
      </div>
      <button className="btn btn-ac w100"onClick={addCat}>+ Adicionar categoria</button>
    </Modal>
  </div>;
}

function FinancasSection({st,setSt}){
  const now=new Date();
  const[yr,setYr]=useState(now.getFullYear());
  const[mo,setMo]=useState(now.getMonth()+1);
  const[sub,setSub]=useState('fixos');
  const[modalFixo,setModalFixo]=useState(false);
  const[modalCartao,setModalCartao]=useState(false);
  const[modalNovoCartao,setModalNovoCartao]=useState(false);
  const[editFixo,setEditFixo]=useState(null);
  const[editCartao,setEditCartao]=useState(null);
  const[novoCartao,setNovoCartao]=useState({nome:'',cor:CARD_COLORS[0],limite:''});

  const MONTH_NAMES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const fin=st.financas||{renda:0,gastosFixos:[],pagamentos:{},cartoes:[],gastosCartao:[]};
  const mk=monthKey(yr,mo);
  const pagMes=fin.pagamentos?.[mk]||{};
  const isCurrentMonth=yr===now.getFullYear()&&mo===now.getMonth()+1;

  function prevMonth(){if(mo===1){setYr(y=>y-1);setMo(12);}else setMo(m=>m-1);}
  function nextMonth(){if(mo===12){setYr(y=>y+1);setMo(1);}else setMo(m=>m+1);}
  function goToday(){const n=new Date();setYr(n.getFullYear());setMo(n.getMonth()+1);}

  function setFin(updater){
    setSt(p=>{
      const prev=p.financas||{renda:0,gastosFixos:[],pagamentos:{},cartoes:[],gastosCartao:[]};
      const next=typeof updater==='function'?updater(prev):{...prev,...updater};
      return{...p,financas:next};
    });
  }

  // Verifica se um gasto de cartão deve aparecer no mês mk
  // - recorrente: sempre aparece
  // - parcelas > 1: aparece do mês de início até (início + parcelas - 1)
  // - parcela única: aparece só no mês exato
  function gastoAparece(g){
    if(g.recorrente)return true;
    if(!g.mesAno)return false;
    const[sy,sm]=g.mesAno.split('-').map(Number);
    const[ky,km]=mk.split('-').map(Number);
    const diff=(ky*12+km)-(sy*12+sm);
    const total=(!g.parcelas||g.parcelas<1)?1:g.parcelas;
    return diff>=0&&diff<total;
  }
  // Retorna qual parcela é a atual (ex: 2 de 3)
  function parcelaAtual(g){
    if(!g.parcelas||g.parcelas<=1||!g.mesAno)return null;
    const[sy,sm]=g.mesAno.split('-').map(Number);
    const[ky,km]=mk.split('-').map(Number);
    return(ky*12+km)-(sy*12+sm)+1;
  }

  // Filter cartão expenses to current month
  const gastosDoMes=(fin.gastosCartao||[]).filter(gastoAparece);

  const totalFixos=(fin.gastosFixos||[]).filter(g=>g.ativo).reduce((s,g)=>s+(+g.valor||0),0);
  const totalPago=(fin.gastosFixos||[]).filter(g=>pagMes[g.id]&&g.ativo).reduce((s,g)=>s+(+g.valor||0),0);
  const totalCartao=gastosDoMes.reduce((s,g)=>s+(+g.valor||0),0);
  const totalGeral=totalFixos+totalCartao;
  const renda=+fin.renda||0;
  const pctRenda=renda>0?Math.min(100,Math.round((totalGeral/renda)*100)):0;

  function saveFixo(f){
    if(editFixo)setFin(p=>({...p,gastosFixos:p.gastosFixos.map(g=>g.id===editFixo.id?{...g,...f}:g)}));
    else setFin(p=>({...p,gastosFixos:[...p.gastosFixos,{...f,id:uid()}]}));
    setEditFixo(null);
  }
  function delFixo(id){setFin(p=>({...p,gastosFixos:p.gastosFixos.filter(g=>g.id!==id)}));}
  function togPago(id){
    setFin(p=>({
      ...p,
      pagamentos:{
        ...(p.pagamentos||{}),
        [mk]:{...((p.pagamentos||{})[mk]||{}),[id]:!((p.pagamentos||{})[mk]||{})[id]}
      }
    }));
  }

  function saveGastoCartao(f){
    if(editCartao)setFin(p=>({...p,gastosCartao:p.gastosCartao.map(g=>g.id===editCartao.id?{...g,...f}:g)}));
    else setFin(p=>({...p,gastosCartao:[...p.gastosCartao,{...f,id:uid()}]}));
    setEditCartao(null);
  }
  function delGastoCartao(id){setFin(p=>({...p,gastosCartao:p.gastosCartao.filter(g=>g.id!==id)}));}

  function addCartao(){
    if(!novoCartao.nome.trim())return;
    setFin(p=>({...p,cartoes:[...p.cartoes,{...novoCartao,id:uid(),limite:+novoCartao.limite||0}]}));
    setNovoCartao({nome:'',cor:CARD_COLORS[0],limite:''});
    setModalNovoCartao(false);
  }
  function delCartao(id){setFin(p=>({...p,cartoes:p.cartoes.filter(c=>c.id!==id),gastosCartao:p.gastosCartao.filter(g=>g.cartaoId!==id)}));}

  const cartoes=fin.cartoes||[];

  return<div className="sec">
    {/* Navegação de mês */}
    <div className="fcb mb14"style={{background:'var(--card)',border:'1px solid var(--bd)',borderRadius:'var(--r)',padding:'10px 14px'}}>
      <button className="btn-ic"style={{fontSize:'1.3rem',padding:'2px 10px',color:'var(--tx2)'}}onClick={prevMonth}>‹</button>
      <div style={{textAlign:'center',flex:1}}>
        <div style={{fontWeight:700,fontSize:'1rem'}}>{MONTH_NAMES[mo-1]} {yr}</div>
        <div style={{fontSize:'.67rem',color:'var(--tx3)',textTransform:'uppercase',letterSpacing:'.07em'}}>finanças mensais</div>
      </div>
      <div className="fc g6">
        {!isCurrentMonth&&<button className="btn btn-gh"style={{padding:'4px 10px',fontSize:'.72rem'}}onClick={goToday}>Hoje</button>}
        <button className="btn-ic"style={{fontSize:'1.3rem',padding:'2px 10px',color:'var(--tx2)'}}onClick={nextMonth}>›</button>
      </div>
    </div>

    {/* Resumo */}
    <div className="card mb14">
      <div className="fcb mb12">
        <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.07em'}}>Resumo — {MONTH_NAMES[mo-1]}</div>
        <div className="fc g8">
          <span style={{fontSize:'.72rem',color:'var(--tx3)',flexShrink:0}}>Renda:</span>
          <input type="number"min={0}value={fin.renda||''}onChange={e=>setFin(p=>({...p,renda:+e.target.value}))}placeholder="R$ 0,00"style={{width:110,padding:'3px 8px',fontSize:'.8rem',fontFamily:'var(--fm)'}}/>
        </div>
      </div>
      <div className="g3c mb10">
        <div className="mcrd"><div className="mval"style={{fontSize:'1.1rem',color:'#ef4444'}}>{fmtBRL(totalFixos)}</div><div className="mlbl">Gastos fixos</div></div>
        <div className="mcrd"><div className="mval"style={{fontSize:'1.1rem',color:'#a855f7'}}>{fmtBRL(totalCartao)}</div><div className="mlbl">Cartão</div></div>
        <div className="mcrd"><div className="mval"style={{fontSize:'1.1rem'}}>{fmtBRL(totalGeral)}</div><div className="mlbl">Total</div></div>
      </div>
      {renda>0&&<div>
        <div className="fcb mb4">
          <span style={{fontSize:'.72rem',color:'var(--tx2)'}}>Comprometido da renda</span>
          <span style={{fontSize:'.75rem',fontFamily:'var(--fm)',fontWeight:700,color:pctRenda>80?'#ef4444':pctRenda>60?'#eab308':'#22c55e'}}>{pctRenda}% · {fmtBRL(renda-totalGeral)} livre</span>
        </div>
        <PBar val={totalGeral}max={renda}color={pctRenda>80?'#ef4444':pctRenda>60?'#eab308':'#22c55e'}/>
      </div>}
    </div>

    {/* Subtabs */}
    <div className="stabs mb14">
      <button className={`stab${sub==='fixos'?' on':''}`}onClick={()=>setSub('fixos')}>💸 Gastos Fixos</button>
      <button className={`stab${sub==='cartao'?' on':''}`}onClick={()=>setSub('cartao')}>💳 Cartão de Crédito</button>
    </div>

    {/* ── ABA GASTOS FIXOS ── */}
    {sub==='fixos'&&<div>
      <div className="sch">
        <div className="sch-t">Contas Fixas Mensais</div>
        <button className="btn btn-ac"onClick={()=>{setEditFixo(null);setModalFixo(true);}}>+ Adicionar</button>
      </div>
      {(fin.gastosFixos||[]).length===0&&<div style={{color:'var(--tx3)',fontSize:'.88rem',padding:'28px 0',textAlign:'center'}}>
        Nenhum gasto fixo ainda.<br/>
        <span style={{fontSize:'.78rem'}}>Clique em "+ Adicionar" para começar.</span>
      </div>}
      {[...(fin.gastosFixos||[])].sort((a,b)=>a.dia-b.dia).map(g=>{
        const cat=FIN_CATS.find(c=>c.k===g.categoria)||FIN_CATS[7];
        const pago=!!pagMes[g.id];
        return<div key={g.id}className="tsk-row"style={{borderColor:pago?'#22c55e44':'var(--bd)',opacity:g.ativo?1:.45}}>
          <Chk on={pago}onChange={()=>togPago(g.id)}/>
          <div style={{flex:1,minWidth:0}}>

// ── MENTE / REPROGRAMAÇÃO DE CRENÇAS ─────────────────────────────────────────

const CRENCA_AREAS=[
  {k:'amor',         l:'Amor',         emoji:'❤️', c:'#ec4899'},
  {k:'esporte',      l:'Esporte',      emoji:'⚽', c:'#22c55e'},
  {k:'profissional', l:'Profissional', emoji:'💼', c:'#3b82f6'},
  {k:'geral',        l:'Vida',         emoji:'✨', c:'#a855f7'},
];
const EVID_META=20; // nº de evidências para instalar 100% da crença

function crencaForca(c){
  const n=(c.evidencias||[]).length;
  return Math.min(100,Math.round(n/EVID_META*100));
}
function crencaNivel(f){
  if(f>=100)return{t:'Instalada 🦋',c:'#22c55e'};
  if(f>=75)return{t:'Quase instalada',c:'#22c55e'};
  if(f>=45)return{t:'Ganhando força',c:'#eab308'};
  if(f>=15)return{t:'Criando raiz',c:'#f59e0b'};
  if(f>0)return{t:'Primeiros brotos',c:'#f97316'};
  return{t:'Semente plantada 🌱',c:'var(--tx3)'};
}
function ritualStreak(log){
  let s=0;const now=new Date();
  for(let i=0;i<365;i++){
    const d=new Date(now);d.setDate(now.getDate()-i);
    const ds=localDateStr(d);
    if(log&&log[ds])s++;else if(i===0)continue;else break;
  }
  return s;
}

// Ritual guiado em tela cheia
function ReprogramMode({st,setSt,onClose}){
  const itens=(st.crencas?.itens)||[];
  const ac=st.config.accentOverride||(THEMES.find(t=>t.id===st.config.themeId)||THEMES[0]).ac;
  const[step,setStep]=useState(0); // 0=intro, 1..N=crenças, N+1=fim
  const total=itens.length;
  const isIntro=step===0;
  const isEnd=step===total+1;
  const cur=(!isIntro&&!isEnd)?itens[step-1]:null;
  const area=cur?CRENCA_AREAS.find(a=>a.k===cur.area):null;

  function finish(){
    const td=TODAY();
    setSt(p=>({...p,crencas:{...p.crencas,ritualLog:{...(p.crencas?.ritualLog||{}),[td]:true}}}));
    onClose();
  }

  return<div style={{position:'fixed',inset:0,zIndex:900,background:'rgba(0,0,0,.97)',backdropFilter:'blur(10px)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24,animation:'fi .25s ease'}}>
    <button onClick={onClose}style={{position:'absolute',top:16,right:16,background:'none',border:'1px solid var(--bd2)',color:'var(--tx2)',padding:'6px 12px',borderRadius:8,fontSize:'.8rem',cursor:'pointer'}}>✕ Fechar</button>

    {/* progresso */}
    <div style={{position:'absolute',top:20,left:0,right:0,display:'flex',justifyContent:'center',gap:6}}>
      {Array.from({length:total+2},(_,i)=><div key={i}style={{width:i===step?22:7,height:7,borderRadius:4,background:i<=step?ac:'rgba(255,255,255,.15)',transition:'all .3s'}}/>)}
    </div>

    {isIntro&&<div style={{textAlign:'center',maxWidth:440,animation:'fu .4s ease'}}>
      <div style={{fontSize:'3.4rem',marginBottom:18}}>🦋</div>
      <div style={{fontFamily:'var(--ft)',fontSize:'2rem',letterSpacing:'.04em',marginBottom:16,color:ac}}>REPROGRAMAÇÃO</div>
      <p style={{fontSize:'1rem',color:'var(--tx2)',lineHeight:1.7,marginBottom:10}}>Respire fundo <b style={{color:'var(--tx)'}}>3 vezes</b>. Devagar.</p>
      <p style={{fontSize:'.92rem',color:'var(--tx3)',lineHeight:1.7,marginBottom:28}}>Nos próximos minutos você não vai "tentar acreditar". Você vai apenas <b style={{color:'var(--tx2)'}}>ler em voz alta</b> e deixar cada frase ressoar. Seu cérebro grava pela repetição calma, não pela força.</p>
      <button onClick={()=>setStep(1)}style={{padding:'12px 34px',borderRadius:10,background:ac,border:'none',color:'#000',fontWeight:800,fontSize:'1rem',cursor:'pointer'}}>Começar →</button>
    </div>}

    {cur&&<div key={step}style={{textAlign:'center',maxWidth:540,animation:'fu .4s ease'}}>
      <div style={{display:'inline-flex',alignItems:'center',gap:7,padding:'4px 14px',borderRadius:20,background:area.c+'22',border:`1px solid ${area.c}55`,marginBottom:26}}>
        <span>{area.emoji}</span><span style={{fontSize:'.8rem',fontWeight:700,color:area.c}}>{area.l}</span>
      </div>
      <div style={{fontSize:'.72rem',color:'var(--tx4)',textTransform:'uppercase',letterSpacing:'.12em',marginBottom:10}}>Leia em voz alta · sinta como verdade</div>
      <div style={{fontSize:'1.7rem',fontWeight:700,lineHeight:1.45,color:'var(--tx)',marginBottom:24}}>"{cur.nova}"</div>
      {cur.reframe&&<div style={{fontSize:'.92rem',color:'var(--tx2)',fontStyle:'italic',lineHeight:1.65,padding:'0 10px',marginBottom:34}}>💭 {cur.reframe}</div>}
      <div className="fc g10"style={{justifyContent:'center'}}>
        {step>1&&<button onClick={()=>setStep(s=>s-1)}style={{padding:'10px 18px',borderRadius:10,background:'transparent',border:'1px solid var(--bd2)',color:'var(--tx2)',fontWeight:600,fontSize:'.9rem',cursor:'pointer'}}>← Voltar</button>}
        <button onClick={()=>setStep(s=>s+1)}style={{padding:'12px 30px',borderRadius:10,background:ac,border:'none',color:'#000',fontWeight:800,fontSize:'.95rem',cursor:'pointer'}}>{step===total?'Finalizar':'Próxima →'}</button>
      </div>
    </div>}

    {isEnd&&<div style={{textAlign:'center',maxWidth:440,animation:'fu .4s ease'}}>
      <div style={{fontSize:'3.4rem',marginBottom:18}}>✨</div>
      <div style={{fontFamily:'var(--ft)',fontSize:'1.8rem',letterSpacing:'.04em',marginBottom:14,color:ac}}>RITUAL COMPLETO</div>
      <p style={{fontSize:'.95rem',color:'var(--tx2)',lineHeight:1.7,marginBottom:8}}>Você plantou as sementes de novo hoje.</p>
      <p style={{fontSize:'.88rem',color:'var(--tx3)',lineHeight:1.7,marginBottom:28}}>Agora, durante o dia, fique atento às <b style={{color:'var(--tx2)'}}>provas</b> de que essas crenças são verdade — e registre-as. É a prova que muda o subconsciente.</p>
      <button onClick={finish}style={{padding:'12px 34px',borderRadius:10,background:ac,border:'none',color:'#000',fontWeight:800,fontSize:'1rem',cursor:'pointer'}}>Concluir ✓</button>
    </div>}
  </div>;
}

      <select value={f.area}onChange={e=>setF(p=>({...p,area:e.target.value}))}>

      <button className="btn btn-gh"onClick={onClose}>Cancelar</button>

      </div>;
    })}

    <CrencaModal open={modal}onClose={()=>{setModal(false);setEdit(null);}}onSave={saveCrenca}init={edit}/>

}

// Coroa de louros (para habilidades dominadas) — desenhada em SVG
function Laurel({color}){
  const cx=44,cy=46,R=34;
  const angsL=[112,134,156,178,200,222];
  const angsR=[68,46,24,2,340,318];
  const leaf=(a,k)=>{
    const rad=a*Math.PI/180;
    const x=cx+R*Math.cos(rad),y=cy+R*Math.sin(rad);
    return<ellipse key={k}cx={x}cy={y}rx={3}ry={6.6}transform={`rotate(${a+90} ${x} ${y})`}fill={color}/>;
  };
  return<svg viewBox="0 0 88 88"style={{width:'100%',height:'100%',display:'block'}}>
    <g style={{filter:`drop-shadow(0 0 2px ${color})`}}opacity="0.92">
      {angsL.map((a,i)=>leaf(a,'l'+i))}
      {angsR.map((a,i)=>leaf(a,'r'+i))}
    </g>
  </svg>;
}

// ── SKILL TREE — helpers para foco do dia, radar, ritual, histórico ───────────
// Calcula os vértices do radar de maestria (um por árvore)
function skillRadar(trees,cx,cy,R){
  const n=trees.length;
  if(n<3)return{points:'',items:[]};
  const items=trees.map(t=>{
    const lv=t.skills.reduce((a,s)=>a+Math.min(s.nivel||0,s.maxNivel||1),0);
    const mx=t.skills.reduce((a,s)=>a+(s.maxNivel||1),0);
    const pct=mx?lv/mx:0;
    const pal=treePalette(t);
    return{...t,pct,pal};
  });
  const pts=items.map((it,i)=>{
    const ang=(i/n)*Math.PI*2 - Math.PI/2;
    const r=R*(0.15+it.pct*0.85);
    return{x:cx+r*Math.cos(ang),y:cy+r*Math.sin(ang)};
  });
  return{points:pts.map(p=>`${p.x},${p.y}`).join(' '),items,pts};
}

// Histórico de prática de uma skill via dados do Reels
function skillPracticeHistory(st,skillId,limit){
  const done=((st.reels&&st.reels.done)||[]).filter(d=>d.skillId===skillId).sort((a,b)=>(b.ts||0)-(a.ts||0));
  return done.slice(0,limit||8);
}

// Streak de prática da skill (dias consecutivos)
function skillStreak(st,skillId){
  const done=(st.reels&&st.reels.done)||[];
  const days=new Set(done.filter(d=>d.skillId===skillId).map(d=>d.date));
  let c=0,off=days.has(TODAY())?0:1;
  const dStr=o=>{const d=new Date();d.setDate(d.getDate()-o);return localDateStr(d);};
  while(days.has(dStr(off))){c++;off++;}
  return c;
}

// Gera narrativa épica de level-up via IA (malandro)
async function skillRitualNarrative(skill,tree,newLevel){
  if(!aiReady())return null;
  const criterion=(skill.levels&&skill.levels[newLevel])||'novo patamar';
  const prompt=`Acabei de subir para o nível ${newLevel} em "${skill.nome}" (da área "${tree.nome}"). O critério desse nível é: "${criterion}". Escreve uma narrativa épica e curta (2 a 3 frases, máximo 160 caracteres) celebrando essa evolução no estilo RPG/malandro, exaltando o que esse novo patamar representa — sem repetir a palavra "nível". Usa 2ª pessoa ("você" ou "tu").`;
  try{
    const t=await aiCall(AI_SYS_MALANDRO,prompt,250);
    return t?aiStrip(t):null;
  }catch(e){return null;}
}

// Radar de maestria entre todas as árvores
function SkillRadar({trees}){
  const SIZE=260,CX=SIZE/2,CY=SIZE/2,R=SIZE/2-24;
  const data=useMemo(()=>skillRadar(trees,CX,CY,R),[trees]);
  if(trees.length<3)return null;
  const rings=[0.25,0.5,0.75,1];
  return<div className="st-radar-wrap">
    <div className="st-radar-title">Equilíbrio entre áreas</div>
    <div className="st-radar">
      <svg width={SIZE}height={SIZE}viewBox={`0 0 ${SIZE} ${SIZE}`}>
        {/* rings */}
        {rings.map(k=>{
          const rr=R*k;
          const pts=trees.map((_,i)=>{
            const a=(i/trees.length)*Math.PI*2-Math.PI/2;
            return`${CX+rr*Math.cos(a)},${CY+rr*Math.sin(a)}`;
          }).join(' ');
          return<polygon key={k}points={pts}fill="none"stroke="rgba(159,179,200,.18)"strokeWidth="1"/>;
        })}
        {/* axis lines */}
        {trees.map((_,i)=>{
          const a=(i/trees.length)*Math.PI*2-Math.PI/2;
          return<line key={i}x1={CX}y1={CY}x2={CX+R*Math.cos(a)}y2={CY+R*Math.sin(a)}stroke="rgba(159,179,200,.14)"strokeWidth="1"/>;
        })}
        {/* polygon */}
        <polygon points={data.points}fill="rgba(245,217,140,.18)"stroke="#F5D98C"strokeWidth="1.5"style={{filter:'drop-shadow(0 0 8px rgba(245,217,140,.45))'}}/>
        {/* dots + emoji labels */}
        {data.items.map((it,i)=>{
          const pt=data.pts[i];
          const a=(i/trees.length)*Math.PI*2-Math.PI/2;
          const lx=CX+(R+14)*Math.cos(a),ly=CY+(R+14)*Math.sin(a);
          return<g key={it.id}>
            <circle cx={pt.x}cy={pt.y}r={4}fill={it.pal.d}style={{filter:`drop-shadow(0 0 4px ${it.pal.d})`}}/>
            <text x={lx}y={ly+4}textAnchor="middle"fontSize="14"style={{userSelect:'none'}}>{it.emoji}</text>
          </g>;
        })}
      </svg>
    </div>
    <div className="st-radar-legend">
      {data.items.map(it=><div key={it.id}className="st-radar-legend-item">
        <span className="st-radar-legend-dot"style={{background:it.pal.d}}/>
        {it.nome} · {Math.round(it.pct*100)}%
      </div>)}
    </div>
  </div>;
}

// Ritual de level-up (overlay épico)

function SkillNode({skill,pal,selected,stl,onClick,practiced}){
  const max=skill.maxNivel||1;
  const lv=Math.min(skill.nivel||0,max);
  const started=lv>0;
  const maxed=lv>=max;
  const d=pal.d,s=pal.s||pal.d;
  const gk=stl&&typeof stl.glow==='number'?stl.glow:1;   // slider "Brilho"
  const nk=stl&&typeof stl.neon==='number'?stl.neon:1;   // slider "Borda neon"
  const hideEmoji=!!(stl&&stl.semEmoji);                  // toggle "Sem emojis" — foco no nome

  // ── ESTÁGIOS DE IGNIÇÃO ──
  // A luz nasce no centro e cresce nível a nível (raio = nível ÷ máximo), mas cada
  // estágio também ACENDE UM ELEMENTO NOVO, então dá pra ler o nível de longe:
  //   1 faísca · 2 satélite em órbita · 3 anel de aura · 4 raios · 5 forma final
  // Num skill de 3 níveis os estágios pulam de 2 em 2 — a forma final é sempre o último.
  const levelRatio=max>0?Math.min(1,lv/max):0;   // fração do raio tomada pela luz
  const tone=max>1?(lv-1)/(max-1):1;             // 0 no nível 1 → 1 no último nível
  const stage=started?1+Math.round(tone*4):0;

  const FRAME=67;                                // diâmetro interno de .skill-frame (70px − borda)
  const lightD=+(levelRatio*FRAME).toFixed(1);
  const orbitR=Math.min(30.5,(lightD+FRAME)/4); // satélites no meio do vão entre luz e borda
  const sats=stage>=2&&stage<5?stage-1:0;        // 1, 2 e 3 satélites nos estágios 2, 3 e 4

  // Cores: tudo derivado da paleta da árvore, nada fixo.
  // O brilho é um gradiente em dois eixos: ENTRE NÍVEIS vai do tom mais claro da
  // paleta (nível 1) até o mais profundo (último), e DENTRO do orbe vai do núcleo
  // claro pra borda escura — a luz clareia no meio e afunda na beirada.
  const lightMain=_ramp(skillLightRamp(pal),tone);
  const lightHot=_mix(lightMain,'#FFFFFF',0.4);            // núcleo sempre mais claro que o corpo
  const lightRim=_mix(lightMain,'#05070D',0.16+tone*0.2);  // borda sempre mais funda que o corpo
  const glowTone=_mix(lightMain,d,0.35+tone*0.4);          // halo não some quando o orbe escurece
  const spark=_mix(d,'#FFFFFF',0.3);                       // satélites e raios seguem acesos
  const maxHi=_mix(d,'#FFFFFF',0.4);                       // acabamento da forma final

  // O poço em volta é sempre fundo — é o escuro dele que faz a luz aparecer —
  // só ganha um fio da cor do tema que adensa com o nível.
  const wellCore=_mix(_mix(d,s,0.5),'#04070E',0.88-tone*0.05);
  const well=started
    ? `radial-gradient(circle closest-side, ${wellCore} 0%, #03050B 100%)`
    : 'radial-gradient(circle closest-side, #101725 0%, #05070D 100%)';

  const halo=started?`0 0 ${Math.round((7+levelRatio*20)*gk)}px ${_rgba(glowTone,Math.min(0.85,(0.14+levelRatio*0.4)*gk).toFixed(2))}`:null;
  const maxHalo=maxed?`0 0 ${Math.round(34*gk)}px ${_rgba(maxHi,Math.min(0.6,0.3*gk).toFixed(2))}`:null;
  const stateHalo=selected?`0 0 14px ${_rgba(d,0.55)}`:focus?`0 0 10px ${_rgba(d,0.4)}`:null;
  const frameShadow=[stateHalo,maxHalo,halo].filter(Boolean).join(', ')||'none';

  // Emoji: grayscale → colorido conforme a luz cresce
  const emojiOp=!started?0.25:0.45+levelRatio*0.55;
  const emojiFilt=!started?'grayscale(1) brightness(0.65)':`brightness(${(0.8+levelRatio*0.35).toFixed(2)}) saturate(${Math.round(45+levelRatio*75)}%)`;

  // Frame: a borda do círculo acende junto com a luz
  const frameBorder=maxed?maxHi
    :selected?_rgba(d,0.95)
    :focus?_rgba(d,0.8)
    :started?_rgba(d,Math.min(1,(0.22+levelRatio*0.6)*(0.4+nk*0.6)).toFixed(2))
    :'rgba(51,69,91,0.4)';

  const skVars={
    '--sk-d':lightD+'px',
    '--sk-c':lightMain,
    '--sk-hot':lightHot,
    '--sk-rim':lightRim,
    '--sk-glow':_rgba(glowTone,Math.min(0.9,0.55*gk).toFixed(2)),
    '--sk-spark':spark,
    '--sk-bloom':Math.round((4+levelRatio*13)*gk)+'px',
    '--sk-aura-op':(maxed?0.9:0.55).toFixed(2),
  };

  // Pips: bolinhas abaixo do badge indicando nível (como estrelas)
  const pips=[];
  for(let i=1;i<=max;i++){
    pips.push({filled:i<=lv,gold:maxed&&i<=lv});
  }

  // Nome: é a informação principal do nó, então nasce já legível e ganha
  // um halo na cor do tema conforme sobe de nível
  const nameColor=maxed?maxHi
    :started?_rgba(d,Math.min(1,0.66+levelRatio*0.34).toFixed(2))
    :focus?d:'rgba(126,142,160,0.8)';
  const nameGlow=started
    ?`0 1px 3px rgba(0,0,0,.85), 0 0 ${Math.round(6+levelRatio*9)}px ${_rgba(maxed?maxHi:d,(0.2+levelRatio*0.32).toFixed(2))}`
    :'0 1px 3px rgba(0,0,0,.85)';

  // Badge
  const badgeColor=maxed?maxHi:started?d:'rgba(92,107,124,0.55)';
  const badgeBorder=maxed?maxHi:started?_rgba(d,Math.min(1,0.25+levelRatio*0.6).toFixed(2)):'rgba(68,86,109,0.35)';

  // Hint
  const nextHint=maxed?'Já dominada. Mantém afiado e ensina.':(skill.levels&&skill.levels[lv+1])||null;

  return<div className="skill-node"onClick={onClick}style={{position:'relative'}}>
    {/* Forma final: corona de raios e coroa pulsante em volta do disco cheio */}
    {maxed&&<div className="sk-corona"style={{'--sk-hot':maxHi}}/>}
    {maxed&&<div className="sk-crown"style={{'--sk-hot':_rgba(maxHi,0.85)}}/>}
    {/* Frame: poço escuro + camadas que acendem por estágio */}
    <div className="skill-frame"style={{...skVars,background:well,border:`1.5px solid ${frameBorder}`,boxShadow:frameShadow,transition:'box-shadow .25s,border-color .25s'}}>
      {stage>=4&&!maxed&&<div className="sk-rays"/>}
      {stage>=3&&<div className="sk-aura"/>}
      {sats>0&&<div className="sk-orbit">
        {Array.from({length:sats},(_,i)=><i key={i}style={{transform:`rotate(${i*360/sats}deg) translateY(${-orbitR}px)`}}/>)}
      </div>}
      {started&&<div className="sk-light"/>}
      <div className="skill-ring"style={{background:'transparent',padding:0}}>
        <div className="skill-core">
          {!hideEmoji&&<span style={{opacity:emojiOp,filter:emojiFilt,textShadow:'0 1px 3px rgba(0,0,0,.6)',transition:'all .3s'}}>{skill.emoji}</span>}
        </div>
      </div>
    </div>
    {/* Selo de dominada */}
    {maxed&&<div style={{position:'absolute',top:28,left:'50%',transform:'translate(-50%,-50%)',fontSize:'.7rem',opacity:0.85,zIndex:4,pointerEvents:'none',textShadow:`0 0 6px ${_rgba(maxHi,0.6)}`}}>{d==='#FFF7D1'?'👑':'⭐'}</div>}
    {/* Badge */}
    <div className="skill-badge"style={{background:'rgba(11,21,34,0.8)',color:badgeColor,border:`1px solid ${badgeBorder}`}}>{lv}/{max}</div>
    {/* Pratica de hoje */}
    {practiced&&<div style={{position:'absolute',top:2,right:2,width:8,height:8,borderRadius:'50%',background:'#22c55e',border:'1.5px solid #0B1522',boxShadow:'0 0 4px #22c55e',zIndex:3}}/>}
    {/* Pips: nível visual */}
    {max>1&&<div style={{display:'flex',justifyContent:'center',gap:3,marginTop:3}}>
      {pips.map((p,i)=><div key={i}style={{width:5,height:5,borderRadius:'50%',background:p.gold?maxHi:p.filled?d:'rgba(43,57,76,0.4)',border:`1px solid ${p.gold?maxHi:p.filled?_rgba(d,0.53):'rgba(43,57,76,0.3)'}`,boxShadow:p.filled?`0 0 3px ${_rgba(p.gold?maxHi:d,0.4)}`:'none',transition:'all .3s'}}/>)}
    </div>}
    {/* Nome */}
    <div className="skill-name"style={{color:nameColor,textShadow:nameGlow,marginTop:max>1?3:5,...(hideEmoji?{fontSize:'.76rem',maxWidth:80}:null)}}>{skill.nome}</div>
    {/* Hint ao selecionar */}
    {selected&&<div className="st-hint">
      {nextHint
        ?<><div className="st-hint-eyebrow">Próximo passo (nv {lv+1})</div><div className="st-hint-text">{nextHint}</div></>
        :<div className="st-hint-empty">{maxed?'✓ Dominada. Hora de ensinar.':'Adicione critérios pra saber o que falta.'}</div>
      }
    </div>}
  </div>;
}

function SkillNodeModal({skill,cor,onClose,onLevel,onEdit,onDelete,st,tree,onGoReel}){
  if(!skill)return null;
  const max=skill.maxNivel||1;
  const lv=Math.min(skill.nivel||0,max);
  const mastery=lv>=max?'✓ Dominado':lv===0?'Não iniciado':'Em progresso';
  const sBtn=(en)=>({width:48,height:48,borderRadius:'50%',background:en?cor+'22':'var(--card2)',border:`1px solid ${en?cor+'66':'var(--bd2)'}`,color:en?cor:'var(--tx4)',fontSize:'1.6rem',fontWeight:700,cursor:en?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0});
  // detecta level-up (quando lv aumenta) — dispara ritual
  const prevLvRef=useRef(lv);
  const[ritual,setRitual]=useState(null);
  useEffect(()=>{
    if(lv>prevLvRef.current){setRitual({newLevel:lv,skill,tree});}
    prevLvRef.current=lv;
  },[lv,skill,tree]);
  // histórico e streak
  const history=useMemo(()=>skillPracticeHistory(st,skill.id,8),[st,skill.id]);
  const streak=useMemo(()=>skillStreak(st,skill.id),[st,skill.id]);
  return<Modal open onClose={onClose}title={`${skill.emoji} ${skill.nome}`}>
    {skill.desc?<p style={{fontSize:'.85rem',color:'var(--tx2)',lineHeight:1.5,marginBottom:14}}>{skill.desc}</p>:null}
    <div className="fc"style={{justifyContent:'center',gap:24,margin:'4px 0 14px'}}>
      <button style={sBtn(lv>0)}onClick={()=>lv>0&&onLevel(-1)}>−</button>
      <div style={{textAlign:'center',minWidth:84}}>
        <div style={{fontFamily:'var(--fm)',fontSize:'2.3rem',fontWeight:700,color:cor,lineHeight:1}}>{lv}<span style={{color:'var(--tx3)',fontSize:'1.2rem'}}>/{max}</span></div>
        <div style={{fontSize:'.66rem',color:lv>=max?'#22c55e':'var(--tx3)',textTransform:'uppercase',letterSpacing:'.08em',marginTop:4}}>{mastery}</div>
      </div>
      <button style={sBtn(lv<max)}onClick={()=>lv<max&&onLevel(1)}>+</button>
    </div>
    <div style={{height:7,background:'rgba(255,255,255,.07)',borderRadius:4,overflow:'hidden',marginBottom:10}}>
      <div style={{height:'100%',width:(lv/max*100)+'%',background:lv>=max?'#22c55e':cor,borderRadius:4,transition:'width .3s'}}/>
    </div>
    {streak>=1&&<div style={{textAlign:'center',fontSize:'.72rem',color:'#F5D98C',marginBottom:10,fontFamily:'var(--fm)',letterSpacing:'.12em',textTransform:'uppercase'}}>🔥 Streak de {streak} dia{streak>1?'s':''}</div>}
    {skill.levels&&<div style={{marginTop:12,paddingTop:8,borderTop:'1px solid rgba(255,255,255,.06)'}}>
      <div style={{fontSize:'.65rem',color:'var(--tx3)',marginBottom:6,fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em',textAlign:'center'}}>📏 Critérios por Nível</div>
      <div style={{maxHeight:160,overflowY:'auto',display:'flex',flexDirection:'column',gap:2,paddingRight:4}}>
        {skill.levels.map((d,i)=>(
          <div key={i} style={{display:'flex',alignItems:'flex-start',gap:6,padding:'4px 7px',borderRadius:5,background:lv===i?cor+'22':'transparent',border:lv===i?`1px solid ${cor}44`:'1px solid transparent',fontSize:'.72rem',color:lv===i?'var(--tx1)':i<=lv?'var(--tx2)':'var(--tx4)',lineHeight:1.35,transition:'all .2s'}}>
            <span style={{fontWeight:700,fontSize:'.65rem',minWidth:13,textAlign:'right',color:lv===i?cor:i<=lv?cor+'aa':cor+'44'}}>{i}</span>
            <span>{d}</span>
          </div>
        ))}
      </div>
    </div>}
    {/* Histórico de prática (do Reels) */}
    <div className="st-history">
      <div className="st-history-title">⚡ Histórico de prática</div>
      {history.length===0
        ?<div className="st-history-empty">Ainda não praticou. Vá pros Reels e treine essa skill.</div>
        :<div className="st-history-list">
          {history.map(h=><div key={h.id}className="st-history-item">
            <span className="st-history-date">{ptDate(h.date)}</span>
            <span className="st-history-type">{h.type||'treino'}</span>
            <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{h.title||'Treino guiado'}</span>
          </div>)}
        </div>}
    </div>
    <div style={{textAlign:'center',fontSize:'.68rem',color:'var(--tx3)',marginTop:12,marginBottom:14}}>⚡ Cada nível vale <b style={{color:cor}}>+{XP_PER_SKILL_LEVEL} XP</b> no seu nível (aba Missão)</div>
    <Btns>
      <button className="btn btn-gh"onClick={onEdit}>✏️ Editar</button>
      <button className="btn btn-ac"style={{flex:1}}onClick={()=>{onClose();onGoReel&&onGoReel(skill.id);}}>▶ Treinar nos Reels</button>
      <button className="btn"style={{background:'rgba(239,68,68,.12)',color:'#ef4444',border:'1px solid rgba(239,68,68,.3)'}}onClick={onDelete}>🗑</button>
    </Btns>
    {ritual&&tree&&<SkillRitual skill={ritual.skill}tree={ritual.tree}newLevel={ritual.newLevel}
      onClose={()=>setRitual(null)}
      onGoReel={()=>{setRitual(null);onClose();onGoReel&&onGoReel(skill.id);}}/>}
  </Modal>;
}

function SkillFormModal({open,onClose,onSave,init,subcats,maxTier}){
  const list=subcats||[];
  const blank={nome:'',emoji:'⭐',maxNivel:3,subcat:list[0]?list[0].id:'',tier:1,desc:''};
  const[f,setF]=useState(init||blank);
  useEffect(()=>{
    const base=init?{...blank,...init}:{...blank};
    if(!base.levels)base.levels=Array.from({length:(base.maxNivel||3)+1},()=>'');
    setF(base);
  },[open]);
  function save(){if(!f.nome.trim())return;onSave({...f,maxNivel:Math.max(1,Math.min(9,+f.maxNivel||1)),tier:Math.max(1,+f.tier||1),subcat:f.subcat||(list[0]?list[0].id:''),levels:(f.levels||[]).slice(0,Math.max(1,Math.min(9,+f.maxNivel||1))+1)});onClose();}
  function handleMaxChange(val){
    const n=Math.max(1,Math.min(9,+val||1));
    setF(p=>{
      const cur=p.levels||[];
      const next=Array.from({length:n+1},(_,i)=>i<cur.length?cur[i]:'');
      return{...p,maxNivel:n,levels:next};
    });
  }
  function setLv(i,v){setF(p=>({...p,levels:(p.levels||[]).map((d,j)=>j===i?v:d)}));}
  const tierOpts=[];for(let i=1;i<=(maxTier||1)+1;i++)tierOpts.push(i);
  return<Modal open={open}onClose={onClose}title={init&&init.id?'Editar Habilidade':'Nova Habilidade'}>
    <div className="g2c">
      <Fld label="Emoji"><input value={f.emoji}onChange={e=>setF(p=>({...p,emoji:e.target.value}))}maxLength={4}placeholder="⭐"/></Fld>
      <Fld label="Nome"><input value={f.nome}onChange={e=>setF(p=>({...p,nome:e.target.value}))}placeholder="Ex: Drible"/></Fld>
    </div>
    <div className="g2c">
      <Fld label="Subcategoria (coluna)">
        <select value={f.subcat}onChange={e=>setF(p=>({...p,subcat:e.target.value}))}>
          {list.map(sc=><option key={sc.id}value={sc.id}>{sc.nome}</option>)}
        </select>
      </Fld>
      <Fld label="Prateleira (fileira)">
        <select value={f.tier}onChange={e=>setF(p=>({...p,tier:+e.target.value}))}>
          {tierOpts.map(i=><option key={i}value={i}>{i===(maxTier||1)+1?`${i} (nova)`:i}</option>)}
        </select>
      </Fld>
    </div>
    <Fld label="Níveis (máximo)"><input type="number"min={1}max={9}value={f.maxNivel}onChange={e=>handleMaxChange(e.target.value)}/></Fld>
    <Fld label="Descrição (opcional)"><textarea rows={2}value={f.desc}onChange={e=>setF(p=>({...p,desc:e.target.value}))}placeholder="Detalhes, referências, o que dominar..."/></Fld>
    {(f.levels||[]).length>0&&<div style={{marginTop:12,paddingTop:8,borderTop:'1px solid rgba(255,255,255,.06)'}}>
      <div style={{fontSize:'.65rem',color:'var(--tx3)',marginBottom:6,fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em',textAlign:'center'}}>📏 Critérios por Nível</div>
      <div style={{display:'flex',flexDirection:'column',gap:3,marginBottom:8}}>
        {(f.levels||[]).map((d,i)=>(
          <div key={i}style={{display:'flex',gap:4,alignItems:'center'}}>
            <span style={{fontWeight:700,fontSize:'.65rem',minWidth:13,textAlign:'right',color:'var(--tx3)'}}>{i}</span>
            <input value={d}onChange={e=>setLv(i,e.target.value)}placeholder={`Critério p/ nível ${i}`}style={{flex:1,minWidth:0}}/>
          </div>
        ))}
      </div>
    </div>}
    <Btns>
      <button className="btn btn-gh"onClick={onClose}>Cancelar</button>
      <button className="btn btn-ac"onClick={save}>Salvar</button>
    </Btns>
  </Modal>;
}

function SkillTreeSection({st,setSt,setTab}){
  const trees=(st.skilltree&&st.skilltree.trees)||[];
  const stl=readStyle(st);
  const[sel,setSel]=useState(trees[0]?trees[0].id:null);
  const[nodeSel,setNodeSel]=useState(null);
  const[showStyle,setShowStyle]=useState(false);
  const[skillModal,setSkillModal]=useState(false);
  const[editSkill,setEditSkill]=useState(null);
  const[skillPreset,setSkillPreset]=useState(null);
  const[treeModal,setTreeModal]=useState(false);
  const[editTree,setEditTree]=useState(null);
  const[showRadar,setShowRadar]=useState(false);
  // Prática de hoje
  const today=TODAY();
  const practicedToday=useMemo(()=>new Set(((st.reels&&st.reels.done)||[]).filter(d=>d.date===today).map(d=>d.skillId)),[st.reels,today]);
  const openSkillModalFor=id=>{
    const s=trees.flatMap(t=>t.skills).find(x=>x.id===id);
    if(s){setNodeSel(id);}
  };
  const goReelsFor=useCallback((skillId)=>{
    if(setTab){
      // filtra o Reels pela árvore da skill (se possível) e muda de aba
      const treeOfSkill=trees.find(t=>(t.skills||[]).some(s=>s.id===skillId));
      setTab('reels');
      if(treeOfSkill){try{sessionStorage.setItem('sc-reels-prefilter',treeOfSkill.id);}catch(e){}}
    }
  },[setTab,trees]);

  function setTrees(updater){
    setSt(p=>{
      const prev=(p.skilltree&&p.skilltree.trees)||[];
      const next=typeof updater==='function'?updater(prev):updater;
      return{...p,skilltree:{...(p.skilltree||{}),trees:next}};
    });
  }
  function setStyle(patch){
    setSt(p=>({...p,skilltree:{...(p.skilltree||{}),style:{...DEF_STYLE,...((p.skilltree&&p.skilltree.style)||{}),...patch}}}));
  }
  function applyPreset(name){setStyle({...SKILL_STYLE_PRESETS[name],preset:name});}

  const tree=trees.find(t=>t.id===sel)||trees[0]||null;

  // ── ações ──
  function setLevel(treeId,skillId,delta){
    setTrees(ts=>ts.map(t=>t.id!==treeId?t:{...t,skills:t.skills.map(s=>s.id!==skillId?s:{...s,nivel:Math.max(0,Math.min(s.maxNivel||1,(s.nivel||0)+delta))})}));
  }
  function saveSkill(f){
    if(!tree)return;
    if(editSkill)setTrees(ts=>ts.map(t=>t.id!==tree.id?t:{...t,skills:t.skills.map(s=>s.id===editSkill.id?{...s,...f}:s)}));
    else setTrees(ts=>ts.map(t=>t.id!==tree.id?t:{...t,skills:[...t.skills,{...f,id:uid(),nivel:0}]}));
    setEditSkill(null);
  }
  function delSkill(treeId,skillId){
    setTrees(ts=>ts.map(t=>t.id!==treeId?t:{...t,skills:t.skills.filter(s=>s.id!==skillId)}));
  }
  function saveTree(f){
    if(editTree)setTrees(ts=>ts.map(t=>t.id===editTree.id?{...t,...f}:t));
    else{const nid=uid();setTrees(ts=>[...ts,{...f,id:nid,skills:[]}]);setSel(nid);}
    setEditTree(null);
  }
  function delTree(id){
    setTrees(ts=>ts.filter(t=>t.id!==id));
    const rest=trees.filter(t=>t.id!==id);
    setSel(rest[0]?rest[0].id:null);
  }
  // subcategorias (colunas)
  function addSubcat(){if(!tree)return;setTrees(ts=>ts.map(t=>t.id!==tree.id?t:{...t,subcats:[...(t.subcats||[]),{id:uid(),nome:'Nova coluna'}]}));}
  function renameSubcat(scid,nome){setTrees(ts=>ts.map(t=>t.id!==tree.id?t:{...t,subcats:(t.subcats||[]).map(sc=>sc.id===scid?{...sc,nome}:sc)}));}
  function delSubcat(scid){setTrees(ts=>ts.map(t=>t.id!==tree.id?t:{...t,subcats:(t.subcats||[]).filter(sc=>sc.id!==scid),skills:t.skills.map(s=>s.subcat===scid?{...s,subcat:''}:s)}));}

  if(!tree){
    return<div className="sec st-screen">
      <div style={{textAlign:'center',padding:'50px 0',color:'#5C6B7C'}}>
        <div style={{fontSize:'2.5rem',marginBottom:10}}>🌳</div>
        <div style={{fontFamily:'var(--serif)',letterSpacing:'.08em',fontSize:'.9rem',marginBottom:16}}>Nenhuma árvore de habilidades ainda.</div>
        <button className="btn"style={{background:'#F5D98C',color:'#0B1522',fontFamily:'var(--serif)',letterSpacing:'.08em'}}onClick={()=>{setEditTree(null);setTreeModal(true);}}>+ CRIAR ÁREA</button>
      </div>
      <TreeFormModal open={treeModal}onClose={()=>setTreeModal(false)}onSave={saveTree}init={editTree}/>
    </div>;
  }

  const pal=treePalette(tree);

  const totLv=tree.skills.reduce((s,k)=>s+(k.nivel||0),0);
  const totMax=tree.skills.reduce((s,k)=>s+(k.maxNivel||0),0);
  const pct=totMax?Math.round(totLv/totMax*100):0;
  const dominadas=tree.skills.filter(k=>(k.nivel||0)>=(k.maxNivel||1)).length;

  // agrupa por subcategoria (coluna) × prateleira (fileira) → grade alinhada
  const subcats=tree.subcats||[];
  const bySub={};
  subcats.forEach(sc=>{bySub[sc.id]=[];});
  const orphan=[];
  tree.skills.forEach(s=>{if(s.subcat&&bySub[s.subcat])bySub[s.subcat].push(s);else orphan.push(s);});
  const columns=[...subcats.map(sc=>({sc,skills:bySub[sc.id]})),...(orphan.length?[{sc:{id:'__outros',nome:'Outros'},skills:orphan,orphan:true}]:[])];
  const allTiers=tree.skills.map(s=>s.tier||1);
  const maxTier=allTiers.length?Math.max(...allTiers):1;
  columns.forEach(col=>{col.byTier={};col.skills.forEach(s=>{const t=s.tier||1;(col.byTier[t]=col.byTier[t]||[]).push(s);});});
  const COLW=82,nCols=columns.length;

  const liveSkill=nodeSel?tree.skills.find(s=>s.id===nodeSel):null;

  // Fundo temático da árvore (emoji da área como marca d'água + lavagem na cor predominante)
  const fi=stl.fundoIntensidade;
  const _bgSvg=`<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><text x='50' y='66' font-size='46' text-anchor='middle' opacity='0.05'>${tree.emoji}</text></svg>`;
  const _washes=`radial-gradient(ellipse 130% 55% at 50% -8%, ${pal.d}${_ah(0.13*fi)}, transparent 62%), radial-gradient(ellipse at 50% 112%, ${pal.s}${_ah(0.16*fi)}, transparent 55%)`;
  const treeBg=_washes+(stl.fundoTema?`, url("data:image/svg+xml,${encodeURIComponent(_bgSvg)}")`:'');
  // borda neon dos ramos (personalizável)
  const neon=stl.neon!=null?stl.neon:1;
  const branchBg=`linear-gradient(180deg, ${pal.s}18, rgba(11,21,34,0.35))`;
  const branchBorder=`1.5px solid ${pal.d}${_ah(Math.min(0.95,0.3+neon*0.32))}`;
  const branchGlow=`0 0 ${Math.round(5+neon*13)}px ${pal.d}${_ah(Math.min(0.75,neon*0.4))}, inset 0 0 ${Math.round(neon*16)}px ${pal.s}${_ah(Math.min(0.45,neon*0.18))}`;

  return<div className="sec st-screen">
    {/* Seletor de áreas */}
    <div className="st-chips">
      {trees.map(t=>{
        const tp=treePalette(t);
        const on=sel===t.id;
        return<button key={t.id}className="st-chip"onClick={()=>setSel(t.id)}style={on?{background:`linear-gradient(135deg,${tp.d}22,${tp.s}11)`,borderColor:tp.d,color:tp.d,boxShadow:`0 0 10px ${tp.d}55`}:{}}>{t.emoji} {t.nome}</button>;
      })}
      <button className="st-chip"onClick={()=>{setEditTree(null);setTreeModal(true);}}>＋</button>
    </div>

    {/* Cabeçalho da árvore */}
    <div className="st-panel"style={{border:`1px solid ${pal.d}55`,boxShadow:`inset 0 0 30px ${pal.s}22`}}>
      <div style={{position:'absolute',top:-14,right:-4,fontSize:'5.4rem',opacity:.12,userSelect:'none',pointerEvents:'none',filter:`drop-shadow(0 0 8px ${pal.d})`}}>{tree.emoji}</div>
      <div className="fcb mb10">
        <div className="fc g10">
          <span style={{fontSize:'1.9rem',filter:`drop-shadow(0 0 6px ${pal.d}88)`}}>{tree.emoji}</span>
          <div>
            <div className="st-title"style={{fontSize:'1.5rem',color:pal.d,textShadow:`0 0 12px ${pal.d}66`}}>{tree.nome}</div>
            <div className="st-sub">{dominadas} dominadas · {tree.skills.length} habilidades</div>
          </div>
        </div>
        <div className="fc g4">
          <button className="btn-ic"style={{color:pal.d,fontSize:'.9rem'}}onClick={addSubcat}title="Nova subcategoria (coluna)">➕</button>
          <button className="btn-ic"style={{color:showRadar?pal.d:'#5C6B7C'}}onClick={()=>setShowRadar(v=>!v)}title="Radar de maestria">🧭</button>
          <button className="btn-ic"style={{color:showStyle?pal.d:'#5C6B7C'}}onClick={()=>setShowStyle(v=>!v)}title="Personalizar visual">🎨</button>
          <button className="btn-ic"style={{color:pal.d}}onClick={()=>{setEditTree(tree);setTreeModal(true);}}>✏️</button>
        </div>
      </div>
      <div className="fcb mb4">
        <span className="st-label">Maestria geral</span>
        <span style={{fontFamily:'var(--serif)',fontSize:'.78rem',fontWeight:700,color:pal.d,letterSpacing:'.05em'}}>{totLv}/{totMax} · {pct}%</span>
      </div>
      <div style={{height:7,background:'rgba(0,0,0,0.3)',borderRadius:4,overflow:'hidden',border:'1px solid rgba(43,57,76,0.6)'}}>
        <div style={{height:'100%',width:pct+'%',background:`linear-gradient(90deg,${pal.s},${pal.d})`,borderRadius:4,transition:'width .5s ease',boxShadow:`0 0 8px ${pal.d}`}}/>
      </div>
    </div>

    {/* Radar de maestria */}

function ConquistasSection({st,setSt}){
  const[modal,setModal]=useState(false);
  const[nb,setNb]=useState({name:'',emoji:'🏅',desc:''});

  // Auto-check badges
  const td=TODAY();
  const totalDoneHabits=Object.values(st.habitLog).reduce((s,day)=>s+Object.values(day).filter(Boolean).length,0);
  const totalTasks=st.tasks.filter(t=>t.done).length;
  const dayLog=st.habitLog[td]||{};
  const allDoneToday=st.habits.filter(h=>h.active).every(h=>dayLog[h.id]);

  function unlock(bid){setSt(p=>({...p,badges:p.badges.map(b=>b.id===bid?{...b,unlocked:true}:b)}));}
  function unlockCustom(bid){setSt(p=>({...p,customBadges:p.customBadges.map(b=>b.id===bid?{...b,unlocked:true}:b)}));}
  function saveCustom(){
    if(!nb.name.trim())return;
    setSt(p=>({...p,customBadges:[...p.customBadges,{...nb,id:uid(),unlocked:false}]}));
    setNb({name:'',emoji:'🏅',desc:''});setModal(false);
  }
  function delCustom(id){setSt(p=>({...p,customBadges:p.customBadges.filter(b=>b.id!==id)}));}

  // Auto-unlock logic (simplified)
  useEffect(()=>{
    const updates=st.badges.map(b=>{
      if(b.unlocked)return b;
      if(b.type==='habits_total'&&totalDoneHabits>=b.threshold)return{...b,unlocked:true};
      if(b.type==='tasks_total'&&totalTasks>=b.threshold)return{...b,unlocked:true};
      if(b.type==='all_habits_day'&&allDoneToday)return{...b,unlocked:true};
      return b;
    });
    if(updates.some((b,i)=>b.unlocked!==st.badges[i].unlocked))setSt(p=>({...p,badges:updates}));
  },[totalDoneHabits,totalTasks,allDoneToday]);

  const all=[...st.badges,...st.customBadges];

  return<div className="sec">
    <div className="sch">
      <div className="sch-t">🏆 Conquistas</div>
      <button className="btn btn-ac"onClick={()=>setModal(true)}>+ Criar</button>
    </div>
    <div className="g2c">
      {all.map(b=>{
        const isCustom=!b.auto;
        return<div key={b.id}className={`badge${b.unlocked?' done':' locked'}`}style={{cursor:isCustom?'pointer':'default'}}onClick={()=>{if(isCustom&&!b.unlocked)unlockCustom(b.id);}}>
          <div style={{fontSize:'2rem',marginBottom:'6px'}}>{b.emoji}</div>
          <div style={{fontWeight:700,fontSize:'.82rem',marginBottom:'3px'}}>{b.name}</div>
          <div style={{fontSize:'.72rem',color:'var(--tx2)',lineHeight:1.4}}>{b.desc}</div>
          {b.unlocked&&<div style={{fontSize:'.68rem',color:'var(--ac)',marginTop:'6px',fontWeight:700}}>✓ Desbloqueada</div>}
          {isCustom&&!b.unlocked&&<div style={{fontSize:'.68rem',color:'var(--tx3)',marginTop:'6px'}}>Toque para desbloquear</div>}
          {isCustom&&<button className="btn-ic"style={{color:'var(--er)',position:'absolute',top:6,right:6}}onClick={e=>{e.stopPropagation();delCustom(b.id);}}>×</button>}
        </div>;
      })}
    </div>
    <Modal open={modal}onClose={()=>setModal(false)}title="Nova Conquista">
      <div className="g2c"><Fld label="Emoji"><input value={nb.emoji}onChange={e=>setNb(p=>({...p,emoji:e.target.value}))}maxLength={4}/></Fld>
      <Fld label="Nome"><input value={nb.name}onChange={e=>setNb(p=>({...p,name:e.target.value}))}placeholder="Minha conquista"/></Fld></div>
      <Fld label="Descrição"><textarea rows={2}value={nb.desc}onChange={e=>setNb(p=>({...p,desc:e.target.value}))}placeholder="Quando conquistar isso..."/></Fld>
      <Btns><button className="btn btn-gh"onClick={()=>setModal(false)}>Cancelar</button><button className="btn btn-ac"onClick={saveCustom}>Criar</button></Btns>
    </Modal>
  </div>;
}

function CfgSync({st,setSt,fbUser,setFbUser,syncStatus,onManualSync}){
  const[cfgText,setCfgText]=useState('');
  const[connecting,setConnecting]=useState(false);
  const[err,setErr]=useState('');
  const[logging,setLogging]=useState(false);
  const[pulling,setPulling]=useState(false);

  const savedCfg=fbLoadCfg();
  const isConfigured=!!savedCfg;

  async function connect(){
    setErr('');setConnecting(true);
    try{
      let cfg;
      // Strip "const firebaseConfig = { ... };" wrapper if present
      let raw=cfgText.trim()
        .replace(/^const\s+\w+\s*=\s*/,'')  // remove "const firebaseConfig ="
        .replace(/;\s*$/,'')                  // remove trailing ";"
        .trim();
      // Strategy 1: direct JSON.parse (works if keys are already quoted)
      try{ cfg=JSON.parse(raw); }catch(_){
        // Strategy 2: eval as JS object literal via Function (safe — no local scope access)
        // Handles unquoted keys like { apiKey: "...", projectId: "..." }
        try{ cfg=new Function('return ('+raw+')')(); }catch(e2){
          throw new Error('Não foi possível ler a config. Tente selecionar "Config" (não NPM/CDN) no Firebase console e copie apenas o objeto JSON.');
        }
      }
      if(!cfg||!cfg.apiKey||!cfg.projectId)throw new Error('Config incompleta — verifique se copiou o firebaseConfig correto.');
      const ok=fbInit(cfg);
      if(!ok)throw new Error('Falha ao inicializar Firebase. Verifique a config.');
      fbSaveCfg(cfg);
      setCfgText('');
    }catch(e){
      setErr(e.message||'Config inválida.');
    }
    setConnecting(false);
  }

  async function login(){
    setErr('');setLogging(true);
    try{await fbSignIn();}
    catch(e){setErr(e.message||'Erro no login.');}
    setLogging(false);
  }

  async function logout(){
    await fbSignOut();
    setFbUser(null);
  }

  async function pullCloud(){
    if(!fbUser)return;
    setPulling(true);setErr('');
    try{
      const cloud=await fbPull(fbUser.uid);
      if(!cloud){setErr('Nenhum dado encontrado na nuvem.');setPulling(false);return;}
      if(window.confirm('Substituir dados locais pelos dados da nuvem? (Cancelar = mesclar)')){
        setSt(cloud);
      }else{
        setSt(p=>mergeDeep(p,cloud));
      }
    }catch(e){setErr(e.message||'Erro ao buscar dados da nuvem.');}
    setPulling(false);
  }

  function disconnect(){
    if(!window.confirm('Desconectar Firebase? A config será removida deste dispositivo.'))return;
    fbSignOut().catch(()=>{});
    fbClearCfg();
    _fbApp=null;_fbAuth=null;_fbDb=null;
    setFbUser(null);
    setErr('');
  }

  const statusColor=syncStatus==='ok'?'#22c55e':syncStatus==='syncing'?'#eab308':syncStatus==='err'?'#ef4444':'#555';
  const statusLabel=syncStatus==='ok'?'Sincronizado':syncStatus==='syncing'?'Sincronizando…':syncStatus==='err'?'Erro na sync':'Não sincronizado';

  return<div>
    {/* Status */}
    {isConfigured&&<div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 14px',background:'var(--card2)',border:'1px solid var(--bd)',borderRadius:'var(--r)',marginBottom:16}}>
      <div style={{width:8,height:8,borderRadius:'50%',background:statusColor,flexShrink:0,boxShadow:`0 0 6px ${statusColor}`}}/>
      <span style={{fontSize:'.82rem',color:'var(--tx2)',flex:1}}>{statusLabel}</span>
      {fbUser&&<span style={{fontSize:'.75rem',color:'var(--tx3)',fontFamily:'var(--fm)'}}>{fbUser.email}</span>}
    </div>}

    {/* Not configured yet */}
    {!isConfigured&&<div className="cfg-s">
      <div className="cfg-t">Configurar Firebase</div>
      <div style={{fontSize:'.8rem',color:'var(--tx2)',lineHeight:1.6,marginBottom:12}}>
        Para sincronizar entre dispositivos, crie um projeto Firebase gratuito e cole a config abaixo.<br/>
        <strong style={{color:'var(--tx)'}}>Passo a passo:</strong>
        <ol style={{marginTop:6,paddingLeft:18,display:'flex',flexDirection:'column',gap:3}}>
          <li>Acesse <strong style={{color:'var(--ac)'}}>console.firebase.google.com</strong></li>
          <li>Crie um projeto → Adicionar app Web</li>
          <li>Copie o objeto <strong style={{color:'var(--ac)'}}>firebaseConfig</strong></li>
          <li>Ative <strong>Firestore Database</strong> no menu lateral</li>
          <li>Ative <strong>Authentication → Google</strong></li>
          <li>Em Firestore → Regras, cole a regra segura abaixo</li>
        </ol>
      </div>
      {/* Firestore rule */}
      <div style={{background:'#0d1117',border:'1px solid var(--bd)',borderRadius:6,padding:'10px 12px',marginBottom:12,fontFamily:'var(--fm)',fontSize:'.72rem',color:'#79c0ff',lineHeight:1.7}}>
        <div style={{color:'#8b949e',marginBottom:4}}>{'// Firestore → Regras:'}</div>
        {`rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /cerebro/{uid} {\n      allow read, write: if request.auth.uid == uid;\n    }\n  }\n}`}
      </div>
      <div className="fld"><label>Cole o firebaseConfig aqui (JSON ou objeto JS)</label>
        <textarea rows={6}value={cfgText}onChange={e=>setCfgText(e.target.value)}placeholder={'{\n  "apiKey": "...",\n  "authDomain": "...",\n  "projectId": "...",\n  ...\n}'}style={{fontFamily:'var(--fm)',fontSize:'.78rem'}}/>
      </div>
      {err&&<div style={{color:'#ef4444',fontSize:'.78rem',marginBottom:8}}>{err}</div>}
      <button className="btn btn-ac w100"onClick={connect}disabled={!cfgText.trim()||connecting}>
        {connecting?'Conectando…':'🔗 Conectar Firebase'}
      </button>
    </div>}

    {/* Configured — show login or user panel */}
    {isConfigured&&!fbUser&&<div className="cfg-s">
      <div className="cfg-t">Entrar com Google</div>
      <div style={{fontSize:'.8rem',color:'var(--tx2)',marginBottom:12}}>Faça login para ativar a sincronização automática.</div>
      {err&&<div style={{color:'#ef4444',fontSize:'.78rem',marginBottom:8}}>{err}</div>}
      <button className="btn btn-ac w100"onClick={login}disabled={logging}style={{marginBottom:8}}>
        {logging?'Entrando…':'🔑 Entrar com Google'}
      </button>
      <button className="btn btn-gh w100"onClick={disconnect}style={{fontSize:'.75rem'}}>Desconectar Firebase</button>
    </div>}

    {isConfigured&&fbUser&&<div className="cfg-s">
      <div className="cfg-t">Sincronização ativa</div>
      <div style={{fontSize:'.8rem',color:'var(--tx2)',marginBottom:12,lineHeight:1.6}}>
        Seus dados são enviados para a nuvem automaticamente após cada alteração (3 segundos de debounce). Você pode acessar em qualquer dispositivo fazendo login com a mesma conta Google.
      </div>
      {err&&<div style={{color:'#ef4444',fontSize:'.78rem',marginBottom:8}}>{err}</div>}
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        <button className="btn btn-ac"onClick={onManualSync}>☁️ Enviar dados agora</button>
        <button className="btn btn-gh"onClick={pullCloud}disabled={pulling}>{pulling?'Buscando…':'⬇️ Buscar dados da nuvem'}</button>
        <button className="btn btn-gh"onClick={logout}style={{fontSize:'.75rem',color:'var(--tx3)'}}>Sair da conta</button>
        <button className="btn-er"style={{fontSize:'.72rem',padding:'5px 10px',borderRadius:'var(--r)',width:'auto',alignSelf:'flex-start'}}onClick={disconnect}>Desconectar Firebase</button>
      </div>
    </div>}
  </div>;
}

function CfgNavbar({st,setSt}){
  const tabs=st.config.tabs||DEF_TABS;
  function move(id,dir){
    setSt(p=>{
      const arr=[...p.config.tabs];
      const i=arr.findIndex(t=>t.id===id);
      const j=dir==='up'?i-1:i+1;
      if(j<0||j>=arr.length)return p;
      [arr[i],arr[j]]=[arr[j],arr[i]];
      return{...p,config:{...p.config,tabs:arr}};
    });
  }
  function togVis(id){setSt(p=>({...p,config:{...p.config,tabs:p.config.tabs.map(t=>t.id===id?{...t,visible:t.visible===false?true:false}:t)}}))}
  function renameTab(id,label){setSt(p=>({...p,config:{...p.config,tabs:p.config.tabs.map(t=>t.id===id?{...t,label}:t)}}))}
  return<div>
    <div className="cfg-t">Ordem e visibilidade das abas</div>
    {tabs.map((t,i)=><div key={t.id}className="fc g10"style={{padding:'8px 10px',background:'var(--card)',border:'1px solid var(--bd)',borderRadius:'var(--r)',marginBottom:'6px'}}>
      <span style={{fontSize:'1rem'}}>{t.emoji}</span>
      <input value={t.label}onChange={e=>renameTab(t.id,e.target.value)}style={{flex:1,padding:'4px 8px',fontSize:'.82rem'}}/>
      <Tog on={t.visible!==false}onChange={()=>togVis(t.id)}/>
      <button className="btn-ic"onClick={()=>move(t.id,'up')}>↑</button>
      <button className="btn-ic"onClick={()=>move(t.id,'down')}>↓</button>
    </div>)}
  </div>;
}

function CfgCats({st,setSt}){
  const[nm,setNm]=useState('');
  const[cor,setCor]=useState('#3b82f6');
  const COLS=['#3b82f6','#22c55e','#a855f7','#ef4444','#ec4899','#06b6d4','#eab308','#f87171','#fbbf24','#a78bfa'];
  function add(){if(!nm.trim())return;setSt(p=>({...p,categories:[...p.categories,{id:uid(),name:nm.trim(),color:cor}]}));setNm('');}
  function del(id){setSt(p=>({...p,categories:p.categories.filter(c=>c.id!==id)}));}
  function ren(id,name){setSt(p=>({...p,categories:p.categories.map(c=>c.id===id?{...c,name}:c)}));}
  function setCatColor(id,color){setSt(p=>({...p,categories:p.categories.map(c=>c.id===id?{...c,color}:c)}));}
  return<div>
    <div className="cfg-t">Categorias de tarefas</div>
    {st.categories.map(c=><div key={c.id}className="fc g8"style={{padding:'8px 10px',background:'var(--card)',border:'1px solid var(--bd)',borderRadius:'var(--r)',marginBottom:'6px'}}>
      <div style={{width:14,height:14,borderRadius:'50%',background:c.color,flexShrink:0}}/>
      <input value={c.name}onChange={e=>ren(c.id,e.target.value)}style={{flex:1,padding:'4px 8px',fontSize:'.82rem'}}/>
      <select value={c.color}onChange={e=>setCatColor(c.id,e.target.value)}style={{width:'auto',padding:'4px 6px',fontSize:'.72rem'}}>
        {COLS.map(col=><option key={col}value={col}style={{background:col}}>{col}</option>)}
      </select>
      <button className="btn-ic"style={{color:'var(--er)'}}onClick={()=>del(c.id)}>🗑</button>
    </div>)}
    <div className="fc g8 mt8">
      <input value={nm}onChange={e=>setNm(e.target.value)}onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();add();}}}placeholder="Nova categoria..."style={{flex:1}}/>
      <select value={cor}onChange={e=>setCor(e.target.value)}style={{width:'auto',padding:'8px 6px'}}>
        {COLS.map(c=><option key={c}value={c}>{c}</option>)}

  </div>;

function CfgDados({st,setSt}){
  function exp(){
    const blob=new Blob([JSON.stringify(st,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='segundo-cerebro-backup.json';a.click();
  }
  function imp(){
    const i=document.createElement('input');i.type='file';i.accept='.json';
    i.onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=ev=>{
        try{
          const data=JSON.parse(ev.target.result);
          if(window.confirm('Mesclar com dados existentes? (Cancelar = substituir tudo)'))setSt(p=>mergeDeep(p,data));
          else setSt(data);
        }catch(err){alert('Arquivo inválido.');}
      };r.readAsText(f);
    };i.click();
  }
  function expTxt(){
    const td=TODAY();const mk=td.slice(0,7);
    const lines=[
      `SEGUNDO CÉREBRO — Resumo ${new Date().toLocaleDateString('pt-BR')}`,
      `Usuário: ${st.user.name}`,'',' HÁBITOS ATIVOS:',
      ...st.habits.filter(h=>h.active).map(h=>{
        let n=0;for(let d=1;d<=31;d++){const ds=`${mk}-${String(d).padStart(2,'0')}`;if(st.habitLog[ds]?.[h.id])n++;}
        return`  ${h.emoji} ${h.name}: ${n}/${h.monthlyGoal} dias`;
      }),'',
      ' TAREFAS DO MÊS:',`  Total: ${st.tasks.filter(t=>t.date.startsWith(mk)).length}`,`  Concluídas: ${st.tasks.filter(t=>t.date.startsWith(mk)&&t.done).length}`,
    ];
    const blob=new Blob([lines.join('\n')],{type:'text/plain'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`cerebro-${mk}.txt`;a.click();
  }
  function reset(){
    if(window.confirm('Resetar TODOS os dados? Isso não pode ser desfeito.')&&window.confirm('Tem ABSOLUTA certeza?')){
      setSt(makeInit());localStorage.removeItem('sc-v3');
    }
  }
  return<div>
    <div className="cfg-s">
      <div className="cfg-t">Exportar / Importar</div>
      <div className="flex col g8">
        <button className="btn btn-ac"onClick={exp}>⬇ Exportar todos os dados (JSON)</button>
        <button className="btn btn-gh"onClick={imp}>⬆ Importar dados (JSON)</button>
        <button className="btn btn-gh"onClick={expTxt}>📄 Exportar resumo do mês (TXT)</button>
      </div>
    </div>
    <div className="cfg-s">
      <div className="cfg-t">Zona de perigo</div>
      <button className="btn-er"onClick={reset}>🗑 Resetar app</button>
    </div>
  </div>;
}

  const sway0=useRef(performance.now());

  const l=Math.round((1-pos)*100), r=100-l;
  const centered=Math.abs(pos-0.5)<0.06;

  const fromClientX=cx=>{
    const rect=trackRef.current.getBoundingClientRect();
    setPos(Math.max(0,Math.min(1,(cx-rect.left)/rect.width)));
  };

  useEffect(()=>{
    const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    const onMove=e=>{ if(dragging.current) fromClientX(e.clientX); };
    const onUp=()=>{ if(dragging.current){ dragging.current=false; setStateLbl('arraste o ponto'); } };
    const onTMove=e=>{ if(dragging.current) fromClientX(e.touches[0].clientX); };
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
    window.addEventListener('touchmove',onTMove,{passive:true});
    window.addEventListener('touchend',onUp);
    let raf;
    const loop=t=>{
      if(idle.current && !dragging.current && !reduce){
        setPos(0.5+Math.sin((t-sway0.current)/1400)*0.16);
      }
      raf=requestAnimationFrame(loop);
    };
    if(!reduce) raf=requestAnimationFrame(loop);
    return()=>{
      window.removeEventListener('mousemove',onMove);
      window.removeEventListener('mouseup',onUp);
      window.removeEventListener('touchmove',onTMove);
      window.removeEventListener('touchend',onUp);
      if(raf)cancelAnimationFrame(raf);
    };
  },[]);

  const startDrag=cx=>{ idle.current=false; dragging.current=true; setStateLbl('solte pra fixar'); fromClientX(cx); };
  const center=()=>{
    idle.current=false;
    const start=pos, dur=420, t0=performance.now();
    const anim=t=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); setPos(start+(0.5-start)*e); if(k<1)requestAnimationFrame(anim); };
    requestAnimationFrame(anim);
  };

  return<div className="meter">
    <div className="meter-head"><span>Centro de gravidade</span><span className="lbl">{stateLbl}</span></div>
    <div className="track"ref={trackRef}onMouseDown={e=>startDrag(e.clientX)}onTouchStart={e=>startDrag(e.touches[0].clientX)}>
      <div className="base-line"></div>
      <div className="tick"style={{left:'12.5%'}}></div>
      <div className="tick"style={{left:'25%'}}></div>
      <div className="tick"style={{left:'37.5%'}}></div>
      <div className="tick center"style={{left:'50%'}}></div>
      <div className="tick"style={{left:'62.5%'}}></div>
      <div className="tick"style={{left:'75%'}}></div>
      <div className="tick"style={{left:'87.5%'}}></div>
      <div className="foot-lbl l">PÉ ESQ.</div>
      <div className="foot-lbl r">PÉ DIR.</div>
      <div className={"dot"+(centered?" centered":"")}style={{left:(pos*100)+'%'}}></div>
    </div>
    <div className="meter-read">
      <div className="read-vals">ESQ <b>{l}%</b> &nbsp;·&nbsp; DIR <b>{r}%</b>{centered&&<span className="c"> — centrado</span>}</div>
      <button className="btn-center"onClick={center}>centrar</button>
    </div>
    <p className="meter-hint">Esse é o gesto que você vai treinar: sentir onde o peso está e movê-lo de propósito. Arraste e repare como o corpo "decide" o apoio. No centro, os dois pés dividem a carga.</p>
  </div>;
}

function rid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

// Junta todas as skills com o contexto da árvore (paleta, emoji, nível)
function reelsSkillPool(st,treeId){
  const pool=[];
  ((st.skilltree&&st.skilltree.trees)||[]).forEach(t=>{
    if(treeId&&treeId!=='all'&&t.id!==treeId)return;
    const pal=treePalette(t);
    (t.skills||[]).forEach(s=>{
      pool.push({
        skillId:s.id, treeId:t.id, skillNome:s.nome||'Habilidade', treeNome:t.nome||'',
        emoji:s.emoji||t.emoji||'🎯', treeEmoji:t.emoji||'🌳', pal,
        nivel:s.nivel||0, maxNivel:s.maxNivel||5, levels:s.levels||[],
      });
    });
  });
  return pool;
}

function reelClean(t){return String(t||'').replace(/[.\s]+$/,'');}
function reelMakeCard(s,tpl){
  const lv=s.levels||[];
  const maxed=s.nivel>=s.maxNivel;
  const cur=reelClean(lv[s.nivel]||'no começo dessa habilidade');
  const next=maxed?'já domina — agora é manter afiado e ensinar':reelClean(lv[s.nivel+1]||'subir mais um nível de controle');
  const ctx={...s,cur,next};
  let title=tpl.title;
  if(tpl.type==='aprendizado'&&tpl.title==='O próximo degrau'&&maxed)title='Mantém afiado';
  return{
    id:rid(),type:tpl.type,title,hook:tpl.hook||'',body:tpl.body(ctx),next,
    skillId:s.skillId,treeId:s.treeId,skillNome:s.skillNome,treeNome:s.treeNome,
    treeEmoji:s.treeEmoji,emoji:s.emoji,pal:s.pal,nivel:s.nivel,maxNivel:s.maxNivel,source:'curado',
  };
}

// pondera skills com mais espaço pra crescer (nível baixo aparece mais)
function reelWeighted(pool){
  const w=[];
  pool.forEach(s=>{const room=Math.max(1,(s.maxNivel-s.nivel)+1);for(let i=0;i<room;i++)w.push(s);});
  return w;
}
function reelGenCurated(st,n,treeId){
  const pool=reelsSkillPool(st,treeId);
  if(!pool.length)return[];
  const w=reelWeighted(pool);
  const cards=[];let lastKey='';
  for(let i=0;i<n;i++){
    const s=w[Math.floor(Math.random()*w.length)];
    let tpl,g=0;
    do{tpl=REEL_TPL[Math.floor(Math.random()*REEL_TPL.length)];g++;}while(g<6&&(s.skillId+tpl.title)===lastKey);
    lastKey=s.skillId+tpl.title;
    cards.push(reelMakeCard(s,tpl));
  }
  return cards;
}

function reelPickSkills(pool,n){
  const w=reelWeighted(pool);
  const picks=[];const used=new Set();let g=0;
  while(picks.length<Math.min(n,pool.length)&&g<300){
    g++;const s=w[Math.floor(Math.random()*w.length)];
    if(!used.has(s.skillId)){used.add(s.skillId);picks.push(s);}
  }
  return picks;
}
function reelParseJSON(raw){
  try{const t=aiStrip(raw);const a=t.indexOf('['),b=t.lastIndexOf(']');if(a<0||b<0)return null;return JSON.parse(t.slice(a,b+1));}catch(e){return null;}
}
async function reelGenAI(st,n,treeId){
  const pool=reelsSkillPool(st,treeId);
  if(!pool.length)return[];
  const byName={};pool.forEach(s=>{byName[s.skillNome.toLowerCase()]=s;});
  const picks=reelPickSkills(pool,n);
  const list=picks.map(s=>`- ${s.skillNome} (${s.treeNome}, nível ${s.nivel}/${s.maxNivel}; próximo: ${(s.levels&&s.levels[s.nivel+1])||'dominar e ensinar'})`).join('\n');
  const types=['acao','aprendizado','identidade','provocacao','gatilho','paradoxo'].join(', ');
  const prompt=`Estas são habilidades minhas que quero evoluir:\n${list}\n\nCrie cards estilo "reels" de mentalização que eu possa fazer AGORA MESMO (no ônibus, na fila, sentado), só com a mente. Tipos válidos: ${types}.\n- acao: visualização curta (filme mental, ensaio 1ª pessoa, contraste acerto-vs-erro, reviver sensação do acerto, caçar gatilho)\n- aprendizado: sacada rápida / insight\n- identidade: afirmação que ancora quem estou virando (ex.: "Eu sou alguém que...")\n- provocacao: pergunta que queima e obriga a encarar uma verdade\n- gatilho: protocolo "quando X, então Y" mental\n- paradoxo: duas verdades que parecem opostas mas coexistem\nNUNCA peça prática física (bola, espaço, equipamento, gravar vídeo). CADA card precisa ter um "hook" de 1 frase curta (até 50 chars) que prende antes do título. Responda APENAS um array JSON:\n[{"skill":"nome exato","type":"tipo","hook":"até 50 chars","title":"até 4 palavras","body":"1 a 2 frases, máx 200 chars, imperativo"}]`;
  let raw;
  try{raw=await aiCall(AI_SYS_MALANDRO,prompt,1000);}catch(e){return[];}
  const arr=reelParseJSON(raw);
  if(!Array.isArray(arr))return[];
  const allowed=new Set(['acao','aprendizado','identidade','provocacao','gatilho','paradoxo']);
  const out=[];
  arr.forEach(o=>{
    if(!o||!o.skill||!o.body)return;
    const key=String(o.skill).toLowerCase();
    const s=byName[key]||picks.find(p=>p.skillNome.toLowerCase().includes(key)||key.includes(p.skillNome.toLowerCase()));
    if(!s)return;
    const t=allowed.has(o.type)?o.type:'acao';
    out.push({
      id:rid(),type:t,
      hook:String(o.hook||'').slice(0,60),
      title:String(o.title||'Micro-passo').slice(0,42),body:String(o.body).slice(0,260),
      next:(s.levels&&s.levels[s.nivel+1])||'dominar e ensinar',
      skillId:s.skillId,treeId:s.treeId,skillNome:s.skillNome,treeNome:s.treeNome,
      treeEmoji:s.treeEmoji,emoji:s.emoji,pal:s.pal,nivel:s.nivel,maxNivel:s.maxNivel,source:'ia',
    });
  });
  return out;
}

// Árvores (categorias) com nível agregado, pra stories e filtros
function reelsTrees(st){
  return((st.skilltree&&st.skilltree.trees)||[]).filter(t=>(t.skills||[]).length).map(t=>{
    const skills=t.skills||[];
    const lvl=skills.reduce((a,s)=>a+Math.min(s.nivel||0,s.maxNivel||1),0);
    const mx=skills.reduce((a,s)=>a+(s.maxNivel||1),0);
    return{id:t.id,nome:t.nome||'Árvore',emoji:t.emoji||'🌳',pal:treePalette(t),skills,lvl,mx};
  });
}
// Segmentos de um story: skills da árvore priorizando as de nível mais baixo
function reelStorySegments(tree){
  const skills=(tree.skills||[]).slice().sort((a,b)=>(((a.nivel||0)-(a.maxNivel||5))-((b.nivel||0)-(b.maxNivel||5))));
  return skills.slice(0,6).map(s=>{
    const lv=s.levels||[],nivel=s.nivel||0,maxNivel=s.maxNivel||5,maxed=nivel>=maxNivel;
    return{
      skill:s,skillNome:s.nome||'Habilidade',emoji:s.emoji||tree.emoji,nivel,maxNivel,maxed,
      cur:reelClean(lv[nivel]||'no começo'),next:maxed?'manter afiado e ensinar':reelClean(lv[nivel+1]||'subir mais um nível'),
    };
  });
}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Segundo Cérebro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.0/babel.min.js"></script>
<!-- Firebase compat SDK (loads before Babel processes JSX) -->
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<style>
:root{
  --ac:#FF6B00;--ac1:#FF6B0022;--ac2:#FF6B0044;
  --bg:#0a0a0a;--card:#141414;--card2:#1c1c1c;--card3:#222;
  --bd:#282828;--bd2:rgba(255,255,255,.10);--bd3:rgba(255,255,255,.18);
  --tx:#f0f0f0;--tx2:#f0f0f0aa;--tx3:#f0f0f066;--tx4:#f0f0f033;
  --ok:#22c55e;--er:#ef4444;--warn:#eab308;
  --ff:'DM Sans',system-ui,sans-serif;
  --fm:'JetBrains Mono','Courier New',monospace;
  --ft:'Bebas Neue','Impact',sans-serif;
  --serif:'Cinzel','Georgia',serif;
  --fs:14px;--r:8px;--tr:.18s ease;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:var(--fs);}
body{background:var(--bg);color:var(--tx);font-family:var(--ff);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
#root{min-height:100vh;display:flex;flex-direction:column;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px;}
input,textarea,select{background:var(--card2);border:1px solid var(--bd2);color:var(--tx);padding:8px 12px;border-radius:var(--r);font-size:.875rem;width:100%;outline:none;font-family:var(--ff);transition:border-color var(--tr);resize:vertical;}
input:focus,textarea:focus,select:focus{border-color:var(--ac);}
input::placeholder,textarea::placeholder{color:var(--tx4);}
select option{background:#1a1a1a;}
button{cursor:pointer;border:none;outline:none;font-family:var(--ff);transition:all var(--tr);}
/* layout */
.flex{display:flex;}.col{flex-direction:column;}.fc{display:flex;align-items:center;}.fcb{display:flex;align-items:center;justify-content:space-between;}
.g4{gap:4px;}.g6{gap:6px;}.g8{gap:8px;}.g10{gap:10px;}.g12{gap:12px;}.g16{gap:16px;}
.g2c{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3c{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.w100{width:100%;}.mt4{margin-top:4px;}.mt8{margin-top:8px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}.mb6{margin-bottom:6px;}.mb10{margin-bottom:10px;}.mb14{margin-bottom:14px;}.mb20{margin-bottom:20px;}
/* card */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;}
/* navbar */
.navbar{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:200;}
.nav-header{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--bd);}
.nav-tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 10px;}
.nav-tabs::-webkit-scrollbar{display:none;}
.tab-btn{display:flex;align-items:center;gap:4px;padding:8px 11px;background:none;border:none;color:var(--tx2);font-size:.78rem;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer;flex-shrink:0;transition:all var(--tr);}
.tab-btn.on{color:var(--ac);border-bottom-color:var(--ac);}
.tab-btn:hover{color:var(--tx);}
/* section */
.sec{padding:14px;flex:1;animation:fu .22s ease;}
@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
/* buttons */
.btn{padding:7px 14px;border-radius:var(--r);font-size:.8rem;font-weight:700;cursor:pointer;}
.btn-ac{background:var(--ac);color:#000;border:none;}.btn-ac:hover{opacity:.85;}
.btn-gh{background:var(--card2);border:1px solid var(--bd2);color:var(--tx2);}.btn-gh:hover{color:var(--tx);border-color:var(--bd3);}
.btn-ic{background:none;border:none;color:var(--tx3);padding:4px;font-size:.95rem;border-radius:4px;}.btn-ic:hover{color:var(--tx);}
.btn-er{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#ef4444;font-size:.75rem;padding:5px 10px;border-radius:var(--r);}
/* toggle */
.tog{width:34px;height:18px;border-radius:9px;background:var(--bd2);position:relative;cursor:pointer;transition:background var(--tr);flex-shrink:0;}
.tog.on{background:var(--ac);}
.tog-th{width:12px;height:12px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left var(--tr);}
.tog.on .tog-th{left:19px;}
/* checkbox */
.chk{width:18px;height:18px;border:2px solid var(--bd2);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;}
.chk.on{background:var(--ac);border-color:var(--ac);}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .18s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border:1px solid var(--bd2);border-radius:12px;padding:20px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;}
.modal-h{font-size:1.05rem;font-weight:700;margin-bottom:16px;}
/* field */
.fld{margin-bottom:10px;}
.fld label{display:block;font-size:.7rem;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
/* priority */
.prio{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em;}
.p-alta{background:rgba(239,68,68,.14);color:#ef4444;}
.p-media{background:rgba(234,179,8,.14);color:#eab308;}
.p-baixa{background:rgba(34,197,94,.14);color:#22c55e;}
/* subtabs */
.stabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none;}
.stabs::-webkit-scrollbar{display:none;}
.stab{padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid var(--bd2);background:none;color:var(--tx2);transition:all .15s;}
.stab.on{background:var(--ac1);border-color:var(--ac2);color:var(--ac);}
/* tracker */
.trk-wrap{overflow-x:auto;padding-bottom:6px;}
.trk-cell{width:22px;height:22px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:.55rem;cursor:pointer;transition:all .12s;border:1px solid var(--bd2);flex-shrink:0;}
.trk-cell.done{border-color:transparent;}
.trk-cell.today{box-shadow:0 0 0 1px var(--ac);}
/* metric card */
.mcrd{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;}
.mval{font-family:var(--fm);font-size:1.7rem;font-weight:700;color:var(--ac);line-height:1;}
.mlbl{font-size:.68rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;margin-top:3px;}
/* prog bar */
.pbar{height:5px;background:var(--bd2);border-radius:3px;overflow:hidden;}
.pfil{height:100%;border-radius:3px;transition:width .4s ease;}
/* badge */
.badge{border-radius:10px;padding:14px 10px;text-align:center;border:1px solid var(--bd);}
.badge.locked{opacity:.3;filter:grayscale(1);}
.badge.done{border-color:var(--ac2);background:var(--ac1);}
/* config */
.cfg-s{margin-bottom:22px;}
.cfg-t{font-size:.72rem;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--bd);}
.swatch{width:26px;height:26px;border-radius:6px;cursor:pointer;transition:transform .12s;border:2px solid transparent;}
.swatch.on{transform:scale(1.25);border-color:#fff;}
/* score */
.score-n{font-family:var(--fm);font-size:2.6rem;font-weight:700;color:var(--ac);line-height:1;}
/* habit item */
.hab-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:6px;}
/* task item */
.tsk-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:6px;transition:opacity .2s;}
.tsk-row.done{opacity:.4;}
/* status btn */
.st-btn{padding:5px 9px;border-radius:5px;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .15s;}
/* section header */
.sch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sch-t{font-size:1.05rem;font-weight:700;}
/* category tag */
.cat-tag{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:4px;}
/* drop zone for obj card */
.obj-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:10px;}
/* diario entry */
.diary-e{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:10px;margin-bottom:6px;}
/* notes / anotações */
.notes-masonry{columns:2;column-gap:10px;}
.notes-masonry .note-card{break-inside:avoid;margin-bottom:10px;display:block;}
.note-card{border-radius:10px;padding:14px;border:1px solid var(--bd);cursor:pointer;transition:all .2s;position:relative;}
.note-card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.4);}
.note-pin{position:absolute;top:8px;right:8px;font-size:.85rem;opacity:.6;}
.note-title{font-weight:700;font-size:.9rem;margin-bottom:6px;line-height:1.3;}
.note-text{font-size:.8rem;color:var(--tx2);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;}
.note-item{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--tx2);padding:2px 0;}
.note-item.done{text-decoration:line-through;opacity:.5;}
.note-img{width:100%;border-radius:6px;margin-bottom:8px;max-height:180px;object-fit:cover;}
.note-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.05);}
.note-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s;}
.note-card:hover .note-actions{opacity:1;}
/* theme preset card */
.theme-card{border:2px solid var(--bd2);border-radius:10px;padding:10px;cursor:pointer;transition:all .18s;text-align:center;}
.theme-card.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac);}
.theme-prev{height:36px;border-radius:6px;margin-bottom:6px;display:flex;align-items:flex-end;padding:4px;gap:3px;}
.theme-dot{width:10px;height:10px;border-radius:50%;}
/* skill tree — templo RPG premium (navy + ouro) */
.st-screen{background:linear-gradient(180deg,#0B1522,#13263D 55%,#0B1522);}
.st-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:14px;}
.st-chips::-webkit-scrollbar{display:none;}
.st-chip{display:flex;align-items:center;gap:6px;padding:7px 15px;border-radius:4px;font-family:var(--serif);font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;cursor:pointer;background:#1D314A;border:1px solid #2B394C;color:#5C6B7C;transition:all .2s;flex-shrink:0;}
.st-panel{position:relative;overflow:hidden;border-radius:6px;padding:16px 18px;margin-bottom:20px;background:linear-gradient(135deg,#1D314A,#13263D);}
.st-title{font-family:var(--serif);font-weight:900;letter-spacing:.13em;text-transform:uppercase;line-height:1.05;}
.st-sub{font-family:var(--serif);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:#5C6B7C;margin-top:6px;}
.st-label{font-family:var(--serif);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:#5C6B7C;}
.skill-tree-body{position:relative;padding:16px 0 6px;}
.skill-spine{position:absolute;top:8px;bottom:8px;left:50%;width:2px;transform:translateX(-50%);z-index:0;}
.skill-tier{position:relative;display:flex;justify-content:center;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:0 0 34px;z-index:1;}
.skill-tier:last-child{margin-bottom:8px;}
.skill-node{position:relative;width:76px;display:flex;flex-direction:column;align-items:center;cursor:pointer;flex-shrink:0;transition:transform .15s;z-index:1;}
.skill-node:hover{transform:translateY(-2px) scale(1.05);}
.skill-halo{position:absolute;width:90px;height:90px;border-radius:50%;left:50%;top:35px;transform:translate(-50%,-50%);z-index:0;filter:blur(10px);pointer-events:none;}
.skill-laurel{position:absolute;width:88px;height:88px;left:50%;top:35px;transform:translate(-50%,-50%);z-index:0;pointer-events:none;}
.skill-frame{position:relative;width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:1;}
.skill-studs{position:absolute;inset:0;border-radius:50%;z-index:2;pointer-events:none;}
.skill-ring{position:relative;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:3;}
.skill-core{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.38rem;}
.skill-badge{margin-top:7px;font-family:var(--serif);font-size:.6rem;font-weight:700;letter-spacing:.05em;padding:1px 9px;border-radius:3px;line-height:1.5;white-space:nowrap;}
.skill-name{margin-top:4px;font-family:var(--serif);font-size:.58rem;letter-spacing:.03em;text-align:center;line-height:1.2;max-width:70px;}
/* responsive */
@media(max-width:500px){
  .g3c{grid-template-columns:1fr 1fr;}
  .tab-btn{padding:8px 9px;font-size:.72rem;}
  .notes-masonry{columns:1;}
}

/* ===================== EIXO — Protocolo de Transferência de Peso ===================== */
.eixo{
  --bg:#14110D;--bg-2:#1A1611;--surface:#211C16;--surface-2:#2A241B;
  --line:#342D22;--line-soft:#28221A;--bone:#EDE4D3;--bone-dim:#B6AB98;--muted:#83786A;
  --fire:#FF5436;--fire-dim:#C9472F;--euca:#5FB8A6;--euca-dim:#3E7E72;
  --eradius:14px;--emaxw:880px;
  background:var(--bg);color:var(--bone);
  font-family:'Hanken Grotesk',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;
  border-radius:16px;padding:6px 18px 36px;
}
.eixo *{box-sizing:border-box;margin:0;padding:0}
.eixo .wrap{max-width:var(--emaxw);margin:0 auto}
/* HERO */
.eixo header{padding:34px 0 24px}
.eixo .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.eixo .eyebrow b{color:var(--fire);font-weight:700}
.eixo h1.brand{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(52px,15vw,104px);line-height:.84;letter-spacing:.01em;text-transform:uppercase}
.eixo h1.brand span{color:var(--fire)}
.eixo .tagline{margin-top:18px;max-width:480px;color:var(--bone-dim);font-size:15.5px}
.eixo .tagline em{color:var(--bone);font-style:normal;font-weight:600}
/* BALANCE METER */
.eixo .meter{margin:30px 0 6px;background:linear-gradient(180deg,var(--surface) 0%,var(--bg-2) 100%);border:1px solid var(--line);border-radius:var(--eradius);padding:24px 22px 20px;user-select:none}
.eixo .meter-head{display:flex;justify-content:space-between;align-items:baseline;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:20px}
.eixo .meter-head .lbl{color:var(--bone-dim)}
.eixo .track{position:relative;height:70px;cursor:grab;touch-action:none}
.eixo .track:active{cursor:grabbing}
.eixo .base-line{position:absolute;left:0;right:0;top:50%;height:2px;background:linear-gradient(90deg,var(--fire) 0%,var(--line) 50%,var(--euca) 100%);opacity:.5;transform:translateY(-50%)}
.eixo .tick{position:absolute;top:50%;width:1px;height:14px;background:var(--line);transform:translateY(-50%)}
.eixo .tick.center{height:24px;background:var(--bone-dim);opacity:.6}
.eixo .foot-lbl{position:absolute;top:0;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--bone-dim)}
.eixo .foot-lbl.l{left:0}
.eixo .foot-lbl.r{right:0;text-align:right}
.eixo .dot{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,var(--fire) 55%,var(--fire-dim) 100%);box-shadow:0 0 0 6px rgba(255,84,54,.14),0 8px 22px rgba(255,84,54,.28);transition:box-shadow .25s ease}
.eixo .dot.centered{background:radial-gradient(circle at 35% 30%,#fff 0%,var(--euca) 55%,var(--euca-dim) 100%);box-shadow:0 0 0 6px rgba(95,184,166,.16),0 8px 22px rgba(95,184,166,.3)}
.eixo .meter-read{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.eixo .read-vals{font-family:'Space Mono',monospace;font-size:13px;color:var(--bone-dim)}
.eixo .read-vals b{color:var(--bone);font-weight:700}
.eixo .read-vals .c{color:var(--euca)}
.eixo .btn-center{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;background:transparent;color:var(--bone-dim);border:1px solid var(--line);border-radius:30px;padding:8px 16px;cursor:pointer;transition:border-color .2s,color .2s}
.eixo .btn-center:hover{border-color:var(--euca-dim);color:var(--euca)}
.eixo .meter-hint{margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.5}
/* STATS */
.eixo .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:32px 0 8px}
.eixo .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--eradius);padding:18px 16px}
.eixo .stat .num{font-family:'Space Mono',monospace;font-size:34px;font-weight:700;line-height:1;color:var(--fire)}
.eixo .stat .num.euca{color:var(--euca)}
.eixo .stat .cap{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:10px}
/* HEATMAP */
.eixo .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--eradius);padding:22px 20px;margin:14px 0}
.eixo .panel-title{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-dim);margin-bottom:18px}
.eixo .grid-days{display:grid;grid-template-columns:repeat(14,1fr);gap:6px}
.eixo .cell{aspect-ratio:1;border-radius:5px;background:var(--surface-2);border:1px solid var(--line-soft);transition:transform .15s;cursor:pointer}
.eixo .cell.done{background:var(--fire);border-color:var(--fire);box-shadow:0 0 10px rgba(255,84,54,.3)}
.eixo .cell.today{outline:2px solid var(--bone-dim);outline-offset:1px}
.eixo .cell.today.done{outline-color:var(--bone)}
.eixo .cell:hover{transform:scale(1.18)}
/* LOG BUTTON */
.eixo .log-row{display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}
.eixo .btn-log{flex:1;min-width:220px;font-family:'Anton',sans-serif;font-size:18px;letter-spacing:.04em;text-transform:uppercase;background:var(--fire);color:#1a0d09;border:none;border-radius:12px;padding:16px 22px;cursor:pointer;transition:transform .12s,background .2s,box-shadow .2s;box-shadow:0 6px 20px rgba(255,84,54,.22)}
.eixo .btn-log:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(255,84,54,.34)}
.eixo .btn-log:active{transform:translateY(0)}
.eixo .btn-log.done{background:transparent;color:var(--euca);border:1px solid var(--euca-dim);box-shadow:none}
.eixo .btn-log.done:hover{box-shadow:0 0 0 1px var(--euca-dim)}
.eixo .log-note{font-size:12.5px;color:var(--muted);max-width:260px}
/* PHASES */
.eixo .section-head{margin:48px 0 22px}
.eixo .section-head .kick{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--fire);margin-bottom:12px}

const AI_CFG_KEY='sc-ai-cfg';
function aiLoadCfg(){try{const s=localStorage.getItem(AI_CFG_KEY);return s?JSON.parse(s):null;}catch{return null;}}
function aiSaveCfg(c){localStorage.setItem(AI_CFG_KEY,JSON.stringify(c));}
function aiClearCfg(){localStorage.removeItem(AI_CFG_KEY);}
function aiReady(){const c=aiLoadCfg();return !!(c&&c.key);}
async function aiCall(system,prompt,maxTokens){
  const c=aiLoadCfg();
  if(!c||!c.key)throw new Error('IA não configurada');
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:c.model||'claude-3-5-haiku-latest',max_tokens:maxTokens||300,system:system||'',messages:[{role:'user',content:prompt}]}),
  });
  if(!res.ok){let m='';try{m=(await res.json()).error?.message||'';}catch(e){}throw new Error('IA '+res.status+(m?': '+m:''));}
  const data=await res.json();
  return((data.content&&data.content[0]&&data.content[0].text)||'').trim();
}

const FB_CFG_KEY='sc-fb-cfg';
let _fbApp=null,_fbAuth=null,_fbDb=null;

function fbLoadCfg(){try{const s=localStorage.getItem(FB_CFG_KEY);return s?JSON.parse(s):null;}catch{return null;}}
function fbSaveCfg(cfg){localStorage.setItem(FB_CFG_KEY,JSON.stringify(cfg));}
function fbClearCfg(){localStorage.removeItem(FB_CFG_KEY);}

function fbInit(cfg){
  try{
    if(_fbApp){
      // Already initialized — check if same config
      return true;
    }
    _fbApp=firebase.initializeApp(cfg,'cerebro');
    _fbAuth=firebase.auth(_fbApp);
    _fbDb=firebase.firestore(_fbApp);
    return true;
  }catch(e){
    console.error('Firebase init error:',e);
    _fbApp=null;_fbAuth=null;_fbDb=null;
    return false;
  }
}

function fbReady(){return !!(_fbAuth&&_fbDb);}

async function fbSignIn(){
  if(!_fbAuth)throw new Error('Firebase não inicializado');
  const p=new firebase.auth.GoogleAuthProvider();
  return _fbAuth.signInWithPopup(p);
}

async function fbSignOut(){
  if(!_fbAuth)return;
  return _fbAuth.signOut();
}

function fbOnAuth(cb){
  if(!_fbAuth)return ()=>{};
  return _fbAuth.onAuthStateChanged(cb);
}

async function fbPush(uid,state){
  if(!_fbDb)return;
  await _fbDb.collection('cerebro').doc(uid).set({
    data:JSON.stringify(state),
    updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
  });
}

async function fbPull(uid){
  if(!_fbDb)return null;
  const doc=await _fbDb.collection('cerebro').doc(uid).get();
  if(!doc.exists)return null;
  const raw=doc.data()?.data;
  return raw?JSON.parse(raw):null;
}

// Garante que abas novas sempre aparecem após updates (evita sumir ao sincronizar)
function sanitizeTabs(state){
  if(!state?.config?.tabs)return state;
  const existing=new Set(state.config.tabs.map(t=>t.id));
  const missing=DEF_TABS.filter(t=>!existing.has(t.id));
  if(!missing.length)return state;
  const tabs=[...state.config.tabs];
  const cfgIdx=tabs.findIndex(t=>t.id==='config');
  if(cfgIdx>=0)tabs.splice(cfgIdx,0,...missing);
  else tabs.push(...missing);
  return{...state,config:{...state.config,tabs}};
}

// Migra dados antigos da skill tree (renomeia Dança→Molho, aplica paletas novas)
function sanitizeSkilltree(state){
  if(!state||!state.skilltree||!Array.isArray(state.skilltree.trees))return state;
  let changed=false;
  // garante objeto de estilo
  let style=state.skilltree.style;
  const mergedStyle={...DEF_STYLE,...(style||{})};
  if(!style||Object.keys(DEF_STYLE).some(k=>mergedStyle[k]!==style[k])){style=mergedStyle;changed=true;}
  // mapa dos defaults p/ backfill de subcategorias
  const defMap={};
  DEF_SKILLTREES.forEach(t=>{const sk={};(t.skills||[]).forEach(s=>{sk[s.id]=s.subcat;});defMap[t.id]={subcats:t.subcats,skills:sk};});
  const trees=state.skilltree.trees.map(t=>{
    let nt=t;
    if(t.id==='danca'&&t.nome==='Dança'){nt={...nt,nome:'Molho'};changed=true;}
    // Futevôlei: vermelho antigo → rosa
    if(t.id==='futevolei'&&t.destaque==='#D94747'){nt={...nt,destaque:'#FF6EB3',secundaria:'#A02E6E',cor:'#FF6EB3'};changed=true;}
    if(!nt.destaque&&SKILL_PALETTES[nt.id]){nt={...nt,destaque:SKILL_PALETTES[nt.id].d,secundaria:SKILL_PALETTES[nt.id].s,cor:SKILL_PALETTES[nt.id].d};changed=true;}
    // substituir árvore de futebol antiga (IDs fb1-fb12) pela nova estrutura FUNDAMENTOS/MENTAL/FREESTYLE
    if(t.id==='futebol'&&t.skills&&t.skills.some(s=>/^fb\d+$/.test(s.id))){const def=DEF_SKILLTREES.find(d=>d.id==='futebol');if(def){nt={...def,skills:def.skills.map(s=>({...s}))};changed=true;}}
    // backfill de subcategorias (colunas) em dados antigos
    const def=defMap[nt.id];
    if((!nt.subcats||!nt.subcats.length)){
      if(def&&def.subcats){nt={...nt,subcats:def.subcats.map(x=>({...x}))};changed=true;}
      else{nt={...nt,subcats:[{id:'geral',nome:'Geral'}]};changed=true;}
    }
    // backfill do subcat de cada skill
    if(nt.skills&&nt.skills.some(s=>!s.subcat)){
      const firstSub=(nt.subcats&&nt.subcats[0]&&nt.subcats[0].id)||'geral';
      nt={...nt,skills:nt.skills.map(s=>{
        if(s.subcat)return s;
        const fromDef=def&&def.skills&&def.skills[s.id];
        return{...s,subcat:fromDef||firstSub};
      })};
      changed=true;
    }
    return nt;
  });
  if(!changed)return state;
  return{...state,skilltree:{...state.skilltree,trees,style}};
}

function loadSt(){
  try{
    const s=localStorage.getItem('sc-v3');
    if(s){
      const p=JSON.parse(s);
      return sanitizeSkilltree(sanitizeTabs(mergeDeep(makeInit(),p)));
    }
  }catch(e){}
  return makeInit();
}
function mergeDeep(target,source){
  const out={...target};
  for(const k in source){
    if(source[k]&&typeof source[k]==='object'&&!Array.isArray(source[k])){
      out[k]=mergeDeep(target[k]||{},source[k]);
    }else{
      out[k]=source[k];
    }
  }
  return out;
}

// ── SCORE UTILS ──────────────────────────────────────────────────────────────

function getDayScore(st,dateStr){
  const tasks=st.tasks.filter(t=>t.date===dateStr&&t.done);
  const log=st.habitLog[dateStr]||{};
  const tScore=tasks.reduce((s,t)=>s+t.weight,0);
  const hScore=st.habits.reduce((s,h)=>log[h.id]?s+h.weight:s,0);
  if(st.config.scoreFormula==='weighted'){
    const hw=st.config.habitWeight/100;
    return Math.round(hScore*hw+tScore*(1-hw));
  }
  return tScore+hScore;
}
function getMonthScores(st,year,month){
  const days=daysInMonth(year,month);
  const mk=monthKey(year,month);
  return Array.from({length:days},(_,i)=>{
    const d=i+1;
    const ds=`${mk}-${String(d).padStart(2,'0')}`;
    return{day:d,score:getDayScore(st,ds),date:ds,isToday:ds===TODAY()};
  });
}

const XP_PER_SKILL_LEVEL=50; // cada nível de habilidade na Skill Tree vale isso
// XP é EXCLUSIVAMENTE da Skill Tree (que já é o resultado das tarefas e hábitos)
// 100 níveis — curva crescente gerada automaticamente
const LEVEL_XP=(()=>{const a=[0];let x=0;for(let n=1;n<100;n++){x+=60+8*(n-1);a.push(x);}return a;})();
const MAX_LEVEL=LEVEL_XP.length; // 100
function roman(n){const m=[['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]];let r='';for(const[s,v]of m){while(n>=v){r+=s;n-=v;}}return r;}

function calcSkillLevels(st){
  let n=0;
  ((st.skilltree&&st.skilltree.trees)||[]).forEach(t=>(t.skills||[]).forEach(s=>{n+=Math.min(s.nivel||0,s.maxNivel||1);}));
  return n;
}
function calcSkillXP(st){return calcSkillLevels(st)*XP_PER_SKILL_LEVEL;}
function calcTotalXP(st){return calcSkillXP(st);}
function classForLevel(lvl){let c=CLASSES[0];for(const x of CLASSES){if(lvl>=x.minLevel)c=x;}return c;}
function getLevelInfo(xp){
  let lvl=1;
  for(let i=0;i<LEVEL_XP.length;i++){if(xp>=LEVEL_XP[i])lvl=i+1;else break;}
  const cls=classForLevel(lvl);
  const sub=Math.max(1,lvl-cls.minLevel+1);
  const curXp=LEVEL_XP[lvl-1];
  const nextXp=lvl<MAX_LEVEL?LEVEL_XP[lvl]:null;
  return{lvl,cls,sub,curXp,nextXp};
}

function ClassAvatar({cls,locked,size,baseImg,mini}){
  const s=size||80;
  const c=cls.cor,c2=cls.cor2||cls.cor,skin='#caa07a',a=cls.av||{};

  // Bloqueado = silhueta escura (surpresa até desbloquear).
  const img=cls.img||CLASS_IMAGES[cls.id]||baseImg||BASE_MALANDRO_IMG;

    const tier=(cls.id||1)-1;            // 0..4

// ── APPLY THEME ──────────────────────────────────────────────────────────────

function applyTheme(config){
  const r=document.documentElement.style;
  const theme=THEMES.find(t=>t.id===config.themeId)||THEMES[0];
  const ac=config.accentOverride||theme.ac;
  r.setProperty('--ac',ac);
  r.setProperty('--ac1',ac+'22');
  r.setProperty('--ac2',ac+'44');
  r.setProperty('--bg',theme.bg);
  r.setProperty('--card',theme.card);
  r.setProperty('--card2',theme.card2);
  r.setProperty('--bd',theme.bd);
  // Layered borders: progressively more visible (white overlay on dark bg)
  r.setProperty('--bd2','rgba(255,255,255,0.10)');
  r.setProperty('--bd3','rgba(255,255,255,0.18)');
  // Text color
  const tx=config.textColor||'#f0f0f0';
  r.setProperty('--tx',tx);
  r.setProperty('--tx2',tx+'aa');
  r.setProperty('--tx3',tx+'66');
  r.setProperty('--tx4',tx+'33');
  const fs={small:'13px',medium:'14px',large:'15px'};
  r.setProperty('--fs',fs[config.fontSize]||'14px');
}

function LineChart({data,accent}){
  const W=560,H=110,PAD={t:22,b:18,l:4,r:4};
  const cW=W-PAD.l-PAD.r,cH=H-PAD.t-PAD.b;
  const max=Math.max(...data.map(d=>d.score),1);
  const pts=data.map((d,i)=>({
    x:PAD.l+(i/(data.length-1||1))*cW,
    y:PAD.t+cH-(d.score/max)*cH,
    ...d
  }));
  // Smooth bezier path
  function curve(pts){
    if(pts.length<2)return pts.length?`M${pts[0].x},${pts[0].y}`:'';
    let d=`M${pts[0].x},${pts[0].y}`;
    for(let i=0;i<pts.length-1;i++){
      const cx=(pts[i].x+pts[i+1].x)/2;
      d+=` C${cx},${pts[i].y} ${cx},${pts[i+1].y} ${pts[i+1].x},${pts[i+1].y}`;
    }
    return d;
  }
  const linePath=curve(pts);
  const areaPath=linePath+` L${pts[pts.length-1].x},${PAD.t+cH} L${pts[0].x},${PAD.t+cH} Z`;
  const gid='lg'+accent.replace('#','');
  // Mostra score em dias-chave: hoje + a cada 3 dias (evita sobreposição)
  const showLabel=(i)=>data[i].isToday||i===0||i===data.length-1||i%3===2;
  return<svg viewBox={`0 0 ${W} ${H}`}style={{width:'100%',height:'auto',display:'block',overflow:'visible'}}>
    <defs>
      <linearGradient id={gid}x1="0"y1="0"x2="0"y2="1">
        <stop offset="0%"stopColor={accent}stopOpacity="0.35"/>
        <stop offset="100%"stopColor={accent}stopOpacity="0"/>
      </linearGradient>
    </defs>
    {/* Area fill */}
    <path d={areaPath}fill={`url(#${gid})`}/>
    {/* Line */}
    <path d={linePath}fill="none"stroke={accent}strokeWidth="2"strokeLinecap="round"strokeLinejoin="round"/>
    {/* Data points + labels */}
    {pts.map((p,i)=>{
      const isT=data[i].isToday;
      return<g key={i}>
        <circle cx={p.x}cy={p.y}r={isT?4:data[i].score>0?2:1.5}fill={isT?accent:data[i].score>0?accent+'aa':'var(--bd2)'}stroke={isT?'#fff':'none'}strokeWidth={isT?1.5:0}/>
        {showLabel(i)&&data[i].score>0&&<text x={p.x}y={p.y-6}textAnchor="middle"fontSize="8"fontFamily="var(--fm)"fontWeight={isT?'700':'400'}fill={isT?accent:accent+'bb'}>{data[i].score}</text>}
      </g>;
    })}
  </svg>;
}

// ── GRÁFICO DE BARRAS ────────────────────────────────────────────────────────

function BarChart({data,accent}){
  const W=560,H=130,PAD={t:24,b:16,l:4,r:4};
  const cW=W-PAD.l-PAD.r,cH=H-PAD.t-PAD.b;
  const max=Math.max(...data.map(d=>d.score),1);
  const slot=cW/data.length;
  const barW=Math.max(slot*0.72,2);
  return<svg viewBox={`0 0 ${W} ${H}`}style={{width:'100%',height:'auto',display:'block'}}>
    {data.map((d,i)=>{
      const x=PAD.l+i*slot+(slot-barW)/2;
      const barH=Math.max((d.score/max)*cH,d.score>0?2:0);
      const y=PAD.t+cH-barH;
      const isT=d.isToday;
      // Mostra número do dia em todos os dias (a cada 2 se muito cheio)
      const showDay=data.length<=20||(i%2===0)||isT;
      return<g key={i}>
        <rect x={x}y={y}width={barW}height={Math.max(barH,1)}rx={2}
          fill={d.score===0?'var(--bd)':isT?accent:accent+'99'}
          style={{transition:'height .3s,y .3s'}}/>
        {/* Dia no rodapé */}
        {showDay&&<text x={x+barW/2}y={H-2}textAnchor="middle"fontSize="6.5"fontFamily="var(--fm)"fill={isT?accent:'var(--tx3)'}>{d.day}</text>}
        {/* Score real no topo de cada barra com dado */}
        {d.score>0&&<text x={x+barW/2}y={y-3}textAnchor="middle"fontSize="7"fontFamily="var(--fm)"fontWeight={isT?'700':'400'}fill={isT?accent:accent+'cc'}>{d.score}</text>}
      </g>;
    })}
    {/* Linha tracejada do dia de hoje */}
    {data.map((d,i)=>{
      if(!d.isToday)return null;
      const x=PAD.l+i*slot+(slot-barW)/2+barW/2;
      return<line key="tl"x1={x}y1={PAD.t}x2={x}y2={PAD.t+cH}stroke={accent}strokeWidth="1"strokeDasharray="3,3"opacity="0.35"/>;
    })}
  </svg>;
}

// ── HEATMAP CALENDÁRIO ────────────────────────────────────────────────────────

function HeatmapChart({data,accent,yr,mo}){
  const firstDow=new Date(yr,mo-1,1).getDay();
  const max=Math.max(...data.map(d=>d.score),1);
  const CELL=30,GAP=4;
  const rows=Math.ceil((firstDow+data.length)/7);
  const W=7*(CELL+GAP)-GAP,H=16+rows*(CELL+GAP);
  const DLBL=['D','S','T','Q','Q','S','S'];
  function cellColor(score){
    if(score===0)return null;
    const p=score/max;
    return p>0.75?accent:p>0.45?accent+'bb':p>0.2?accent+'77':accent+'44';
  }
  return<svg viewBox={`0 0 ${W} ${H}`}style={{width:'100%',height:'auto',display:'block'}}>
    {/* Day-of-week headers */}
    {DLBL.map((l,i)=><text key={i}x={i*(CELL+GAP)+CELL/2}y={10}textAnchor="middle"fontSize="8"fontFamily="var(--fm)"fill="var(--tx3)">{l}</text>)}
    {/* Empty cells before day 1 */}
    {Array.from({length:firstDow},(_,i)=>{
      const col=i%7,row=Math.floor(i/7);
      return<rect key={`e${i}`}x={col*(CELL+GAP)}y={14+row*(CELL+GAP)}width={CELL}height={CELL}rx={5}fill="var(--card2)"opacity="0.3"/>;
    })}
    {/* Day cells */}
    {data.map((d,i)=>{
      const pos=firstDow+i;
      const col=pos%7,row=Math.floor(pos/7);
      const x=col*(CELL+GAP),y=14+row*(CELL+GAP);
      const isT=d.isToday;
      const bg=cellColor(d.score)||'var(--card2)';
      const pct=Math.round((d.score/max)*100);
      return<g key={i}>
        <rect x={x}y={y}width={CELL}height={CELL}rx={5}fill={bg}
          stroke={isT?accent:'none'}strokeWidth={isT?2:0}/>
        <text x={x+CELL/2}y={y+CELL/2-3}textAnchor="middle"fontSize="8"fontFamily="var(--fm)"
          fill={d.score>0?'#fff':'var(--tx3)'}fontWeight={isT?'700':'400'}>{d.day}</text>
        {d.score>0&&<text x={x+CELL/2}y={y+CELL/2+8}textAnchor="middle"fontSize="7.5"fontFamily="var(--fm)"fontWeight="700"
          fill="rgba(255,255,255,0.85)">{d.score}</text>}
      </g>;
    })}
  </svg>;
}

// ── 🧬 ANÁLISE DO SISTEMA (surpresa) ─────────────────────────────────────────

function InsightCard({st,yr,mo}){
  const td=TODAY();
  const mk=monthKey(yr,mo);
  const totalDays=daysInMonth(yr,mo);
  const scores=getMonthScores(st,yr,mo);
  const now=new Date();

  // Hábito mais forte e mais fraco do mês
  const habProg=st.habits.filter(h=>h.active).map(h=>{
    let done=0;
    for(let d=1;d<=totalDays;d++){
      const ds=`${mk}-${String(d).padStart(2,'0')}`;
      if(st.habitLog[ds]?.[h.id])done++;
    }
    return{...h,done,pct:Math.round((done/Math.max(h.monthlyGoal,1))*100)};
  });
  const bestHab=[...habProg].sort((a,b)=>b.pct-a.pct)[0];
  const worstHab=[...habProg].sort((a,b)=>a.pct-b.pct)[0];

  // Melhor dia da semana
  const dowBucket=Array(7).fill(null).map(()=>({t:0,n:0}));
  scores.forEach(d=>{
    if(d.score>0){const dow=new Date(d.date+'T12:00:00').getDay();dowBucket[dow].t+=d.score;dowBucket[dow].n++;}
  });
  const dowAvg=dowBucket.map(b=>b.n>0?b.t/b.n:0);
  const bestDow=dowAvg.indexOf(Math.max(...dowAvg));
  const worstDow=dowAvg.indexOf(Math.min(...dowAvg.map((v,i)=>dowAvg[bestDow]>0&&v===0?99:v)));

  // Sequência atual
  let streak=0;
  for(let i=0;i<60;i++){
    const d=new Date(now);d.setDate(now.getDate()-i);
    const ds=localDateStr(d);
    if(getDayScore(st,ds)>0)streak++;else break;
  }

  // Tendência últimos 7 dias vs 7 anteriores
  const todayNum=now.getDate();
  const last7=scores.slice(Math.max(todayNum-7,0),todayNum);
  const prev7=scores.slice(Math.max(todayNum-14,0),Math.max(todayNum-7,0));
  const avg7=d=>{const a=d.filter(x=>x.score>0);return a.length?a.reduce((s,x)=>s+x.score,0)/a.length:0;};
  const la=avg7(last7),pa=avg7(prev7);
  const trend=pa>0?(la>pa*1.1?'up':la<pa*0.9?'down':'igual'):'novo';
  const trendPct=pa>0?Math.round(Math.abs(la-pa)/pa*100):0;

  // Consistência geral do mês
  const daysActive=scores.filter(d=>d.score>0).length;
  const daysUntilToday=Math.min(todayNum,totalDays);
  const consistency=Math.round((daysActive/Math.max(daysUntilToday,1))*100);

  // Gera insights
  const insights=[];
  if(streak>=7)insights.push({e:'🏆',t:`Sequência lendária de ${streak} dias! Você é imparável.`,c:'#f59e0b'});
  else if(streak>=3)insights.push({e:'🔥',t:`Sequência de ${streak} dias — o sistema está vivo. Não quebre.`,c:'#f97316'});
  else if(streak===1)insights.push({e:'⚡',t:'Você voltou hoje. Um dia de volta vale mais que mil planos.',c:'var(--ac)'});

  if(trend==='up')insights.push({e:'📈',t:`Sua performance subiu ${trendPct}% em relação à semana anterior.`,c:'#22c55e'});
  else if(trend==='down')insights.push({e:'📉',t:`Queda de ${trendPct}% vs semana passada. Hora de reconectar com o sistema.`,c:'#ef4444'});

  if(consistency>=80)insights.push({e:'🎯',t:`${consistency}% de consistência este mês — isso é elite.`,c:'#22c55e'});
  else if(consistency>=50)insights.push({e:'📅',t:`${consistency}% dos dias ativos — você está na média. Pode mais.`,c:'#eab308'});
  else if(daysUntilToday>=5)insights.push({e:'🚨',t:`Só ${consistency}% dos dias com registro — o sistema está apagado.`,c:'#ef4444'});

  if(bestHab&&bestHab.pct>=70)insights.push({e:bestHab.emoji,t:`${bestHab.name} é seu ponto forte este mês (${bestHab.pct}% da meta).`,c:'#22c55e'});
  if(worstHab&&worstHab.pct<40&&worstHab.id!==bestHab?.id)insights.push({e:worstHab.emoji,t:`${worstHab.name} está em ${worstHab.pct}% — precisa de atenção urgente.`,c:'#eab308'});

  if(dowAvg[bestDow]>0)insights.push({e:'📅',t:`${DAYS_LABEL[bestDow]} é o seu dia mais forte da semana.`,c:'var(--tx)'});

  if(insights.length===0)insights.push({e:'🧠',t:'Continue registrando seus dias para ver insights personalizados aqui.',c:'var(--tx2)'});

  return<div className="card mt14">
    <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--tx2)',marginBottom:12,textTransform:'uppercase',letterSpacing:'.07em'}}>🧬 Análise do Sistema</div>
    <div style={{display:'flex',flexDirection:'column',gap:7}}>
      {insights.map((ins,i)=><div key={i}style={{display:'flex',alignItems:'flex-start',gap:10,padding:'9px 12px',background:'var(--card2)',borderRadius:'var(--r)',border:'1px solid var(--bd)'}}>
        <span style={{fontSize:'1.05rem',flexShrink:0,lineHeight:1.4}}>{ins.e}</span>
        <span style={{fontSize:'.82rem',color:ins.c,lineHeight:1.45,fontWeight:500}}>{ins.t}</span>
      </div>)}
    </div>
  </div>;
}

function MissaoSection({st,setSt}){

  const info=getLevelInfo(totalXP);
  const cls=info.cls;
  const base=st.classBaseImg;
  const fileRef=useRef(null);
  const[imgModal,setImgModal]=useState(null);
  function handleAvatarFile(file){
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const im=new Image();
      im.onload=()=>{
        const sz=320,cv=document.createElement('canvas');cv.width=sz;cv.height=sz;
        const ctx=cv.getContext('2d');
        const scale=Math.max(sz/im.width,sz/im.height);
        const w=im.width*scale,h=im.height*scale;
        ctx.drawImage(im,(sz-w)/2,(sz-h)/2,w,h);
        try{setSt(p=>({...p,classBaseImg:cv.toDataURL('image/jpeg',0.82)}));}catch(e){}
      };
      im.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  }
  const acc=cls.cor,acc2=cls.cor2;
  const nextXp=info.nextXp;
  const xpInLvl=totalXP-info.curXp;
  const xpToNext=nextXp==null?0:nextXp-info.curXp;
  const pct=nextXp==null?100:Math.min(100,Math.round(xpInLvl/Math.max(xpToNext,1)*100));

  // Quests = habilidades ainda não dominadas (única fonte de XP). Mais perto do topo primeiro.
  const quests=[];
  ((st.skilltree&&st.skilltree.trees)||[]).forEach(t=>{const pal=treePalette(t);(t.skills||[]).forEach(s=>{if((s.nivel||0)<(s.maxNivel||1))quests.push({treeNome:t.nome,pal,skill:s});});});
  quests.sort((a,b)=>(b.skill.nivel||0)-(a.skill.nivel||0));
  const topQuests=quests.slice(0,5);

  return<div className="sec">
    {/* ── HERO: classe atual ── */}

      <div style={{position:'absolute',inset:0,background:`radial-gradient(ellipse at 80% 0%, ${acc}22, transparent 60%)`,pointerEvents:'none'}}/>
      <div className="fc g16"style={{position:'relative'}}>
        <div style={{position:'relative'}}>
          <div style={{filter:`drop-shadow(0 0 10px ${acc}88)`,cursor:'pointer'}}onClick={()=>setImgModal(cls)}><ClassAvatar cls={cls}size={94}baseImg={base}/></div>
          <button onClick={e=>{e.stopPropagation();fileRef.current&&fileRef.current.click();}}title="Definir foto do avatar"style={{position:'absolute',bottom:-2,right:-2,width:28,height:28,borderRadius:'50%',background:acc,border:'2px solid #0B1522',color:'#0B1522',cursor:'pointer',fontSize:'.8rem',display:'flex',alignItems:'center',justifyContent:'center',zIndex:5}}>📷</button>
          <input ref={fileRef}type="file"accept="image/*"onChange={e=>handleAvatarFile(e.target.files&&e.target.files[0])}style={{display:'none'}}/>
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontFamily:'var(--serif)',fontSize:'.62rem',fontWeight:700,color:acc,textTransform:'uppercase',letterSpacing:'.16em',marginBottom:4}}>Nível {info.lvl} / {MAX_LEVEL}</div>
          <div style={{fontFamily:'var(--serif)',fontWeight:900,fontSize:'1.7rem',letterSpacing:'.04em',lineHeight:1,color:acc,textShadow:`0 0 14px ${acc}55`}}>{cls.nome} {roman(info.sub)}</div>
          <div style={{fontSize:'.74rem',color:'var(--tx2)',fontStyle:'italic',marginTop:5}}>"{cls.desc}"</div>
        </div>

      <div style={{position:'relative',maxWidth:'90vw',maxHeight:'90vh',display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
        <button onClick={()=>setImgModal(null)}style={{position:'absolute',top:-32,right:0,background:'none',border:'none',color:'var(--tx2)',fontSize:'1.2rem',cursor:'pointer',zIndex:10}}>✕ Fechar</button>

        </div>
        <div style={{textAlign:'center'}}>

          <div style={{fontSize:'.75rem',color:'var(--tx2)',fontStyle:'italic'}}>{imgModal.desc}</div>
        </div>
      </div>
    </div>}
  </div>;
}

function TaskModal({open,onClose,onSave,init,cats}){
  const blank={title:'',weight:5,date:TODAY(),time:'',cat:cats[0]?.id||'',prio:'media',done:false,subtasks:[]};
  const[f,setF]=useState({...blank});
  useEffect(()=>{setF({...blank,...(init||{})});},[open]);
  const isEdit=!!(init&&init.id);
  function save(){if(!f.title.trim())return;onSave({...f,date:f.date||TODAY(),subtasks:(f.subtasks||[]).filter(s=>s.text.trim())});onClose();}
  function addSub(){setF(p=>({...p,subtasks:[...(p.subtasks||[]),{id:uid(),text:'',done:false}]}));}
  function updSub(i,v){setF(p=>({...p,subtasks:p.subtasks.map((s,idx)=>idx===i?{...s,text:v}:s)}));}
  function togSub(i){setF(p=>({...p,subtasks:p.subtasks.map((s,idx)=>idx===i?{...s,done:!s.done}:s)}));}
  function delSub(i){setF(p=>({...p,subtasks:p.subtasks.filter((_,idx)=>idx!==i)}));}
  return<Modal open={open}onClose={onClose}title={isEdit?'Editar Tarefa':'Nova Tarefa'}>
    <Fld label="Título"><input value={f.title}onChange={e=>setF(p=>({...p,title:e.target.value}))}placeholder="Ex: Estudar n8n por 1 hora"/></Fld>
    <div className="g2c">
      <Fld label="Data"><input type="date"value={f.date}onChange={e=>setF(p=>({...p,date:e.target.value}))}/></Fld>
      <Fld label="Horário (opcional)"><input type="time"value={f.time||''}onChange={e=>setF(p=>({...p,time:e.target.value}))}/></Fld>
    </div>
    <div className="g2c">
      <Fld label="Peso (1–10)"><input type="number"min={1}max={10}value={f.weight}onChange={e=>setF(p=>({...p,weight:+e.target.value}))}/></Fld>
      <Fld label="Prioridade">
        <select value={f.prio}onChange={e=>setF(p=>({...p,prio:e.target.value}))}>
          <option value="alta">Alta</option><option value="media">Média</option><option value="baixa">Baixa</option>
        </select>
      </Fld>
    </div>
    <Fld label="Categoria">
      <select value={f.cat}onChange={e=>setF(p=>({...p,cat:e.target.value}))}>
        {cats.map(c=><option key={c.id}value={c.id}>{c.name}</option>)}
      </select>
    </Fld>
    <Fld label="Subitens (lista)">
      <div className="flex col g6">
        {(f.subtasks||[]).map((s,i)=><div key={s.id}className="fc g6">
          <Chk on={s.done}onChange={()=>togSub(i)}/>
          <input value={s.text}onChange={e=>updSub(i,e.target.value)}placeholder="Subitem..."/>
          <button className="btn-ic"style={{color:'var(--er)',flexShrink:0}}onClick={()=>delSub(i)}>×</button>
        </div>)}
      </div>
      <button onClick={addSub}style={{marginTop:6,fontSize:'.75rem',color:'var(--ac)',background:'none',border:'none',cursor:'pointer',padding:'2px 0'}}>+ adicionar subitem</button>
    </Fld>
    <Btns>
      <button className="btn btn-gh"onClick={onClose}>Cancelar</button>
      <button className="btn btn-ac"onClick={save}>Salvar</button>
    </Btns>
  </Modal>;
}

// ── MODO FOCO (Pomodoro fullscreen) ──────────────────────────────────────────

function FocusMode({st,onClose}){
  const SESSIONS=[
    {label:'Foco',min:25,color:'var(--ac)'},
    {label:'Pausa curta',min:5,color:'#22c55e'},
    {label:'Pausa longa',min:15,color:'#3b82f6'},
  ];
  const[sessionIdx,setSessionIdx]=useState(0);
  const[running,setRunning]=useState(false);
  const[elapsed,setElapsed]=useState(0);
  const[reflection,setReflection]=useState('');
  const intervalRef=useRef(null);
  const sess=SESSIONS[sessionIdx];
  const total=sess.min*60;
  const left=Math.max(0,total-elapsed);
  const mm=String(Math.floor(left/60)).padStart(2,'0');
  const ss=String(left%60).padStart(2,'0');
  const pct=elapsed/total;
  // circular SVG progress
  const R=80,CX=100,CY=100,CIRC=2*Math.PI*R;
  const dash=CIRC*(1-pct);

  useEffect(()=>{
    if(running){
      intervalRef.current=setInterval(()=>{
        setElapsed(e=>{if(e>=total){clearInterval(intervalRef.current);setRunning(false);return total;}return e+1;});
      },1000);
    }else{
      clearInterval(intervalRef.current);
    }
    return()=>clearInterval(intervalRef.current);
  },[running,total]);

  function changeSession(i){setSessionIdx(i);setElapsed(0);setRunning(false);setReflection('');}
  function reset(){setElapsed(0);setRunning(false);setReflection('');}

  // top priority task today
  const td=TODAY();
  const topTask=st.tasks.filter(t=>t.date===td&&!t.done).sort((a,b)=>{const po={alta:0,media:1,baixa:2};return po[a.prio]-po[b.prio];})[0];

  // Reflexão pós-foco gerada pela IA quando a sessão de Foco termina
  useEffect(()=>{
    if(left===0&&elapsed>0&&sess.label==='Foco'&&aiReady()&&!reflection){
      setReflection('...');
      (async()=>{
        try{
          const t=aiStrip(await aiCall(AI_SYS_MALANDRO,`Acabei de concluir uma sessão de foco de ${sess.min} minutos. Tarefa que eu estava focando: "${(topTask&&topTask.title)||'(sem tarefa específica)'}". Faça 2 perguntas curtas e diretas de reflexão pra eu avaliar o que rendeu e o próximo passo. Liste cada pergunta numa linha começando com "• ".`,160));
          setReflection(t||'');
        }catch(e){setReflection('');}
      })();
    }
  },[left,elapsed]);
  // habit progress
  const dayLog=st.habitLog[td]||{};
  const active=st.habits.filter(h=>h.active);
  const doneH=active.filter(h=>dayLog[h.id]).length;

  return<div style={{position:'fixed',inset:0,zIndex:900,background:'rgba(0,0,0,.96)',backdropFilter:'blur(8px)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:24,animation:'fi .22s ease'}}>
    {/* Close */}
    <button onClick={onClose}style={{position:'absolute',top:16,right:16,background:'none',border:'1px solid var(--bd2)',color:'var(--tx2)',padding:'6px 12px',borderRadius:8,fontSize:'.8rem',cursor:'pointer'}}>✕ Fechar</button>

    {/* Session selector */}
    <div style={{display:'flex',gap:8}}>
      {SESSIONS.map((s,i)=><button key={i}onClick={()=>changeSession(i)}style={{padding:'6px 16px',borderRadius:20,fontSize:'.78rem',fontWeight:700,cursor:'pointer',background:sessionIdx===i?s.color+'22':'transparent',border:`1px solid ${sessionIdx===i?s.color:'#333'}`,color:sessionIdx===i?s.color:'#555',transition:'all .15s'}}>{s.label}</button>)}
    </div>

    {/* Circle timer */}
    <div style={{position:'relative',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <svg width="200"height="200"viewBox="0 0 200 200">
        <circle cx={CX}cy={CY}r={R}fill="none"stroke="#1a1a1a"strokeWidth="8"/>
        <circle cx={CX}cy={CY}r={R}fill="none"stroke={sess.color}strokeWidth="8"strokeLinecap="round"
          strokeDasharray={CIRC}strokeDashoffset={dash}
          transform="rotate(-90 100 100)"style={{transition:'stroke-dashoffset .9s linear'}}/>
      </svg>
      <div style={{position:'absolute',textAlign:'center'}}>
        <div style={{fontFamily:'var(--fm)',fontSize:'2.8rem',fontWeight:700,color:sess.color,lineHeight:1}}>{mm}:{ss}</div>
        <div style={{fontSize:'.72rem',color:'#555',marginTop:4,textTransform:'uppercase',letterSpacing:'.1em'}}>{sess.label}</div>
      </div>
    </div>

    {/* Controls */}
    <div style={{display:'flex',gap:12}}>
      <button onClick={reset}style={{padding:'8px 18px',borderRadius:8,background:'#1a1a1a',border:'1px solid #2a2a2a',color:'#666',cursor:'pointer',fontSize:'.85rem'}}>↺ Reset</button>
      <button onClick={()=>setRunning(r=>!r)}style={{padding:'10px 32px',borderRadius:8,background:sess.color,border:'none',color:'#000',fontWeight:800,fontSize:'1rem',cursor:'pointer',transition:'opacity .15s'}}>{running?'⏸ Pausar':'▶ Iniciar'}</button>
    </div>

    {/* Reflexão pós-foco (IA) */}
    {reflection&&<div style={{width:'100%',maxWidth:340,padding:'12px 14px',background:'var(--ac1)',border:'1px solid var(--ac2)',borderRadius:10}}>
      <div style={{fontSize:'.66rem',color:'var(--ac)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:6,fontWeight:700}}>🧠 Reflexão da sessão</div>
      {reflection==='...'
        ?<div style={{fontSize:'.82rem',color:'var(--tx3)'}}>Gerando…</div>
        :<div style={{fontSize:'.84rem',color:'var(--tx)',lineHeight:1.5,whiteSpace:'pre-line'}}>{reflection}</div>}
    </div>}

    {/* Top task + habit mini progress */}
    <div style={{width:'100%',maxWidth:340,display:'flex',flexDirection:'column',gap:8,marginTop:4}}>
      {topTask&&<div style={{padding:'10px 14px',background:'#111',border:'1px solid #222',borderRadius:10}}>
        <div style={{fontSize:'.68rem',color:'#444',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:4}}>Tarefa prioritária</div>
        <div style={{fontSize:'.9rem',fontWeight:600,color:'#ccc'}}>{topTask.title}</div>
      </div>}
      <div style={{padding:'10px 14px',background:'#111',border:'1px solid #222',borderRadius:10}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
          <span style={{fontSize:'.68rem',color:'#444',textTransform:'uppercase',letterSpacing:'.08em'}}>Hábitos hoje</span>
          <span style={{fontFamily:'var(--fm)',fontSize:'.8rem',color:'#666'}}>{doneH}/{active.length}</span>
        </div>
        <div style={{height:4,background:'#1a1a1a',borderRadius:2,overflow:'hidden'}}>
          <div style={{height:'100%',width:`${(doneH/Math.max(active.length,1))*100}%`,background:'var(--ac)',borderRadius:2,transition:'width .4s'}}/>
        </div>
      </div>
    </div>
  </div>;
}

// ── MENU DE DOPAMINA ─────────────────────────────────────────────────────────

const DOPAMINA_SECOES=[
  {key:'entradas',  label:'Entradas',       sub:'5 min',  emoji:'🥗', cor:'#22c55e'},
  {key:'pratos',    label:'Pratos Principais',sub:'20 min',emoji:'🍖', cor:'var(--ac)'},
  {key:'sobremesas',label:'Sobremesas',      sub:'10 min', emoji:'🍮', cor:'#a855f7'},
];

function DopaminaMenu({st,setSt}){
  const td=TODAY();
  const menu=st.dopaminaMenu||{entradas:[],pratos:[],sobremesas:[]};
  const log=st.dopaminaLog?.[td]||{};
  const[sugestao,setSugestao]=useState(null);
  const[addModal,setAddModal]=useState(null);
  const[novoItem,setNovoItem]=useState({titulo:'',emoji:''});
  const[open,setOpen]=useState(true);

  const totalItens=DOPAMINA_SECOES.reduce((s,sec)=>s+(menu[sec.key]||[]).length,0);
  const totalFeitos=Object.values(log).filter(Boolean).length;

  function toggle(id){
    setSt(p=>({...p,dopaminaLog:{...(p.dopaminaLog||{}),[td]:{...((p.dopaminaLog||{})[td]||{}),[id]:!((p.dopaminaLog||{})[td]||{})[id]}}}));
  }
  function addItem(key){
    if(!novoItem.titulo.trim())return;
    setSt(p=>({...p,dopaminaMenu:{...(p.dopaminaMenu||{}), [key]:[...((p.dopaminaMenu||{})[key]||[]),{...novoItem,id:uid(),emoji:novoItem.emoji||'⭐'}]}}));
    setNovoItem({titulo:'',emoji:''});setAddModal(null);
  }
  function delItem(key,id){
    setSt(p=>({...p,dopaminaMenu:{...(p.dopaminaMenu||{}),[key]:((p.dopaminaMenu||{})[key]||[]).filter(i=>i.id!==id)}}));
  }
  function sortear(){
    const picks={};
    for(const s of DOPAMINA_SECOES){
      const disp=(menu[s.key]||[]).filter(i=>!log[i.id]);
      if(disp.length)picks[s.key]=disp[Math.floor(Math.random()*disp.length)].id;
    }
    setSugestao(picks);
    setTimeout(()=>setSugestao(null),10000);
  }

  return<div className="card mb14"style={{padding:0,overflow:'hidden'}}>
    {/* Header do cardápio */}
    <div onClick={()=>setOpen(o=>!o)}style={{cursor:'pointer',padding:'12px 14px',background:'var(--card2)',borderBottom:open?'1px solid var(--bd)':'none',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div className="fc g8">
        <span style={{fontSize:'1.1rem'}}>🧠</span>
        <div>
          <div style={{fontFamily:'var(--ft)',fontSize:'1rem',letterSpacing:'.06em',lineHeight:1}}>MENU DE DOPAMINA</div>
          <div style={{fontSize:'.65rem',color:'var(--tx3)',marginTop:2}}>{totalFeitos}/{totalItens} pedidos hoje</div>
        </div>
      </div>
      <div className="fc g8">
        {open&&<button onClick={e=>{e.stopPropagation();sortear();}}style={{padding:'4px 10px',borderRadius:8,background:'var(--ac)',border:'none',color:'#000',fontWeight:700,fontSize:'.7rem',cursor:'pointer'}}>🎲 Sortear</button>}
        <span style={{color:'var(--tx3)',fontSize:'.9rem'}}>{open?'▲':'▼'}</span>
      </div>
    </div>

    {open&&<div style={{padding:'12px 14px'}}>
      {DOPAMINA_SECOES.map((sec,si)=><div key={sec.key}style={{marginBottom:si<2?16:0}}>
        {/* Cabeçalho da seção */}
        <div className="fcb mb8">
          <div className="fc g6">
            <span style={{fontSize:'1rem'}}>{sec.emoji}</span>
            <span style={{fontWeight:700,fontSize:'.85rem'}}>{sec.label}</span>
            <span style={{fontSize:'.7rem',fontFamily:'var(--fm)',color:sec.cor,background:sec.cor.startsWith('#')?sec.cor+'18':'var(--ac1)',padding:'1px 7px',borderRadius:8}}>{sec.sub}</span>
          </div>
          <button onClick={()=>{setAddModal(sec.key);setNovoItem({titulo:'',emoji:''});}}style={{fontSize:'.7rem',color:'var(--tx3)',background:'none',border:'none',cursor:'pointer',padding:'2px 4px'}}>+ adicionar</button>
        </div>

        {/* Itens */}
        <div style={{display:'flex',flexDirection:'column',gap:5}}>
          {(menu[sec.key]||[]).map(item=>{
            const done=!!log[item.id];
            const chef=sugestao?.[sec.key]===item.id;
            const corHex=sec.cor.startsWith('#')?sec.cor:'var(--ac)';
            return<div key={item.id}onClick={()=>toggle(item.id)}style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',borderRadius:'var(--r)',cursor:'pointer',background:done?corHex+'18':chef?corHex+'12':'transparent',border:`1px solid ${done?corHex+'55':chef?corHex+'99':'var(--bd2)'}`,boxShadow:chef&&!done?`0 0 14px ${corHex}44`:'none',transition:'all .2s',opacity:done?0.65:1}}>
              <span style={{fontSize:'1.1rem',flexShrink:0}}>{item.emoji}</span>
              <span style={{flex:1,fontSize:'.85rem',fontWeight:500,textDecoration:done?'line-through':'none',color:done?'var(--tx3)':'var(--tx)'}}>{item.titulo}</span>
              {chef&&!done&&<span style={{fontSize:'.6rem',fontWeight:800,color:corHex,background:corHex+'22',padding:'2px 7px',borderRadius:8,letterSpacing:'.05em',flexShrink:0}}>CHEF ⭐</span>}
              {done&&<span style={{color:'#22c55e',flexShrink:0,fontSize:'1rem'}}>✓</span>}
              <button onClick={e=>{e.stopPropagation();delItem(sec.key,item.id);}}style={{background:'none',border:'none',color:'var(--tx4)',fontSize:'.85rem',cursor:'pointer',padding:'0 2px',flexShrink:0,lineHeight:1}}>×</button>
            </div>;
          })}
          {(menu[sec.key]||[]).length===0&&<div style={{color:'var(--tx4)',fontSize:'.78rem',textAlign:'center',padding:'8px 0'}}>Nenhum prato aqui. Clique em + adicionar.</div>}
        </div>
      </div>)}
    </div>}

    {/* Modal para adicionar item */}
    <Modal open={!!addModal}onClose={()=>setAddModal(null)}title="Novo prato">
      <div className="g2c">
        <Fld label="Emoji"><input value={novoItem.emoji}onChange={e=>setNovoItem(p=>({...p,emoji:e.target.value}))}maxLength={4}placeholder="⭐"/></Fld>
        <Fld label="Atividade"><input value={novoItem.titulo}onChange={e=>setNovoItem(p=>({...p,titulo:e.target.value}))}placeholder="Ex: 5 min de alongamento"/></Fld>
      </div>
      <Btns>
        <button className="btn btn-gh"onClick={()=>setAddModal(null)}>Cancelar</button>
        <button className="btn btn-ac"onClick={()=>addItem(addModal)}>Adicionar</button>
      </Btns>
    </Modal>
  </div>;
}

// ── HOJE ─────────────────────────────────────────────────────────────────────

function HojeSection({st,setSt}){
  const td=TODAY();
  const[taskModal,setTaskModal]=useState(false);
  const[editTask,setEditTask]=useState(null);
  const[focusOpen,setFocusOpen]=useState(false);
  const todayTasks=st.tasks.filter(t=>t.date===td);
  const dayLog=st.habitLog[td]||{};
  const activeHabits=st.habits.filter(h=>h.active);
  const score=getDayScore(st,td);
  const doneT=todayTasks.filter(t=>t.done).length;
  const doneH=activeHabits.filter(h=>dayLog[h.id]).length;
  const maxScore=todayTasks.reduce((s,t)=>s+t.weight,0)+activeHabits.reduce((s,h)=>s+h.weight,0);

  function toggleTask(id){
    setSt(p=>({...p,tasks:p.tasks.map(t=>t.id===id?{...t,done:!t.done}:t)}));
  }
  function toggleHabit(hid){
    setSt(p=>({...p,habitLog:{...p.habitLog,[td]:{...( p.habitLog[td]||{}), [hid]:!(p.habitLog[td]||{})[hid]}}}));
  }
  function saveTask(f){
    const td2=TODAY();
    if(editTask){
      setSt(p=>({...p,tasks:p.tasks.map(t=>t.id===editTask.id?{...t,...f}:t)}));
    }else{
      setSt(p=>({...p,tasks:[...p.tasks,{...f,id:uid(),done:false,createdAt:td2}]}));
    }
    setEditTask(null);
  }

  const streak=useMemo(()=>{
    let n=0;const now=new Date();
    for(let i=0;i<365;i++){
      const d=new Date(now);d.setDate(now.getDate()-i);
      const ds=localDateStr(d);
      if(getDayScore(st,ds)>0)n++;else break;
    }
    return n;
  },[st]);
  const streakRecord=useMemo(()=>{
    let best=0,cur=0;
    const now=new Date();
    for(let i=0;i<365;i++){
      const d=new Date(now);d.setDate(now.getDate()-i);
      if(getDayScore(st,localDateStr(d))>0)cur++;else{if(cur>best)best=cur;cur=0;}
    }
    return Math.max(best,cur);
  },[st]);
  const streakMilestones=[3,7,14,21,30,60,90];
  const nextMilestone=streakMilestones.find(m=>m>streak)||streakMilestones[streakMilestones.length-1];
  const fireLevel=streak>=30?5:streak>=21?4:streak>=14?3:streak>=7?2:streak>=3?1:0;
  const fireEmojis=['🔥','🔥','🔥🔥','🔥🔥🔥','🔥🔥🔥🔥','💥🔥🔥🔥🔥'];
  const fireMsgs=[
    'Aquecendo... bora ativar!',
    'Chama começou! Mantenha.',
    'Fogo brando! Não apaga.',
    'Fogueira acesa! Tá pegando.',
    'Inferno na área! Só passa por cima.',
    'LENDA VIVA — tá imparável! 🔥💥'
  ];

  const staticFrase=useMemo(()=>st.frases[Math.floor(Math.random()*st.frases.length)]||'',[]);
  const aiFraseHoje=(st.aiFrase&&st.aiFrase.date===td)?st.aiFrase.text:'';
  const frase=aiFraseHoje||staticFrase;
  // Frase do dia personalizada pela IA (1x por dia)
  useEffect(()=>{
    if(!aiReady())return;
    if(st.aiFrase&&st.aiFrase.date===td)return;
    let cancel=false;
    (async()=>{
      try{
        const lvl=getLevelInfo(calcTotalXP(st));
        const ah=st.habits.filter(h=>h.active);
        const doneHj=ah.filter(h=>(st.habitLog[td]||{})[h.id]).length;
        const ctx=`Contexto de hoje: classe ${lvl.cls.nome} (nível ${lvl.lvl}), score do dia ${score}, hábitos ${doneHj}/${ah.length}, ${todayTasks.length} tarefas. Escreva UMA frase curta (máx 18 palavras), motivadora e pessoal pra hoje. Só a frase, sem aspas.`;
        const text=aiStrip(await aiCall(AI_SYS_MALANDRO,ctx,80));
        if(!cancel&&text)setSt(p=>({...p,aiFrase:{date:td,text}}));
      }catch(e){}
    })();
    return()=>{cancel=true;};
  },[td]);

  return<div className="sec">
    {focusOpen&&<FocusMode st={st}onClose={()=>setFocusOpen(false)}/>}
    {/* Score strip */}
    <div className="card mb14"style={{background:'var(--card)',borderColor:'var(--ac2)'}}>
      <div className="fcb"style={{marginBottom:10}}>
        <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.08em'}}>{todayFull()}</div>
        <button onClick={()=>setFocusOpen(true)}style={{display:'flex',alignItems:'center',gap:5,padding:'5px 12px',borderRadius:8,background:'var(--ac)',border:'none',color:'#000',fontWeight:700,fontSize:'.75rem',cursor:'pointer',flexShrink:0}}>⏱ Modo Foco</button>
      </div>
      <div className="fc g16"style={{flexWrap:'wrap'}}>
        <div>
          <div className="score-n">{score}</div>
          <div style={{fontSize:'.68rem',color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.08em'}}>Score do dia</div>
        </div>
        <div className="flex col g4"style={{flex:1,minWidth:120}}>
          <div className="fcb"style={{fontSize:'.8rem'}}>
            <span style={{color:'var(--tx2)'}}>Tarefas</span>
            <span style={{fontFamily:'var(--fm)',color:'var(--ac)'}}>{doneT}/{todayTasks.length}</span>
          </div>
          <PBar val={doneT}max={Math.max(todayTasks.length,1)}color="var(--ac)"/>
          <div className="fcb mt4"style={{fontSize:'.8rem'}}>
            <span style={{color:'var(--tx2)'}}>Hábitos</span>
            <span style={{fontFamily:'var(--fm)',color:'var(--ac)'}}>{doneH}/{activeHabits.length}</span>
          </div>
          <PBar val={doneH}max={Math.max(activeHabits.length,1)}color="var(--ac)"/>
        </div>
      </div>
    </div>

    {/* Sequência de Fogo */}
    <div className="card mb14"style={{borderColor:fireLevel>=4?'var(--ok)':fireLevel>=2?'var(--warn)':'var(--bd)',overflow:'hidden',padding:0}}>
      <div className="fcb"style={{padding:'10px 14px',background:`linear-gradient(135deg,${fireLevel>=4?'#22c55e22':fireLevel>=2?'#eab30822':'transparent'},transparent)`}}>
        <div className="fc g10">
          <span style={{fontSize:fireLevel===0?'1.3rem':'1.6rem',filter:fireLevel>=3?'drop-shadow(0 0 6px #f97316)':'none',transition:'all .3s'}}>
            {fireEmojis[fireLevel]}
          </span>
          <div>
            <div style={{fontWeight:700,fontSize:'.95rem'}}>
              {streak>0?`${streak} ${streak===1?'dia seguido':'dias seguidos'}`:'Nenhum registro hoje'}
            </div>
            <div style={{fontSize:'.7rem',color:'var(--tx2)'}}>
              {fireMsgs[fireLevel]}{streakRecord>1?` · Recorde: ${streakRecord} dias`:' · Bora começar!'}
            </div>
          </div>
        </div>
        {streak>0&&streak<streakMilestones[streakMilestones.length-1]&&<div style={{textAlign:'right',flexShrink:0}}>
          <div style={{fontSize:'.6rem',color:'var(--tx3)',textTransform:'uppercase',letterSpacing:'.06em'}}>Próx. marco</div>
          <div style={{fontFamily:'var(--fm)',fontSize:'.8rem',fontWeight:700,color:'var(--ac)'}}>{nextMilestone}d</div>
        </div>}
      </div>
      {streak>0&&<div style={{padding:'0 14px 10px'}}><PBar val={streak}max={nextMilestone}color={fireLevel>=4?'#22c55e':fireLevel>=2?'#eab308':'var(--ac)'}/></div>}
    </div>

    {/* Frase */}
    <div style={{padding:'10px 14px',background:'var(--ac1)',border:'1px solid var(--ac2)',borderRadius:'var(--r)',marginBottom:'14px',fontStyle:'italic',fontSize:'.85rem',color:'var(--ac)',lineHeight:1.5}}>
      "{frase}"
    </div>

    {/* Tarefas do dia */}
    <div className="sch">
      <div className="sch-t">Tarefas de Hoje</div>
      <button className="btn btn-ac"onClick={()=>{setEditTask(null);setTaskModal(true);}}>+ Tarefa</button>
    </div>
    {todayTasks.length===0&&<div style={{color:'var(--tx3)',fontSize:'.85rem',padding:'12px 0'}}>Sem tarefas para hoje. Adicione uma!</div>}
    {todayTasks.map(t=><div key={t.id}className={`tsk-row${t.done?' done':''}`}>
      <Chk on={t.done}onChange={()=>toggleTask(t.id)}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:'.88rem',fontWeight:600,textDecoration:t.done?'line-through':'none',color:t.done?'var(--tx2)':'var(--tx)'}}>{t.title}</div>
        <div className="fc g6 mt4"style={{flexWrap:'wrap'}}>
          <CatTag catId={t.cat}cats={st.categories}/>
          <PrioTag p={t.prio}/>
          <span style={{fontSize:'.68rem',fontFamily:'var(--fm)',color:'var(--tx3)'}}>+{t.weight}pts</span>
        </div>
      </div>
      <button className="btn-ic"onClick={()=>{setEditTask(t);setTaskModal(true);}}>✏️</button>
    </div>)}

    {/* Hábitos */}
    <div className="sch mt12">
      <div className="sch-t">Hábitos de Hoje</div>
    </div>
    {activeHabits.map(h=>{
      const done=!!(dayLog[h.id]);
      return<div key={h.id}className="hab-row"style={{borderColor:done?h.color+'33':'var(--bd)',opacity:h.active?1:.5}}>
        <span style={{fontSize:'1.2rem'}}>{h.emoji}</span>
        <div style={{flex:1}}>
          <div style={{fontWeight:600,fontSize:'.88rem',textDecoration:done?'line-through':'none',color:done?'var(--tx2)':'var(--tx)'}}>{h.name}</div>
          <div style={{fontSize:'.7rem',fontFamily:'var(--fm)',color:h.color}}>+{h.weight}pts</div>
        </div>
        <Chk on={done}onChange={()=>toggleHabit(h.id)}/>
      </div>;
    })}

    <TaskModal open={taskModal}onClose={()=>{setTaskModal(false);setEditTask(null);}}onSave={saveTask}init={editTask}cats={st.categories}/>
  </div>;
}

// ── TAREFAS ──────────────────────────────────────────────────────────────────

function TarefasSection({st,setSt}){
  const td=TODAY();
  const po={alta:0,media:1,baixa:2};
  const[view,setView]=useState('lista');
  const[modal,setModal]=useState(false);
  const[edit,setEdit]=useState(null);
  const[preset,setPreset]=useState(null);
  const[weekOff,setWeekOff]=useState(0);
  const[listInput,setListInput]=useState({});

  function weekDates(ref){
    const d=new Date(ref);const off=(d.getDay()===0?-6:1-d.getDay());
    const mon=new Date(d);mon.setDate(d.getDate()+off);
    return Array.from({length:7},(_,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return localDateStr(x);});
  }
  const thisWeek=weekDates(new Date());

  // ── ações ──
  function save(f){
    if(edit)setSt(p=>({...p,tasks:p.tasks.map(t=>t.id===edit.id?{...t,...f}:t)}));
    else setSt(p=>({...p,tasks:[...p.tasks,{...f,id:uid(),done:false,createdAt:td}]}));
    setEdit(null);setPreset(null);
  }
  function del(id){setSt(p=>({...p,tasks:p.tasks.filter(t=>t.id!==id)}));}
  function tog(id){setSt(p=>({...p,tasks:p.tasks.map(t=>t.id===id?{...t,done:!t.done}:t)}));}
  function openNew(initPartial){setEdit(null);setPreset(initPartial||{});setModal(true);}
  function openEdit(t){setEdit(t);setPreset(null);setModal(true);}

  // ── LISTAS PRÓPRIAS (criadas livremente, lado a lado) ──
  const lists=st.taskLists||[];
  function addList(){setSt(p=>({...p,taskLists:[...(p.taskLists||[]),{id:uid(),nome:'Nova lista',items:[]}]}));}
  function renameList(id,nome){setSt(p=>({...p,taskLists:p.taskLists.map(l=>l.id===id?{...l,nome}:l)}));}
  function delList(id){setSt(p=>({...p,taskLists:p.taskLists.filter(l=>l.id!==id)}));}
  function addItem(lid){const txt=(listInput[lid]||'').trim();if(!txt)return;setSt(p=>({...p,taskLists:p.taskLists.map(l=>l.id===lid?{...l,items:[...l.items,{id:uid(),text:txt,done:false}]}:l)}));setListInput(s=>({...s,[lid]:''}));}
  function togItem(lid,iid){setSt(p=>({...p,taskLists:p.taskLists.map(l=>l.id===lid?{...l,items:l.items.map(it=>it.id===iid?{...it,done:!it.done}:it)}:l)}));}
  function delItem(lid,iid){setSt(p=>({...p,taskLists:p.taskLists.map(l=>l.id===lid?{...l,items:l.items.filter(it=>it.id!==iid)}:l)}));}

  // ── QUADRO SEMANAL ──
  const DLBL=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const refBase=(()=>{const d=new Date();d.setDate(d.getDate()+weekOff*7);return d;})();
  const week=weekDates(refBase);
  const ptShort=ds=>{const d=new Date(ds+'T12:00:00');return d.getDate()+'/'+(d.getMonth()+1);};
  const weekAll=st.tasks.filter(t=>t.date&&t.date>=week[0]&&t.date<=week[6]);
  const weekDone=weekAll.filter(t=>t.done).length;
  // refeições fixas (âncoras do dia) — tarefas se organizam antes/depois por horário
  const MEALS=[{id:'m-cafe',meal:true,emoji:'☕',title:'Café da manhã',time:'08:00'},{id:'m-almoco',meal:true,emoji:'🍽️',title:'Almoço',time:'12:00'}];
  function dayItems(ds){
    const items=[...st.tasks.filter(t=>t.date===ds).map(t=>({...t,time:t.time||''})),...MEALS.map(m=>({...m}))];
    items.sort((a,b)=>{const ta=a.time||'',tb=b.time||'';if(ta!==tb)return ta<tb?-1:1;if(a.meal!==b.meal)return a.meal?1:-1;return(po[a.prio]||1)-(po[b.prio]||1);});
    return items;
  }
  function colCard(t){
    const subs=t.subtasks||[];const dn=subs.filter(s=>s.done).length;
    const pc={alta:'#ef4444',media:'#eab308',baixa:'#22c55e'}[t.prio]||'#888';
    return<div onClick={()=>openEdit(t)}style={{flex:1,background:'var(--card2)',border:'1px solid var(--bd)',borderLeft:`3px solid ${pc}`,borderRadius:6,padding:'7px 9px',cursor:'pointer',opacity:t.done?.5:1}}>
      <div className="fc g6"style={{alignItems:'flex-start'}}>
        <span onClick={e=>{e.stopPropagation();tog(t.id);}}style={{fontSize:'.8rem',flexShrink:0,cursor:'pointer',lineHeight:1.2}}>{t.done?'✅':'⬜'}</span>
        <span style={{flex:1,fontSize:'.76rem',fontWeight:600,lineHeight:1.25,textDecoration:t.done?'line-through':'none',color:t.done?'var(--tx3)':'var(--tx)',wordBreak:'break-word'}}>{t.title}</span>
      </div>
      {subs.length>0&&<div style={{marginLeft:18,marginTop:3,fontSize:'.62rem',fontFamily:'var(--fm)',color:dn===subs.length?'#22c55e':'var(--tx3)'}}>☑ {dn}/{subs.length}</div>}
    </div>;
  }
  function dayRow(item){
    const gutter=<div style={{width:30,flexShrink:0,fontSize:'.56rem',fontFamily:'var(--fm)',color:item.meal?'var(--ac)':'var(--tx4)',textAlign:'right',paddingTop:5,lineHeight:1.15}}>{item.time||''}</div>;
    if(item.meal)return<div key={item.id}className="fc"style={{gap:5,alignItems:'center',margin:'5px 0'}}>
      {gutter}
      <div style={{flex:1,display:'flex',alignItems:'center',gap:5,padding:'3px 7px',borderRadius:6,background:'var(--ac1)',border:'1px dashed var(--ac2)'}}>
        <span style={{fontSize:'.78rem'}}>{item.emoji}</span>
        <span style={{fontSize:'.62rem',fontWeight:700,color:'var(--ac)',textTransform:'uppercase',letterSpacing:'.03em'}}>{item.title}</span>
      </div>
    </div>;
    return<div key={item.id}className="fc"style={{gap:5,alignItems:'stretch',marginBottom:6}}>
      {gutter}{colCard(item)}
    </div>;
  }
  const colWrap={minWidth:160,flex:'0 0 160px',background:'var(--card)',borderRadius:8,padding:8,maxHeight:'62vh',overflowY:'auto'};
  const colHead={fontSize:'.72rem',fontWeight:700,marginBottom:8,position:'sticky',top:0};
  const addBtn=ds=>(<button onClick={()=>openNew({date:ds})}style={{width:'100%',padding:'6px',borderRadius:6,background:'none',border:'1px dashed var(--bd2)',color:'var(--tx3)',fontSize:'.72rem',cursor:'pointer',marginTop:2}}>+ tarefa</button>);

  return<div className="sec">
    <div className="sch">
      <div className="sch-t">Tarefas</div>
      {view==='lista'
        ?<button className="btn btn-ac"onClick={addList}>+ Nova Lista</button>
        :<button className="btn btn-ac"onClick={()=>openNew({date:td})}>+ Nova Tarefa</button>}
    </div>
    <div className="stabs mb14">
      <button className={`stab${view==='lista'?' on':''}`}onClick={()=>setView('lista')}>📋 Listas</button>
      <button className={`stab${view==='quadro'?' on':''}`}onClick={()=>setView('quadro')}>🗓 Quadro Semanal</button>
    </div>

    {view==='lista'&&<div>
      {lists.length===0&&<div style={{color:'var(--tx3)',fontSize:'.85rem',padding:'30px 0',textAlign:'center'}}>
        Nenhuma lista ainda.<br/><span style={{fontSize:'.78rem'}}>Crie listas próprias (ideias, pendências, compras...) com "+ Nova Lista".</span>
      </div>}
      <div style={{display:'flex',gap:10,overflowX:'auto',paddingBottom:8,alignItems:'flex-start'}}>
        {lists.map(l=>{
          const doneN=l.items.filter(i=>i.done).length;
          return<div key={l.id}style={{...colWrap,border:'1px solid var(--bd)'}}>
            <div className="fcb"style={{marginBottom:8}}>
              <input value={l.nome}onChange={e=>renameList(l.id,e.target.value)}style={{fontWeight:700,fontSize:'.82rem',background:'none',border:'none',padding:0,color:'var(--tx)',width:'100%'}}/>
              <button className="btn-ic"style={{color:'var(--er)',flexShrink:0}}onClick={()=>delList(l.id)}>×</button>
            </div>
            {l.items.length>0&&<div style={{fontSize:'.62rem',fontFamily:'var(--fm)',color:doneN===l.items.length?'#22c55e':'var(--tx3)',marginBottom:6}}>☑ {doneN}/{l.items.length}</div>}
            {l.items.map(it=><div key={it.id}className="fc g8"style={{padding:'4px 0'}}>
              <Chk on={it.done}onChange={()=>togItem(l.id,it.id)}/>
              <span style={{flex:1,fontSize:'.8rem',color:it.done?'var(--tx3)':'var(--tx2)',textDecoration:it.done?'line-through':'none',wordBreak:'break-word'}}>{it.text}</span>
              <button className="btn-ic"style={{color:'var(--tx4)',flexShrink:0}}onClick={()=>delItem(l.id,it.id)}>×</button>
            </div>)}
            <input value={listInput[l.id]||''}onChange={e=>setListInput(s=>({...s,[l.id]:e.target.value}))}onKeyDown={e=>{if(e.key==='Enter')addItem(l.id);}}placeholder="+ item (Enter)"style={{fontSize:'.78rem',padding:'5px 8px',marginTop:6}}/>
          </div>;
        })}
        <button onClick={addList}style={{minWidth:120,flex:'0 0 120px',alignSelf:'flex-start',background:'none',border:'1px dashed var(--bd2)',borderRadius:8,color:'var(--tx3)',fontSize:'.8rem',cursor:'pointer',padding:'14px 8px'}}>+ Nova lista</button>
      </div>
    </div>}

    {view==='quadro'&&<div>
      {/* navegação de semana */}
      <div className="fcb mb12"style={{background:'var(--card)',border:'1px solid var(--bd)',borderRadius:'var(--r)',padding:'8px 12px'}}>
        <button className="btn-ic"style={{fontSize:'1.2rem'}}onClick={()=>setWeekOff(w=>w-1)}>‹</button>
        <div style={{textAlign:'center'}}>
          <div style={{fontWeight:700,fontSize:'.85rem'}}>{ptShort(week[0])} – {ptShort(week[6])}</div>
          <div style={{fontSize:'.65rem',color:'var(--tx3)'}}>{weekDone}/{weekAll.length} concluídas {weekOff===0?'· esta semana':''}</div>
        </div>
        <div className="fc g6">
          {weekOff!==0&&<button className="btn btn-gh"style={{padding:'3px 9px',fontSize:'.72rem'}}onClick={()=>setWeekOff(0)}>Hoje</button>}
          <button className="btn-ic"style={{fontSize:'1.2rem'}}onClick={()=>setWeekOff(w=>w+1)}>›</button>
        </div>
      </div>
      {/* colunas dos dias */}
      <div style={{display:'flex',gap:10,overflowX:'auto',paddingBottom:8}}>
        {week.map((ds,i)=>{
          const isToday=ds===td;
          return<div key={ds}style={{...colWrap,minWidth:180,flex:'0 0 180px',border:isToday?'1px solid var(--ac)':'1px solid var(--bd)'}}>
            <div style={{...colHead,color:isToday?'var(--ac)':'var(--tx2)',background:'var(--card)'}}>{DLBL[i]} <span style={{fontFamily:'var(--fm)',color:'var(--tx4)'}}>{ptShort(ds)}</span></div>
            {dayItems(ds).map(dayRow)}
            {addBtn(ds)}
          </div>;
        })}
      </div>
    </div>}

    <TaskModal open={modal}onClose={()=>{setModal(false);setEdit(null);setPreset(null);}}onSave={save}init={edit||preset}cats={st.categories}/>
  </div>;
}

// ── HÁBITOS ──────────────────────────────────────────────────────────────────

function HabitosSection({st,setSt}){
  const[sub,setSub]=useState('lista');
  return<div className="sec">
    <div className="stabs mb14">

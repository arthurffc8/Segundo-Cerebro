function HabitsList({st,setSt}){
  const[modal,setModal]=useState(false);
  const[edit,setEdit]=useState(null);
  const td=TODAY();
  const mk=td.slice(0,7);

  function save(f){
    if(edit)setSt(p=>({...p,habits:p.habits.map(h=>h.id===edit.id?{...h,...f}:h)}));
    else setSt(p=>({...p,habits:[...p.habits,{...f,id:uid(),order:p.habits.length}]}));
    setEdit(null);
  }
  function del(id){setSt(p=>({...p,habits:p.habits.filter(h=>h.id!==id)}));}
  function togActive(id){setSt(p=>({...p,habits:p.habits.map(h=>h.id===id?{...h,active:!h.active}:h)}));}
  function move(id,dir){
    setSt(p=>{
      const arr=[...p.habits].sort((a,b)=>a.order-b.order);
      const i=arr.findIndex(h=>h.id===id);
      const j=dir==='up'?i-1:i+1;
      if(j<0||j>=arr.length)return p;
      [arr[i].order,arr[j].order]=[arr[j].order,arr[i].order];
      return{...p,habits:arr};
    });
  }

  const habits=[...st.habits].sort((a,b)=>a.order-b.order);

  // calc month completions
  function monthCount(hid){
    let n=0;
    const yr=new Date().getFullYear();
    const mo=new Date().getMonth()+1;
    const days=daysInMonth(yr,mo);
    for(let d=1;d<=days;d++){
      const ds=`${mk}-${String(d).padStart(2,'0')}`;
      if(st.habitLog[ds]?.[hid])n++;
    }
    return n;
  }

  return<div>
    <div className="sch">
      <div className="sch-t">Hábitos</div>
      <button className="btn btn-ac"onClick={()=>{setEdit(null);setModal(true);}}>+ Hábito</button>
    </div>
    {habits.map(h=>{
      const mc=monthCount(h.id);
      return<div key={h.id}className="hab-row"style={{borderColor:h.active?h.color+'33':'var(--bd)',opacity:h.active?1:.55}}>
        <span style={{fontSize:'1.2rem'}}>{h.emoji}</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:600,fontSize:'.88rem'}}>{h.name}</div>
          <div className="fc g6 mt4"style={{flexWrap:'wrap'}}>
            <span style={{fontSize:'.68rem',fontFamily:'var(--fm)',color:h.color}}>{mc}/{h.monthlyGoal} este mês</span>
            <span style={{fontSize:'.68rem',color:'var(--tx3)'}}>+{h.weight}pts</span>
            <span style={{fontSize:'.68rem',color:'var(--tx3)'}}>{h.freq==='diario'?'Diário':'Semanal'}</span>
          </div>
          <div className="mt4"><PBar val={mc}max={h.monthlyGoal}color={h.color}/></div>
        </div>
        <div className="fc g6">
          <Tog on={h.active}onChange={()=>togActive(h.id)}/>
          <button className="btn-ic"onClick={()=>move(h.id,'up')}>↑</button>
          <button className="btn-ic"onClick={()=>move(h.id,'down')}>↓</button>
          <button className="btn-ic"onClick={()=>{setEdit(h);setModal(true);}}>✏️</button>
          <button className="btn-ic"style={{color:'var(--er)'}}onClick={()=>del(h.id)}>🗑</button>
        </div>
      </div>;
    })}
    <HabitModal open={modal}onClose={()=>{setModal(false);setEdit(null);}}onSave={save}init={edit}/>
  </div>;
}

function HabitsTracker({st,setSt}){
  const now=new Date();
  const[yr,setYr]=useState(now.getFullYear());
  const[mo,setMo]=useState(now.getMonth()+1);
  const days=daysInMonth(yr,mo);
  const mk=monthKey(yr,mo);
  const habits=[...st.habits].filter(h=>h.active).sort((a,b)=>a.order-b.order);
  const td=TODAY();

  function toggle(hid,day){
    const ds=`${mk}-${String(day).padStart(2,'0')}`;
    setSt(p=>({...p,habitLog:{...p.habitLog,[ds]:{...(p.habitLog[ds]||{}),[hid]:!(p.habitLog[ds]||{})[hid]}}}));
  }
  function prevMonth(){if(mo===1){setYr(y=>y-1);setMo(12);}else setMo(m=>m-1);}
  function nextMonth(){if(mo===12){setYr(y=>y+1);setMo(1);}else setMo(m=>m+1);}
  const mNames=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  return<div>
    {/* Month nav */}
    <div className="fcb mb14">
      <button className="btn btn-gh"style={{padding:'5px 10px'}}onClick={prevMonth}>‹</button>
      <div style={{fontFamily:'var(--fm)',fontWeight:700,fontSize:'.9rem'}}>{mNames[mo-1]} {yr}</div>
      <button className="btn btn-gh"style={{padding:'5px 10px'}}onClick={nextMonth}>›</button>
    </div>
    <div className="trk-wrap">
      <table style={{borderCollapse:'separate',borderSpacing:'2px',minWidth:'max-content'}}>
        <thead>
          <tr>
            <th style={{fontSize:'.68rem',color:'var(--tx2)',fontWeight:600,padding:'2px 8px 6px 0',textAlign:'left',whiteSpace:'nowrap',minWidth:'100px'}}>Hábito</th>
            {Array.from({length:days},(_,i)=>{
              const d=i+1;
              const ds=`${mk}-${String(d).padStart(2,'0')}`;
              const isT=ds===td;
              return<th key={d}style={{fontSize:'.65rem',color:isT?'var(--ac)':'var(--tx3)',fontWeight:isT?700:400,padding:'2px 1px',textAlign:'center',width:'24px'}}>{d}</th>;
            })}
          </tr>
        </thead>
        <tbody>
          {habits.map(h=>{
            const mc=Array.from({length:days},(_,i)=>{
              const ds=`${mk}-${String(i+1).padStart(2,'0')}`;
              return st.habitLog[ds]?.[h.id]?1:0;
            }).reduce((s,v)=>s+v,0);
            return<tr key={h.id}>
              <td style={{padding:'2px 8px 2px 0',whiteSpace:'nowrap'}}>
                <div className="fc g6">
                  <span style={{fontSize:'.9rem'}}>{h.emoji}</span>
                  <span style={{fontSize:'.75rem',fontWeight:500}}>{h.name}</span>
                  <span style={{fontSize:'.65rem',fontFamily:'var(--fm)',color:h.color}}>{mc}/{h.monthlyGoal}</span>
                </div>
              </td>
              {Array.from({length:days},(_,i)=>{
                const d=i+1;
                const ds=`${mk}-${String(d).padStart(2,'0')}`;
                const done=!!(st.habitLog[ds]?.[h.id]);
                const isT=ds===td;
                return<td key={d}style={{padding:'1px'}}>
                  <div className={`trk-cell${done?' done':''}${isT?' today':''}`}
                    style={{background:done?h.color:'transparent'}}
                    onClick={()=>toggle(h.id,d)}>
                    {done&&<span style={{color:'#fff'}}>✓</span>}
                  </div>
                </td>;
              })}
            </tr>;
          })}
        </tbody>
      </table>
    </div>
  </div>;
}

function DashboardSection({st,setSt}){
  const now=new Date();
  const[yr,setYr]=useState(now.getFullYear());
  const[mo,setMo]=useState(now.getMonth()+1);
  const[chartMode,setChartMode]=useState('linha');
  const td=TODAY();
  const mNames=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const scores=getMonthScores(st,yr,mo);
  const totalTasks=st.tasks.filter(t=>t.date.startsWith(monthKey(yr,mo))).length;
  const doneTasks=st.tasks.filter(t=>t.date.startsWith(monthKey(yr,mo))&&t.done).length;
  const todayScore=getDayScore(st,td);
  const avgScore=useMemo(()=>{const s=scores.filter(d=>d.score>0);return s.length?Math.round(s.reduce((a,d)=>a+d.score,0)/s.length):0;},[scores]);
  const bestDay=useMemo(()=>scores.reduce((b,d)=>d.score>b?d.score:b,0),[scores]);
  const daysWithData=scores.filter(d=>d.score>0).length;
  const totalDays=daysInMonth(yr,mo);
  const pctMonth=Math.round((daysWithData/totalDays)*100);

  // habits month progress — sorted best → worst
  const habitsProgress=st.habits.filter(h=>h.active).map(h=>{
    let done=0;
    for(let d=1;d<=totalDays;d++){
      const ds=`${monthKey(yr,mo)}-${String(d).padStart(2,'0')}`;
      if(st.habitLog[ds]?.[h.id])done++;
    }
    return{...h,done,pct:Math.round((done/Math.max(h.monthlyGoal,1))*100)};
  }).sort((a,b)=>b.pct-a.pct);

  // Day of week failure pattern
  const dayFails=Array(7).fill(0);
  scores.forEach(d=>{
    if(d.score===0){
      const dow=new Date(d.date+'T12:00:00').getDay();
      dayFails[dow]++;
    }
  });
  const worstDay=dayFails.indexOf(Math.max(...dayFails));

  function exp(){
    const data={period:`${mNames[mo-1]} ${yr}`,avgScore,bestDay,daysActive:daysWithData,tasksCompleted:doneTasks,habits:habitsProgress.map(h=>({name:h.name,done:h.done,goal:h.monthlyGoal,pct:h.pct+'%'}))};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`cerebro-${monthKey(yr,mo)}.json`;a.click();
  }

  function prevMonth(){if(mo===1){setYr(y=>y-1);setMo(12);}else setMo(m=>m-1);}
  function nextMonth(){if(mo===12){setYr(y=>y+1);setMo(1);}else setMo(m=>m+1);}

  return<div className="sec">
    <div className="fcb mb14">
      <div className="fcb g8">
        <button className="btn btn-gh"style={{padding:'5px 10px'}}onClick={prevMonth}>‹</button>
        <div style={{fontFamily:'var(--fm)',fontWeight:700,fontSize:'.88rem'}}>{mNames[mo-1]} {yr}</div>
        <button className="btn btn-gh"style={{padding:'5px 10px'}}onClick={nextMonth}>›</button>
      </div>
      <button className="btn btn-gh"style={{fontSize:'.75rem'}}onClick={exp}>⬇ Exportar</button>
    </div>

    {/* Metric cards */}
    <div className="g2c mb14">
      <div className="mcrd"><div className="mval">{todayScore}</div><div className="mlbl">Score hoje</div></div>
      <div className="mcrd"><div className="mval">{avgScore}</div><div className="mlbl">Média do mês</div></div>
      <div className="mcrd"><div className="mval">{bestDay}</div><div className="mlbl">Melhor dia</div></div>
      <div className="mcrd"><div className="mval">{doneTasks}/{totalTasks}</div><div className="mlbl">Tarefas</div></div>
    </div>

    {/* Chart */}
    {(()=>{
      const accent=st.config.accentOverride||(THEMES.find(t=>t.id===st.config.themeId)||THEMES[0]).ac;
      const MODES=[{k:'linha',l:'📈 Linha'},{k:'barras',l:'📊 Barras'},{k:'heatmap',l:'🗓 Calendário'}];
      return<div className="card mb14">
        <div className="fcb mb10">
          <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.07em'}}>Score por dia — {mNames[mo-1]}</div>
          <div className="fc g4">
            {MODES.map(m=><button key={m.k}onClick={()=>setChartMode(m.k)}style={{padding:'3px 9px',borderRadius:12,fontSize:'.68rem',fontWeight:700,cursor:'pointer',border:`1px solid ${chartMode===m.k?accent:'var(--bd2)'}`,background:chartMode===m.k?accent+'22':'none',color:chartMode===m.k?accent:'var(--tx3)',transition:'all .15s'}}>{m.l}</button>)}
          </div>
        </div>
        {chartMode==='linha'&&<>
          <LineChart data={scores}accent={accent}/>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:'4px',fontSize:'.65rem',color:'var(--tx3)',fontFamily:'var(--fm)'}}>
            <span>1</span><span>{Math.floor(totalDays/2)}</span><span>{totalDays}</span>
          </div>
        </>}
        {chartMode==='barras'&&<BarChart data={scores}accent={accent}/>}
        {chartMode==='heatmap'&&<HeatmapChart data={scores}accent={accent}yr={yr}mo={mo}/>}
      </div>;
    })()}

    {/* % conclusão + padrão */}
    <div className="g2c mb14">
      <div className="card">
        <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:'8px'}}>Atividade do mês</div>
        <div style={{fontFamily:'var(--fm)',fontSize:'1.4rem',fontWeight:700,color:'var(--ac)'}}>{pctMonth}%</div>
        <div style={{fontSize:'.72rem',color:'var(--tx2)'}}>{daysWithData} de {totalDays} dias</div>
      </div>
      <div className="card">
        <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:'8px'}}>Padrão de falha</div>
        <div style={{fontFamily:'var(--fm)',fontSize:'1.1rem',fontWeight:700,color:'#ef4444'}}>{DAYS_LABEL[worstDay]}</div>
        <div style={{fontSize:'.72rem',color:'var(--tx2)'}}>é o dia mais difícil</div>
      </div>
    </div>

    {/* Habits progress */}
    <div className="card">
      <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--tx2)',marginBottom:'12px',textTransform:'uppercase',letterSpacing:'.07em'}}>Progresso dos hábitos</div>
      {habitsProgress.map(h=><div key={h.id}style={{marginBottom:'10px'}}>
        <div className="fcb mb4">
          <span style={{fontSize:'.82rem',fontWeight:500}}>{h.emoji} {h.name}</span>
          <span style={{fontSize:'.72rem',fontFamily:'var(--fm)',color:h.color}}>{h.done}/{h.monthlyGoal} ({h.pct}%)</span>
        </div>
        <PBar val={h.done}max={h.monthlyGoal}color={h.color}/>
      </div>)}
    </div>

    {/* 🧬 Análise do Sistema */}
    <InsightCard st={st}yr={yr}mo={mo}/>
  </div>;
}

          const k=`${g.id}-${tipo}`;
          const items=fac[tipo]||[];
          return<div key={tipo}style={{marginBottom:'14px'}}>
            <div style={{fontSize:'.72rem',fontWeight:700,color:cor,textTransform:'uppercase',letterSpacing:'.07em',marginBottom:'8px'}}>{lbl}</div>
            {items.map(item=><div key={item.id}className="fc g8"style={{padding:'6px 8px',background:'var(--bg)',borderRadius:'6px',marginBottom:'4px',border:`1px solid ${item.ok?cor+'33':'var(--bd)'}` }}>
              <Chk on={item.ok}onChange={()=>togItem(g.id,tipo,item.id)}/>
              <span style={{flex:1,fontSize:'.82rem',color:item.ok?'var(--tx3)':'var(--tx)',textDecoration:item.ok?'line-through':'none'}}>{item.texto}</span>
              <button className="btn-ic"style={{color:'var(--er)'}}onClick={()=>delItem(g.id,tipo,item.id)}>×</button>
            </div>)}
            <div className="fc g6 mt4">
              <input value={inputs[k]||''}onChange={e=>setInputs(p=>({...p,[k]:e.target.value}))}onKeyDown={e=>e.key==='Enter'&&addItem(g.id,tipo)}placeholder="Adicionar item..."style={{fontSize:'.8rem',padding:'6px 10px'}}/>
              <button className="btn btn-ac"style={{padding:'6px 10px',flexShrink:0}}onClick={()=>addItem(g.id,tipo)}>+</button>
            </div>
          </div>;
        })}
      </div>;
    })}
  </div>;
}

function DropTab({st,setSt}){
  function updF(gid,f,v){setSt(p=>({...p,drop:{...p.drop,[gid]:{...(p.drop[gid]||{}), [f]:v}}}))}
  function addObs(gid){setSt(p=>({...p,drop:{...p.drop,[gid]:{...(p.drop[gid]||{}),obs:[...((p.drop[gid]||{}).obs||[]),{id:uid(),obs:'',prot:''}]}}}))}
  function updO(gid,oid,f,v){setSt(p=>({...p,drop:{...p.drop,[gid]:{...p.drop[gid],obs:p.drop[gid].obs.map(o=>o.id===oid?{...o,[f]:v}:o)}}}))}
  function delO(gid,oid){setSt(p=>({...p,drop:{...p.drop,[gid]:{...p.drop[gid],obs:p.drop[gid].obs.filter(o=>o.id!==oid)}}}))}
  const drops=[['🔥','Desejo','desejo','O que quero alcançar?'],['✨','Resultado','resultado','Como vou me sentir quando alcançar?']];
  return<div>
    <div className="sch-t mb6">🧠 Protocolo DROP</div>
    <div className="fc g6 mb14"style={{flexWrap:'wrap'}}>
      {[['D','#FF6B00'],['R','#22c55e'],['O','#f472b6'],['P','#60a5fa']].map(([l,c])=><span key={l}style={{fontSize:'.72rem',background:c+'18',color:c,border:`1px solid ${c}30`,padding:'2px 8px',borderRadius:'4px',fontWeight:700}}>{l}</span>)}
    </div>
    {st.goals.map(g=>{
      const d=st.drop[g.id]||{desejo:'',resultado:'',obs:[]};
      return<div key={g.id}className="obj-card">
        <div className="fc g6 mb12"><span>{g.emoji}</span><span style={{fontWeight:700,fontSize:'.9rem'}}>{g.name}</span></div>
        {drops.map(([ic,lbl,field,ph])=><div key={field}className="fld">
          <label style={{color:field==='desejo'?'#FF6B00':'#22c55e'}}>{ic} {lbl}</label>
          <textarea rows={2}value={d[field]||''}onChange={e=>updF(g.id,field,e.target.value)}placeholder={ph}/>
        </div>)}
        <div className="fcb mb8">
          <label style={{fontSize:'.7rem',fontWeight:700,color:'#f472b6',textTransform:'uppercase',letterSpacing:'.07em'}}>🧱 O + P — Obstáculos</label>
          <button className="btn btn-ac"style={{fontSize:'.72rem',padding:'4px 10px'}}onClick={()=>addObs(g.id)}>+ Obs.</button>
        </div>
        {(d.obs||[]).map(o=><div key={o.id}style={{background:'var(--card2)',border:'1px solid var(--bd2)',borderRadius:'var(--r)',padding:'10px',marginBottom:'8px'}}>
          <div className="fcb mb6"><span style={{fontSize:'.68rem',fontWeight:700,color:'#f472b6',textTransform:'uppercase'}}>Obstáculo</span><button className="btn-ic"style={{color:'var(--er)'}}onClick={()=>delO(g.id,o.id)}>×</button></div>
          <input value={o.obs}onChange={e=>updO(g.id,o.id,'obs',e.target.value)}placeholder="Qual barreira pode me impedir?"style={{marginBottom:'6px'}}/>
          <label style={{fontSize:'.68rem',fontWeight:700,color:'#60a5fa',textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:'4px'}}>Protocolo (mínimo passo)</label>
          <textarea rows={2}value={o.prot}onChange={e=>updO(g.id,o.id,'prot',e.target.value)}placeholder="Se acontecer, eu faço exatamente isso..."/>
        </div>)}
        {(d.obs||[]).length===0&&<div style={{color:'var(--tx3)',fontSize:'.8rem',textAlign:'center',padding:'10px'}}>Sem obstáculos mapeados.</div>}
      </div>;
    })}
  </div>;
}

function IdentidadeTab({st,setSt}){
  const[texto,setTexto]=useState('');
  const td=TODAY();
  const hoje=new Date().toDateString();
  const frase=useMemo(()=>st.frases[Math.floor(Math.random()*st.frases.length)]||'',[]);

  function updAfirm(gid,v){setSt(p=>({...p,afirmacoes:{...p.afirmacoes,[gid]:v}}));}
  function marcar(gid){
    setSt(p=>{
      const sk=p.streaks[gid]||{atual:0,recorde:0,ultima:null};
      if(sk.ultima===hoje)return p;
      const ontem=new Date();ontem.setDate(ontem.getDate()-1);
      const seq=sk.ultima===ontem.toDateString()?sk.atual+1:1;
      return{...p,streaks:{...p.streaks,[gid]:{atual:seq,recorde:Math.max(seq,sk.recorde),ultima:hoje}}};
    });
  }
  function saveDiary(){
    if(!texto.trim())return;
    setSt(p=>({...p,diario:[{id:uid(),data:new Date().toLocaleDateString('pt-BR'),iso:new Date().toISOString(),texto:texto.trim()},...p.diario]}));
    setTexto('');
  }
  function addFrase(){
    const f=prompt('Nova frase:');
    if(f?.trim())setSt(p=>({...p,frases:[...p.frases,f.trim()]}));
  }

  return<div>
    {/* Frase */}
    <div style={{padding:'12px 14px',background:'var(--ac1)',border:'1px solid var(--ac2)',borderRadius:'var(--r)',marginBottom:'16px',fontStyle:'italic',color:'var(--ac)',lineHeight:1.5}}>"{frase}"<button className="btn-ic"style={{marginLeft:'8px',fontSize:'.7rem'}}onClick={addFrase}>+ frase</button></div>

    {/* Afirmações */}
    <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.09em',marginBottom:'10px'}}>Afirmações de Identidade</div>
    {st.goals.map(g=><div key={g.id}style={{background:'var(--card)',border:`1px solid var(--bd)`,borderLeft:`3px solid var(--ac)`,borderRadius:'var(--r)',padding:'10px 12px',marginBottom:'8px'}}>
      <div style={{fontSize:'.75rem',color:'var(--ac)',fontWeight:700,marginBottom:'5px'}}>{g.emoji} {g.name}</div>
      <textarea rows={2}value={st.afirmacoes[g.id]||''}onChange={e=>updAfirm(g.id,e.target.value)}placeholder="Eu sou..."style={{fontStyle:'italic'}}/>
    </div>)}

    {/* Streaks */}
    <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.09em',margin:'16px 0 10px'}}>Consistência — Fiz Hoje</div>
    <div className="g2c mb16">
      {st.goals.map(g=>{
        const sk=st.streaks[g.id]||{atual:0,recorde:0,ultima:null};
        const feito=sk.ultima===hoje;
        return<div key={g.id}style={{background:'var(--card)',border:`1px solid ${feito?'var(--ac2)':'var(--bd)'}`,borderRadius:'var(--r)',padding:'12px',textAlign:'center'}}>
          <div style={{fontSize:'.78rem',color:'var(--tx2)',marginBottom:'4px'}}>{g.emoji}</div>
          <div style={{fontFamily:'var(--fm)',fontSize:'2rem',fontWeight:700,color:feito?'var(--ac)':'var(--bd2)',lineHeight:1}}>{sk.atual}</div>
          <div style={{fontSize:'.65rem',color:'var(--tx3)',fontFamily:'var(--fm)',marginBottom:'8px'}}>dias · rec:{sk.recorde}</div>
          <button onClick={()=>marcar(g.id)}disabled={feito}style={{background:feito?'var(--ac1)':'var(--ac)',border:`1px solid var(--ac)`,color:feito?'var(--ac)':'#000',padding:'5px',borderRadius:'5px',fontSize:'.72rem',fontWeight:700,cursor:feito?'default':'pointer',width:'100%'}}>{feito?'✓ Feito':'Fiz hoje!'}</button>
        </div>;
      })}
    </div>

    {/* Diário */}
    <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.09em',marginBottom:'10px'}}>Diário do Sistema</div>
    <div style={{fontSize:'.68rem',color:'var(--tx3)',fontFamily:'var(--fm)',marginBottom:'4px'}}>{new Date().toLocaleDateString('pt-BR')}</div>
    <textarea rows={4}value={texto}onChange={e=>setTexto(e.target.value)}placeholder="Como foi hoje? O que funcionou? O que aprendi?"style={{marginBottom:'8px'}}/>
    <button className="btn btn-ac w100"onClick={saveDiary}>Salvar reflexão</button>
    {st.diario.slice(0,14).map(e=><div key={e.id}className="diary-e mt8">
      <div style={{fontSize:'.68rem',color:'var(--tx3)',fontFamily:'var(--fm)',marginBottom:'3px'}}>{e.data}</div>
      <div style={{fontSize:'.82rem',color:'var(--tx)',lineHeight:1.5,whiteSpace:'pre-wrap'}}>{e.texto}</div>
    </div>)}
  </div>;
}

function getNoteStyle(colorKey){
  const c=NOTE_COLORS.find(x=>x.k===colorKey)||NOTE_COLORS[0];
  return{background:c.bg,borderColor:c.bd};
}

function NoteModal({open,onClose,onSave,init,cats}){
  const blank={title:'',type:'texto',content:'',items:[],imageData:null,color:'default',catId:'',pinned:false};
  const[f,setF]=useState(init||blank);
  const[newItem,setNewItem]=useState('');
  const fileRef=useRef();
  useEffect(()=>{setF(init||blank);setNewItem('');},[open]);

  function addItem(){
    if(!newItem.trim())return;
    setF(p=>({...p,items:[...p.items,{id:uid(),text:newItem.trim(),done:false}]}));
    setNewItem('');
  }
  function togItem(id){setF(p=>({...p,items:p.items.map(i=>i.id===id?{...i,done:!i.done}:i)}));}
  function delItem(id){setF(p=>({...p,items:p.items.filter(i=>i.id!==id)}));}
  function handleImage(e){
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>setF(p=>({...p,imageData:ev.target.result,type:'imagem'}));
    r.readAsDataURL(file);
  }
  function save(){onSave({...f,updatedAt:TODAY()});onClose();}

  const types=[{k:'texto',l:'📝 Texto'},{k:'lista',l:'✅ Lista'},{k:'imagem',l:'🖼 Imagem'}];
  return<Modal open={open}onClose={onClose}title={init?'Editar nota':'Nova nota'}>
    {/* Type selector */}
    <div className="stabs mb10">
      {types.map(t=><button key={t.k}className={`stab${f.type===t.k?' on':''}`}onClick={()=>setF(p=>({...p,type:t.k}))}>{t.l}</button>)}
    </div>
    <Fld label="Título (opcional)"><input value={f.title}onChange={e=>setF(p=>({...p,title:e.target.value}))}placeholder="Título da nota..."/></Fld>

    {/* Content by type */}
    {f.type==='texto'&&<Fld label="Conteúdo">
      <textarea rows={5}value={f.content}onChange={e=>setF(p=>({...p,content:e.target.value}))}placeholder="Escreva aqui..."/>
    </Fld>}

    {f.type==='lista'&&<Fld label="Itens">
      {f.items.map(item=><div key={item.id}className="fc g8 mb6">
        <Chk on={item.done}onChange={()=>togItem(item.id)}/>
        <span style={{flex:1,fontSize:'.85rem',textDecoration:item.done?'line-through':'none',color:item.done?'var(--tx3)':'var(--tx)'}}>{item.text}</span>
        <button className="btn-ic"style={{color:'var(--er)'}}onClick={()=>delItem(item.id)}>×</button>
      </div>)}
      <div className="fc g6 mt4">
        <input value={newItem}onChange={e=>setNewItem(e.target.value)}onKeyDown={e=>e.key==='Enter'&&addItem()}placeholder="Novo item... (Enter)"/>
        <button className="btn btn-ac"style={{padding:'6px 10px',flexShrink:0}}onClick={addItem}>+</button>
      </div>
    </Fld>}

    {f.type==='imagem'&&<div>
      {f.imageData&&<img src={f.imageData}style={{width:'100%',borderRadius:'8px',marginBottom:'8px',maxHeight:'200px',objectFit:'cover'}}/>}
      <button className="btn btn-gh w100"onClick={()=>fileRef.current.click()}>📎 {f.imageData?'Trocar imagem':'Adicionar imagem'}</button>
      <input ref={fileRef}type="file"accept="image/*"style={{display:'none'}}onChange={handleImage}/>
      {f.imageData&&<Fld label="Legenda" style={{marginTop:'8px'}}>
        <input value={f.content}onChange={e=>setF(p=>({...p,content:e.target.value}))}placeholder="Legenda opcional..."/>
      </Fld>}
    </div>}

    {/* Bottom row: category + color + pin */}
    <div className="g2c mt12">
      <Fld label="Categoria">
        <select value={f.catId}onChange={e=>setF(p=>({...p,catId:e.target.value}))}>
          <option value="">Sem categoria</option>
          {cats.map(c=><option key={c.id}value={c.id}>{c.name}</option>)}
        </select>
      </Fld>
      <Fld label="Cor do card">
        <select value={f.color}onChange={e=>setF(p=>({...p,color:e.target.value}))}>
          {NOTE_COLORS.map(c=><option key={c.k}value={c.k}>{c.name}</option>)}
        </select>
      </Fld>
    </div>
    <div className="fc g10 mt4">
      <Chk on={f.pinned}onChange={()=>setF(p=>({...p,pinned:!p.pinned}))}/>
      <span style={{fontSize:'.85rem',color:'var(--tx2)'}}>Fixar nota no topo</span>
    </div>
    <Btns>
      <button className="btn btn-gh"onClick={onClose}>Cancelar</button>
      <button className="btn btn-ac"onClick={save}>Salvar</button>
    </Btns>
  </Modal>;
}

function AnotacoesSection({st,setSt}){
  const[modal,setModal]=useState(false);
  const[edit,setEdit]=useState(null);
  const[search,setSearch]=useState('');
  const[catFilter,setCatFilter]=useState('');
  const[catModal,setCatModal]=useState(false);
  const[newCat,setNewCat]=useState({name:'',color:'#a855f7'});

  const CAT_COLORS=['#a855f7','#3b82f6','#22c55e','#eab308','#ef4444','#ec4899','#06b6d4','#f97316'];

  function saveNote(f){
    const td=TODAY();
    if(edit){
      setSt(p=>({...p,notes:p.notes.map(n=>n.id===edit.id?{...n,...f}:n)}));
    }else{
      setSt(p=>({...p,notes:[{...f,id:uid(),createdAt:td,archived:false},...p.notes]}));
    }
    setEdit(null);
  }
  function delNote(id){setSt(p=>({...p,notes:p.notes.filter(n=>n.id!==id)}));}
  function pinNote(id){setSt(p=>({...p,notes:p.notes.map(n=>n.id===id?{...n,pinned:!n.pinned}:n)}));}
  function archiveNote(id){setSt(p=>({...p,notes:p.notes.map(n=>n.id===id?{...n,archived:!n.archived}:n)}));}
  function addCat(){
    if(!newCat.name.trim())return;
    setSt(p=>({...p,noteCategories:[...p.noteCategories,{id:uid(),...newCat}]}));
    setNewCat({name:'',color:'#a855f7'});setCatModal(false);
  }
  function delCat(id){setSt(p=>({...p,noteCategories:p.noteCategories.filter(c=>c.id!==id)}));}

  const notes=useMemo(()=>{
    let n=(st.notes||[]).filter(x=>!x.archived);
    if(search)n=n.filter(x=>(x.title+x.content+x.items.map(i=>i.text).join(' ')).toLowerCase().includes(search.toLowerCase()));
    if(catFilter)n=n.filter(x=>x.catId===catFilter);
    // pinned first
    return [...n.filter(x=>x.pinned),...n.filter(x=>!x.pinned)];
  },[st.notes,search,catFilter]);

  const cats=st.noteCategories||[];

  return<div className="sec">
    {/* Header */}
    <div className="fcb mb10">
      <div className="sch-t">📝 Anotações</div>
      <div className="fc g6">
        <button className="btn btn-gh"style={{fontSize:'.75rem',padding:'5px 10px'}}onClick={()=>setCatModal(true)}>🏷 Cats</button>
        <button className="btn btn-ac"onClick={()=>{setEdit(null);setModal(true);}}>+ Nota</button>
      </div>
    </div>

    {/* Search */}
    <input value={search}onChange={e=>setSearch(e.target.value)}placeholder="🔍 Buscar nas anotações..."style={{marginBottom:'10px'}}/>

    {/* Category filter */}
    <div className="stabs mb14">
      <button className={`stab${catFilter===''?' on':''}`}onClick={()=>setCatFilter('')}>Todas</button>
      {cats.map(c=><button key={c.id}className={`stab${catFilter===c.id?' on':''}`}onClick={()=>setCatFilter(c.id)}style={catFilter===c.id?{background:c.color+'18',borderColor:c.color+'44',color:c.color}:{}}>{c.name}</button>)}
    </div>

    {/* Notes grid */}
    {notes.length===0&&<div style={{color:'var(--tx3)',textAlign:'center',padding:'32px 0',fontSize:'.9rem'}}>
      {search?'Nenhuma nota encontrada.':'Sem anotações. Crie a primeira!'}
    </div>}
    <div className="notes-masonry">
      {notes.map(note=>{
        const cat=cats.find(c=>c.id===note.catId);
        const ns=getNoteStyle(note.color);
        return<div key={note.id}className="note-card"style={ns}onClick={()=>{setEdit(note);setModal(true);}}>
          {note.pinned&&<div className="note-pin">📌</div>}
          {note.type==='imagem'&&note.imageData&&<img src={note.imageData}className="note-img"onClick={e=>e.stopPropagation()}/>}
          {note.title&&<div className="note-title"style={{paddingRight:note.pinned?'20px':'0'}}>{note.title}</div>}
          {note.type==='texto'&&note.content&&<div className="note-text">{note.content}</div>}
          {note.type==='lista'&&<div>{note.items.slice(0,6).map(item=><div key={item.id}className={`note-item${item.done?' done':''}`}>
            <div style={{width:10,height:10,borderRadius:2,flexShrink:0,border:`1.5px solid ${item.done?'var(--ac)':'var(--bd2)'}`,background:item.done?'var(--ac)':'transparent'}}/>
            <span>{item.text}</span>
          </div>)}
          {note.items.length>6&&<div style={{fontSize:'.72rem',color:'var(--tx3)',marginTop:'4px'}}>+{note.items.length-6} itens</div>}
          </div>}
          {note.type==='imagem'&&note.content&&<div className="note-text"style={{marginTop:'4px'}}>{note.content}</div>}
          <div className="note-footer"onClick={e=>e.stopPropagation()}>
            <div>{cat&&<span className="cat-tag"style={{background:cat.color+'18',color:cat.color}}>{cat.name}</span>}</div>
            <div className="note-actions">
              <button className="btn-ic"onClick={e=>{e.stopPropagation();pinNote(note.id);}}title={note.pinned?'Desafixar':'Fixar'}>📌</button>
              <button className="btn-ic"onClick={e=>{e.stopPropagation();archiveNote(note.id);}}title="Arquivar">📦</button>
              <button className="btn-ic"style={{color:'var(--er)'}}onClick={e=>{e.stopPropagation();delNote(note.id);}}>🗑</button>
            </div>
          </div>
        </div>;
      })}
    </div>

    {/* Note modal */}
    <NoteModal open={modal}onClose={()=>{setModal(false);setEdit(null);}}onSave={saveNote}init={edit}cats={cats}/>

    {/* Category modal */}
    <Modal open={catModal}onClose={()=>setCatModal(false)}title="Categorias de notas">
      <div className="flex col g6 mb12">
        {cats.map(c=><div key={c.id}className="fcb"style={{padding:'6px 10px',background:'var(--card2)',borderRadius:'6px'}}>
          <div className="fc g8"><div style={{width:12,height:12,borderRadius:'50%',background:c.color}}/><span style={{fontSize:'.85rem'}}>{c.name}</span></div>
          <button className="btn-ic"style={{color:'var(--er)'}}onClick={()=>delCat(c.id)}>🗑</button>
        </div>)}
      </div>
      <div className="fc g6 mb8">
        <input value={newCat.name}onChange={e=>setNewCat(p=>({...p,name:e.target.value}))}onKeyDown={e=>e.key==='Enter'&&addCat()}placeholder="Nova categoria..."/>
        <div className="fc g4"style={{flexWrap:'wrap',flexShrink:0}}>
          {CAT_COLORS.map(col=><div key={col}className={`swatch${newCat.color===col?' on':''}`}style={{background:col,width:20,height:20}}onClick={()=>setNewCat(p=>({...p,color:col}))}/>)}
        </div>
      </div>
      <button className="btn btn-ac w100"onClick={addCat}>+ Adicionar categoria</button>
    </Modal>
  </div>;
}

function fmtBRL(v){return(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}

function GastoFixoModal({open,onClose,onSave,init}){
  const blank={nome:'',valor:'',categoria:'moradia',dia:1,ativo:true,pago:false};
  const[f,setF]=useState(init||blank);
  useEffect(()=>{setF(init||blank);},[open]);
  function save(){if(!f.nome.trim()||!f.valor)return;onSave({...f,valor:+f.valor});onClose();}
  return<Modal open={open}onClose={onClose}title={init?'Editar Gasto':'Novo Gasto Fixo'}>
    <Fld label="Nome"><input value={f.nome}onChange={e=>setF(p=>({...p,nome:e.target.value}))}placeholder="Ex: Aluguel, Internet, Academia..."/></Fld>
    <div className="g2c">
      <Fld label="Valor (R$)"><input type="number"min={0}step={0.01}value={f.valor}onChange={e=>setF(p=>({...p,valor:e.target.value}))}placeholder="0,00"/></Fld>
      <Fld label="Dia de vencimento"><input type="number"min={1}max={31}value={f.dia}onChange={e=>setF(p=>({...p,dia:+e.target.value}))}/></Fld>
    </div>
    <Fld label="Categoria">
      <select value={f.categoria}onChange={e=>setF(p=>({...p,categoria:e.target.value}))}>
        {FIN_CATS.map(c=><option key={c.k}value={c.k}>{c.l}</option>)}
      </select>
    </Fld>
    <div className="fc g10 mt8">
      <Tog on={f.ativo}onChange={()=>setF(p=>({...p,ativo:!p.ativo}))}/>
      <span style={{fontSize:'.85rem',color:'var(--tx2)'}}>Recorrente (todo mês)</span>
    </div>
    <Btns>
      <button className="btn btn-gh"onClick={onClose}>Cancelar</button>
      <button className="btn btn-ac"onClick={save}>Salvar</button>
    </Btns>
  </Modal>;
}

function GastoCartaoModal({open,onClose,onSave,init,cartoes,mesAtual}){
  const blank={nome:'',valor:'',categoria:'outros',cartaoId:'',parcelas:1,recorrente:false,mesAno:mesAtual};
  const[f,setF]=useState({...blank,cartaoId:cartoes[0]?.id||''});
  useEffect(()=>{setF(init?{...init}:{...blank,cartaoId:cartoes[0]?.id||'',mesAno:mesAtual});},[open]);
  function save(){
    if(!f.nome.trim()||!f.valor||!f.cartaoId)return;
    onSave({...f,valor:+f.valor,mesAno:f.recorrente?null:(f.mesAno||mesAtual)});
    onClose();
  }
  return<Modal open={open}onClose={onClose}title={init?'Editar Gasto':'Novo Gasto no Cartão'}>
    <Fld label="Descrição"><input value={f.nome}onChange={e=>setF(p=>({...p,nome:e.target.value}))}placeholder="Ex: Netflix, Spotify, Compra..."/></Fld>
    <div className="g2c">
      <Fld label="Valor (R$)"><input type="number"min={0}step={0.01}value={f.valor}onChange={e=>setF(p=>({...p,valor:e.target.value}))}placeholder="0,00"/></Fld>
      <Fld label="Parcelas"><input type="number"min={1}max={48}value={f.parcelas}onChange={e=>setF(p=>({...p,parcelas:+e.target.value}))}/></Fld>
    </div>
    <div className="g2c">
      <Fld label="Cartão">
        <select value={f.cartaoId}onChange={e=>setF(p=>({...p,cartaoId:e.target.value}))}>
          {cartoes.map(c=><option key={c.id}value={c.id}>{c.nome}</option>)}
        </select>
      </Fld>
      <Fld label="Categoria">
        <select value={f.categoria}onChange={e=>setF(p=>({...p,categoria:e.target.value}))}>
          {FIN_CATS.map(c=><option key={c.k}value={c.k}>{c.l}</option>)}
        </select>
      </Fld>
    </div>
    <div className="fc g10 mt8">
      <Tog on={f.recorrente}onChange={()=>setF(p=>({...p,recorrente:!p.recorrente}))}/>
      <span style={{fontSize:'.85rem',color:'var(--tx2)'}}>{f.recorrente?'🔁 Aparece todo mês':'📅 Só neste mês'}</span>
    </div>
    {!f.recorrente&&<div style={{marginTop:8}}>
      <Fld label="Mês de referência">
        <input type="month"value={f.mesAno||mesAtual}onChange={e=>setF(p=>({...p,mesAno:e.target.value}))}/>
      </Fld>
    </div>}
    <Btns>
      <button className="btn btn-gh"onClick={onClose}>Cancelar</button>
      <button className="btn btn-ac"onClick={save}>Salvar</button>
    </Btns>
  </Modal>;
}

function FinancasSection({st,setSt}){
  const now=new Date();
  const[yr,setYr]=useState(now.getFullYear());
  const[mo,setMo]=useState(now.getMonth()+1);
  const[sub,setSub]=useState('fixos');
  const[modalFixo,setModalFixo]=useState(false);
  const[modalCartao,setModalCartao]=useState(false);
  const[modalNovoCartao,setModalNovoCartao]=useState(false);
  const[editFixo,setEditFixo]=useState(null);
  const[editCartao,setEditCartao]=useState(null);
  const[novoCartao,setNovoCartao]=useState({nome:'',cor:CARD_COLORS[0],limite:''});

  const MONTH_NAMES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const fin=st.financas||{renda:0,gastosFixos:[],pagamentos:{},cartoes:[],gastosCartao:[]};
  const mk=monthKey(yr,mo);
  const pagMes=fin.pagamentos?.[mk]||{};
  const isCurrentMonth=yr===now.getFullYear()&&mo===now.getMonth()+1;

  function prevMonth(){if(mo===1){setYr(y=>y-1);setMo(12);}else setMo(m=>m-1);}
  function nextMonth(){if(mo===12){setYr(y=>y+1);setMo(1);}else setMo(m=>m+1);}
  function goToday(){const n=new Date();setYr(n.getFullYear());setMo(n.getMonth()+1);}

  function setFin(updater){
    setSt(p=>{
      const prev=p.financas||{renda:0,gastosFixos:[],pagamentos:{},cartoes:[],gastosCartao:[]};
      const next=typeof updater==='function'?updater(prev):{...prev,...updater};
      return{...p,financas:next};
    });
  }

  // Verifica se um gasto de cartão deve aparecer no mês mk
  // - recorrente: sempre aparece
  // - parcelas > 1: aparece do mês de início até (início + parcelas - 1)
  // - parcela única: aparece só no mês exato
  function gastoAparece(g){
    if(g.recorrente)return true;
    if(!g.mesAno)return false;
    const[sy,sm]=g.mesAno.split('-').map(Number);
    const[ky,km]=mk.split('-').map(Number);
    const diff=(ky*12+km)-(sy*12+sm);
    const total=(!g.parcelas||g.parcelas<1)?1:g.parcelas;
    return diff>=0&&diff<total;
  }
  // Retorna qual parcela é a atual (ex: 2 de 3)
  function parcelaAtual(g){
    if(!g.parcelas||g.parcelas<=1||!g.mesAno)return null;
    const[sy,sm]=g.mesAno.split('-').map(Number);
    const[ky,km]=mk.split('-').map(Number);
    return(ky*12+km)-(sy*12+sm)+1;
  }

  // Filter cartão expenses to current month
  const gastosDoMes=(fin.gastosCartao||[]).filter(gastoAparece);

  const totalFixos=(fin.gastosFixos||[]).filter(g=>g.ativo).reduce((s,g)=>s+(+g.valor||0),0);
  const totalPago=(fin.gastosFixos||[]).filter(g=>pagMes[g.id]&&g.ativo).reduce((s,g)=>s+(+g.valor||0),0);
  const totalCartao=gastosDoMes.reduce((s,g)=>s+(+g.valor||0),0);
  const totalGeral=totalFixos+totalCartao;
  const renda=+fin.renda||0;
  const pctRenda=renda>0?Math.min(100,Math.round((totalGeral/renda)*100)):0;

  function saveFixo(f){
    if(editFixo)setFin(p=>({...p,gastosFixos:p.gastosFixos.map(g=>g.id===editFixo.id?{...g,...f}:g)}));
    else setFin(p=>({...p,gastosFixos:[...p.gastosFixos,{...f,id:uid()}]}));
    setEditFixo(null);
  }
  function delFixo(id){setFin(p=>({...p,gastosFixos:p.gastosFixos.filter(g=>g.id!==id)}));}
  function togPago(id){
    setFin(p=>({
      ...p,
      pagamentos:{
        ...(p.pagamentos||{}),
        [mk]:{...((p.pagamentos||{})[mk]||{}),[id]:!((p.pagamentos||{})[mk]||{})[id]}
      }
    }));
  }

  function saveGastoCartao(f){
    if(editCartao)setFin(p=>({...p,gastosCartao:p.gastosCartao.map(g=>g.id===editCartao.id?{...g,...f}:g)}));
    else setFin(p=>({...p,gastosCartao:[...p.gastosCartao,{...f,id:uid()}]}));
    setEditCartao(null);
  }
  function delGastoCartao(id){setFin(p=>({...p,gastosCartao:p.gastosCartao.filter(g=>g.id!==id)}));}

  function addCartao(){
    if(!novoCartao.nome.trim())return;
    setFin(p=>({...p,cartoes:[...p.cartoes,{...novoCartao,id:uid(),limite:+novoCartao.limite||0}]}));
    setNovoCartao({nome:'',cor:CARD_COLORS[0],limite:''});
    setModalNovoCartao(false);
  }
  function delCartao(id){setFin(p=>({...p,cartoes:p.cartoes.filter(c=>c.id!==id),gastosCartao:p.gastosCartao.filter(g=>g.cartaoId!==id)}));}

  const cartoes=fin.cartoes||[];

  return<div className="sec">
    {/* Navegação de mês */}
    <div className="fcb mb14"style={{background:'var(--card)',border:'1px solid var(--bd)',borderRadius:'var(--r)',padding:'10px 14px'}}>
      <button className="btn-ic"style={{fontSize:'1.3rem',padding:'2px 10px',color:'var(--tx2)'}}onClick={prevMonth}>‹</button>
      <div style={{textAlign:'center',flex:1}}>
        <div style={{fontWeight:700,fontSize:'1rem'}}>{MONTH_NAMES[mo-1]} {yr}</div>
        <div style={{fontSize:'.67rem',color:'var(--tx3)',textTransform:'uppercase',letterSpacing:'.07em'}}>finanças mensais</div>
      </div>
      <div className="fc g6">
        {!isCurrentMonth&&<button className="btn btn-gh"style={{padding:'4px 10px',fontSize:'.72rem'}}onClick={goToday}>Hoje</button>}
        <button className="btn-ic"style={{fontSize:'1.3rem',padding:'2px 10px',color:'var(--tx2)'}}onClick={nextMonth}>›</button>
      </div>
    </div>

    {/* Resumo */}
    <div className="card mb14">
      <div className="fcb mb12">
        <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.07em'}}>Resumo — {MONTH_NAMES[mo-1]}</div>
        <div className="fc g8">
          <span style={{fontSize:'.72rem',color:'var(--tx3)',flexShrink:0}}>Renda:</span>
          <input type="number"min={0}value={fin.renda||''}onChange={e=>setFin(p=>({...p,renda:+e.target.value}))}placeholder="R$ 0,00"style={{width:110,padding:'3px 8px',fontSize:'.8rem',fontFamily:'var(--fm)'}}/>
        </div>
      </div>
      <div className="g3c mb10">
        <div className="mcrd"><div className="mval"style={{fontSize:'1.1rem',color:'#ef4444'}}>{fmtBRL(totalFixos)}</div><div className="mlbl">Gastos fixos</div></div>
        <div className="mcrd"><div className="mval"style={{fontSize:'1.1rem',color:'#a855f7'}}>{fmtBRL(totalCartao)}</div><div className="mlbl">Cartão</div></div>
        <div className="mcrd"><div className="mval"style={{fontSize:'1.1rem'}}>{fmtBRL(totalGeral)}</div><div className="mlbl">Total</div></div>
      </div>
      {renda>0&&<div>
        <div className="fcb mb4">
          <span style={{fontSize:'.72rem',color:'var(--tx2)'}}>Comprometido da renda</span>
          <span style={{fontSize:'.75rem',fontFamily:'var(--fm)',fontWeight:700,color:pctRenda>80?'#ef4444':pctRenda>60?'#eab308':'#22c55e'}}>{pctRenda}% · {fmtBRL(renda-totalGeral)} livre</span>
        </div>
        <PBar val={totalGeral}max={renda}color={pctRenda>80?'#ef4444':pctRenda>60?'#eab308':'#22c55e'}/>
      </div>}
    </div>

    {/* Subtabs */}
    <div className="stabs mb14">
      <button className={`stab${sub==='fixos'?' on':''}`}onClick={()=>setSub('fixos')}>💸 Gastos Fixos</button>
      <button className={`stab${sub==='cartao'?' on':''}`}onClick={()=>setSub('cartao')}>💳 Cartão de Crédito</button>
    </div>

    {/* ── ABA GASTOS FIXOS ── */}
    {sub==='fixos'&&<div>
      <div className="sch">
        <div className="sch-t">Contas Fixas Mensais</div>
        <button className="btn btn-ac"onClick={()=>{setEditFixo(null);setModalFixo(true);}}>+ Adicionar</button>
      </div>
      {(fin.gastosFixos||[]).length===0&&<div style={{color:'var(--tx3)',fontSize:'.88rem',padding:'28px 0',textAlign:'center'}}>
        Nenhum gasto fixo ainda.<br/>
        <span style={{fontSize:'.78rem'}}>Clique em "+ Adicionar" para começar.</span>
      </div>}
      {[...(fin.gastosFixos||[])].sort((a,b)=>a.dia-b.dia).map(g=>{
        const cat=FIN_CATS.find(c=>c.k===g.categoria)||FIN_CATS[7];
        const pago=!!pagMes[g.id];
        return<div key={g.id}className="tsk-row"style={{borderColor:pago?'#22c55e44':'var(--bd)',opacity:g.ativo?1:.45}}>
          <Chk on={pago}onChange={()=>togPago(g.id)}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:600,fontSize:'.88rem',textDecoration:pago?'line-through':'none',color:pago?'var(--tx3)':'var(--tx)'}}>{g.nome}</div>
            <div className="fc g6 mt4"style={{flexWrap:'wrap'}}>
              <span style={{fontSize:'.68rem',padding:'1px 7px',borderRadius:4,background:cat.c+'1a',color:cat.c,fontWeight:600}}>{cat.l}</span>
              <span style={{fontSize:'.68rem',color:'var(--tx3)'}}>vence dia {g.dia}</span>
              {!g.ativo&&<span style={{fontSize:'.65rem',color:'var(--tx3)'}}>· inativo</span>}
            </div>
          </div>
          <div style={{fontFamily:'var(--fm)',fontWeight:700,color:pago?'#22c55e':'var(--tx)',fontSize:'.9rem',minWidth:80,textAlign:'right',marginRight:6}}>{fmtBRL(+g.valor||0)}</div>
          <button className="btn-ic"onClick={()=>{setEditFixo(g);setModalFixo(true);}}>✏️</button>
          <button className="btn-ic"style={{color:'var(--er)'}}onClick={()=>delFixo(g.id)}>🗑</button>
        </div>;
      })}
      {(fin.gastosFixos||[]).length>0&&<div style={{marginTop:10,padding:'10px 14px',background:'var(--card2)',border:'1px solid var(--bd)',borderRadius:'var(--r)'}}>
        <div className="fcb">
          <div className="fc g12">
            <span style={{fontSize:'.78rem',color:'#22c55e'}}>✓ Pago: {fmtBRL(totalPago)}</span>
            <span style={{fontSize:'.78rem',color:'var(--tx3)'}}>Pendente: {fmtBRL(totalFixos-totalPago)}</span>
          </div>
          <span style={{fontFamily:'var(--fm)',fontWeight:700,fontSize:'.95rem',color:'#ef4444'}}>{fmtBRL(totalFixos)}</span>
        </div>
      </div>}
    </div>}

    {/* ── ABA CARTÃO ── */}
    {sub==='cartao'&&<div>
      {cartoes.length===0
        ?<div style={{textAlign:'center',padding:'32px 0',color:'var(--tx3)'}}>
            <div style={{fontSize:'2rem',marginBottom:8}}>💳</div>
            <div style={{fontSize:'.9rem',marginBottom:16}}>Nenhum cartão cadastrado ainda.</div>
            <button className="btn btn-ac"onClick={()=>setModalNovoCartao(true)}>+ Adicionar cartão</button>
          </div>
        :<div>
          <div className="sch">
            <div className="sch-t">Cartões — {MONTH_NAMES[mo-1]}</div>
            <div className="fc g8">
              <button className="btn btn-gh"onClick={()=>setModalNovoCartao(true)}>+ Cartão</button>
              <button className="btn btn-ac"onClick={()=>{setEditCartao(null);setModalCartao(true);}}>+ Gasto</button>
            </div>
          </div>

          {/* Cards preview */}
          <div style={{display:'flex',gap:10,overflowX:'auto',paddingBottom:10,marginBottom:14}}>
            {cartoes.map(c=>{
              const tot=gastosDoMes.filter(g=>g.cartaoId===c.id).reduce((s,g)=>s+(+g.valor||0),0);
              const pct=c.limite>0?Math.min(100,Math.round((tot/c.limite)*100)):0;
              return<div key={c.id}style={{minWidth:180,flex:'0 0 180px',background:`linear-gradient(135deg,${c.cor}22,${c.cor}0a)`,border:`1px solid ${c.cor}44`,borderRadius:12,padding:'14px'}}>
                <div className="fcb mb8">
                  <div style={{width:32,height:20,borderRadius:4,background:`linear-gradient(135deg,${c.cor},${c.cor}99)`}}/>
                  <button className="btn-ic"style={{color:'var(--er)',fontSize:'.7rem'}}onClick={()=>delCartao(c.id)}>✕</button>
                </div>
                <div style={{fontWeight:700,fontSize:'.85rem',marginBottom:6}}>{c.nome}</div>
                <div style={{fontFamily:'var(--fm)',fontSize:'1.2rem',fontWeight:700,color:c.cor}}>{fmtBRL(tot)}</div>
                {c.limite>0&&<div style={{fontSize:'.65rem',color:'var(--tx3)',marginTop:2,marginBottom:5}}>limite {fmtBRL(c.limite)} · {pct}% usado</div>}
                {c.limite>0&&<PBar val={tot}max={c.limite}color={pct>80?'#ef4444':pct>60?'#eab308':c.cor}/>}
              </div>;
            })}
          </div>

          {/* Gastos por cartão */}
          {cartoes.map(c=>{
            const gastos=gastosDoMes.filter(g=>g.cartaoId===c.id);
            if(!gastos.length)return null;
            return<div key={c.id}style={{marginBottom:18}}>
              <div style={{fontSize:'.72rem',fontWeight:700,color:c.cor,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:8,paddingLeft:4}}>
                {c.nome} — {fmtBRL(gastos.reduce((s,g)=>s+(+g.valor||0),0))}
              </div>
              {gastos.map(g=>{
                const cat=FIN_CATS.find(x=>x.k===g.categoria)||FIN_CATS[7];
                return<div key={g.id}className="tsk-row">
                  <div style={{width:3,alignSelf:'stretch',borderRadius:2,background:c.cor,flexShrink:0,marginRight:4}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:'.88rem'}}>{g.nome}</div>
                    <div className="fc g6 mt4"style={{flexWrap:'wrap'}}>
                      <span style={{fontSize:'.68rem',padding:'1px 7px',borderRadius:4,background:cat.c+'1a',color:cat.c,fontWeight:600}}>{cat.l}</span>
                      {g.parcelas>1&&(()=>{const pa=parcelaAtual(g);return<span style={{fontSize:'.68rem',fontFamily:'var(--fm)',color:'var(--ac)',fontWeight:700}}>{pa}/{g.parcelas}x</span>;})()}
                      {g.recorrente
                        ?<span style={{fontSize:'.65rem',background:'var(--ac1)',color:'var(--ac)',padding:'1px 6px',borderRadius:4}}>🔁 recorrente</span>
                        :g.parcelas<=1&&<span style={{fontSize:'.68rem',color:'var(--tx3)'}}>📅 {g.mesAno}</span>}
                    </div>
                  </div>
                  <div style={{fontFamily:'var(--fm)',fontWeight:700,fontSize:'.9rem',minWidth:80,textAlign:'right',marginRight:6}}>{fmtBRL(+g.valor||0)}</div>
                  <button className="btn-ic"onClick={()=>{setEditCartao(g);setModalCartao(true);}}>✏️</button>
                  <button className="btn-ic"style={{color:'var(--er)'}}onClick={()=>delGastoCartao(g.id)}>🗑</button>
                </div>;
              })}
            </div>;
          })}

          <div style={{padding:'10px 14px',background:'var(--card2)',border:'1px solid var(--bd)',borderRadius:'var(--r)'}}>
            <div className="fcb">
              <span style={{fontSize:'.8rem',color:'var(--tx2)'}}>Total cartão — {MONTH_NAMES[mo-1]}</span>
              <span style={{fontFamily:'var(--fm)',fontWeight:700,color:'#a855f7'}}>{fmtBRL(totalCartao)}</span>
            </div>
          </div>
        </div>
      }
    </div>}

    {/* Modais */}
    <GastoFixoModal open={modalFixo}onClose={()=>{setModalFixo(false);setEditFixo(null);}}onSave={saveFixo}init={editFixo}/>
    {cartoes.length>0&&<GastoCartaoModal open={modalCartao}onClose={()=>{setModalCartao(false);setEditCartao(null);}}onSave={saveGastoCartao}init={editCartao}cartoes={cartoes}mesAtual={mk}/>}

    <Modal open={modalNovoCartao}onClose={()=>setModalNovoCartao(false)}title="Novo Cartão">
      <Fld label="Nome do cartão"><input value={novoCartao.nome}onChange={e=>setNovoCartao(p=>({...p,nome:e.target.value}))}placeholder="Ex: Nubank, Itaú, Inter..."/></Fld>
      <Fld label="Limite (opcional)"><input type="number"min={0}value={novoCartao.limite}onChange={e=>setNovoCartao(p=>({...p,limite:e.target.value}))}placeholder="R$ 0,00"/></Fld>
      <Fld label="Cor do cartão">
        <div className="fc g8 mt4"style={{flexWrap:'wrap'}}>
          {CARD_COLORS.map(c=><div key={c}onClick={()=>setNovoCartao(p=>({...p,cor:c}))}style={{width:26,height:26,borderRadius:6,background:c,cursor:'pointer',border:`2px solid ${novoCartao.cor===c?'#fff':'transparent'}`,transform:novoCartao.cor===c?'scale(1.2)':'none',transition:'transform .12s'}}/>)}
        </div>
      </Fld>
      <Btns>
        <button className="btn btn-gh"onClick={()=>setModalNovoCartao(false)}>Cancelar</button>
        <button className="btn btn-ac"onClick={addCartao}>Adicionar</button>
      </Btns>
    </Modal>
  </div>;
}

// ── MENTE / REPROGRAMAÇÃO DE CRENÇAS ─────────────────────────────────────────

const CRENCA_AREAS=[
  {k:'amor',         l:'Amor',         emoji:'❤️', c:'#ec4899'},
  {k:'esporte',      l:'Esporte',      emoji:'⚽', c:'#22c55e'},
  {k:'profissional', l:'Profissional', emoji:'💼', c:'#3b82f6'},
  {k:'geral',        l:'Vida',         emoji:'✨', c:'#a855f7'},
];
const EVID_META=20; // nº de evidências para instalar 100% da crença

function crencaForca(c){
  const n=(c.evidencias||[]).length;
  return Math.min(100,Math.round(n/EVID_META*100));
}
function crencaNivel(f){
  if(f>=100)return{t:'Instalada 🦋',c:'#22c55e'};
  if(f>=75)return{t:'Quase instalada',c:'#22c55e'};
  if(f>=45)return{t:'Ganhando força',c:'#eab308'};
  if(f>=15)return{t:'Criando raiz',c:'#f59e0b'};
  if(f>0)return{t:'Primeiros brotos',c:'#f97316'};
  return{t:'Semente plantada 🌱',c:'var(--tx3)'};
}
function ritualStreak(log){
  let s=0;const now=new Date();
  for(let i=0;i<365;i++){
    const d=new Date(now);d.setDate(now.getDate()-i);
    const ds=localDateStr(d);
    if(log&&log[ds])s++;else if(i===0)continue;else break;
  }
  return s;
}

// Ritual guiado em tela cheia
function ReprogramMode({st,setSt,onClose}){
  const itens=(st.crencas?.itens)||[];
  const ac=st.config.accentOverride||(THEMES.find(t=>t.id===st.config.themeId)||THEMES[0]).ac;
  const[step,setStep]=useState(0); // 0=intro, 1..N=crenças, N+1=fim
  const total=itens.length;
  const isIntro=step===0;
  const isEnd=step===total+1;
  const cur=(!isIntro&&!isEnd)?itens[step-1]:null;
  const area=cur?CRENCA_AREAS.find(a=>a.k===cur.area):null;

  function finish(){
    const td=TODAY();
    setSt(p=>({...p,crencas:{...p.crencas,ritualLog:{...(p.crencas?.ritualLog||{}),[td]:true}}}));

// Coroa de louros (para habilidades dominadas) — desenhada em SVG
function Laurel({color}){
  const cx=44,cy=46,R=34;
  const angsL=[112,134,156,178,200,222];
  const angsR=[68,46,24,2,340,318];
  const leaf=(a,k)=>{
    const rad=a*Math.PI/180;
    const x=cx+R*Math.cos(rad),y=cy+R*Math.sin(rad);
    return<ellipse key={k}cx={x}cy={y}rx={3}ry={6.6}transform={`rotate(${a+90} ${x} ${y})`}fill={color}/>;
  };
  return<svg viewBox="0 0 88 88"style={{width:'100%',height:'100%',display:'block'}}>
    <g style={{filter:`drop-shadow(0 0 2px ${color})`}}opacity="0.92">
      {angsL.map((a,i)=>leaf(a,'l'+i))}
      {angsR.map((a,i)=>leaf(a,'r'+i))}
    </g>
  </svg>;
}

function SkillNode({skill,pal,selected,stl,onClick}){
  const S=stl||DEF_STYLE;
  const g=S.glow||1;
  const bl=(n)=>Math.round(n*g); // blur escalado pelo brilho
  const max=skill.maxNivel||1;
  const lv=Math.min(skill.nivel||0,max);
  const pct=Math.round(lv/max*100);
  const started=lv>0;
  const maxed=lv>=max;
  const d=pal.d,s=pal.s;
  const TRACK='#2B394C';
  // anel de progresso (destaque sobre trilho metálico)
  const ring=started?`conic-gradient(${d} ${pct}%, ${TRACK} ${pct}%)`:TRACK;
  // fundo suave (halo) atrás do nó
  const halo=started?`radial-gradient(circle, ${d}66, ${d}00 70%)`:'radial-gradient(circle, rgba(68,86,109,.30), rgba(68,86,109,0) 70%)';
  // moldura (rim de pedra/metal) ao redor — pode ser desligada
  const frameBg=!S.moldura?'transparent':started?`radial-gradient(circle at 50% 34%, ${d}2e, ${s}16)`:'radial-gradient(circle at 50% 34%, #20364F, #11223A)';
  const frameBorder=!S.moldura?'transparent':selected||maxed?'#FFF1B3':started?d+'99':'#33455B';
  const stoneShadow=S.moldura?`inset 0 1px 2px rgba(255,255,255,.10), inset 0 -2px 5px rgba(0,0,0,.45)`:'';
  const outerGlow=selected?`0 0 ${bl(20)}px ${d}aa`:maxed?`0 0 ${bl(14)}px ${d}88`:started?`0 0 ${bl(9)}px ${d}44`:'';
  const frameGlow=[stoneShadow,outerGlow].filter(Boolean).join(', ')||'none';
  // entalhes/ticks no rim (estilo medalhão)
  const studColor=started?d:'#44566D';
  const studs=`repeating-conic-gradient(from 0deg, ${studColor} 0deg 2deg, transparent 2deg 11deg)`;
  // glow do anel interno
  let ringGlow;
  if(selected)ringGlow=`0 0 ${bl(14)}px ${d}`;
  else if(maxed)ringGlow=`0 0 ${bl(11)}px ${d}cc`;
  else if(started)ringGlow=`0 0 ${bl(7)}px ${d}66`;
  else ringGlow='none';
  // aura: borda fina brilhante que cresce a cada nível
  const auraD=72+lv*(S.auraStep||5);
  return<div className="skill-node"onClick={onClick}>
    <div className="skill-halo"style={{background:halo,opacity:selected?1:started?.9:.5}}/>
    {maxed&&S.louros&&<div className="skill-laurel"><Laurel color={d}/></div>}
    {started&&<div style={{position:'absolute',width:auraD,height:auraD,borderRadius:'50%',left:'50%',top:35,transform:'translate(-50%,-50%)',zIndex:0,border:`1.5px solid ${d}`,opacity:0.22+(lv/max)*0.55,boxShadow:`0 0 ${bl(4+lv*4)}px ${d}, inset 0 0 ${bl(3+lv*2)}px ${d}55`,pointerEvents:'none',transition:'all .3s ease'}}/>}
    <div className="skill-frame"style={{background:frameBg,border:`1px solid ${frameBorder}`,boxShadow:frameGlow,transition:'box-shadow .2s,border-color .2s'}}>
      {S.entalhes&&<div className="skill-studs"style={{background:studs,WebkitMaskImage:'radial-gradient(transparent 62%, #000 65%)',maskImage:'radial-gradient(transparent 62%, #000 65%)',opacity:started?0.85:0.45}}/>}
      <div className="skill-ring"style={{background:ring,padding:started?3:2,boxShadow:ringGlow}}>
        <div className="skill-core"style={{background:started?`radial-gradient(circle at 50% 32%, ${d}, ${s})`:'linear-gradient(145deg,#1D314A,#13263D)'}}>
          {/* ícone escuro sobre fundo dourado quando ativo */}
          <span style={{opacity:started?0.82:0.32,filter:started?'brightness(0)':'grayscale(1) brightness(.85)'}}>{skill.emoji}</span>
        </div>
      </div>
    </div>
    <div className="skill-badge"style={{
      background:'#0B1522',
      color:maxed?'#FFF1B3':started?d:'#5C6B7C',
      border:`1px solid ${maxed?'#FFF1B3':started?d:'#44566D'}`
    }}>{lv}/{max}</div>
    <div className="skill-name"style={{color:started?d:'#5C6B7C'}}>{skill.nome}</div>
  </div>;
}

function SkillNodeModal({skill,cor,onClose,onLevel,onEdit,onDelete}){
  if(!skill)return null;
  const max=skill.maxNivel||1;
  const lv=Math.min(skill.nivel||0,max);
  const mastery=lv>=max?'✓ Dominado':lv===0?'Não iniciado':'Em progresso';
  const sBtn=(en)=>({width:48,height:48,borderRadius:'50%',background:en?cor+'22':'var(--card2)',border:`1px solid ${en?cor+'66':'var(--bd2)'}`,color:en?cor:'var(--tx4)',fontSize:'1.6rem',fontWeight:700,cursor:en?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0});
  return<Modal open onClose={onClose}title={`${skill.emoji} ${skill.nome}`}>
    {skill.desc?<p style={{fontSize:'.85rem',color:'var(--tx2)',lineHeight:1.5,marginBottom:14}}>{skill.desc}</p>:null}
    <div className="fc"style={{justifyContent:'center',gap:24,margin:'4px 0 14px'}}>
      <button style={sBtn(lv>0)}onClick={()=>lv>0&&onLevel(-1)}>−</button>
      <div style={{textAlign:'center',minWidth:84}}>
        <div style={{fontFamily:'var(--fm)',fontSize:'2.3rem',fontWeight:700,color:cor,lineHeight:1}}>{lv}<span style={{color:'var(--tx3)',fontSize:'1.2rem'}}>/{max}</span></div>
        <div style={{fontSize:'.66rem',color:lv>=max?'#22c55e':'var(--tx3)',textTransform:'uppercase',letterSpacing:'.08em',marginTop:4}}>{mastery}</div>
      </div>
      <button style={sBtn(lv<max)}onClick={()=>lv<max&&onLevel(1)}>+</button>
    </div>
    <div style={{height:7,background:'rgba(255,255,255,.07)',borderRadius:4,overflow:'hidden',marginBottom:10}}>
      <div style={{height:'100%',width:(lv/max*100)+'%',background:lv>=max?'#22c55e':cor,borderRadius:4,transition:'width .3s'}}/>
    </div>
    {skill.levels&&<div style={{marginTop:12,paddingTop:8,borderTop:'1px solid rgba(255,255,255,.06)'}}>
      <div style={{fontSize:'.65rem',color:'var(--tx3)',marginBottom:6,fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em',textAlign:'center'}}>📏 Critérios por Nível</div>
      <div style={{maxHeight:160,overflowY:'auto',display:'flex',flexDirection:'column',gap:2,paddingRight:4}}>
        {skill.levels.map((d,i)=>(
          <div key={i} style={{display:'flex',alignItems:'flex-start',gap:6,padding:'4px 7px',borderRadius:5,background:lv===i?cor+'22':'transparent',border:lv===i?`1px solid ${cor}44`:'1px solid transparent',fontSize:'.72rem',color:lv===i?'var(--tx1)':i<=lv?'var(--tx2)':'var(--tx4)',lineHeight:1.35,transition:'all .2s'}}>
            <span style={{fontWeight:700,fontSize:'.65rem',minWidth:13,textAlign:'right',color:lv===i?cor:i<=lv?cor+'aa':cor+'44'}}>{i}</span>
            <span>{d}</span>
          </div>
        ))}
      </div>
    </div>}
    <div style={{textAlign:'center',fontSize:'.68rem',color:'var(--tx3)',marginBottom:14}}>⚡ Cada nível vale <b style={{color:cor}}>+{XP_PER_SKILL_LEVEL} XP</b> no seu nível (aba Missão)</div>
    <Btns>
      <button className="btn btn-gh"onClick={onEdit}>✏️ Editar</button>
      <button className="btn"style={{background:'rgba(239,68,68,.12)',color:'#ef4444',border:'1px solid rgba(239,68,68,.3)'}}onClick={onDelete}>🗑 Remover</button>
    </Btns>
  </Modal>;
}

function SkillFormModal({open,onClose,onSave,init,subcats,maxTier}){
  const list=subcats||[];
  const blank={nome:'',emoji:'⭐',maxNivel:3,subcat:list[0]?list[0].id:'',tier:1,desc:''};
  const[f,setF]=useState(init||blank);
  useEffect(()=>{
    const base=init?{...blank,...init}:{...blank};
    if(!base.levels)base.levels=Array.from({length:(base.maxNivel||3)+1},()=>'');
    setF(base);
  },[open]);
  function save(){if(!f.nome.trim())return;onSave({...f,maxNivel:Math.max(1,Math.min(9,+f.maxNivel||1)),tier:Math.max(1,+f.tier||1),subcat:f.subcat||(list[0]?list[0].id:''),levels:(f.levels||[]).slice(0,Math.max(1,Math.min(9,+f.maxNivel||1))+1)});onClose();}
  function handleMaxChange(val){
    const n=Math.max(1,Math.min(9,+val||1));
    setF(p=>{
      const cur=p.levels||[];
      const next=Array.from({length:n+1},(_,i)=>i<cur.length?cur[i]:'');
      return{...p,maxNivel:n,levels:next};
    });
  }
  function setLv(i,v){setF(p=>({...p,levels:(p.levels||[]).map((d,j)=>j===i?v:d)}));}
  const tierOpts=[];for(let i=1;i<=(maxTier||1)+1;i++)tierOpts.push(i);
  return<Modal open={open}onClose={onClose}title={init&&init.id?'Editar Habilidade':'Nova Habilidade'}>
    <div className="g2c">
      <Fld label="Emoji"><input value={f.emoji}onChange={e=>setF(p=>({...p,emoji:e.target.value}))}maxLength={4}placeholder="⭐"/></Fld>
      <Fld label="Nome"><input value={f.nome}onChange={e=>setF(p=>({...p,nome:e.target.value}))}placeholder="Ex: Drible"/></Fld>
    </div>
    <div className="g2c">
      <Fld label="Subcategoria (coluna)">
        <select value={f.subcat}onChange={e=>setF(p=>({...p,subcat:e.target.value}))}>
          {list.map(sc=><option key={sc.id}value={sc.id}>{sc.nome}</option>)}
        </select>
      </Fld>
      <Fld label="Prateleira (fileira)">
        <select value={f.tier}onChange={e=>setF(p=>({...p,tier:+e.target.value}))}>
          {tierOpts.map(i=><option key={i}value={i}>{i===(maxTier||1)+1?`${i} (nova)`:i}</option>)}
        </select>
      </Fld>
    </div>
    <Fld label="Níveis (máximo)"><input type="number"min={1}max={9}value={f.maxNivel}onChange={e=>handleMaxChange(e.target.value)}/></Fld>
    <Fld label="Descrição (opcional)"><textarea rows={2}value={f.desc}onChange={e=>setF(p=>({...p,desc:e.target.value}))}placeholder="Detalhes, referências, o que dominar..."/></Fld>
    {(f.levels||[]).length>0&&<div style={{marginTop:12,paddingTop:8,borderTop:'1px solid rgba(255,255,255,.06)'}}>
      <div style={{fontSize:'.65rem',color:'var(--tx3)',marginBottom:6,fontWeight:600,textTransform:'uppercase',letterSpacing:'.08em',textAlign:'center'}}>📏 Critérios por Nível</div>
      <div style={{display:'flex',flexDirection:'column',gap:3,marginBottom:8}}>
        {(f.levels||[]).map((d,i)=>(
          <div key={i}style={{display:'flex',gap:4,alignItems:'center'}}>
            <span style={{fontWeight:700,fontSize:'.65rem',minWidth:13,textAlign:'right',color:'var(--tx3)'}}>{i}</span>
            <input value={d}onChange={e=>setLv(i,e.target.value)}placeholder={`Critério p/ nível ${i}`}style={{flex:1,minWidth:0}}/>
          </div>
        ))}
      </div>
    </div>}
    <Btns>
      <button className="btn btn-gh"onClick={onClose}>Cancelar</button>
      <button className="btn btn-ac"onClick={save}>Salvar</button>
    </Btns>
  </Modal>;
}

    <div className="g2c">

      <div className="fc g8 mt4"style={{flexWrap:'wrap'}}>

        <button className="btn btn-gh"onClick={onClose}>Cancelar</button>

function SkillTreeSection({st,setSt}){
  const trees=(st.skilltree&&st.skilltree.trees)||[];
  const stl=readStyle(st);
  const[sel,setSel]=useState(trees[0]?trees[0].id:null);
  const[nodeSel,setNodeSel]=useState(null);
  const[showStyle,setShowStyle]=useState(false);
  const[skillModal,setSkillModal]=useState(false);
  const[editSkill,setEditSkill]=useState(null);
  const[skillPreset,setSkillPreset]=useState(null);
  const[treeModal,setTreeModal]=useState(false);
  const[editTree,setEditTree]=useState(null);

  function setTrees(updater){
    setSt(p=>{
      const prev=(p.skilltree&&p.skilltree.trees)||[];
      const next=typeof updater==='function'?updater(prev):updater;
      return{...p,skilltree:{...(p.skilltree||{}),trees:next}};
    });
  }
  function setStyle(patch){
    setSt(p=>({...p,skilltree:{...(p.skilltree||{}),style:{...DEF_STYLE,...((p.skilltree&&p.skilltree.style)||{}),...patch}}}));
  }
  function applyPreset(name){setStyle({...SKILL_STYLE_PRESETS[name],preset:name});}

  const tree=trees.find(t=>t.id===sel)||trees[0]||null;

  // ── ações ──
  function setLevel(treeId,skillId,delta){
    setTrees(ts=>ts.map(t=>t.id!==treeId?t:{...t,skills:t.skills.map(s=>s.id!==skillId?s:{...s,nivel:Math.max(0,Math.min(s.maxNivel||1,(s.nivel||0)+delta))})}));
  }
  function saveSkill(f){
    if(!tree)return;
    if(editSkill)setTrees(ts=>ts.map(t=>t.id!==tree.id?t:{...t,skills:t.skills.map(s=>s.id===editSkill.id?{...s,...f}:s)}));
    else setTrees(ts=>ts.map(t=>t.id!==tree.id?t:{...t,skills:[...t.skills,{...f,id:uid(),nivel:0}]}));
    setEditSkill(null);
  }
  function delSkill(treeId,skillId){
    setTrees(ts=>ts.map(t=>t.id!==treeId?t:{...t,skills:t.skills.filter(s=>s.id!==skillId)}));
  }
  function saveTree(f){
    if(editTree)setTrees(ts=>ts.map(t=>t.id===editTree.id?{...t,...f}:t));
    else{const nid=uid();setTrees(ts=>[...ts,{...f,id:nid,skills:[]}]);setSel(nid);}
    setEditTree(null);
  }
  function delTree(id){
    setTrees(ts=>ts.filter(t=>t.id!==id));
    const rest=trees.filter(t=>t.id!==id);
    setSel(rest[0]?rest[0].id:null);
  }
  // subcategorias (colunas)
  function addSubcat(){if(!tree)return;setTrees(ts=>ts.map(t=>t.id!==tree.id?t:{...t,subcats:[...(t.subcats||[]),{id:uid(),nome:'Nova coluna'}]}));}
  function renameSubcat(scid,nome){setTrees(ts=>ts.map(t=>t.id!==tree.id?t:{...t,subcats:(t.subcats||[]).map(sc=>sc.id===scid?{...sc,nome}:sc)}));}
  function delSubcat(scid){setTrees(ts=>ts.map(t=>t.id!==tree.id?t:{...t,subcats:(t.subcats||[]).filter(sc=>sc.id!==scid),skills:t.skills.map(s=>s.subcat===scid?{...s,subcat:''}:s)}));}

  if(!tree){
    return<div className="sec st-screen">
      <div style={{textAlign:'center',padding:'50px 0',color:'#5C6B7C'}}>
        <div style={{fontSize:'2.5rem',marginBottom:10}}>🌳</div>
        <div style={{fontFamily:'var(--serif)',letterSpacing:'.08em',fontSize:'.9rem',marginBottom:16}}>Nenhuma árvore de habilidades ainda.</div>
        <button className="btn"style={{background:'#F5D98C',color:'#0B1522',fontFamily:'var(--serif)',letterSpacing:'.08em'}}onClick={()=>{setEditTree(null);setTreeModal(true);}}>+ CRIAR ÁREA</button>
      </div>
      <TreeFormModal open={treeModal}onClose={()=>setTreeModal(false)}onSave={saveTree}init={editTree}/>
    </div>;
  }

  const pal=treePalette(tree);

  const totLv=tree.skills.reduce((s,k)=>s+(k.nivel||0),0);
  const totMax=tree.skills.reduce((s,k)=>s+(k.maxNivel||0),0);
  const pct=totMax?Math.round(totLv/totMax*100):0;
  const dominadas=tree.skills.filter(k=>(k.nivel||0)>=(k.maxNivel||1)).length;

  // agrupa por subcategoria (coluna) × prateleira (fileira) → grade alinhada
  const subcats=tree.subcats||[];
  const bySub={};
  subcats.forEach(sc=>{bySub[sc.id]=[];});
  const orphan=[];
  tree.skills.forEach(s=>{if(s.subcat&&bySub[s.subcat])bySub[s.subcat].push(s);else orphan.push(s);});
  const columns=[...subcats.map(sc=>({sc,skills:bySub[sc.id]})),...(orphan.length?[{sc:{id:'__outros',nome:'Outros'},skills:orphan,orphan:true}]:[])];
  const allTiers=tree.skills.map(s=>s.tier||1);
  const maxTier=allTiers.length?Math.max(...allTiers):1;
  columns.forEach(col=>{col.byTier={};col.skills.forEach(s=>{const t=s.tier||1;(col.byTier[t]=col.byTier[t]||[]).push(s);});});
  const COLW=82,nCols=columns.length;

  const liveSkill=nodeSel?tree.skills.find(s=>s.id===nodeSel):null;

  // Fundo temático da árvore (emoji da área como marca d'água + lavagem na cor predominante)
  const fi=stl.fundoIntensidade;
  const _bgSvg=`<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><text x='50' y='66' font-size='46' text-anchor='middle' opacity='0.05'>${tree.emoji}</text></svg>`;
  const _washes=`radial-gradient(ellipse 130% 55% at 50% -8%, ${pal.d}${_ah(0.13*fi)}, transparent 62%), radial-gradient(ellipse at 50% 112%, ${pal.s}${_ah(0.16*fi)}, transparent 55%)`;
  const treeBg=_washes+(stl.fundoTema?`, url("data:image/svg+xml,${encodeURIComponent(_bgSvg)}")`:'');
  // borda neon dos ramos (personalizável)
  const neon=stl.neon!=null?stl.neon:1;
  const branchBg=`linear-gradient(180deg, ${pal.s}1f, rgba(11,21,34,0.5))`;
  const branchBorder=`1.5px solid ${pal.d}${_ah(Math.min(0.95,0.3+neon*0.32))}`;
  const branchGlow=`0 0 ${Math.round(5+neon*13)}px ${pal.d}${_ah(Math.min(0.75,neon*0.4))}, inset 0 0 ${Math.round(neon*16)}px ${pal.s}${_ah(Math.min(0.45,neon*0.18))}`;

  return<div className="sec st-screen">
    {/* Seletor de áreas */}
    <div className="st-chips">
      {trees.map(t=>{
        const tp=treePalette(t);
        const on=sel===t.id;
        return<button key={t.id}className="st-chip"onClick={()=>setSel(t.id)}style={on?{background:`linear-gradient(135deg,${tp.d}22,${tp.s}11)`,borderColor:tp.d,color:tp.d,boxShadow:`0 0 10px ${tp.d}55`}:{}}>{t.emoji} {t.nome}</button>;
      })}
      <button className="st-chip"onClick={()=>{setEditTree(null);setTreeModal(true);}}>＋</button>
    </div>

    {/* Cabeçalho da árvore */}
    <div className="st-panel"style={{border:`1px solid ${pal.d}55`,boxShadow:`inset 0 0 30px ${pal.s}22`}}>
      <div style={{position:'absolute',top:-14,right:-4,fontSize:'5.4rem',opacity:.12,userSelect:'none',pointerEvents:'none',filter:`drop-shadow(0 0 8px ${pal.d})`}}>{tree.emoji}</div>
      <div className="fcb mb10">
        <div className="fc g10">
          <span style={{fontSize:'1.9rem',filter:`drop-shadow(0 0 6px ${pal.d}88)`}}>{tree.emoji}</span>
          <div>
            <div className="st-title"style={{fontSize:'1.5rem',color:pal.d,textShadow:`0 0 12px ${pal.d}66`}}>{tree.nome}</div>
            <div className="st-sub">{dominadas} dominadas · {tree.skills.length} habilidades</div>
          </div>
        </div>
        <div className="fc g4">
          <button className="btn-ic"style={{color:pal.d,fontSize:'.9rem'}}onClick={addSubcat}title="Nova subcategoria (coluna)">➕</button>
          <button className="btn-ic"style={{color:showStyle?pal.d:'#5C6B7C'}}onClick={()=>setShowStyle(v=>!v)}title="Personalizar visual">🎨</button>
          <button className="btn-ic"style={{color:pal.d}}onClick={()=>{setEditTree(tree);setTreeModal(true);}}>✏️</button>
        </div>
      </div>
      <div className="fcb mb4">
        <span className="st-label">Maestria geral</span>
        <span style={{fontFamily:'var(--serif)',fontSize:'.78rem',fontWeight:700,color:pal.d,letterSpacing:'.05em'}}>{totLv}/{totMax} · {pct}%</span>
      </div>
      <div style={{height:7,background:'#0B1522',borderRadius:4,overflow:'hidden',border:'1px solid #2B394C'}}>
        <div style={{height:'100%',width:pct+'%',background:`linear-gradient(90deg,${pal.s},${pal.d})`,borderRadius:4,transition:'width .5s ease',boxShadow:`0 0 8px ${pal.d}`}}/>
      </div>
    </div>

    {/* Painel de personalização */}
    {showStyle&&<SkillStylePanel stl={stl}setStyle={setStyle}applyPreset={applyPreset}/>}

    {/* Árvore — ramos (subcategorias) lado a lado; cada fileira aceita várias habilidades */}
    <div style={{position:'relative',borderRadius:10,overflow:'hidden'}}>
      {tree.id==='futebol'&&<div style={{position:'absolute',inset:0,backgroundImage:"url('futebol-bg.jpg')",backgroundSize:'cover',backgroundPosition:'center 30%',filter:'grayscale(1)',opacity:0.13,zIndex:0,pointerEvents:'none',borderRadius:10}}/>}
      {tree.id==='futevolei'&&<div style={{position:'absolute',inset:0,backgroundImage:"url('futevolei-bg.png')",backgroundSize:'cover',backgroundPosition:'center',filter:'grayscale(1)',opacity:0.09,zIndex:0,pointerEvents:'none',borderRadius:10}}/>}
      {tree.id==='tantan'&&<div style={{position:'absolute',inset:0,backgroundImage:"url('tantan-bg.png')",backgroundSize:'cover',backgroundPosition:'center',filter:'grayscale(1)',opacity:0.09,zIndex:0,pointerEvents:'none',borderRadius:10}}/>}
      {tree.id==='surdo'&&<div style={{position:'absolute',inset:0,backgroundImage:"url('surdo-bg.png')",backgroundSize:'cover',backgroundPosition:'center',filter:'grayscale(1)',opacity:0.09,zIndex:0,pointerEvents:'none',borderRadius:10}}/>}

function ConquistasSection({st,setSt}){
  const[modal,setModal]=useState(false);
  const[nb,setNb]=useState({name:'',emoji:'🏅',desc:''});

  // Auto-check badges
  const td=TODAY();
  const totalDoneHabits=Object.values(st.habitLog).reduce((s,day)=>s+Object.values(day).filter(Boolean).length,0);
  const totalTasks=st.tasks.filter(t=>t.done).length;
  const dayLog=st.habitLog[td]||{};
  const allDoneToday=st.habits.filter(h=>h.active).every(h=>dayLog[h.id]);

  function unlock(bid){setSt(p=>({...p,badges:p.badges.map(b=>b.id===bid?{...b,unlocked:true}:b)}));}
  function unlockCustom(bid){setSt(p=>({...p,customBadges:p.customBadges.map(b=>b.id===bid?{...b,unlocked:true}:b)}));}
  function saveCustom(){
    if(!nb.name.trim())return;
    setSt(p=>({...p,customBadges:[...p.customBadges,{...nb,id:uid(),unlocked:false}]}));
    setNb({name:'',emoji:'🏅',desc:''});setModal(false);
  }
  function delCustom(id){setSt(p=>({...p,customBadges:p.customBadges.filter(b=>b.id!==id)}));}

  // Auto-unlock logic (simplified)
  useEffect(()=>{
    const updates=st.badges.map(b=>{
      if(b.unlocked)return b;
      if(b.type==='habits_total'&&totalDoneHabits>=b.threshold)return{...b,unlocked:true};
      if(b.type==='tasks_total'&&totalTasks>=b.threshold)return{...b,unlocked:true};
      if(b.type==='all_habits_day'&&allDoneToday)return{...b,unlocked:true};
      return b;
    });
    if(updates.some((b,i)=>b.unlocked!==st.badges[i].unlocked))setSt(p=>({...p,badges:updates}));
  },[totalDoneHabits,totalTasks,allDoneToday]);

  const all=[...st.badges,...st.customBadges];

  return<div className="sec">
    <div className="sch">
      <div className="sch-t">🏆 Conquistas</div>
      <button className="btn btn-ac"onClick={()=>setModal(true)}>+ Criar</button>
    </div>
    <div className="g2c">
      {all.map(b=>{
        const isCustom=!b.auto;
        return<div key={b.id}className={`badge${b.unlocked?' done':' locked'}`}style={{cursor:isCustom?'pointer':'default'}}onClick={()=>{if(isCustom&&!b.unlocked)unlockCustom(b.id);}}>
          <div style={{fontSize:'2rem',marginBottom:'6px'}}>{b.emoji}</div>
          <div style={{fontWeight:700,fontSize:'.82rem',marginBottom:'3px'}}>{b.name}</div>
          <div style={{fontSize:'.72rem',color:'var(--tx2)',lineHeight:1.4}}>{b.desc}</div>
          {b.unlocked&&<div style={{fontSize:'.68rem',color:'var(--ac)',marginTop:'6px',fontWeight:700}}>✓ Desbloqueada</div>}
          {isCustom&&!b.unlocked&&<div style={{fontSize:'.68rem',color:'var(--tx3)',marginTop:'6px'}}>Toque para desbloquear</div>}
          {isCustom&&<button className="btn-ic"style={{color:'var(--er)',position:'absolute',top:6,right:6}}onClick={e=>{e.stopPropagation();delCustom(b.id);}}>×</button>}
        </div>;
      })}
    </div>
    <Modal open={modal}onClose={()=>setModal(false)}title="Nova Conquista">
      <div className="g2c"><Fld label="Emoji"><input value={nb.emoji}onChange={e=>setNb(p=>({...p,emoji:e.target.value}))}maxLength={4}/></Fld>
      <Fld label="Nome"><input value={nb.name}onChange={e=>setNb(p=>({...p,name:e.target.value}))}placeholder="Minha conquista"/></Fld></div>
      <Fld label="Descrição"><textarea rows={2}value={nb.desc}onChange={e=>setNb(p=>({...p,desc:e.target.value}))}placeholder="Quando conquistar isso..."/></Fld>
      <Btns><button className="btn btn-gh"onClick={()=>setModal(false)}>Cancelar</button><button className="btn btn-ac"onClick={saveCustom}>Criar</button></Btns>
    </Modal>
  </div>;
}

:root{

*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:var(--fs);}
body{background:var(--bg);color:var(--tx);font-family:var(--ff);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
#root{min-height:100vh;display:flex;flex-direction:column;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px;}
input,textarea,select{background:var(--card2);border:1px solid var(--bd2);color:var(--tx);padding:8px 12px;border-radius:var(--r);font-size:.875rem;width:100%;outline:none;font-family:var(--ff);transition:border-color var(--tr);resize:vertical;}
input:focus,textarea:focus,select:focus{border-color:var(--ac);}
input::placeholder,textarea::placeholder{color:var(--tx4);}
select option{background:#1a1a1a;}
button{cursor:pointer;border:none;outline:none;font-family:var(--ff);transition:all var(--tr);}
/* layout */
.flex{display:flex;}.col{flex-direction:column;}.fc{display:flex;align-items:center;}.fcb{display:flex;align-items:center;justify-content:space-between;}
.g4{gap:4px;}.g6{gap:6px;}.g8{gap:8px;}.g10{gap:10px;}.g12{gap:12px;}.g16{gap:16px;}
.g2c{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3c{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.w100{width:100%;}.mt4{margin-top:4px;}.mt8{margin-top:8px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}.mb6{margin-bottom:6px;}.mb10{margin-bottom:10px;}.mb14{margin-bottom:14px;}.mb20{margin-bottom:20px;}
/* card */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;}
/* navbar */
.navbar{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:200;}
.nav-header{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--bd);}
.nav-tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 10px;}
.nav-tabs::-webkit-scrollbar{display:none;}
.tab-btn{display:flex;align-items:center;gap:4px;padding:8px 11px;background:none;border:none;color:var(--tx2);font-size:.78rem;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer;flex-shrink:0;transition:all var(--tr);}
.tab-btn.on{color:var(--ac);border-bottom-color:var(--ac);}
.tab-btn:hover{color:var(--tx);}
/* section */
.sec{padding:14px;flex:1;animation:fu .22s ease;}
@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
/* buttons */
.btn{padding:7px 14px;border-radius:var(--r);font-size:.8rem;font-weight:700;cursor:pointer;}
.btn-ac{background:var(--ac);color:#000;border:none;}.btn-ac:hover{opacity:.85;}
.btn-gh{background:var(--card2);border:1px solid var(--bd2);color:var(--tx2);}.btn-gh:hover{color:var(--tx);border-color:var(--bd3);}
.btn-ic{background:none;border:none;color:var(--tx3);padding:4px;font-size:.95rem;border-radius:4px;}.btn-ic:hover{color:var(--tx);}
.btn-er{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#ef4444;font-size:.75rem;padding:5px 10px;border-radius:var(--r);}
/* toggle */
.tog{width:34px;height:18px;border-radius:9px;background:var(--bd2);position:relative;cursor:pointer;transition:background var(--tr);flex-shrink:0;}
.tog.on{background:var(--ac);}
.tog-th{width:12px;height:12px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left var(--tr);}
.tog.on .tog-th{left:19px;}
/* checkbox */
.chk{width:18px;height:18px;border:2px solid var(--bd2);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;}
.chk.on{background:var(--ac);border-color:var(--ac);}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .18s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border:1px solid var(--bd2);border-radius:12px;padding:20px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;}
.modal-h{font-size:1.05rem;font-weight:700;margin-bottom:16px;}
/* field */
.fld{margin-bottom:10px;}
.fld label{display:block;font-size:.7rem;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}

.p-media{background:rgba(234,179,8,.14);color:#eab308;}
.p-baixa{background:rgba(34,197,94,.14);color:#22c55e;}

.stabs::-webkit-scrollbar{display:none;}
.stab{padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid var(--bd2);background:none;color:var(--tx2);transition:all .15s;}
.stab.on{background:var(--ac1);border-color:var(--ac2);color:var(--ac);}

.trk-cell{width:22px;height:22px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:.55rem;cursor:pointer;transition:all .12s;border:1px solid var(--bd2);flex-shrink:0;}
.trk-cell.done{border-color:transparent;}
.trk-cell.today{box-shadow:0 0 0 1px var(--ac);}

.mval{font-family:var(--fm);font-size:1.7rem;font-weight:700;color:var(--ac);line-height:1;}
.mlbl{font-size:.68rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;margin-top:3px;}
/* prog bar */
.pbar{height:5px;background:var(--bd2);border-radius:3px;overflow:hidden;}
.pfil{height:100%;border-radius:3px;transition:width .4s ease;}
/* badge */
.badge{border-radius:10px;padding:14px 10px;text-align:center;border:1px solid var(--bd);}
.badge.locked{opacity:.3;filter:grayscale(1);}
.badge.done{border-color:var(--ac2);background:var(--ac1);}

/* habit item */

/* section header */

/* category tag */

/* diario entry */

/* responsive */
@media(max-width:500px){

</style>

function loadSt(){
  try{
    const s=localStorage.getItem('sc-v2');
    if(s){const p=JSON.parse(s);const d=makeInit();return mergeDeep(d,p);}
  }catch(e){}
  return makeInit();
}
function mergeDeep(target,source){
  const out={...target};
  for(const k in source){
    if(source[k]&&typeof source[k]==='object'&&!Array.isArray(source[k])){
      out[k]=mergeDeep(target[k]||{},source[k]);
    }else{
      out[k]=source[k];
    }
  }
  return out;
}

// ── SCORE UTILS ──────────────────────────────────────────────────────────────

function getDayScore(st,dateStr){
  const tasks=st.tasks.filter(t=>t.date===dateStr&&t.done);
  const log=st.habitLog[dateStr]||{};
  const tScore=tasks.reduce((s,t)=>s+t.weight,0);
  const hScore=st.habits.reduce((s,h)=>log[h.id]?s+h.weight:s,0);
  if(st.config.scoreFormula==='weighted'){
    const hw=st.config.habitWeight/100;
    return Math.round(hScore*hw+tScore*(1-hw));
  }
  return tScore+hScore;
}
function getMonthScores(st,year,month){
  const days=daysInMonth(year,month);
  const mk=monthKey(year,month);
  return Array.from({length:days},(_,i)=>{
    const d=i+1;
    const ds=`${mk}-${String(d).padStart(2,'0')}`;
    return{day:d,score:getDayScore(st,ds),date:ds,isToday:ds===TODAY()};
  });
}

function applyTheme(config){
  const r=document.documentElement.style;
  r.setProperty('--ac',config.accent);
  r.setProperty('--ac1',config.accent+'18');
  r.setProperty('--ac2',config.accent+'38');
  const lv=BG_LVL[config.bgLevel]||BG_LVL.midnight;
  r.setProperty('--bg',lv.bg);
  r.setProperty('--card',lv.card);
  r.setProperty('--card2',lv.card2);
  r.setProperty('--bd',lv.bd);
  const fs={small:'13px',medium:'14px',large:'15px'};
  r.setProperty('--fs',fs[config.fontSize]||'14px');
}

function PBar({val,max=100,color}){

function StBtn({status,onChange}){

  </div>;
}
function SVGChart({data,accent}){
  const W=560,H=80;
  const max=Math.max(...data.map(d=>d.score),1);
  const bw=Math.max(4,Math.floor(W/data.length)-1);
  return<svg viewBox={`0 0 ${W} ${H}`}style={{width:'100%',height:'auto',display:'block'}}>
    {data.map((d,i)=>{
      const h=Math.max(3,(d.score/max)*(H-4));
      const x=i*(bw+1);
      const y=H-h;
      return<rect key={i}x={x}y={y}width={bw}height={h}rx={2}fill={d.isToday?accent:accent+'55'}/>;
    })}
  </svg>;
}

  const thisWeek=(()=>{const d=new Date();const mon=new Date(d);mon.setDate(d.getDate()-d.getDay()+1);const sun=new Date(mon);sun.setDate(mon.getDate()+6);return{start:mon.toISOString().slice(0,10),end:sun.toISOString().slice(0,10)};})();

  const tasks=useMemo(()=>{
    let t=st.tasks;

  function del(id){setSt(p=>({...p,tasks:p.tasks.filter(t=>t.id!==id)}));}

  return<div className="sec">

      {st.categories.map(c=><button key={c.id}className={`stab${catFilter===c.id?' on':''}`}onClick={()=>setCatFilter(c.id)}style={catFilter===c.id?{background:c.color+'18',borderColor:c.color+'44',color:c.color}:{}}>{c.name}</button>)}
    </div>

function HabitsList({st,setSt}){
  const[modal,setModal]=useState(false);
  const[edit,setEdit]=useState(null);
  const td=TODAY();
  const mk=td.slice(0,7);

  function save(f){
    if(edit)setSt(p=>({...p,habits:p.habits.map(h=>h.id===edit.id?{...h,...f}:h)}));
    else setSt(p=>({...p,habits:[...p.habits,{...f,id:uid(),order:p.habits.length}]}));
    setEdit(null);
  }
  function del(id){setSt(p=>({...p,habits:p.habits.filter(h=>h.id!==id)}));}
  function togActive(id){setSt(p=>({...p,habits:p.habits.map(h=>h.id===id?{...h,active:!h.active}:h)}));}
  function move(id,dir){
    setSt(p=>{
      const arr=[...p.habits].sort((a,b)=>a.order-b.order);
      const i=arr.findIndex(h=>h.id===id);
      const j=dir==='up'?i-1:i+1;
      if(j<0||j>=arr.length)return p;
      [arr[i].order,arr[j].order]=[arr[j].order,arr[i].order];
      return{...p,habits:arr};
    });
  }

  const habits=[...st.habits].sort((a,b)=>a.order-b.order);

  // calc month completions
  function monthCount(hid){
    let n=0;
    const yr=new Date().getFullYear();
    const mo=new Date().getMonth()+1;
    const days=daysInMonth(yr,mo);
    for(let d=1;d<=days;d++){
      const ds=`${mk}-${String(d).padStart(2,'0')}`;
      if(st.habitLog[ds]?.[hid])n++;
    }
    return n;
  }

  return<div>
    <div className="sch">
      <div className="sch-t">Hábitos</div>
      <button className="btn btn-ac"onClick={()=>{setEdit(null);setModal(true);}}>+ Hábito</button>
    </div>
    {habits.map(h=>{
      const mc=monthCount(h.id);
      return<div key={h.id}className="hab-row"style={{borderColor:h.active?h.color+'33':'var(--bd)',opacity:h.active?1:.55}}>
        <span style={{fontSize:'1.2rem'}}>{h.emoji}</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:600,fontSize:'.88rem'}}>{h.name}</div>
          <div className="fc g6 mt4"style={{flexWrap:'wrap'}}>
            <span style={{fontSize:'.68rem',fontFamily:'var(--fm)',color:h.color}}>{mc}/{h.monthlyGoal} este mês</span>
            <span style={{fontSize:'.68rem',color:'var(--tx3)'}}>+{h.weight}pts</span>
            <span style={{fontSize:'.68rem',color:'var(--tx3)'}}>{h.freq==='diario'?'Diário':'Semanal'}</span>
          </div>
          <div className="mt4"><PBar val={mc}max={h.monthlyGoal}color={h.color}/></div>
        </div>
        <div className="fc g6">
          <Tog on={h.active}onChange={()=>togActive(h.id)}/>
          <button className="btn-ic"onClick={()=>move(h.id,'up')}>↑</button>
          <button className="btn-ic"onClick={()=>move(h.id,'down')}>↓</button>
          <button className="btn-ic"onClick={()=>{setEdit(h);setModal(true);}}>✏️</button>
          <button className="btn-ic"style={{color:'var(--er)'}}onClick={()=>del(h.id)}>🗑</button>
        </div>
      </div>;
    })}
    <HabitModal open={modal}onClose={()=>{setModal(false);setEdit(null);}}onSave={save}init={edit}/>
  </div>;
}

function HabitsTracker({st,setSt}){
  const now=new Date();
  const[yr,setYr]=useState(now.getFullYear());
  const[mo,setMo]=useState(now.getMonth()+1);
  const days=daysInMonth(yr,mo);
  const mk=monthKey(yr,mo);
  const habits=[...st.habits].filter(h=>h.active).sort((a,b)=>a.order-b.order);
  const td=TODAY();

  function toggle(hid,day){
    const ds=`${mk}-${String(day).padStart(2,'0')}`;
    setSt(p=>({...p,habitLog:{...p.habitLog,[ds]:{...(p.habitLog[ds]||{}),[hid]:!(p.habitLog[ds]||{})[hid]}}}));
  }
  function prevMonth(){if(mo===1){setYr(y=>y-1);setMo(12);}else setMo(m=>m-1);}
  function nextMonth(){if(mo===12){setYr(y=>y+1);setMo(1);}else setMo(m=>m+1);}
  const mNames=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  return<div>
    {/* Month nav */}
    <div className="fcb mb14">
      <button className="btn btn-gh"style={{padding:'5px 10px'}}onClick={prevMonth}>‹</button>
      <div style={{fontFamily:'var(--fm)',fontWeight:700,fontSize:'.9rem'}}>{mNames[mo-1]} {yr}</div>
      <button className="btn btn-gh"style={{padding:'5px 10px'}}onClick={nextMonth}>›</button>
    </div>
    <div className="trk-wrap">
      <table style={{borderCollapse:'separate',borderSpacing:'2px',minWidth:'max-content'}}>
        <thead>
          <tr>
            <th style={{fontSize:'.68rem',color:'var(--tx2)',fontWeight:600,padding:'2px 8px 6px 0',textAlign:'left',whiteSpace:'nowrap',minWidth:'100px'}}>Hábito</th>
            {Array.from({length:days},(_,i)=>{
              const d=i+1;
              const ds=`${mk}-${String(d).padStart(2,'0')}`;
              const isT=ds===td;
              return<th key={d}style={{fontSize:'.65rem',color:isT?'var(--ac)':'var(--tx3)',fontWeight:isT?700:400,padding:'2px 1px',textAlign:'center',width:'24px'}}>{d}</th>;
            })}
          </tr>
        </thead>
        <tbody>
          {habits.map(h=>{
            const mc=Array.from({length:days},(_,i)=>{
              const ds=`${mk}-${String(i+1).padStart(2,'0')}`;
              return st.habitLog[ds]?.[h.id]?1:0;
            }).reduce((s,v)=>s+v,0);
            return<tr key={h.id}>
              <td style={{padding:'2px 8px 2px 0',whiteSpace:'nowrap'}}>
                <div className="fc g6">
                  <span style={{fontSize:'.9rem'}}>{h.emoji}</span>
                  <span style={{fontSize:'.75rem',fontWeight:500}}>{h.name}</span>
                  <span style={{fontSize:'.65rem',fontFamily:'var(--fm)',color:h.color}}>{mc}/{h.monthlyGoal}</span>
                </div>
              </td>
              {Array.from({length:days},(_,i)=>{
                const d=i+1;
                const ds=`${mk}-${String(d).padStart(2,'0')}`;
                const done=!!(st.habitLog[ds]?.[h.id]);
                const isT=ds===td;
                return<td key={d}style={{padding:'1px'}}>
                  <div className={`trk-cell${done?' done':''}${isT?' today':''}`}
                    style={{background:done?h.color:'transparent'}}
                    onClick={()=>toggle(h.id,d)}>
                    {done&&<span style={{color:'#fff'}}>✓</span>}
                  </div>
                </td>;
              })}
            </tr>;
          })}
        </tbody>
      </table>
    </div>
  </div>;
}

function DashboardSection({st,setSt}){
  const now=new Date();
  const[yr,setYr]=useState(now.getFullYear());
  const[mo,setMo]=useState(now.getMonth()+1);
  const td=TODAY();
  const mNames=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const scores=getMonthScores(st,yr,mo);
  const totalTasks=st.tasks.filter(t=>t.date.startsWith(monthKey(yr,mo))).length;
  const doneTasks=st.tasks.filter(t=>t.date.startsWith(monthKey(yr,mo))&&t.done).length;
  const todayScore=getDayScore(st,td);
  const avgScore=useMemo(()=>{const s=scores.filter(d=>d.score>0);return s.length?Math.round(s.reduce((a,d)=>a+d.score,0)/s.length):0;},[scores]);
  const bestDay=useMemo(()=>scores.reduce((b,d)=>d.score>b?d.score:b,0),[scores]);
  const daysWithData=scores.filter(d=>d.score>0).length;
  const totalDays=daysInMonth(yr,mo);
  const pctMonth=Math.round((daysWithData/totalDays)*100);

  // habits month progress
  const habitsProgress=st.habits.filter(h=>h.active).map(h=>{
    let done=0;
    for(let d=1;d<=totalDays;d++){
      const ds=`${monthKey(yr,mo)}-${String(d).padStart(2,'0')}`;
      if(st.habitLog[ds]?.[h.id])done++;
    }
    return{...h,done,pct:Math.round((done/Math.max(h.monthlyGoal,1))*100)};
  });

  // Day of week failure pattern
  const dayFails=Array(7).fill(0);
  scores.forEach(d=>{
    if(d.score===0){
      const dow=new Date(d.date+'T12:00:00').getDay();
      dayFails[dow]++;
    }
  });
  const worstDay=dayFails.indexOf(Math.max(...dayFails));

  function exp(){
    const data={period:`${mNames[mo-1]} ${yr}`,avgScore,bestDay,daysActive:daysWithData,tasksCompleted:doneTasks,habits:habitsProgress.map(h=>({name:h.name,done:h.done,goal:h.monthlyGoal,pct:h.pct+'%'}))};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`cerebro-${monthKey(yr,mo)}.json`;a.click();
  }

  function prevMonth(){if(mo===1){setYr(y=>y-1);setMo(12);}else setMo(m=>m-1);}
  function nextMonth(){if(mo===12){setYr(y=>y+1);setMo(1);}else setMo(m=>m+1);}

  return<div className="sec">
    <div className="fcb mb14">
      <div className="fcb g8">
        <button className="btn btn-gh"style={{padding:'5px 10px'}}onClick={prevMonth}>‹</button>
        <div style={{fontFamily:'var(--fm)',fontWeight:700,fontSize:'.88rem'}}>{mNames[mo-1]} {yr}</div>
        <button className="btn btn-gh"style={{padding:'5px 10px'}}onClick={nextMonth}>›</button>
      </div>
      <button className="btn btn-gh"style={{fontSize:'.75rem'}}onClick={exp}>⬇ Exportar</button>
    </div>

    {/* Metric cards */}
    <div className="g2c mb14">
      <div className="mcrd"><div className="mval">{todayScore}</div><div className="mlbl">Score hoje</div></div>
      <div className="mcrd"><div className="mval">{avgScore}</div><div className="mlbl">Média do mês</div></div>
      <div className="mcrd"><div className="mval">{bestDay}</div><div className="mlbl">Melhor dia</div></div>
      <div className="mcrd"><div className="mval">{doneTasks}/{totalTasks}</div><div className="mlbl">Tarefas</div></div>
    </div>

    {/* Chart */}
    <div className="card mb14">
      <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--tx2)',marginBottom:'10px',textTransform:'uppercase',letterSpacing:'.07em'}}>Score por dia — {mNames[mo-1]}</div>
      <SVGChart data={scores}accent={st.config.accent||'#FF6B00'}/>
      <div style={{display:'flex',justifyContent:'space-between',marginTop:'4px',fontSize:'.65rem',color:'var(--tx3)',fontFamily:'var(--fm)'}}>
        <span>1</span><span>{Math.floor(totalDays/2)}</span><span>{totalDays}</span>
      </div>
    </div>

    {/* % conclusão + padrão */}
    <div className="g2c mb14">
      <div className="card">
        <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:'8px'}}>Atividade do mês</div>
        <div style={{fontFamily:'var(--fm)',fontSize:'1.4rem',fontWeight:700,color:'var(--ac)'}}>{pctMonth}%</div>
        <div style={{fontSize:'.72rem',color:'var(--tx2)'}}>{daysWithData} de {totalDays} dias</div>
      </div>
      <div className="card">
        <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:'8px'}}>Padrão de falha</div>
        <div style={{fontFamily:'var(--fm)',fontSize:'1.1rem',fontWeight:700,color:'#ef4444'}}>{DAYS_LABEL[worstDay]}</div>
        <div style={{fontSize:'.72rem',color:'var(--tx2)'}}>é o dia mais difícil</div>
      </div>
    </div>

    {/* Habits progress */}
    <div className="card">
      <div style={{fontSize:'.78rem',fontWeight:700,color:'var(--tx2)',marginBottom:'12px',textTransform:'uppercase',letterSpacing:'.07em'}}>Progresso dos hábitos</div>
      {habitsProgress.map(h=><div key={h.id}style={{marginBottom:'10px'}}>
        <div className="fcb mb4">
          <span style={{fontSize:'.82rem',fontWeight:500}}>{h.emoji} {h.name}</span>
          <span style={{fontSize:'.72rem',fontFamily:'var(--fm)',color:h.color}}>{h.done}/{h.monthlyGoal} ({h.pct}%)</span>
        </div>
        <PBar val={h.done}max={h.monthlyGoal}color={h.color}/>
      </div>)}
    </div>
  </div>;
}

  function setStatus(id,s){setSt(p=>({...p,goals:p.goals.map(g=>g.id===id?{...g,status:s,updatedAt:TODAY()}:g)}));}
  function setMeta(id,f,v){setSt(p=>({...p,goals:p.goals.map(g=>g.id===id?{...g,[f]:v,updatedAt:TODAY()}:g)}));}
  return<div>
    <div className="sch">

            <button className="btn-ic"onClick={()=>{setEdit(g);setModal(true);}}>✏️</button>

function FacilitacaoTab({st,setSt}){
  const[inputs,setInputs]=useState({});

    setSt(p=>({...p,facilitacao:{...p.facilitacao,[gid]:{...(p.facilitacao[gid]||{facilitar:[],dificultar:[]}),[tipo]:[...((p.facilitacao[gid]||{})[tipo]||[]),{id:uid(),texto:txt,ok:false}]}}}));
    setInputs(p=>({...p,[k]:''}));
  }
  function togItem(gid,tipo,iid){
    setSt(p=>({...p,facilitacao:{...p.facilitacao,[gid]:{...p.facilitacao[gid],[tipo]:p.facilitacao[gid][tipo].map(i=>i.id===iid?{...i,ok:!i.ok}:i)}}}));
  }
  function delItem(gid,tipo,iid){
    setSt(p=>({...p,facilitacao:{...p.facilitacao,[gid]:{...p.facilitacao[gid],[tipo]:p.facilitacao[gid][tipo].filter(i=>i.id!==iid)}}}));
  }
  return<div>
    <div className="sch-t mb14">🔧 Facilitação</div>

              <button className="btn btn-ac"style={{padding:'6px 10px',flexShrink:0}}onClick={()=>addItem(g.id,tipo)}>+</button>
            </div>
          </div>;
        })}
      </div>;
    })}
  </div>;
}

        </div>

          <label style={{fontSize:'.68rem',fontWeight:700,color:'#60a5fa',textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:'4px'}}>Protocolo (mínimo passo)</label>

function IdentidadeTab({st,setSt}){
  const[texto,setTexto]=useState('');
  const td=TODAY();
  const hoje=new Date().toDateString();
  const frase=useMemo(()=>st.frases[Math.floor(Math.random()*st.frases.length)]||'',[]);

  function updAfirm(gid,v){setSt(p=>({...p,afirmacoes:{...p.afirmacoes,[gid]:v}}));}
  function marcar(gid){
    setSt(p=>{
      const sk=p.streaks[gid]||{atual:0,recorde:0,ultima:null};
      if(sk.ultima===hoje)return p;
      const ontem=new Date();ontem.setDate(ontem.getDate()-1);
      const seq=sk.ultima===ontem.toDateString()?sk.atual+1:1;
      return{...p,streaks:{...p.streaks,[gid]:{atual:seq,recorde:Math.max(seq,sk.recorde),ultima:hoje}}};
    });
  }
  function saveDiary(){
    if(!texto.trim())return;
    setSt(p=>({...p,diario:[{id:uid(),data:new Date().toLocaleDateString('pt-BR'),iso:new Date().toISOString(),texto:texto.trim()},...p.diario]}));
    setTexto('');
  }
  function addFrase(){
    const f=prompt('Nova frase:');
    if(f?.trim())setSt(p=>({...p,frases:[...p.frases,f.trim()]}));
  }

  return<div>
    {/* Frase */}
    <div style={{padding:'12px 14px',background:'var(--ac1)',border:'1px solid var(--ac2)',borderRadius:'var(--r)',marginBottom:'16px',fontStyle:'italic',color:'var(--ac)',lineHeight:1.5}}>"{frase}"<button className="btn-ic"style={{marginLeft:'8px',fontSize:'.7rem'}}onClick={addFrase}>+ frase</button></div>

    {/* Afirmações */}
    <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.09em',marginBottom:'10px'}}>Afirmações de Identidade</div>
    {st.goals.map(g=><div key={g.id}style={{background:'var(--card)',border:`1px solid var(--bd)`,borderLeft:`3px solid var(--ac)`,borderRadius:'var(--r)',padding:'10px 12px',marginBottom:'8px'}}>
      <div style={{fontSize:'.75rem',color:'var(--ac)',fontWeight:700,marginBottom:'5px'}}>{g.emoji} {g.name}</div>
      <textarea rows={2}value={st.afirmacoes[g.id]||''}onChange={e=>updAfirm(g.id,e.target.value)}placeholder="Eu sou..."style={{fontStyle:'italic'}}/>
    </div>)}

    {/* Streaks */}
    <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.09em',margin:'16px 0 10px'}}>Consistência — Fiz Hoje</div>
    <div className="g2c mb16">
      {st.goals.map(g=>{
        const sk=st.streaks[g.id]||{atual:0,recorde:0,ultima:null};
        const feito=sk.ultima===hoje;
        return<div key={g.id}style={{background:'var(--card)',border:`1px solid ${feito?'var(--ac2)':'var(--bd)'}`,borderRadius:'var(--r)',padding:'12px',textAlign:'center'}}>
          <div style={{fontSize:'.78rem',color:'var(--tx2)',marginBottom:'4px'}}>{g.emoji}</div>
          <div style={{fontFamily:'var(--fm)',fontSize:'2rem',fontWeight:700,color:feito?'var(--ac)':'var(--bd2)',lineHeight:1}}>{sk.atual}</div>
          <div style={{fontSize:'.65rem',color:'var(--tx3)',fontFamily:'var(--fm)',marginBottom:'8px'}}>dias · rec:{sk.recorde}</div>
          <button onClick={()=>marcar(g.id)}disabled={feito}style={{background:feito?'var(--ac1)':'var(--ac)',border:`1px solid var(--ac)`,color:feito?'var(--ac)':'#000',padding:'5px',borderRadius:'5px',fontSize:'.72rem',fontWeight:700,cursor:feito?'default':'pointer',width:'100%'}}>{feito?'✓ Feito':'Fiz hoje!'}</button>
        </div>;
      })}
    </div>

    {/* Diário */}
    <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--tx2)',textTransform:'uppercase',letterSpacing:'.09em',marginBottom:'10px'}}>Diário do Sistema</div>
    <div style={{fontSize:'.68rem',color:'var(--tx3)',fontFamily:'var(--fm)',marginBottom:'4px'}}>{new Date().toLocaleDateString('pt-BR')}</div>

    <button className="btn btn-ac w100"onClick={saveDiary}>Salvar reflexão</button>
    {st.diario.slice(0,14).map(e=><div key={e.id}className="diary-e mt8">
      <div style={{fontSize:'.68rem',color:'var(--tx3)',fontFamily:'var(--fm)',marginBottom:'3px'}}>{e.data}</div>
      <div style={{fontSize:'.82rem',color:'var(--tx)',lineHeight:1.5,whiteSpace:'pre-wrap'}}>{e.texto}</div>
    </div>)}
  </div>;
}

function ConquistasSection({st,setSt}){
  const[modal,setModal]=useState(false);
  const[nb,setNb]=useState({name:'',emoji:'🏅',desc:''});

  // Auto-check badges
  const td=TODAY();
  const totalDoneHabits=Object.values(st.habitLog).reduce((s,day)=>s+Object.values(day).filter(Boolean).length,0);
  const totalTasks=st.tasks.filter(t=>t.done).length;
  const dayLog=st.habitLog[td]||{};
  const allDoneToday=st.habits.filter(h=>h.active).every(h=>dayLog[h.id]);

  function unlock(bid){setSt(p=>({...p,badges:p.badges.map(b=>b.id===bid?{...b,unlocked:true}:b)}));}
  function unlockCustom(bid){setSt(p=>({...p,customBadges:p.customBadges.map(b=>b.id===bid?{...b,unlocked:true}:b)}));}
  function saveCustom(){
    if(!nb.name.trim())return;
    setSt(p=>({...p,customBadges:[...p.customBadges,{...nb,id:uid(),unlocked:false}]}));
    setNb({name:'',emoji:'🏅',desc:''});setModal(false);
  }
  function delCustom(id){setSt(p=>({...p,customBadges:p.customBadges.filter(b=>b.id!==id)}));}

  // Auto-unlock logic (simplified)
  useEffect(()=>{
    const updates=st.badges.map(b=>{
      if(b.unlocked)return b;
      if(b.type==='habits_total'&&totalDoneHabits>=b.threshold)return{...b,unlocked:true};
      if(b.type==='tasks_total'&&totalTasks>=b.threshold)return{...b,unlocked:true};
      if(b.type==='all_habits_day'&&allDoneToday)return{...b,unlocked:true};
      return b;
    });
    if(updates.some((b,i)=>b.unlocked!==st.badges[i].unlocked))setSt(p=>({...p,badges:updates}));
  },[totalDoneHabits,totalTasks,allDoneToday]);

  const all=[...st.badges,...st.customBadges];

  return<div className="sec">
    <div className="sch">
      <div className="sch-t">🏆 Conquistas</div>
      <button className="btn btn-ac"onClick={()=>setModal(true)}>+ Criar</button>
    </div>
    <div className="g2c">
      {all.map(b=>{
        const isCustom=!b.auto;
        return<div key={b.id}className={`badge${b.unlocked?' done':' locked'}`}style={{cursor:isCustom?'pointer':'default'}}onClick={()=>{if(isCustom&&!b.unlocked)unlockCustom(b.id);}}>
          <div style={{fontSize:'2rem',marginBottom:'6px'}}>{b.emoji}</div>
          <div style={{fontWeight:700,fontSize:'.82rem',marginBottom:'3px'}}>{b.name}</div>
          <div style={{fontSize:'.72rem',color:'var(--tx2)',lineHeight:1.4}}>{b.desc}</div>
          {b.unlocked&&<div style={{fontSize:'.68rem',color:'var(--ac)',marginTop:'6px',fontWeight:700}}>✓ Desbloqueada</div>}
          {isCustom&&!b.unlocked&&<div style={{fontSize:'.68rem',color:'var(--tx3)',marginTop:'6px'}}>Toque para desbloquear</div>}
          {isCustom&&<button className="btn-ic"style={{color:'var(--er)',position:'absolute',top:6,right:6}}onClick={e=>{e.stopPropagation();delCustom(b.id);}}>×</button>}
        </div>;
      })}
    </div>
    <Modal open={modal}onClose={()=>setModal(false)}title="Nova Conquista">
      <div className="g2c"><Fld label="Emoji"><input value={nb.emoji}onChange={e=>setNb(p=>({...p,emoji:e.target.value}))}maxLength={4}/></Fld>
      <Fld label="Nome"><input value={nb.name}onChange={e=>setNb(p=>({...p,name:e.target.value}))}placeholder="Minha conquista"/></Fld></div>
      <Fld label="Descrição"><textarea rows={2}value={nb.desc}onChange={e=>setNb(p=>({...p,desc:e.target.value}))}placeholder="Quando conquistar isso..."/></Fld>
      <Btns><button className="btn btn-gh"onClick={()=>setModal(false)}>Cancelar</button><button className="btn btn-ac"onClick={saveCustom}>Criar</button></Btns>
    </Modal>
  </div>;
}

      if(j<0||j>=arr.length)return p;
      [arr[i],arr[j]]=[arr[j],arr[i]];
      return{...p,config:{...p.config,tabs:arr}};
    });
  }
  function togVis(id){setSt(p=>({...p,config:{...p.config,tabs:p.config.tabs.map(t=>t.id===id?{...t,visible:t.visible===false?true:false}:t)}}))}

function CfgDados({st,setSt}){
  function exp(){
    const blob=new Blob([JSON.stringify(st,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='segundo-cerebro-backup.json';a.click();
  }
  function imp(){
    const i=document.createElement('input');i.type='file';i.accept='.json';
    i.onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=ev=>{
        try{
          const data=JSON.parse(ev.target.result);
          if(window.confirm('Mesclar com dados existentes? (Cancelar = substituir tudo)'))setSt(p=>mergeDeep(p,data));
          else setSt(data);
        }catch(err){alert('Arquivo inválido.');}
      };r.readAsText(f);
    };i.click();
  }
  function expTxt(){
    const td=TODAY();const mk=td.slice(0,7);
    const lines=[
      `SEGUNDO CÉREBRO — Resumo ${new Date().toLocaleDateString('pt-BR')}`,
      `Usuário: ${st.user.name}`,'',' HÁBITOS ATIVOS:',
      ...st.habits.filter(h=>h.active).map(h=>{
        let n=0;for(let d=1;d<=31;d++){const ds=`${mk}-${String(d).padStart(2,'0')}`;if(st.habitLog[ds]?.[h.id])n++;}
        return`  ${h.emoji} ${h.name}: ${n}/${h.monthlyGoal} dias`;
      }),'',
      ' TAREFAS DO MÊS:',`  Total: ${st.tasks.filter(t=>t.date.startsWith(mk)).length}`,`  Concluídas: ${st.tasks.filter(t=>t.date.startsWith(mk)&&t.done).length}`,
    ];
    const blob=new Blob([lines.join('\n')],{type:'text/plain'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`cerebro-${mk}.txt`;a.click();
  }
  function reset(){
    if(window.confirm('Resetar TODOS os dados? Isso não pode ser desfeito.')&&window.confirm('Tem ABSOLUTA certeza?')){
      setSt(makeInit());localStorage.removeItem('sc-v2');
    }
  }
  return<div>
    <div className="cfg-s">
      <div className="cfg-t">Exportar / Importar</div>
      <div className="flex col g8">
        <button className="btn btn-ac"onClick={exp}>⬇ Exportar todos os dados (JSON)</button>
        <button className="btn btn-gh"onClick={imp}>⬆ Importar dados (JSON)</button>
        <button className="btn btn-gh"onClick={expTxt}>📄 Exportar resumo do mês (TXT)</button>
      </div>
    </div>
    <div className="cfg-s">
      <div className="cfg-t">Zona de perigo</div>
      <button className="btn-er"onClick={reset}>🗑 Resetar app</button>
    </div>
  </div>;
}

    habitos:<HabitosSection st={st}setSt={setSt}/>,
    dashboard:<DashboardSection st={st}setSt={setSt}/>,
    metas:<MetasSection st={st}setSt={setSt}/>,
    conquistas:<ConquistasSection st={st}setSt={setSt}/>,
    config:<ConfigSection st={st}setSt={setSt}/>,
  };

  const visibleTab=(st.config.tabs||DEF_TABS).some(t=>t.id===tab&&t.visible!==false)?tab:'hoje';

  return<div>
    <Navbar cur={visibleTab}onChange={setTab}st={st}/>
    {sections[visibleTab]||null}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
